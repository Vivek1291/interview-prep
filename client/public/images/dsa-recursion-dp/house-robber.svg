<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Houses with 2 7 9 3 1; best totals 2 7 11 11 12 by robbing houses 0 2 and 4"><title>Houses with 2 7 9 3 1; best totals 2 7 11 11 12 by robbing houses 0 2 and 4</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">House Robber: take it or skip it</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569">Can't rob two neighbours. At each house: rob it (+ best up to i − 2) or skip it (best up to i − 1)</text><path d="M120 150 L160 115 L200 150 Z" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><rect x="128" y="150" width="64" height="50" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="160" y="182" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">$2</text><text x="160" y="222" font-size="11" text-anchor="middle" fill="#475569">house 0</text><path d="M240 150 L280 115 L320 150 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="248" y="150" width="64" height="50" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="280" y="182" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">$7</text><text x="280" y="222" font-size="11" text-anchor="middle" fill="#475569">house 1</text><path d="M360 150 L400 115 L440 150 Z" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><rect x="368" y="150" width="64" height="50" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="182" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">$9</text><text x="400" y="222" font-size="11" text-anchor="middle" fill="#475569">house 2</text><path d="M480 150 L520 115 L560 150 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="488" y="150" width="64" height="50" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="520" y="182" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">$3</text><text x="520" y="222" font-size="11" text-anchor="middle" fill="#475569">house 3</text><path d="M600 150 L640 115 L680 150 Z" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><rect x="608" y="150" width="64" height="50" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640" y="182" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">$1</text><text x="640" y="222" font-size="11" text-anchor="middle" fill="#475569">house 4</text><text x="118" y="285" font-size="13" text-anchor="end" fill="#475569" font-weight="700">best</text><rect x="128" y="260" width="120" height="40" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="188" y="285.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="248" y="260" width="120" height="40" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="308" y="285.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><rect x="368" y="260" width="120" height="40" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="428" y="285.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">11</text><rect x="488" y="260" width="120" height="40" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="548" y="285.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">11</text><rect x="608" y="260" width="120" height="40" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="668" y="285.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><text x="400" y="345" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">best[i] = max(best[i − 1], best[i − 2] + money[i])  →  rob houses 0, 2, 4 = 2 + 9 + 1 = 12</text></svg>