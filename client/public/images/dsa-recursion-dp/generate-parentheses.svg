ot;</text><rect x="372" y="286" width="96" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="420" y="304.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;(())()&quot;</text><rect x="502" y="286" width="96" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="550" y="304.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;()(())&quot;</text><rect x="632" y="286" width="96" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="680" y="304.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;()()()&quot;</text><text x="400" y="352" font-size="13" text-anchor="middle" fill="#475569">Add &quot;(&quot; if open &lt; n.  Add &quot;)&quot; if close &lt; open.  These two rules never build an invalid prefix.</text><text x="400" y="376" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">n = 3 → 5 valid strings (the Catalan number), not all 2⁶ = 64 strings</text></svg>