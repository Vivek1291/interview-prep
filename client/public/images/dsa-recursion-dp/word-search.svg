<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Grid ABCE SFCS ADEE with the path A B C C E D highlighted"><title>Grid ABCE SFCS ADEE with the path A B C C E D highlighted</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Word Search: DFS + backtracking on a grid</text><rect x="130" y="90" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="162" y="129" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="194" y="90" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="226" y="129" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><rect x="258" y="90" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="290" y="129" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><rect x="322" y="90" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="354" y="129" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">E</text><rect x="130" y="154" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="162" y="193" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">S</text><rect x="194" y="154" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="226" y="193" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">F</text><rect x="258" y="154" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="290" y="193" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><rect x="322" y="154" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="354" y="193" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">S</text><rect x="130" y="218" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="162" y="257" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="194" y="218" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="226" y="257" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">D</text><rect x="258" y="218" width="64" height="64" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="290" y="257" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">E</text><rect x="322" y="218" width="64" height="64" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="354" y="257" font-size="20" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">E</text><text x="184" y="106" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">1</text><text x="248" y="106" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">2</text><text x="312" y="106" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">3</text><text x="312" y="170" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">4</text><text x="312" y="234" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">5</text><text x="248" y="234" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">6</text><text x="560" y="110" font-size="15" text-anchor="middle" fill="#10b981" font-weight="700">word = &quot;ABCCED&quot; ✅</text><text x="560" y="150" font-size="13" text-anchor="middle" fill="#475569">DFS from every cell matching W[0]</text><text x="560" y="172" font-size="13" text-anchor="middle" fill="#475569">mark the cell as used (e.g. &quot;#&quot;)</text><text x="560" y="194" font-size="13" text-anchor="middle" fill="#475569">try 4 neighbours for W[k + 1]</text><text x="560" y="216" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">UNMARK when backtracking</text><text x="560" y="260" font-size="13" text-anchor="middle" fill="#475569">&quot;ABCB&quot; → false: the B at (0,1)</text><text x="560" y="280" font-size="13" text-anchor="middle" fill="#475569">cannot be used twice</text><text x="400" y="370" font-size="12" text-anchor="middle" fill="#475569">Worst case O(R·C · 3^L) for a word of length L (3 = directions except where you came from).</text></svg>