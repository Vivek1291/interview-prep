ke-width="1.5"/><text x="210" y="219.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">f(2)</text><rect x="300" y="201" width="60" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="330" y="219.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">f(2)</text><rect x="400" y="201" width="60" height="28" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="430" y="219.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">f(1)</text><rect x="20" y="266" width="60" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="50" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">f(2)</text><rect x="100" y="266" width="60" height="28" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">f(1)</text><text x="260" y="330" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="700">plain recursion repeats f(3), f(2)… → O(2ⁿ)</text><text x="490" y="137" font-size="13" text-anchor="end" fill="#475569" font-weight="700">dp</text><rect x="500" y="110" width="46" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="523" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="523" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="546" y="110" width="46" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="569" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="569" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="592" y="110" width="46" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="615" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="615" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="638" y="110" width="46" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="661" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="684" y="110" width="46" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="707" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="707" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="730" y="110" width="46" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="753" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><text x="753" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="638" y="200" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">dp[i] = dp[i − 1] + dp[i − 2]</text><text x="638" y="222" font-size="12" text-anchor="middle" fill="#475569">(last step was 1 or 2 stairs)</text><text x="638" y="262" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">each value computed once → O(n)</text><text x="63