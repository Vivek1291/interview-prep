<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Comparison of GitHub Actions and Jenkins by hosting, configuration, reuse, secrets, best use and cost"><title>Comparison of GitHub Actions and Jenkins by hosting, configuration, reuse, secrets, best use and cost</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">GitHub Actions vs Jenkins</text><rect x="30" y="58" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Hosting</text><rect x="176" y="58" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="83.9" font-size="11" text-anchor="middle" fill="#1e293b">GitHub-hosted runners (or self-hosted)</text><rect x="472" y="58" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="83.9" font-size="11" text-anchor="middle" fill="#1e293b">self-hosted controller + agents (you patch it)</text><rect x="30" y="108" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="134.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Config</text><rect x="176" y="108" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="133.9" font-size="11" text-anchor="middle" fill="#1e293b">YAML in .github/workflows</text><rect x="472" y="108" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="133.9" font-size="11" text-anchor="middle" fill="#1e293b">Groovy Jenkinsfile (declarative or scripted)</text><rect x="30" y="158" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Reuse</text><rect x="176" y="158" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="183.9" font-size="11" text-anchor="middle" fill="#1e293b">marketplace actions, reusable workflows</text><rect x="472" y="158" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="183.9" font-size="11" text-anchor="middle" fill="#1e293b">plugins, shared libraries (vars/*.groovy)</text><rect x="30" y="208" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="234.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Secrets</text><rect x="176" y="208" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="233.9" font-size="11" text-anchor="middle" fill="#1e293b">repo/org/environment secrets, OIDC</text><rect x="472" y="208" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="233.9" font-size="11" text-anchor="middle" fill="#1e293b">Credentials plugin + withCredentials</text><rect x="30" y="258" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Best when</text><rect x="176" y="258" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="283.9" font-size="11" text-anchor="middle" fill="#1e293b">code on GitHub, cloud deploys, little ops</text><rect x="472" y="258" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="283.9" font-size="11" text-anchor="middle" fill="#1e293b">on-prem, air-gapped, complex/legacy, any SCM</text><rect x="30" y="308" width="140" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="334.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Cost</text><rect x="176" y="308" width="290" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="321" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">per-minute (free tier), zero maintenance</text><rect x="472" y="308" width="298" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">servers + admin time, no per-minute fee</text><text x="321" y="52" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">GitHub Actions</text><text x="621" y="52" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Jenkins</text></svg>