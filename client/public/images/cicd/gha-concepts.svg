<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Workflows are triggered by events and contain jobs that run on fresh runners with steps; jobs pass data by artifacts; actionlint found five mistakes in a broken workflow"><title>Workflows are triggered by events and contain jobs that run on fresh runners with steps; jobs pass data by artifacts; actionlint found five mistakes in a broken workflow</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">GitHub Actions: workflow → jobs → steps (+ actionlint)</text><rect x="30" y="58" width="170" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">WORKFLOW</text><text x="115" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b">.github/workflows/ci.yml</text><text x="115" y="123.9" font-size="11" text-anchor="middle" fill="#1e293b">on: push, pull_request,</text><text x="115" y="137.9" font-size="11" text-anchor="middle" fill="#1e293b">schedule, workflow_dispatch</text><rect x="220" y="58" width="170" height="110" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="305" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">JOB "test"</text><text x="305" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b">runs-on: ubuntu-latest</text><text x="305" y="123.9" font-size="11" text-anchor="middle" fill="#1e293b">fresh VM per job</text><text x="305" y="137.9" font-size="11" text-anchor="middle" fill="#1e293b">matrix: node [20, 22]</text><rect x="410" y="58" width="170" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="495" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">STEPS (same VM)</text><text x="495" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b">uses: actions/checkout@v4</text><text x="495" y="123.9" font-size="11" text-anchor="middle" fill="#1e293b">uses: actions/setup-node@v4</text><text x="495" y="137.9" font-size="11" text-anchor="middle" fill="#1e293b">run: npm ci &amp;&amp; npm test</text><rect x="600" y="58" width="170" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="685" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">JOB "deploy"</text><text x="685" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b">needs: test</text><text x="685" y="123.9" font-size="11" text-anchor="middle" fill="#1e293b">if: main branch</text><text x="685" y="137.9" font-size="11" text-anchor="middle" fill="#1e293b">environment: production</text><line x1="394" y1="113" x2="406" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="204" y1="113" x2="216" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="305" y1="172" x2="650" y2="172" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-slate)"/><text x="477.5" y="186" font-size="11" text-anchor="middle" fill="#475569">artifacts pass files between jobs</text><text x="400" y="212" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">actionlint on a broken workflow: 5 errors found before pushing</text><rect x="30" y="224" width="740" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="240.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">branchs: [main] → unexpected key (should be branches)</text><rect x="30" y="254" width="740" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="270.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">node-versoin → input not defined in actions/setup-node</text><rect x="30" y="284" width="740" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="300.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">needs: tests → job does not exist</text><rect x="30" y="314" width="740" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="330.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">${{ secret.X }} → undefined variable (secrets)</text><rect x="30" y="344" width="740" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="360.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">${{ github.event.pull_request.title }} in run: → untrusted input, pass via env</text></svg>