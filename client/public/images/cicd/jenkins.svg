<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Jenkins controller schedules builds on agents using a Jenkinsfile; measured pipeline 13.1 s sequential, 11.3 s parallel, 3.3 s with a warm npm cache; a failing test skipped archive and deploy"><title>Jenkins controller schedules builds on agents using a Jenkinsfile; measured pipeline 13.1 s sequential, 11.3 s parallel, 3.3 s with a warm npm cache; a failing test skipped archive and deploy</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Jenkins: controller, agents, Jenkinsfile (measured)</text><rect x="30" y="58" width="230" height="130" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="145" y="105.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Jenkins controller</text><text x="145" y="119.75" font-size="11.5" text-anchor="middle" fill="#1e293b">UI, job config, scheduling,</text><text x="145" y="134.25" font-size="11.5" text-anchor="middle" fill="#1e293b">plugins (2,000+), credentials</text><text x="145" y="148.75" font-size="11.5" text-anchor="middle" fill="#1e293b">keep builds OFF the controller</text><rect x="300" y="58" width="220" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="410" y="92" font-size="11.5" text-anchor="middle" fill="#1e293b">agent: linux + docker</text><rect x="300" y="128" width="220" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="410" y="161.9" font-size="11" text-anchor="middle" fill="#1e293b">agent: docker { image "node:22" }</text><rect x="550" y="58" width="220" height="130" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660" y="105.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Jenkinsfile in the repo</text><text x="660" y="119.75" font-size="11.5" text-anchor="middle" fill="#1e293b">pipeline as code, reviewed</text><text x="660" y="134.25" font-size="11.5" text-anchor="middle" fill="#1e293b">in PRs; multibranch job</text><text x="660" y="148.75" font-size="11.5" text-anchor="middle" fill="#1e293b">builds every branch + PR</text><line x1="264" y1="88" x2="296" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="264" y1="158" x2="296" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="214" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: Jenkins 2.580.1 in Docker, server + client monorepo pipeline</text><text x="230" y="241" font-size="11.5" text-anchor="end" fill="#475569">stages in sequence</text><rect x="240" y="226" width="366.8" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="612.8" y="241" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">13.1 s</text><text x="230" y="271" font-size="11.5" text-anchor="end" fill="#475569">install/test in parallel</text><rect x="240" y="256" width="316.4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="562.4" y="271" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">11.3 s</text><text x="230" y="301" font-size="11.5" text-anchor="end" fill="#475569">parallel, npm cache warm</text><rect x="240" y="286" width="92.4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="338.4" y="301" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">3.3 s</text><rect x="30" y="320" width="740" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">Failing test run: JUnit report 1 passed / 1 failed, stage marked FAILED, Archive and Deploy "skipped due to earlier failure(s)",</text><text x="400" y="358.9" font-size="11" text-anchor="middle" fill="#1e293b">post { failure } ran "notify the team" → exactly what you want a red pipeline to do.</text></svg>