<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Frontend workflow lints, tests, builds and deploys to S3 and CloudFront; backend workflow runs a Node version matrix with Postgres and Redis service containers then pushes one image tagged with the commit SHA; a monorepo uses path filters, reusable workflows and e2e tests"><title>Frontend workflow lints, tests, builds and deploys to S3 and CloudFront; backend workflow runs a Node version matrix with Postgres and Redis service containers then pushes one image tagged with the commit SHA; a monorepo uses path filters, reusable workflows and e2e tests</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">GitHub Actions for frontend, backend and full-stack</text><rect x="30" y="58" width="230" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="145" y="92.5" font-size="11.5" text-anchor="middle" fill="#1e293b">PR opened</text><text x="145" y="107" font-size="11.5" text-anchor="middle" fill="#1e293b">frontend.yml + backend.yml</text><text x="145" y="121.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(path filters)</text><rect x="290" y="58" width="230" height="90" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="405" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">frontend: npm ci → lint →</text><text x="405" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">vitest → vite build →</text><text x="405" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b">upload dist artifact</text><rect x="540" y="58" width="230" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="655" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">backend matrix node 20/22:</text><text x="655" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">services postgres + redis</text><text x="655" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b">npm ci → lint → test</text><line x1="264" y1="103" x2="286" y2="103" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="172" width="230" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="145" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b">merge to main</text><rect x="290" y="172" width="230" height="90" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="405" y="200.45" font-size="10.5" text-anchor="middle" fill="#1e293b">frontend deploy (OIDC role)</text><text x="405" y="213.95" font-size="10.5" text-anchor="middle" fill="#1e293b">s3 sync hashed assets: immutable</text><text x="405" y="227.45" font-size="10.5" text-anchor="middle" fill="#1e293b">index.html: no-cache</text><text x="405" y="240.95" font-size="10.5" text-anchor="middle" fill="#1e293b">CloudFront invalidate index</text><rect x="540" y="172" width="230" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="655" y="200.45" font-size="10.5" text-anchor="middle" fill="#1e293b">backend: build image once</text><text x="655" y="213.95" font-size="10.5" text-anchor="middle" fill="#1e293b">push ghcr.io/…/api:&lt;sha&gt;</text><text x="655" y="227.45" font-size="10.5" text-anchor="middle" fill="#1e293b">cache-from/to: gha</text><text x="655" y="240.95" font-size="10.5" text-anchor="middle" fill="#1e293b">deploy that tag</text><line x1="264" y1="217" x2="286" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="286" width="740" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="320.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Full-stack monorepo: a changes job (paths-filter) decides which apps run; client and server call one reusable</text><text x="400" y="335" font-size="11.5" text-anchor="middle" fill="#1e293b">workflow (on: workflow_call) with inputs; e2e runs docker compose up --wait + Playwright when neither failed.</text><text x="400" y="349.5" font-size="11.5" text-anchor="middle" fill="#1e293b">concurrency: cancel-in-progress stops stale runs; environments add approvals and per-environment secrets.</text></svg>