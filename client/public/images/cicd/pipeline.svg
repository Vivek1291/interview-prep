<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pipeline stages from commit through install, lint, tests, build, staging, e2e and production; measured npm ci 10.8 s without cache vs 2.1 s with cache"><title>Pipeline stages from commit through install, lint, tests, build, staging, e2e and production; measured npm ci 10.8 s without cache vs 2.1 s with cache</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A CI/CD pipeline (measured dependency cache)</text><rect x="22" y="66" width="84" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="64" y="99.9" font-size="11" text-anchor="middle" fill="#1e293b">commit / PR</text><rect x="118" y="66" width="84" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">install</text><text x="160" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">(cached)</text><line x1="106" y1="96" x2="116" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="214" y="66" width="84" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="256" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">lint +</text><text x="256" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">type-check</text><line x1="202" y1="96" x2="212" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="310" y="66" width="84" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="352" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">unit +</text><text x="352" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">integration</text><line x1="298" y1="96" x2="308" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="406" y="66" width="84" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="448" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">build</text><text x="448" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">artifact/image</text><line x1="394" y1="96" x2="404" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="502" y="66" width="84" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="544" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">deploy</text><text x="544" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">staging</text><line x1="490" y1="96" x2="500" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="598" y="66" width="84" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="640" y="99.9" font-size="11" text-anchor="middle" fill="#1e293b">e2e / smoke</text><line x1="586" y1="96" x2="596" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="694" y="66" width="84" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="736" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">deploy</text><text x="736" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">production</text><line x1="682" y1="96" x2="692" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="22" y="140" width="372" height="8" rx="4" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/><text x="208" y="166" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Continuous Integration: every push, fast feedback</text><rect x="406" y="140" width="372" height="8" rx="4" fill="#bbf7d0" stroke="#10b981" stroke-width="1.5"/><text x="592" y="166" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Continuous Delivery/Deployment</text><text x="400" y="198" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: npm ci for this app's client (199 packages)</text><text x="250" y="225" font-size="11.5" text-anchor="end" fill="#475569">no dependency cache</text><rect x="260" y="210" width="324" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="225" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10.8 s</text><text x="250" y="257" font-size="11.5" text-anchor="end" fill="#475569">npm cache restored</text><rect x="260" y="242" width="63" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="329" y="257" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2.1 s (5× faster)</text><rect x="30" y="284" width="740" height="92" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Delivery = every green build CAN go to production (a human clicks deploy). Deployment = it goes automatically.</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">Build once, promote the same artifact (image tag = git SHA) through staging → production; never rebuild per environment.</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Fail fast: cheapest checks first; a red main branch is everyone's top priority.</text></svg>