<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Rolling, blue-green, canary and feature flag release strategies, plus expand-migrate-contract database migrations and rollback by redeploying the previous image tag"><title>Rolling, blue-green, canary and feature flag release strategies, plus expand-migrate-contract database migrations and rollback by redeploying the previous image tag</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Deployment strategies and safe releases</text><rect x="30" y="58" width="120" height="96" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="90" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Rolling</text><rect x="156" y="58" width="234" height="96" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="273" y="96.2" font-size="10.5" text-anchor="middle" fill="#1e293b">replace instances a few at a time</text><text x="273" y="109.7" font-size="10.5" text-anchor="middle" fill="#1e293b">(k8s default: maxSurge / maxUnavailable)</text><text x="273" y="123.2" font-size="10.5" text-anchor="middle" fill="#1e293b">both versions serve traffic briefly</text><rect x="410" y="58" width="120" height="96" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="470" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Blue-green</text><rect x="536" y="58" width="234" height="96" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="96.2" font-size="10.5" text-anchor="middle" fill="#1e293b">start full new copy (green), switch the</text><text x="653" y="109.7" font-size="10.5" text-anchor="middle" fill="#1e293b">load balancer at once, keep blue for</text><text x="653" y="123.2" font-size="10.5" text-anchor="middle" fill="#1e293b">instant rollback (double capacity)</text><rect x="30" y="168" width="120" height="96" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="90" y="220.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Canary</text><rect x="156" y="168" width="234" height="96" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="273" y="206.2" font-size="10.5" text-anchor="middle" fill="#1e293b">send 1% → 10% → 50% → 100% to the new</text><text x="273" y="219.7" font-size="10.5" text-anchor="middle" fill="#1e293b">version, watch error rate and p99,</text><text x="273" y="233.2" font-size="10.5" text-anchor="middle" fill="#1e293b">roll back automatically on regression</text><rect x="410" y="168" width="120" height="96" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="470" y="220.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Feature flags</text><rect x="536" y="168" width="234" height="96" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="206.2" font-size="10.5" text-anchor="middle" fill="#1e293b">deploy code dark, turn features on per</text><text x="653" y="219.7" font-size="10.5" text-anchor="middle" fill="#1e293b">user/percentage at runtime, separate</text><text x="653" y="233.2" font-size="10.5" text-anchor="middle" fill="#1e293b">deploy from release</text><rect x="30" y="284" width="740" height="92" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Database migrations with zero downtime: expand → migrate → contract.</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">1) add new column/table (old code still works) 2) deploy code that writes both, backfill 3) read new 4) drop old later.</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Rollback = redeploy the previous image tag (keep N old tags); never roll back a destructive migration.</text></svg>