<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Execution order"><title>Execution order</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Express walks its layer stack: next, next('route'), next(err)</text><rect x="40" y="70" width="300" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="93.6" font-size="13" text-anchor="middle" fill="#1e293b">1 app.use(global)</text><rect x="40" y="120" width="300" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="143.6" font-size="13" text-anchor="middle" fill="#1e293b">2 app.use('/users', ...)</text><rect x="40" y="170" width="300" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="190" y="193.6" font-size="13" text-anchor="middle" fill="#1e293b">3 GET /users/:id  callback 1</text><rect x="40" y="220" width="300" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="190" y="243.6" font-size="13" text-anchor="middle" fill="#1e293b">4 GET /users/:id  callback 2</text><rect x="40" y="270" width="300" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="190" y="293.6" font-size="13" text-anchor="middle" fill="#1e293b">5 GET /users/:id  (second route)</text><rect x="470" y="170" width="300" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="620" y="193.6" font-size="13" text-anchor="middle" fill="#1e293b">404 handler</text><rect x="470" y="270" width="300" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="620" y="293.6" font-size="13" text-anchor="middle" fill="#1e293b">error middleware (err, req, res, next)</text><line x1="190" y1="108" x2="190" y2="117" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="190" y1="158" x2="190" y2="167" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="190" y1="208" x2="190" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="205" y="216" font-size="12" text-anchor="start" fill="#475569">next()</text><path d="M40 189 H18 V289 H35" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text transform="rotate(-90 14 245)" x="14" y="245" font-size="12" text-anchor="start" fill="#8b5cf6" font-weight="700">next('route')</text><line x1="340" y1="180" x2="467" y2="284" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="433.5" y="218" font-size="12" text-anchor="middle" fill="#475569">next(err)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Only layers whose path + method match run · a sent response stops the walk</text></svg>