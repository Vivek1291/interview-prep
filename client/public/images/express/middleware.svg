<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Middleware pipeline"><title>Middleware pipeline</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Middleware = checkpoints between request and response</text><rect x="20" y="150" width="105" height="54" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="72.5" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">request</text><line x1="125" y1="177" x2="149" y2="177" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="152" y="150" width="105" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="204.5" y="173.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">helmet</text><text x="204.5" y="188.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">cors</text><line x1="257" y1="177" x2="281" y2="177" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="284" y="150" width="105" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="336.5" y="173.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">express</text><text x="336.5" y="188.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">.json()</text><line x1="389" y1="177" x2="413" y2="177" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="416" y="150" width="105" height="54" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="468.5" y="173.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">requestId</text><text x="468.5" y="188.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">+ logger</text><line x1="521" y1="177" x2="545" y2="177" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="548" y="150" width="105" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600.5" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">authenticate</text><line x1="653" y1="177" x2="677" y2="177" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="680" y="150" width="105" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="732.5" y="173.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">route</text><text x="732.5" y="188.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">handler</text><text x="530" y="140" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">stamp: req.user</text><line x1="593" y1="206" x2="593" y2="262" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="520" y="265" width="150" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="595" y="291.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">401: stop here</text><text x="400" y="110" font-size="13" text-anchor="middle" fill="#475569">each one: run code · change req/res · respond · or call next()</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Order is the program: security + parsing first, error handler last</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Neither next() nor a response → the request hangs</text></svg>