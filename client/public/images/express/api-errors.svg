-size="12" text-anchor="start" fill="#1e293b">permission message</text><rect x="430" y="183" width="90" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="475" y="202.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">409</text><text x="535" y="203" font-size="12" text-anchor="start" fill="#1e293b">inline message</text><rect x="430" y="219" width="90" height="30" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="475" y="238.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">429/503</text><text x="535" y="239" font-size="12" text-anchor="start" fill="#1e293b">retry later</text><rect x="430" y="255" width="90" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="475" y="274.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">500</text><text x="535" y="275" font-size="12" text-anchor="start" fill="#1e293b">toast + ref id</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Stable codes for machines, messages for people, request ids for support</text></svg>