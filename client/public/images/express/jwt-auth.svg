<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="JWT auth"><title>JWT auth</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A JWT: readable by anyone, trusted only through its signature</text><rect x="40" y="80" width="220" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="150" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">header {alg: HS256}</text><rect x="290" y="80" width="220" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">payload {sub, role, exp}</text><rect x="540" y="80" width="220" height="44" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="650" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">signature HMAC(secret)</text><text x="275" y="107" font-size="22" text-anchor="middle" fill="#1e293b" font-weight="700">.</text><text x="525" y="107" font-size="22" text-anchor="middle" fill="#1e293b" font-weight="700">.</text><text x="400" y="150" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">base64url only → never put secrets or PII in the payload</text><rect x="50" y="190" width="140" height="54" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Bearer token</text><line x1="190" y1="217" x2="233" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="236" y="190" width="140" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="306" y="213.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">verify sig +</text><text x="306" y="228.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">alg + exp</text><line x1="376" y1="217" x2="419" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="422" y="190" width="140" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="492" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">req.user</text><line x1="562" y1="217" x2="605" y2="217" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="608" y="190" width="140" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="678" y="213.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">authorize /</text><text x="678" y="228.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">owner check</text><text x="250" y="272" font-size="12" text-anchor="middle" fill="#ef4444">401 if missing / invalid / expired</text><text x="620" y="272" font-size="12" text-anchor="middle" fill="#f59e0b">403 if not allowed</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Short access token in memory · rotated refresh token in an httpOnly, SameSite cookie</text></svg>