<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="API versioning"><title>API versioning</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Versioning: new sockets next to the old ones</text><line x1="160" y1="115" x2="227" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="160" y1="255" x2="227" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="450" y1="115" x2="650" y2="157" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="450" y1="255" x2="650" y2="213" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="20" y="90" width="140" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="119.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">old mobile app</text><rect x="20" y="230" width="140" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="90" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">new web app</text><rect x="230" y="90" width="220" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="340" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">/api/v1  legacy shape</text><text x="340" y="126.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Deprecation + Sunset</text><rect x="230" y="230" width="220" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="340" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">/api/v2  new shape</text><rect x="540" y="160" width="220" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="650" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">shared userService</text><text x="340" y="175" font-size="12" text-anchor="middle" fill="#475569">breaking change? → new version</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Additive changes (new optional fields, new endpoints) need no new version</text></svg>