="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="345" y="176" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">▼ cursor</text><text x="410" y="198" font-size="12" text-anchor="start" fill="#10b981">→ index seek to the bookmark, 0.5 ms</text><rect x="40" y="250" width="340" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="210" y="271.7" font-size="12" text-anchor="middle" fill="#1e293b">offset: page numbers + totals,</text><text x="210" y="286.7" font-size="12" text-anchor="middle" fill="#1e293b">but slow deep pages and shifting items</text><rect x="420" y="250" width="340" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="271.7" font-size="12" text-anchor="middle" fill="#1e293b">cursor: (createdAt, _id) bookmark,</text><text x="590" y="286.7" font-size="12" text-anchor="middle" fill="#1e293b">constant speed, stable under inserts</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured on 1M documents (MongoDB 7): page 50,000 = 240 ms with skip vs 0.5 ms with a cursor</text></svg>