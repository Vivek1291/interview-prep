<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="App vs router middleware"><title>App vs router middleware</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">App-level = mall entrance, router-level = shop door</text><rect x="20" y="160" width="150" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="95" y="194.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">request</text><rect x="220" y="150" width="170" height="80" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="305" y="179.2" font-size="12" text-anchor="middle" fill="#1e293b">app.use</text><text x="305" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">helmet, cors, json,</text><text x="305" y="209.2" font-size="12" text-anchor="middle" fill="#1e293b">logger (everyone)</text><rect x="470" y="70" width="300" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="620" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">/api/products → publicRouter (no auth)</text><rect x="470" y="165" width="300" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="620" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">/api/admin → authenticate + requireAdmin</text><rect x="470" y="260" width="300" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="620" y="289.2" font-size="12" text-anchor="middle" fill="#1e293b">/api/users/:userId/orders (mergeParams)</text><line x1="170" y1="190" x2="216" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="390" y1="170" x2="466" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="390" y1="190" x2="466" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="390" y1="210" x2="466" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Scope comes from where you mount: app-wide or only inside one router</text></svg>