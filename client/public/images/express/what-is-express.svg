<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="What is Express"><title>What is Express</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Express = routing + middleware + helpers on top of Node http</text><rect x="250" y="290" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="314.6" font-size="13" text-anchor="middle" fill="#1e293b">Node http.createServer (raw req, res)</text><rect x="250" y="230" width="300" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="257.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">Express app</text><rect x="40" y="120" width="170" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">Router</text><text x="125" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">method + path, params</text><rect x="230" y="120" width="170" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="315" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">Middleware</text><text x="315" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">json, cors, auth</text><rect x="420" y="120" width="170" height="60" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="505" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">Helpers</text><text x="505" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">res.json, req.query</text><rect x="610" y="120" width="150" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="685" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">Errors</text><text x="685" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">4-arg handler</text><line x1="125" y1="180" x2="400" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="315" y1="180" x2="400" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="505" y1="180" x2="400" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="685" y1="180" x2="400" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="250" y="65" width="300" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b">your routes, services, repositories</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured hello-world JSON: http 55k · Fastify 50k · Express 4 19.5k · Express 5 17.5k req/s</text></svg>