<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Validation"><title>Validation</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Validation at the entrance: check the form before anyone enters</text><rect x="30" y="150" width="140" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="100" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b">request</text><text x="100" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b">{ name, email,</text><text x="100" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">role: admin }</text><rect x="230" y="120" width="200" height="130" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="330" y="159.2" font-size="12" text-anchor="middle" fill="#1e293b">validate(schema)</text><text x="330" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b">· trim, lowercase</text><text x="330" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b">· coerce numbers</text><text x="330" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">· strict: unknown keys</text><text x="330" y="219.2" font-size="12" text-anchor="middle" fill="#1e293b">· types (no $ne objects)</text><rect x="510" y="90" width="250" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="635" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">400 + field errors</text><text x="635" y="126.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">role: Unknown field</text><rect x="510" y="170" width="250" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="635" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">req.valid (clean data) → handler</text><rect x="510" y="250" width="250" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="635" y="279.2" font-size="12" text-anchor="middle" fill="#1e293b">service rules → DB unique index</text><line x1="170" y1="185" x2="226" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="430" y1="160" x2="506" y2="120" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="430" y1="195" x2="506" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><line x1="635" y1="220" x2="635" y2="247" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Frontend validation = UX · server validation = security · DB constraints = last line</text></svg>