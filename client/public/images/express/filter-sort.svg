<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Filter and sort"><title>Filter and sort</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Filtering and sorting through an allow-list and the right index</text><rect x="20" y="80" width="760" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="104.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">?category=books&amp;minPrice=10&amp;maxPrice=50&amp;sort=-price&amp;q=c++&amp;password[$ne]=x</text><rect x="20" y="150" width="230" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="135" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">allow-list + cast</text><text x="135" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b">category: String</text><text x="135" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b">price: Number range</text><text x="135" y="221.7" font-size="12" text-anchor="middle" fill="#1e293b">q: escaped regex</text><rect x="285" y="150" width="230" height="90" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="177.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ isDeleted: false,</text><text x="400" y="191.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  category: &quot;books&quot;,</text><text x="400" y="205.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  price: {$gte:10,$lte:50} }</text><text x="400" y="219.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">sort {price:-1,_id:-1}</text><rect x="550" y="150" width="230" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="665" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b">ESR index</text><text x="665" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b">{ isDeleted, category, price }</text><text x="665" y="214.2" font-size="12" text-anchor="middle" fill="#1e293b">20 docs examined</text><line x1="135" y1="120" x2="135" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="250" y1="195" x2="282" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="515" y1="195" x2="547" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="20" y="265" width="230" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="135" y="289.2" font-size="12" text-anchor="middle" fill="#1e293b">password[$ne] → ignored</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured on 500k products: 107.6 ms / 500,000 docs (no index) vs 1.5 ms / 20 docs (ESR index)</text></svg>