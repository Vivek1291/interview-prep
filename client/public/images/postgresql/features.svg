<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="PostgreSQL strengths: MVCC, rich types like jsonb, many index types, advanced SQL, extensions and reliability features, and when MongoDB fits better"><title>PostgreSQL strengths: MVCC, rich types like jsonb, many index types, advanced SQL, extensions and reliability features, and when MongoDB fits better</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Why PostgreSQL?</text><rect x="30" y="60" width="170" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="83.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">MVCC</text><rect x="206" y="60" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="83" font-size="11.5" text-anchor="middle" fill="#1e293b">readers never block writers; snapshots per transaction</text><rect x="30" y="104" width="170" height="38" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="115" y="127.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Rich types</text><rect x="206" y="104" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="127" font-size="11.5" text-anchor="middle" fill="#1e293b">jsonb, arrays, uuid, timestamptz, numeric, ranges, enums</text><rect x="30" y="148" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="171.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Indexes</text><rect x="206" y="148" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="171" font-size="11.5" text-anchor="middle" fill="#1e293b">B-tree, GIN, GiST, BRIN, partial, expression, covering</text><rect x="30" y="192" width="170" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="115" y="215.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">SQL power</text><rect x="206" y="192" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="215" font-size="11.5" text-anchor="middle" fill="#1e293b">CTEs, window functions, UPSERT (ON CONFLICT), RETURNING, LATERAL</text><rect x="30" y="236" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="259.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Extensions</text><rect x="206" y="236" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="259" font-size="11.5" text-anchor="middle" fill="#1e293b">PostGIS, pg_trgm, pgvector, pg_stat_statements, TimescaleDB</text><rect x="30" y="280" width="170" height="38" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="115" y="303.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Reliability</text><rect x="206" y="280" width="564" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="303" font-size="11.5" text-anchor="middle" fill="#1e293b">transactional DDL, WAL, streaming replication, point-in-time recovery</text><rect x="30" y="330" width="740" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="356" font-size="11.5" text-anchor="middle" fill="#1e293b">Choose MongoDB when documents vary a lot and you query by one aggregate; choose PostgreSQL when data is relational and correctness matters.</text></svg>