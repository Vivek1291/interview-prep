<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Many Node instances connecting through PgBouncer to PostgreSQL, and scaling options: read replicas, partitioning, vertical scaling, sharding and timeouts"><title>Many Node instances connecting through PgBouncer to PostgreSQL, and scaling options: read replicas, partitioning, vertical scaling, sharding and timeouts</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Scaling PostgreSQL</text><rect x="30" y="60" width="220" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="86.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">20 Node instances</text><text x="140" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">× pool max 10</text><line x1="250" y1="90" x2="300" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="60" width="200" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="86.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">PgBouncer</text><text x="400" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(transaction pooling)</text><line x1="500" y1="90" x2="550" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="550" y="60" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="660" y="86.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">PostgreSQL</text><text x="660" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">max_connections 100</text><text x="400" y="146" font-size="11.5" text-anchor="middle" fill="#475569">200 client connections → ~20 server connections; each Postgres connection is a process (~10 MB)</text><rect x="30" y="166" width="300" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="187.9" font-size="11" text-anchor="middle" fill="#1e293b">read replicas</text><rect x="336" y="166" width="434" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="187.9" font-size="11" text-anchor="middle" fill="#1e293b">scale reads; replication lag → read-your-writes from the primary</text><rect x="30" y="208" width="300" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="229.9" font-size="11" text-anchor="middle" fill="#1e293b">partitioning</text><rect x="336" y="208" width="434" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="229.9" font-size="11" text-anchor="middle" fill="#1e293b">split big tables by time/tenant; drop old partitions instantly</text><rect x="30" y="250" width="300" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="271.9" font-size="11" text-anchor="middle" fill="#1e293b">vertical scale + indexes</text><rect x="336" y="250" width="434" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="271.9" font-size="11" text-anchor="middle" fill="#1e293b">usually the first, cheapest step</text><rect x="30" y="292" width="300" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="313.9" font-size="11" text-anchor="middle" fill="#1e293b">sharding (Citus) / managed (RDS, Aurora)</text><rect x="336" y="292" width="434" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="313.9" font-size="11" text-anchor="middle" fill="#1e293b">only when one primary truly can't keep up</text><rect x="30" y="334" width="300" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="355.9" font-size="11" text-anchor="middle" fill="#1e293b">statement_timeout + idle-in-tx timeout</text><rect x="336" y="334" width="434" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="355.9" font-size="11" text-anchor="middle" fill="#1e293b">stop runaway queries and stuck transactions</text></svg>