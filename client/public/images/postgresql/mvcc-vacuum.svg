<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Updates create new row versions; measured table growth from 360 KB to 7376 KB after 20 updates, VACUUM making the space reusable without shrinking, VACUUM FULL shrinking back to 360 KB"><title>Updates create new row versions; measured table growth from 360 KB to 7376 KB after 20 updates, VACUUM making the space reusable without shrinking, VACUUM FULL shrinking back to 360 KB</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">MVCC, dead rows and VACUUM (measured)</text><rect x="30" y="60" width="740" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="91.7" font-size="12" text-anchor="middle" fill="#1e293b">UPDATE never overwrites a row: it writes a NEW row version and marks the old one dead.</text><text x="400" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b">Readers see the version valid for their snapshot, so readers never block writers (MVCC).</text><text x="400" y="156" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 10,000 rows, 20 full-table UPDATEs, autovacuum off</text><text x="290" y="185" font-size="11.5" text-anchor="end" fill="#475569">initial</text><rect x="300" y="168" width="18" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="324" y="185" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">360 KB</text><text x="290" y="221" font-size="11.5" text-anchor="end" fill="#475569">after 20 updates (198,522 dead rows)</text><rect x="300" y="204" width="368.8" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="674.8" y="221" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7376 KB</text><text x="290" y="257" font-size="11.5" text-anchor="end" fill="#475569">after VACUUM (dead 0, space reusable)</text><rect x="300" y="240" width="368.8" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="674.8" y="257" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7376 KB</text><text x="290" y="293" font-size="11.5" text-anchor="end" fill="#475569">10 more updates after VACUUM</text><rect x="300" y="276" width="368.8" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="674.8" y="293" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7376 KB (no growth)</text><text x="290" y="329" font-size="11.5" text-anchor="end" fill="#475569">after VACUUM FULL (rewrites, locks)</text><rect x="300" y="312" width="18" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="324" y="329" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">360 KB</text></svg>