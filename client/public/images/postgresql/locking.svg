<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured job queue throughput: 312 jobs per second with FOR UPDATE vs 2205 with SKIP LOCKED and even distribution; deadlock detected after one second"><title>Measured job queue throughput: 312 jobs per second with FOR UPDATE vs 2205 with SKIP LOCKED and even distribution; deadlock detected after one second</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Row locks, SKIP LOCKED queues and deadlocks (measured)</text><rect x="30" y="60" width="740" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="91.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">SELECT id FROM jobs WHERE status = 'queued' ORDER BY id LIMIT 1</text><text x="400" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">FOR UPDATE SKIP LOCKED   -- each worker takes a different row, nobody waits</text><text x="400" y="156" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 8 workers, 2,000 jobs of 2 ms each</text><text x="270" y="186" font-size="11.5" text-anchor="end" fill="#475569">FOR UPDATE (workers wait for each other)</text><rect x="280" y="168" width="37.44" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="323.44" y="186" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">312 jobs/s · per worker 440,302,0,237,390,227,0,404</text><text x="270" y="226" font-size="11.5" text-anchor="end" fill="#475569">FOR UPDATE SKIP LOCKED</text><rect x="280" y="208" width="264.6" height="28" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="550.6" y="226" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2205 jobs/s · per worker ~250 each</text><rect x="30" y="262" width="740" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="306.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Deadlock (measured): A locks SKU-3 then wants SKU-4, B locks SKU-4 then wants SKU-3</text><text x="400" y="321" font-size="11.5" text-anchor="middle" fill="#1e293b">→ after deadlock_timeout (1 s) PostgreSQL aborts one: 40P01 deadlock detected, the other succeeds</text><text x="400" y="335.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Prevent: lock rows in a consistent order (ORDER BY id … FOR UPDATE), keep transactions short, retry 40P01/40001</text></svg>