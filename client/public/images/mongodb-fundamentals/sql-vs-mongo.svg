<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SQL vs MongoDB"><title>SQL vs MongoDB</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Linked spreadsheets (SQL) vs complete forms (MongoDB)</text><rect x="30" y="70" width="150" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="101.6" font-size="13" text-anchor="middle" fill="#1e293b">users</text><text x="105" y="117.6" font-size="13" text-anchor="middle" fill="#1e293b">id · name</text><rect x="30" y="170" width="150" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="201.7" font-size="12" text-anchor="middle" fill="#1e293b">orders</text><text x="105" y="216.7" font-size="12" text-anchor="middle" fill="#1e293b">id · user_id · total</text><rect x="30" y="270" width="150" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="301.7" font-size="12" text-anchor="middle" fill="#1e293b">order_items</text><text x="105" y="316.7" font-size="12" text-anchor="middle" fill="#1e293b">order_id · sku · qty</text><line x1="105" y1="140" x2="105" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="131" y="157" font-size="12" text-anchor="middle" fill="#475569">JOIN</text><line x1="105" y1="240" x2="105" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="131" y="257" font-size="12" text-anchor="middle" fill="#475569">JOIN</text><text x="105" y="60" font-size="12" text-anchor="middle" fill="#475569">3 tables, joined at read time</text><rect x="440" y="70" width="330" height="270" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="605" y="209.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="605" y="60" font-size="12" text-anchor="middle" fill="#475569">1 document, read in one go</text><text x="460" y="100" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ _id: 42,</text><text x="460" y="130" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  user: { id: 1, name: &quot;Asha&quot; },</text><text x="460" y="160" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  items: [</text><text x="460" y="190" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    { sku: &quot;MUG&quot;, qty: 2, price: 300 },</text><text x="460" y="220" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    { sku: &quot;PEN&quot;, qty: 3, price: 100 }</text><text x="460" y="250" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  ],</text><text x="460" y="280" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  total: 900 }</text><line x1="200" y1="205" x2="430" y2="205" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="315" y="197" font-size="12" text-anchor="middle" fill="#475569">same data</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">SQL: integrity + flexible joins · MongoDB: read whole aggregates, flexible schema</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Choose by access patterns, consistency needs and team skills</text></svg>