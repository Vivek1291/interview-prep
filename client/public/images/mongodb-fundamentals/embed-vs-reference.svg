<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Embed vs reference"><title>Embed vs reference</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Inside the passport (embed) vs an account number (reference)</text><rect x="40" y="70" width="300" height="230" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="190" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="190" y="95" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">PASSPORT = user document</text><rect x="60" y="115" width="260" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="190" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">photo, name (1:1) → embed</text><rect x="60" y="165" width="260" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="190" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b">visa stamps (few, bounded) → embed</text><rect x="60" y="215" width="260" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="190" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b">bank account: 123</text><text x="190" y="256.7" font-size="12" text-anchor="middle" fill="#1e293b">(just the id) → reference</text><rect x="470" y="150" width="290" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="615" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">BANK = orders collection</text><text x="615" y="209.2" font-size="12" text-anchor="middle" fill="#1e293b">unbounded · shared · changes daily</text><text x="615" y="224.2" font-size="12" text-anchor="middle" fill="#1e293b">{ userId: 123, ... } × thousands</text><line x1="320" y1="245" x2="466" y2="215" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="393" y="222" font-size="12" text-anchor="middle" fill="#475569">userId (indexed)</text><rect x="470" y="70" width="290" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="615" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">16 MB per document: never grow arrays forever</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Embed: read together + owned + bounded · Reference: big, shared or independent</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Hybrid: id + a snapshot of the fields you always show</text></svg>