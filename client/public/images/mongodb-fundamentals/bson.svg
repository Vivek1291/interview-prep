<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="BSON"><title>BSON</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Handwriting (JSON) vs a labelled code (BSON)</text><rect x="40" y="80" width="300" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="121.3" font-size="18" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{&quot;a&quot;: 1}</text><text x="190" y="172" font-size="12" text-anchor="middle" fill="#475569">JSON: text, parse every character</text><text x="190" y="192" font-size="11.5" text-anchor="middle" fill="#475569">types: string, number, bool, null, array, object</text><rect x="400" y="85" width="95" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="447.5" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0c 00 00 00</text><text x="447.5" y="145" font-size="11" text-anchor="middle" fill="#475569">length 12</text><rect x="500" y="85" width="45" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="522.5" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><text x="522.5" y="161" font-size="11" text-anchor="middle" fill="#475569">type int32</text><rect x="550" y="85" width="65" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="582.5" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">61 00</text><text x="582.5" y="145" font-size="11" text-anchor="middle" fill="#475569">name &quot;a&quot;</text><rect x="620" y="85" width="95" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="667.5" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">01 00 00 00</text><text x="667.5" y="161" font-size="11" text-anchor="middle" fill="#475569">value 1</text><rect x="720" y="85" width="45" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="742.5" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">00</text><text x="742.5" y="145" font-size="11" text-anchor="middle" fill="#475569">end</text><rect x="60" y="225" width="125" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="122.5" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">ObjectId</text><rect x="200" y="225" width="125" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="262.5" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Date</text><rect x="340" y="225" width="125" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="402.5" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Int64</text><rect x="480" y="225" width="125" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="542.5" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Decimal128</text><rect x="620" y="225" width="125" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682.5" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Binary</text><text x="400" y="295" font-size="12.5" text-anchor="middle" fill="#ef4444" font-weight="700">money: 0.1 + 0.2 as doubles = 0.30000000000000004 · as Decimal128 = 0.3</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Same size as JSON (157 vs 161 bytes) · faster to scan, richer types</text></svg>