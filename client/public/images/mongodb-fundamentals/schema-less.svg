nchor="middle" fill="#1e293b">v1: price &quot;25.50&quot;</text><text x="655" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b">↓ migrate (lazy or batch)</text><text x="655" y="274.2" font-size="12" text-anchor="middle" fill="#1e293b">v2: price 25.5</text><line x1="260" y1="130" x2="296" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="260" y1="255" x2="296" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="170" x2="536" y2="120" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="500" y1="220" x2="536" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">&quot;Schema-less&quot; = flexible schema: same collection, different shapes, explicit rules</text></svg>