<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="ObjectId"><title>ObjectId</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A ticket from the entrance machine: 12 bytes</text><rect x="60" y="90" width="240" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="180" y="127" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">66f1c0a2</text><rect x="300" y="90" width="280" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="440" y="127" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">e4b0a1b2c3</text><rect x="580" y="90" width="160" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660" y="127" font-size="20" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">d4e5f6</text><text x="180" y="180" font-size="13" text-anchor="middle" fill="#1e293b">4 bytes: time printed</text><text x="180" y="202" font-size="13" text-anchor="middle" fill="#1e293b">(Unix seconds)</text><text x="440" y="180" font-size="13" text-anchor="middle" fill="#1e293b">5 bytes: which machine</text><text x="440" y="202" font-size="13" text-anchor="middle" fill="#1e293b">(random per process)</text><text x="660" y="180" font-size="13" text-anchor="middle" fill="#1e293b">3 bytes: counter</text><text x="660" y="202" font-size="13" text-anchor="middle" fill="#1e293b">(+1 per ticket)</text><rect x="60" y="240" width="330" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="225" y="261.7" font-size="12" text-anchor="middle" fill="#1e293b">sort({ _id: -1 }) ≈ newest first</text><text x="225" y="276.7" font-size="12" text-anchor="middle" fill="#1e293b">getTimestamp() → creation time</text><rect x="410" y="240" width="330" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="575" y="261.7" font-size="12" text-anchor="middle" fill="#1e293b">made by the driver, unique everywhere</text><text x="575" y="276.7" font-size="12" text-anchor="middle" fill="#1e293b">validate 24 hex chars → 400</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Not a secret: never authorize by &quot;knowing the id&quot;</text></svg>