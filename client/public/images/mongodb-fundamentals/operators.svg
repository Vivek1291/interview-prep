<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Operators"><title>Operators</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Question words (filters) and instruction words (updates)</text><text x="200" y="72" font-size="14" text-anchor="middle" fill="#0ea5e9" font-weight="700">ASK (query operators)</text><text x="600" y="72" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="700">INSTRUCT (update operators)</text><rect x="40" y="88" width="180" height="42" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="113.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$gt $gte $lt $lte</text><text x="235" y="113" font-size="12" text-anchor="start" fill="#475569">older than…</text><rect x="40" y="144" width="180" height="42" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$in $nin $ne</text><text x="235" y="169" font-size="12" text-anchor="start" fill="#475569">one of…</text><rect x="40" y="200" width="180" height="42" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$or, implicit AND</text><text x="235" y="225" font-size="12" text-anchor="start" fill="#475569">either / both</text><rect x="40" y="256" width="180" height="42" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="281.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$all $size $elemMatch</text><text x="235" y="281" font-size="12" text-anchor="start" fill="#475569">arrays</text><rect x="430" y="88" width="210" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="535" y="113.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$set $unset $rename</text><text x="655" y="113" font-size="12" text-anchor="start" fill="#475569">fields</text><rect x="430" y="144" width="210" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="535" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$inc $min $max</text><text x="655" y="169" font-size="12" text-anchor="start" fill="#475569">numbers, atomic</text><rect x="430" y="200" width="210" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="535" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">$push $addToSet $pull</text><text x="655" y="225" font-size="12" text-anchor="start" fill="#475569">arrays</text><rect x="430" y="256" width="210" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="535" y="281.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">items.$ · $[] · arrayFilters</text><text x="655" y="281" font-size="12" text-anchor="start" fill="#475569">array elements</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">200 concurrent +1: read-modify-write → 1 · $inc → 200</text></svg>