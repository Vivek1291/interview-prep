<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Venn diagrams for inner, left, right and full outer joins, with example row counts and anti-join, self join and cross join"><title>Venn diagrams for inner, left, right and full outer joins, with example row counts and anti-join, self join and cross join</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">SQL joins</text><circle cx="88" cy="135" r="45" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" fill-opacity="0.9"/><circle cx="132" cy="135" r="45" fill="#ffffff" stroke="#10b981" stroke-width="1.5" fill-opacity="0.75"/><path d="M110 99 A45 45 0 0 1 110 171 A45 45 0 0 1 110 99" fill="#fef3c7" stroke="#f59e0b"/><text x="110" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">INNER JOIN</text><circle cx="278" cy="135" r="45" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" fill-opacity="0.9"/><circle cx="322" cy="135" r="45" fill="#ffffff" stroke="#10b981" stroke-width="1.5" fill-opacity="0.75"/><path d="M300 99 A45 45 0 0 1 300 171 A45 45 0 0 1 300 99" fill="#fef3c7" stroke="#f59e0b"/><text x="300" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">LEFT JOIN</text><circle cx="468" cy="135" r="45" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" fill-opacity="0.9"/><circle cx="512" cy="135" r="45" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" fill-opacity="0.75"/><path d="M490 99 A45 45 0 0 1 490 171 A45 45 0 0 1 490 99" fill="#fef3c7" stroke="#f59e0b"/><text x="490" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">RIGHT JOIN</text><circle cx="658" cy="135" r="45" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" fill-opacity="0.9"/><circle cx="702" cy="135" r="45" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" fill-opacity="0.75"/><path d="M680 99 A45 45 0 0 1 680 171 A45 45 0 0 1 680 99" fill="#fef3c7" stroke="#f59e0b"/><text x="680" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">FULL OUTER JOIN</text><text x="110" y="220" font-size="11" text-anchor="middle" fill="#475569">only matches</text><text x="300" y="220" font-size="11" text-anchor="middle" fill="#475569">all left + matches</text><text x="490" y="220" font-size="11" text-anchor="middle" fill="#475569">all right + matches</text><text x="680" y="220" font-size="11" text-anchor="middle" fill="#475569">everything</text><rect x="30" y="240" width="740" height="136" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="283" font-size="11.5" text-anchor="middle" fill="#1e293b">users (Asha, Ben, Chen) · orders (Asha ×2, Ben ×1, one order with user_id NULL)</text><text x="400" y="297.5" font-size="11.5" text-anchor="middle" fill="#1e293b">INNER JOIN → 3 rows (Asha, Asha, Ben)</text><text x="400" y="312" font-size="11.5" text-anchor="middle" fill="#1e293b">LEFT JOIN users → orders → 4 rows (Chen with NULL order: users without orders)</text><text x="400" y="326.5" font-size="11.5" text-anchor="middle" fill="#1e293b">LEFT JOIN … WHERE o.id IS NULL → anti-join: Chen only</text><text x="400" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b">SELF JOIN: employees e JOIN employees m ON m.id = e.manager_id · CROSS JOIN: every combination</text></svg>