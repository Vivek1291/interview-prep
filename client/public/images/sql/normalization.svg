<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A flat orders table with repeated data, the rules of first, second and third normal form, and when to normalise or denormalise"><title>A flat orders table with repeated data, the rules of first, second and third normal form, and when to normalise or denormalise</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Normalisation: 1NF, 2NF, 3NF</text><rect x="30" y="60" width="740" height="52" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="82.75" font-size="11.5" text-anchor="middle" fill="#1e293b">orders_flat(order_id, customer_email, customer_city, product_name, product_price, qty)</text><text x="400" y="97.25" font-size="11.5" text-anchor="middle" fill="#1e293b">the same customer and product data repeated on every row</text><rect x="30" y="128" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="75" y="152.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1NF</text><rect x="126" y="128" width="644" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="448" y="152" font-size="11.5" text-anchor="middle" fill="#1e293b">atomic values, no repeating groups (no "tags: a,b,c" column, no item1/item2 columns)</text><rect x="30" y="174" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="75" y="198.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">2NF</text><rect x="126" y="174" width="644" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="448" y="198" font-size="11.5" text-anchor="middle" fill="#1e293b">every column depends on the WHOLE key (product_name depends only on product_id → products table)</text><rect x="30" y="220" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="75" y="244.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">3NF</text><rect x="126" y="220" width="644" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="448" y="244" font-size="11.5" text-anchor="middle" fill="#1e293b">no column depends on another non-key column (city depends on customer → customers table)</text><rect x="30" y="274" width="360" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="320.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Normalise for: correctness, one place to update,</text><text x="210" y="335.25" font-size="11.5" text-anchor="middle" fill="#1e293b">no update anomalies (OLTP, money, inventory)</text><rect x="410" y="274" width="360" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="313.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Denormalise on purpose for: read-heavy views,</text><text x="590" y="328" font-size="11.5" text-anchor="middle" fill="#1e293b">reporting, caches, snapshots (order keeps the</text><text x="590" y="342.5" font-size="11.5" text-anchor="middle" fill="#1e293b">price paid), with a plan to keep copies in sync</text></svg>