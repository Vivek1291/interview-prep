rt-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Indexes and query plans (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured on PostgreSQL 17: 100k users, 1M orders (best of 3)</text><text x="290" y="86" font-size="11.5" text-anchor="end" fill="#475569">email = (unique index)</text><rect x="300" y="70" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="86" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.007 ms</text><text x="290" y="119" font-size="11.5" text-anchor="end" fill="#475569">lower(email) = …, no expression index</text><rect x="300" y="103" width="145.6" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="451.6" y="119" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">18.2 ms</text><text x="290" y="152" font-size="11.5" text-anchor="end" fill="#475569">lower(email) = …, expression index</text><rect x="300" y="136" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="152" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.008 ms</text><text x="290" y="185" font-size="11.5" text-anchor="end" fill="#475569">orders WHERE user_id, no index</text><rect x="300" y="169" width="87.2" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="393.2" y="185" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10.9 ms</text><text x="290" y="218" font-size="11.5" text-anchor="end" fill="#475569">orders WHERE user_id, index</text><rect x="300" y="202" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="218" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.007 ms</text><text x="290" y="251" font-size="11.5" text-anchor="end" fill="#475569">LIKE 'user77777%', default collation</text><rect x="300" y="235" width="30" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="336" y="251" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">3.75 ms</text><text x="290" y="284" font-size="11.5" text-anchor="end" fill="#475569">LIKE 'user77777%', text_pattern_ops</text><rect x="300" y="268" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="284" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.083 ms</text><text x="290" y="317" font-size="11.5" text-anchor="end" fill="#475569">OFFSET 500000 LIMIT 20</text><rect x="300" y="301" width="405.6" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="711.6" y="317" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50.7 ms</text><text x="290" y="350" font-size="11.5" text-anchor="end" fill="#475569">keyset WHERE created_at &lt; x LIMIT 20</text><rect x="300" y="334" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="350" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.012 ms</text></svg>