 y="130.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">user_id  FK → users.id</text><text x="410" y="144.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">status  CHECK (…)</text><text x="410" y="158.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">total_cents</text><rect x="560" y="60" width="210" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="665" y="89.95" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">order_items</text><text x="665" y="103.45" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">─────────</text><text x="665" y="116.95" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(order_id, product_id) PK</text><text x="665" y="130.45" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">order_id  FK → orders</text><text x="665" y="143.95" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">product_id FK → products</text><text x="665" y="157.45" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">qty  CHECK (qty &gt; 0)</text><line x1="300" y1="110" x2="262" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="560