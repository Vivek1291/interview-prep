<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Atomicity, consistency, isolation and durability; measured behaviour of read committed, repeatable read and serializable when another transaction commits in between, including write skew"><title>Atomicity, consistency, isolation and durability; measured behaviour of read committed, repeatable read and serializable when another transaction commits in between, including write skew</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">ACID and isolation levels (measured)</text><rect x="30" y="60" width="150" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="80.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Atomicity</text><rect x="186" y="60" width="584" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="80" font-size="11.5" text-anchor="middle" fill="#1e293b">all statements or none (ROLLBACK)</text><rect x="30" y="98" width="150" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="118.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Consistency</text><rect x="186" y="98" width="584" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="118" font-size="11.5" text-anchor="middle" fill="#1e293b">constraints hold before and after</text><rect x="30" y="136" width="150" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="156.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Isolation</text><rect x="186" y="136" width="584" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="156" font-size="11.5" text-anchor="middle" fill="#1e293b">concurrent transactions don't see each other's partial work</text><rect x="30" y="174" width="150" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Durability</text><rect x="186" y="174" width="584" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="194" font-size="11.5" text-anchor="middle" fill="#1e293b">committed = survives a crash (WAL)</text><text x="400" y="228" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured (PostgreSQL 17): another transaction commits stock 50 → 45 in the middle</text><rect x="30" y="240" width="220" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="140" y="263" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">READ COMMITTED (default)</text><rect x="256" y="240" width="514" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="263" font-size="11.5" text-anchor="middle" fill="#1e293b">reads 50 then 45 · its update wins · final 44 (lost update risk)</text><rect x="30" y="284" width="220" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="307" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">REPEATABLE READ</text><rect x="256" y="284" width="514" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="307" font-size="11.5" text-anchor="middle" fill="#1e293b">reads 50 then 50 · update fails 40001 → retry</text><rect x="30" y="328" width="220" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="351" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">SERIALIZABLE</text><rect x="256" y="328" width="514" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="351" font-size="11.5" text-anchor="middle" fill="#1e293b">same, and also catches write skew (on-call doctors: 1 left, RR left 0)</text></svg>