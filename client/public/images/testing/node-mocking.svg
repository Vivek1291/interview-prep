<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Ways to mock in Node tests: dependency injection, method mocks, module mocks, fake timers, stubbing global fetch, and MSW or nock for outgoing HTTP"><title>Ways to mock in Node tests: dependency injection, method mocks, module mocks, fake timers, stubbing global fetch, and MSW or nock for outgoing HTTP</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Mocking in Node.js tests</text><rect x="30" y="62" width="230" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="86.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">dependency injection</text><rect x="266" y="62" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">createApp({ db, mailer, clock }) → pass fakes in tests</text><rect x="30" y="108" width="230" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="132.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">method mock</text><rect x="266" y="108" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">mock.method(mailer, 'send', fake) / vi.spyOn</text><rect x="30" y="154" width="230" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="145" y="178.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">module mock</text><rect x="266" y="154" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="177.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">vi.mock('./mailer') / jest.mock (hoisted)</text><rect x="30" y="200" width="230" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="145" y="224.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">timers</text><rect x="266" y="200" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="223.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">mock.timers.tick(60_000) / vi.advanceTimersByTime</text><rect x="30" y="246" width="230" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="270.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">global fetch</text><rect x="266" y="246" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="269.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">mock.method(globalThis, 'fetch', …) or MSW</text><rect x="30" y="292" width="230" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">outgoing HTTP (any client)</text><rect x="266" y="292" width="504" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">MSW (msw/node) or nock</text><rect x="30" y="346" width="740" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="367.2" font-size="12" text-anchor="middle" fill="#1e293b">Prefer injection (explicit, no magic) → method mocks → module mocks (last resort, hoisting surprises).</text></svg>