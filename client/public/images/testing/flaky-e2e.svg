rker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Flaky tests and Playwright vs Cypress</text><text x="400" y="66" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: the same check on a page whose data streams in after ~400 ms, run 10 times</text><rect x="30" y="82" width="330" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="195" y="105" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">waitForTimeout(200) then count()</text><rect x="370" y="90" width="4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="382" y="106" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0/10 passed</text><rect x="30" y="128" width="330" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="195" y="151" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await expect(items).toHaveCount(5)</text><rect x="370" y="136" width="300" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="678" y="152" font-size="12" text-anchor="start" fill="#475569" font-weight="700">10/10 passed</text><rect x="30" y="186" width="136" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="98" y="204.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="170" y="186" width="301" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="320.5" y="204.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Playwright</text><rect x="475" y="186" width="301" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="625.5" y="204.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Cypress</text><rect x="30" y="218" width="136" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="98" y="236.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">runs</text><rect x="170" y="218" width="301" height="29" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="320.5" y="236.4" font-size="11" text-anchor="middle" fill="#1e293b">outside the browser (CDP/protocol)</text><rect x="475" y="218" width="301" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625.5" y="236.4" font-size="11" text-anchor="middle" fill="#1e293b">inside the browser</text><rect x="30" y="250" width="136" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="98" y="268.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">browsers</text><rect x="170" y="250" width="301" height="29" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="320.5" y="268.4" font-size="11" text-anchor="middle" fill="#1e293b">Chromium, Firefox, WebKit (Safari)</text><rect x="475" y="250" width="301" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625.5" y="268.4" font-size="11" text-anchor="middle" fill="#1e293b">Chromium family, Firefox, WebKit (exp.)</text><rect x="30" y="282" width="136" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="98" y="300.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">tabs / origins</text><rect x="170" y="282" width="301" height="29" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="320.5" y="300.4" font-size="11" text-anchor="middle" fill="#1e293b">multi-tab, multi-origin</text><rect x="475" y="282" width="301" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625.5" y="300.4" font-size="11" text-anchor="middle" fill="#1e293b">single tab, cross-origin via cy.origin</text><rect x="30" y="