<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Dummies fill parameters, stubs return canned answers, spies record calls, mocks verify expectations, and fakes are working lightweight implementations like an in-memory database"><title>Dummies fill parameters, stubs return canned answers, spies record calls, mocks verify expectations, and fakes are working lightweight implementations like an in-memory database</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Test doubles: dummy, stub, spy, mock, fake</text><rect x="30" y="64" width="130" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="90.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Dummy</text><rect x="166" y="64" width="230" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="281" y="90.2" font-size="12" text-anchor="middle" fill="#1e293b">passed but never used</text><rect x="402" y="64" width="368" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="586" y="90" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">new Logger() just to fill a parameter</text><rect x="30" y="116" width="130" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="142.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Stub</text><rect x="166" y="116" width="230" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="281" y="142.2" font-size="12" text-anchor="middle" fill="#1e293b">returns canned answers</text><rect x="402" y="116" width="368" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="586" y="142" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getRate = () =&gt; 1.1</text><rect x="30" y="168" width="130" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="95" y="194.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Spy</text><rect x="166" y="168" width="230" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="281" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">records how it was called</text><rect x="402" y="168" width="368" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="586" y="194" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">vi.spyOn(console, &quot;error&quot;)</text><rect x="30" y="220" width="130" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="95" y="246.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Mock</text><rect x="166" y="220" width="230" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="281" y="246.2" font-size="12" text-anchor="middle" fill="#1e293b">stub + spy + expectations</text><rect x="402" y="220" width="368" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="586" y="246" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">expect(send).toHaveBeenCalledWith(...)</text><rect x="30" y="272" width="130" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="95" y="298.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Fake</text><rect x="166" y="272" width="230" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="281" y="298.2" font-size="12" text-anchor="middle" fill="#1e293b">working light implementation</text><rect x="402" y="272" width="368" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="586" y="298" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">in-memory DB, MSW server, fake timers</text><rect x="30" y="334" width="740" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="360.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Mock what you do not own or cannot control (network, time, randomness, email); avoid mocking your own modules.</text></svg>