<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Query priority: role, label text, placeholder, text, display value, alt/title, test id last; getBy throws, queryBy returns null, findBy waits for async elements, AllBy returns arrays"><title>Query priority: role, label text, placeholder, text, display value, alt/title, test id last; getBy throws, queryBy returns null, findBy waits for async elements, AllBy returns arrays</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Which query should I use?</text><rect x="30" y="62" width="200" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="81" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1 getByRole</text><rect x="234" y="62" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="80.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('button', { name: /save/i })</text><rect x="30" y="96" width="200" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2 getByLabelText</text><rect x="234" y="96" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('Email')</text><rect x="30" y="130" width="200" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="149" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3 getByPlaceholderText</text><rect x="234" y="130" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="148.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('Search…')</text><rect x="30" y="164" width="200" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="183" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4 getByText</text><rect x="234" y="164" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="182.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('No users yet')</text><rect x="30" y="198" width="200" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="217" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5 getByDisplayValue</text><rect x="234" y="198" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="216.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('asha@x.com')</text><rect x="30" y="232" width="200" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="251" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">6 getByAltText / Title</text><rect x="234" y="232" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="250.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('Logo')</text><rect x="30" y="266" width="200" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="130" y="285" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7 getByTestId</text><rect x="234" y="266" width="220" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="344" y="284.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">('cart-total') last resort</text><text x="615" y="70" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Variants</text><rect x="480" y="84" width="110" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="535" y="112.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getBy…</text><rect x="594" y="84" width="176" height="48" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682" y="104.9" font-size="11" text-anchor="middle" fill="#1e293b">throws if 0 or &gt;1</text><text x="682" y="118.9" font-size="11" text-anchor="middle" fill="#1e293b">element must be there now</text><rect x="480" y="140" width="110" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="535" y="168.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">queryBy…</text><rect x="594" y="140" width="176" height="48" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682" y="160.9" font-size="11" text-anchor="middle" fill="#1e293b">returns null if 0</text><text x="682" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">assert something is NOT there</text><rect x="480" y="196" width="110" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="535" y="224.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">findBy…</text><rect x="594" y="196" width="176" height="48" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682" y="216.9" font-size="11" text-anchor="middle" fill="#1e293b">Promise, retries ~1 s</text><text x="682" y="230.9" font-size="11" text-anchor="middle" fill="#1e293b">appears later (async)</text><rect x="480" y="252" width="110" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="535" y="280.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">…AllBy…</text><rect x="594" y="252" width="176" height="48" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682" y="272.9" font-size="11" text-anchor="middle" fill="#1e293b">arrays</text><text x="682" y="286.9" font-size="11" text-anchor="middle" fill="#1e293b">lists</text><text x="400" y="330" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Role queries also check accessibility: if getByRole cannot find your button, neither can a screen reader.</text></svg>