<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="user-event simulates full user interactions; findBy and waitFor wait for async UI; avoid fixed timeouts and fireEvent for typing"><title>user-event simulates full user interactions; findBy and waitFor wait for async UI; avoid fixed timeouts and fireEvent for typing</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Interacting and waiting for async UI</text><rect x="30" y="66" width="230" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="100.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await user.click(button)</text><line x1="262" y1="96" x2="296" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="66" width="200" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">state update →</text><text x="400" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">loading UI</text><line x1="502" y1="96" x2="536" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="540" y="66" width="230" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="655" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">fetch resolves →</text><text x="655" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">result rendered</text><rect x="30" y="150" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="44" y="185" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">✅ await screen.findByText('Saved')</text><text x="44" y="199.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">✅ await waitFor(() =&gt;</text><text x="44" y="214" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">     expect(save).toHaveBeenCalled())</text><text x="44" y="228.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">✅ expect(queryByText('Loading'))</text><text x="44" y="243" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">     .not.toBeInTheDocument()</text><rect x="410" y="150" width="360" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="424" y="185" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">❌ fireEvent for typing (no focus,</text><text x="424" y="199.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">   keydown, input sequence)</text><text x="424" y="214" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">❌ await new Promise(r =&gt;</text><text x="424" y="228.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">     setTimeout(r, 500))</text><text x="424" y="243" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">❌ waitFor(() =&gt; fireEvent…) side effects</text><rect x="30" y="290" width="740" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="321.7" font-size="12" text-anchor="middle" fill="#1e293b">userEvent.setup() simulates real interactions: pointer → focus → keydown/keypress/input → keyup → change,</text><text x="400" y="336.7" font-size="12" text-anchor="middle" fill="#1e293b">respects disabled elements, pointer-events and maxLength. fireEvent dispatches one DOM event only.</text></svg>