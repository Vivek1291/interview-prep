<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Playwright drives real browsers against the running app; locators, auto-waiting, web-first assertions, isolated browser contexts and trace debugging"><title>Playwright drives real browsers against the running app; locators, auto-waiting, web-first assertions, isolated browser contexts and trace debugging</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Playwright: end-to-end tests in real browsers</text><rect x="30" y="66" width="170" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="100.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Playwright test</text><line x1="202" y1="96" x2="236" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="240" y="66" width="200" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="340" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">real browser</text><text x="340" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">Chromium / Firefox / WebKit</text><line x1="442" y1="96" x2="476" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="66" width="290" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">your running app</text><text x="625" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">(next start / staging URL)</text><rect x="30" y="146" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Locators</text><rect x="206" y="146" width="340" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="168.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">page.getByRole('button', { name: 'Add' })</text><rect x="552" y="146" width="218" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="169" font-size="11.5" text-anchor="middle" fill="#1e293b">lazy, re-found on every action</text><rect x="30" y="190" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="213.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Auto-wait</text><rect x="206" y="190" width="340" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="212.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">click() waits until visible, enabled, stable</text><rect x="552" y="190" width="218" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="213" font-size="11.5" text-anchor="middle" fill="#1e293b">no manual sleeps</text><rect x="30" y="234" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="257.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Web-first assertions</text><rect x="206" y="234" width="340" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="256.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await expect(locator).toHaveText('…')</text><rect x="552" y="234" width="218" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="257" font-size="11.5" text-anchor="middle" fill="#1e293b">retry until true or timeout</text><rect x="30" y="278" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Isolation</text><rect x="206" y="278" width="340" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="300.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">new browser context per test</text><rect x="552" y="278" width="218" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="301" font-size="11.5" text-anchor="middle" fill="#1e293b">cookies/storage never leak</text><rect x="30" y="322" width="170" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="345.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Debugging</text><rect x="206" y="322" width="340" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="344.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">trace viewer, --ui mode, codegen</text><rect x="552" y="322" width="218" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="345" font-size="11.5" text-anchor="middle" fill="#1e293b">see every step</text></svg>