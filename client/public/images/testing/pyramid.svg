<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Unit tests at the base, integration in the middle, end-to-end at the top; measured median time per test: unit 0.32 ms, API integration 5.6 ms, component 71.6 ms, end-to-end 992 ms"><title>Unit tests at the base, integration in the middle, end-to-end at the top; measured median time per test: unit 0.32 ms, API integration 5.6 ms, component 71.6 ms, end-to-end 992 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The testing pyramid (with measured speeds)</text><polygon points="200,70 250,70 290,150 160,150" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="225" y="120" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">E2E</text><polygon points="160,150 290,150 330,230 120,230" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="225" y="196" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Integration</text><polygon points="120,230 330,230 370,310 80,310" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="225" y="276" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Unit</text><text x="225" y="336" font-size="12" text-anchor="middle" fill="#475569">many fast tests at the bottom,</text><text x="225" y="354" font-size="12" text-anchor="middle" fill="#475569">few slow ones at the top</text><text x="590" y="70" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured: median time per test (Vitest 5, Playwright 1.63)</text><text x="590" y="102" font-size="12" text-anchor="middle" fill="#475569">unit (pure function)</text><rect x="420" y="108" width="43.6" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="471.6" y="123" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0.32 ms</text><text x="590" y="158" font-size="12" text-anchor="middle" fill="#475569">API integration (Supertest)</text><rect x="420" y="164" width="122.9" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="550.9" y="179" font-size="12" text-anchor="start" fill="#475569" font-weight="700">5.6 ms</text><text x="590" y="214" font-size="12" text-anchor="middle" fill="#475569">component (RTL + jsdom)</text><rect x="420" y="220" width="199.9" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="627.9" y="235" font-size="12" text-anchor="start" fill="#475569" font-weight="700">71.6 ms</text><text x="590" y="270" font-size="12" text-anchor="middle" fill="#475569">E2E (Chrome + Next.js)</text><rect x="420" y="276" width="279.8" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="707.8" y="291" font-size="12" text-anchor="start" fill="#475569" font-weight="700">992 ms</text><text x="590" y="330" font-size="11.5" text-anchor="middle" fill="#475569" font-style="italic">(log scale) E2E ≈ 3,000× slower than a unit test</text><text x="590" y="352" font-size="11.5" text-anchor="middle" fill="#475569" font-style="italic">but it is the only one that tests the real app</text></svg>