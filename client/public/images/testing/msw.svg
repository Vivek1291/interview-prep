<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Mock Service Worker intercepts fetch at the network layer and returns handler responses; tests override handlers per test for error and empty states"><title>Mock Service Worker intercepts fetch at the network layer and returns handler responses; tests override handlers per test for error and empty states</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Mocking the network with MSW</text><rect x="30" y="80" width="170" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="114.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;UserList /&gt;</text><line x1="202" y1="110" x2="246" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="224" y="100" font-size="11" text-anchor="middle" fill="#475569">fetch</text><rect x="250" y="70" width="230" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="365" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">MSW intercepts at the</text><text x="365" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b">network layer</text><text x="365" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b">(no code changes)</text><line x1="482" y1="110" x2="526" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="530" y="62" width="240" height="96" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="544" y="99.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">http.get('/users', () =&gt;</text><text x="544" y="114" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  HttpResponse.json([...])</text><text x="544" y="128.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">)</text><rect x="30" y="180" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="44" y="217.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Per-test override:</text><text x="44" y="231.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">server.use(</text><text x="44" y="245.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  http.get('/users', () =&gt;</text><text x="44" y="259.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">    new HttpResponse(null, { status: 500 })))</text><rect x="410" y="180" width="360" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="424" y="216.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Same handlers work in:</text><text x="424" y="231.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• Vitest/Jest (msw/node)</text><text x="424" y="246.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• the browser dev server (service worker)</text><text x="424" y="261.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• Storybook, Playwright</text><rect x="30" y="310" width="740" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="339.2" font-size="12" text-anchor="middle" fill="#1e293b">onUnhandledRequest: 'error' → a test fails if the component calls an API you did not mock.</text></svg>