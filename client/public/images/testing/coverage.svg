<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Line, branch and function coverage measured on the example app: 97.6% lines, 89.4% branches, 100% functions; coverage finds untested code but does not prove correctness"><title>Line, branch and function coverage measured on the example app: 97.6% lines, 89.4% branches, 100% functions; coverage finds untested code but does not prove correctness</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Code coverage: useful, but not the goal</text><text x="400" y="66" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: coverage of the example app (Vitest v8 provider, 18 tests)</text><rect x="30" y="82" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Lines / statements</text><rect x="206" y="82" width="220" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="316" y="106" font-size="11.5" text-anchor="middle" fill="#1e293b">which lines ran</text><rect x="436" y="92" width="253.7" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="697.7" y="107" font-size="12" text-anchor="start" fill="#475569" font-weight="700">97.56%</text><rect x="30" y="132" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="156.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Branches</text><rect x="206" y="132" width="220" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="316" y="156" font-size="11.5" text-anchor="middle" fill="#1e293b">both sides of if / ?: / ??</text><rect x="436" y="142" width="232.3" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="676.3" y="157" font-size="12" text-anchor="start" fill="#475569" font-weight="700">89.36%</text><rect x="30" y="182" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="206.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Functions</text><rect x="206" y="182" width="220" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="316" y="206" font-size="11.5" text-anchor="middle" fill="#1e293b">which functions were called</text><rect x="436" y="192" width="260" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="704" y="207" font-size="12" text-anchor="start" fill="#475569" font-weight="700">100%</text><rect x="30" y="248" width="740" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="289.7" font-size="12" text-anchor="middle" fill="#1e293b">Coverage shows what is NOT tested; it does not prove the tested code is correct.</text><text x="400" y="304.7" font-size="12" text-anchor="middle" fill="#1e293b">expect(true).toBe(true) after calling a function gives 100% line coverage and tests nothing.</text><text x="400" y="319.7" font-size="12" text-anchor="middle" fill="#1e293b">Use it to find untested branches (the branches missed here are fallback/error paths),</text><text x="400" y="334.7" font-size="12" text-anchor="middle" fill="#1e293b">set a sensible floor in CI (e.g. 80%), and prefer mutation testing (Stryker) to judge test quality.</text></svg>