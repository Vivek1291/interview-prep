<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The TDD cycle: write a failing test (red), write the simplest code to pass (green), then refactor while tests stay green"><title>The TDD cycle: write a failing test (red), write the simplest code to pass (green), then refactor while tests stay green</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Test-driven development: red, green, refactor</text><rect x="305" y="46" width="190" height="68" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="76.6" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">RED</text><text x="400" y="92.1" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">write a failing test</text><rect x="409.4" y="226" width="190" height="68" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="504.4" y="256.6" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">GREEN</text><text x="504.4" y="272.1" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">simplest code to pass</text><rect x="200.6" y="226" width="190" height="68" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="295.6" y="256.6" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">REFACTOR</text><text x="295.6" y="272.1" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">clean up, tests stay green</text><line x1="495" y1="125" x2="520" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><line x1="420" y1="300" x2="330" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><line x1="275" y1="210" x2="300" y2="125" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="140" y="80" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Benefits</text><text x="140" y="100" font-size="11.5" text-anchor="middle" fill="#475569">design from the caller view</text><text x="140" y="118" font-size="11.5" text-anchor="middle" fill="#475569">every line is tested</text><text x="140" y="136" font-size="11.5" text-anchor="middle" fill="#475569">safe refactoring</text><text x="660" y="80" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Best for</text><text x="660" y="100" font-size="11.5" text-anchor="middle" fill="#475569">pure logic, bug fixes</text><text x="660" y="118" font-size="11.5" text-anchor="middle" fill="#475569">(write the failing test</text><text x="660" y="136" font-size="11.5" text-anchor="middle" fill="#475569">that reproduces the bug)</text></svg>