<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Supertest sends requests to the Express app, which validates and writes to a separate MongoDB test database; setup and cleanup hooks; real databases catch unique index and schema behaviour"><title>Supertest sends requests to the Express app, which validates and writes to a separate MongoDB test database; setup and cleanup hooks; real databases catch unique index and schema behaviour</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Integration testing an API with Supertest and a test database</text><rect x="30" y="70" width="150" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="104.4" font-size="12.5" text-anchor="middle" fill="#1e293b">test (node:test)</text><line x1="182" y1="100" x2="216" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="199" y="62" font-size="10" text-anchor="middle" fill="#475569">request(app)</text><rect x="220" y="70" width="170" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="305" y="96.7" font-size="12" text-anchor="middle" fill="#1e293b">Express app</text><text x="305" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b">(no port needed)</text><line x1="392" y1="100" x2="426" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="430" y="70" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="510" y="96.7" font-size="12" text-anchor="middle" fill="#1e293b">validation +</text><text x="510" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b">Mongoose model</text><line x1="592" y1="100" x2="626" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="630" y="70" width="140" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="700" y="96.7" font-size="12" text-anchor="middle" fill="#1e293b">MongoDB</text><text x="700" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b">users_api_test</text><text x="400" y="166" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured per test (after warm-up): real MongoDB 3–9 ms · in-memory fake 5.6 ms (median)</text><rect x="30" y="186" width="360" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="227.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">before: connect + syncIndexes</text><text x="44" y="242.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">beforeEach: deleteMany (clean slate)</text><text x="44" y="257.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">after: dropDatabase + disconnect</text><text x="44" y="272.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">NEVER point MONGO_URI at real data</text><rect x="410" y="186" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="227.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Real DB catches what fakes miss:</text><text x="424" y="242.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">unique index → 409 on duplicate email,</text><text x="424" y="257.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">schema trim/lowercase, query behaviour.</text><text x="424" y="272.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Fakes: faster to set up, no infra.</text><rect x="30" y="320" width="740" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="349.2" font-size="12" text-anchor="middle" fill="#1e293b">In CI: a MongoDB/Postgres service container, or mongodb-memory-server / Testcontainers.</text></svg>