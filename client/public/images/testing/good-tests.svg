<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Arrange, act, assert structure; FIRST principles fast, independent, repeatable, self-validating, timely; test behaviour not implementation"><title>Arrange, act, assert structure; FIRST principles fast, independent, repeatable, self-validating, timely; test behaviour not implementation</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Anatomy of a good test</text><rect x="30" y="64" width="360" height="190" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="95.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">it('takes 10% off with SAVE10', () =&gt; {</text><text x="44" y="110.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  // Arrange</text><text x="44" y="125.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  const total = 500</text><text x="44" y="140.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="155.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  // Act</text><text x="44" y="170.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  const result = applyCoupon(total, 'SAVE10')</text><text x="44" y="185.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="200.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  // Assert</text><text x="44" y="215.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  expect(result).toBe(450)</text><text x="44" y="230.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">})</text><rect x="410" y="64" width="120" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Fast</text><rect x="536" y="64" width="234" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="83.9" font-size="11" text-anchor="middle" fill="#1e293b">milliseconds, run on every save</text><rect x="410" y="102" width="120" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="122.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Independent</text><rect x="536" y="102" width="234" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">no order, no shared state</text><rect x="410" y="140" width="120" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="160.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Repeatable</text><rect x="536" y="140" width="234" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="159.9" font-size="11" text-anchor="middle" fill="#1e293b">same result: control time, random, network</text><rect x="410" y="178" width="120" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="198.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Self-validating</text><rect x="536" y="178" width="234" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="197.9" font-size="11" text-anchor="middle" fill="#1e293b">pass/fail by assertions, no reading logs</text><rect x="410" y="216" width="120" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="236.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Timely</text><rect x="536" y="216" width="234" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="653" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b">written with (or before) the code</text><rect x="30" y="274" width="740" height="96" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="311.2" font-size="12" text-anchor="middle" fill="#1e293b">Test BEHAVIOUR, not implementation: assert what a user/caller can observe (output, DOM, HTTP response),</text><text x="400" y="326.2" font-size="12" text-anchor="middle" fill="#1e293b">not private state or which internal function ran. Then refactors do not break tests.</text><text x="400" y="341.2" font-size="12" text-anchor="middle" fill="#1e293b">One reason to fail per test · descriptive names · no logic (if/loops) in tests.</text></svg>