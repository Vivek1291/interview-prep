<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Secrets management"><title>Secrets management</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A code on a postcard vs a safe deposit box with a doorman</text><rect x="30" y="80" width="330" height="210" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="195" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="195" y="103" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">secret in source code</text><text x="50" y="135" font-size="12.5" text-anchor="start" fill="#1e293b">deleted the line → still in history</text><text x="50" y="169" font-size="12.5" text-anchor="start" fill="#1e293b">gitleaks: 2 leaks found</text><text x="50" y="203" font-size="12.5" text-anchor="start" fill="#1e293b">every clone, fork, CI log has it</text><text x="50" y="237" font-size="12.5" text-anchor="start" fill="#1e293b">rotate = commit + deploy</text><rect x="430" y="80" width="340" height="210" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="600" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="600" y="103" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">roles + Secrets Manager</text><text x="450" y="135" font-size="12.5" text-anchor="start" fill="#1e293b">IAM role / OIDC: no AWS keys</text><text x="450" y="169" font-size="12.5" text-anchor="start" fill="#1e293b">1,000 reads → 1 call (TTL cache)</text><text x="450" y="203" font-size="12.5" text-anchor="start" fill="#1e293b">rotation picked up after TTL</text><text x="450" y="237" font-size="12.5" text-anchor="start" fill="#1e293b">pre-commit hook blocks staged keys</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Leaked? Rotate first, check CloudTrail, then git filter-repo</text></svg>