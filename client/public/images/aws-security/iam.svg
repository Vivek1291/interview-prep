<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="IAM users, roles and policies"><title>IAM users, roles and policies</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Permanent badges, short-lived visitor passes, and the doors each opens</text><rect x="30" y="80" width="200" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="130" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b">IAM USER</text><text x="130" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b">permanent badge</text><text x="130" y="144.2" font-size="12" text-anchor="middle" fill="#1e293b">(humans → use SSO)</text><rect x="30" y="195" width="200" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="229.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">ROLE</text><text x="130" y="244.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">visitor pass: ASIA… key</text><text x="130" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">session token, expires</text><rect x="290" y="130" width="200" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="390" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b">POLICY (the list)</text><text x="390" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b">Allow Put/Get avatars/*</text><text x="390" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">Deny DeleteObject</text><line x1="230" y1="240" x2="286" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="530" y="80" width="240" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="104.9" font-size="11" text-anchor="middle" fill="#1e293b">Put avatars/42/a.png → allowed</text><rect x="530" y="135" width="240" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="159.9" font-size="11" text-anchor="middle" fill="#1e293b">Put invoices/1.pdf → denied (implicit)</text><rect x="530" y="190" width="240" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="214.9" font-size="11" text-anchor="middle" fill="#1e293b">ListBuckets → denied</text><rect x="530" y="245" width="240" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="650" y="269.9" font-size="11" text-anchor="middle" fill="#1e293b">Delete → denied (explicit wins)</text><line x1="490" y1="185" x2="526" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Tested on an AWS mock with IAM enforcement on · apps and CI always use roles</text></svg>