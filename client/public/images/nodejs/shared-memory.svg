<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Four workers incrementing a shared counter a million times each: plain increments ended at 1,327,674 instead of 4,000,000 while Atomics.add was exact"><title>Four workers incrementing a shared counter a million times each: plain increments ended at 1,327,674 instead of 4,000,000 while Atomics.add was exact</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">SharedArrayBuffer and Atomics (measured race)</text><rect x="30" y="54" width="740" height="76" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const sab = new SharedArrayBuffer(4); const counter = new Int32Array(sab);</text><text x="400" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">all workers see the SAME memory: counter[0]++ is read-modify-write → races</text><text x="400" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Atomics.add(counter, 0, 1) is one indivisible step</text><text x="400" y="146" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 4 workers × 1,000,000 increments on one shared counter</text><text x="160" y="176" font-size="11.5" text-anchor="end" fill="#475569">counter[0]++</text><rect x="170" y="158" width="66.38" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="242.38" y="176" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1327674 (expected 4,000,000: 2.67M updates lost) · 29 ms</text><text x="160" y="216" font-size="11.5" text-anchor="end" fill="#475569">Atomics.add</text><rect x="170" y="198" width="200" height="28" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="376" y="216" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4000000 · 84 ms</text><rect x="30" y="256" width="740" height="118" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="304.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Atomics: add/sub/compareExchange/load/store, wait/notify (block a worker until a value changes).</text><text x="400" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b">Prefer message passing (no shared state) unless you need very fast shared counters, ring buffers or locks.</text><text x="400" y="333.5" font-size="11.5" text-anchor="middle" fill="#1e293b">The main thread must not Atomics.wait (it would block the event loop).</text></svg>