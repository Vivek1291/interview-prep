<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured 807 requests per second on the main thread, 307 with a new worker per request and 4654 with a piscina pool; ping latency 76 ms when the main thread is busy vs under 1 ms with the pool"><title>Measured 807 requests per second on the main thread, 307 with a new worker per request and 4654 with a piscina pool; ping latency 76 ms when the main thread is busy vs under 1 ms with the pool</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Worker pools vs a worker per request (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: GET endpoint computing fib(27), 32 connections (Express 5)</text><text x="220" y="88" font-size="11.5" text-anchor="end" fill="#475569">on the main thread</text><rect x="230" y="72" width="72.63" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="308.63" y="88" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">807 req/s · p50 37 ms</text><text x="220" y="122" font-size="11.5" text-anchor="end" fill="#475569">new Worker per request</text><rect x="230" y="106" width="27.63" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="263.63" y="122" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">307 req/s · p50 98 ms</text><text x="220" y="156" font-size="11.5" text-anchor="end" fill="#475569">piscina pool (8 threads)</text><rect x="230" y="140" width="418.86" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="654.86" y="156" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4654 req/s · p50 6 ms</text><text x="400" y="192" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: latency of GET /ping while that endpoint is under load</text><text x="220" y="220" font-size="11.5" text-anchor="end" fill="#475569">CPU on the main thread</text><rect x="230" y="204" width="304" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="540" y="220" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">76 ms p50 (blocked event loop)</text><text x="220" y="254" font-size="11.5" text-anchor="end" fill="#475569">CPU in the pool</text><rect x="230" y="238" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="239" y="254" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.5 ms p50 (event loop free)</text><rect x="30" y="286" width="740" height="88" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Reuse threads: a pool (piscina, workerpool) keeps N warm workers and a task queue; size ≈ CPU cores.</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">Spawning a worker per request pays ~12 ms startup + memory each time and was slower than doing the work inline.</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Keep the main thread for I/O and coordination; ship CPU-heavy pure functions to the pool.</text></svg>