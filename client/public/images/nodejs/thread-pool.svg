<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured 8 parallel pbkdf2 calls: pool size 1 finished at 300 ms, 2 at 153 ms, 4 at 83 ms, 8 at 53 ms; what runs on the thread pool vs OS async I/O"><title>Measured 8 parallel pbkdf2 calls: pool size 1 finished at 300 ms, 2 at 153 ms, 4 at 83 ms, 8 at 53 ms; what runs on the thread pool vs OS async I/O</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The libuv thread pool (measured)</text><text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: 8 parallel crypto.pbkdf2 calls (each 37 ms of CPU), Node 22, 11-core M3 Pro</text><text x="220" y="98" font-size="12" text-anchor="end" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">UV_THREADPOOL_SIZE=1</text><rect x="230" y="84" width="390" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="628" y="101" font-size="12" text-anchor="start" fill="#475569" font-weight="700">all done at 300 ms</text><text x="220" y="138" font-size="12" text-anchor="end" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="230" y="124" width="198.9" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="436.9" y="141" font-size="12" text-anchor="start" fill="#475569" font-weight="700">all done at 153 ms</text><text x="220" y="178" font-size="12" text-anchor="end" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4 (default)</text><rect x="230" y="164" width="107.9" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="345.9" y="181" font-size="12" text-anchor="start" fill="#475569" font-weight="700">all done at 83 ms</text><text x="220" y="218" font-size="12" text-anchor="end" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="230" y="204" width="68.9" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="306.9" y="221" font-size="12" text-anchor="start" fill="#475569" font-weight="700">all done at 53 ms</text><rect x="30" y="252" width="370" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="215" y="287" font-size="11.5" text-anchor="middle" fill="#1e293b">Thread pool (4 threads default):</text><text x="215" y="301.5" font-size="11.5" text-anchor="middle" fill="#1e293b">fs.*, dns.lookup, crypto pbkdf2/scrypt/</text><text x="215" y="316" font-size="11.5" text-anchor="middle" fill="#1e293b">randomBytes(async), zlib async</text><text x="215" y="330.5" font-size="11.5" text-anchor="middle" fill="#1e293b">→ set UV_THREADPOOL_SIZE before</text><text x="215" y="345" font-size="11.5" text-anchor="middle" fill="#1e293b">  any pool work starts (max 1024)</text><rect x="410" y="252" width="360" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="590" y="294.3" font-size="11.5" text-anchor="middle" fill="#1e293b">NOT the thread pool:</text><text x="590" y="308.8" font-size="11.5" text-anchor="middle" fill="#1e293b">network sockets (OS async: epoll/kqueue),</text><text x="590" y="323.3" font-size="11.5" text-anchor="middle" fill="#1e293b">timers, your JavaScript (main thread)</text><text x="590" y="337.8" font-size="11.5" text-anchor="middle" fill="#1e293b">CPU-heavy JS → worker_threads</text></svg>