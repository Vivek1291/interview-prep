<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="How node:http handles a request from TCP connection to parsing, the request event, the handler and the response; measured 92 thousand requests per second with node:http and 20 thousand with Express 5"><title>How node:http handles a request from TCP connection to parsing, the request event, the handler and the response; measured 92 thousand requests per second with node:http and 20 thousand with Express 5</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A native HTTP server</text><rect x="30" y="60" width="200" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="83.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">client</text><rect x="240" y="60" width="530" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="83.2" font-size="12" text-anchor="middle" fill="#1e293b">TCP connect (OS, poll phase)</text><line x1="130" y1="98" x2="130" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="106" width="200" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="130" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">llhttp</text><rect x="240" y="106" width="530" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b">parses method, URL, headers</text><line x1="130" y1="144" x2="130" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="152" width="200" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="130" y="175.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">'request' event</text><rect x="240" y="152" width="530" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="175.2" font-size="12" text-anchor="middle" fill="#1e293b">req = IncomingMessage (readable stream)</text><line x1="130" y1="190" x2="130" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="198" width="200" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">your handler</text><rect x="240" y="198" width="530" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b">route by req.method + req.url, read body</text><line x1="130" y1="236" x2="130" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="244" width="200" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="267.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">res</text><rect x="240" y="244" width="530" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="267.2" font-size="12" text-anchor="middle" fill="#1e293b">writeHead(status, headers) → write → end()</text><text x="400" y="316" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured: GET /api/users/1, 50 connections, 6 s, autocannon (Node 22)</text><rect x="30" y="328" width="360" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="355.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">node:http: 92,085 req/s · p99 1 ms</text><rect x="410" y="328" width="360" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="355.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Express 5: 20,189 req/s · p99 4 ms</text></svg>