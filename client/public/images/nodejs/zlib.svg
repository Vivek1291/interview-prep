<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured compression of 697 KB of JSON: gzip 53 KB in 2.8 ms, brotli quality 4 26 KB in 2.1 ms, brotli quality 11 21 KB in 712 ms"><title>Measured compression of 697 KB of JSON: gzip 53 KB in 2.8 ms, brotli quality 4 26 KB in 2.1 ms, brotli quality 11 21 KB in 712 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Compression with zlib: gzip vs brotli (measured)</text><text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: 697 KB JSON (5,000 users), Node 22 zlib</text><text x="180" y="100" font-size="12" text-anchor="end" fill="#475569">raw JSON</text><rect x="190" y="82" width="432.4" height="30" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="630.4" y="102" font-size="12" text-anchor="start" fill="#475569" font-weight="700">697.4 KB · —</text><text x="180" y="144" font-size="12" text-anchor="end" fill="#475569">gzip (level 6)</text><rect x="190" y="126" width="33" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="231" y="146" font-size="12" text-anchor="start" fill="#475569" font-weight="700">53.3 KB · 2.8 ms</text><text x="180" y="188" font-size="12" text-anchor="end" fill="#475569">brotli quality 4</text><rect x="190" y="170" width="16.1" height="30" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="214.1" y="190" font-size="12" text-anchor="start" fill="#475569" font-weight="700">25.9 KB · 2.1 ms</text><text x="180" y="232" font-size="12" text-anchor="end" fill="#475569">brotli quality 11</text><rect x="190" y="214" width="13" height="30" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="211" y="234" font-size="12" text-anchor="start" fill="#475569" font-weight="700">21 KB · 712 ms</text><rect x="30" y="262" width="370" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="215" y="299.3" font-size="11.5" text-anchor="middle" fill="#1e293b">Dynamic API responses:</text><text x="215" y="313.8" font-size="11.5" text-anchor="middle" fill="#1e293b">gzip or brotli at a LOW quality</text><text x="215" y="328.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(fast enough per request)</text><text x="215" y="342.8" font-size="11.5" text-anchor="middle" fill="#1e293b">usually done by the proxy/CDN</text><rect x="410" y="262" width="360" height="110" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="590" y="299.3" font-size="11.5" text-anchor="middle" fill="#1e293b">Static assets (JS/CSS) at build time:</text><text x="590" y="313.8" font-size="11.5" text-anchor="middle" fill="#1e293b">brotli quality 11 (slow once,</text><text x="590" y="328.3" font-size="11.5" text-anchor="middle" fill="#1e293b">smallest forever)</text><text x="590" y="342.8" font-size="11.5" text-anchor="middle" fill="#1e293b">use async zlib or streams in servers</text></svg>