<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The cluster module forks workers sharing a port while containers run one process each behind a load balancer; measured 38,531 requests per second with one process, 80,698 with two, 123,078 with four and 111,443 with eight"><title>The cluster module forks workers sharing a port while containers run one process each behind a load balancer; measured 38,531 requests per second with one process, 80,698 with two, 123,078 with four and 111,443 with eight</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Cluster vs containers for using all cores (measured)</text><rect x="30" y="58" width="360" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="95.25" font-size="11.5" text-anchor="middle" fill="#1e293b">cluster (in one container/VM)</text><text x="210" y="109.75" font-size="11.5" text-anchor="middle" fill="#1e293b">primary forks N workers that share port 5721</text><text x="210" y="124.25" font-size="11.5" text-anchor="middle" fill="#1e293b">primary restarts crashed workers</text><text x="210" y="138.75" font-size="11.5" text-anchor="middle" fill="#1e293b">round-robin connection distribution</text><rect x="410" y="58" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="95.25" font-size="11.5" text-anchor="middle" fill="#1e293b">containers (modern default)</text><text x="590" y="109.75" font-size="11.5" text-anchor="middle" fill="#1e293b">one Node process per container, N replicas</text><text x="590" y="124.25" font-size="11.5" text-anchor="middle" fill="#1e293b">load balancer spreads requests</text><text x="590" y="138.75" font-size="11.5" text-anchor="middle" fill="#1e293b">orchestrator restarts, scales, rolls out</text><text x="400" y="192" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: small CPU-ish handler, 100 connections, load generator on the same machine</text><text x="150" y="219" font-size="11.5" text-anchor="end" fill="#475569">1 process</text><rect x="160" y="204" width="107.89" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="273.89" y="219" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">38531 req/s</text><text x="150" y="251" font-size="11.5" text-anchor="end" fill="#475569">cluster ×2</text><rect x="160" y="236" width="225.95" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="391.95" y="251" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">80698 req/s</text><text x="150" y="283" font-size="11.5" text-anchor="end" fill="#475569">cluster ×4</text><rect x="160" y="268" width="344.62" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="510.62" y="283" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">123078 req/s</text><text x="150" y="315" font-size="11.5" text-anchor="end" fill="#475569">cluster ×8</text><rect x="160" y="300" width="312.04" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="478.04" y="315" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">111443 req/s (load tester competes for cores)</text><text x="400" y="348" font-size="11.5" text-anchor="middle" fill="#475569">Stateless instances are what make either approach work: sessions, caches, rate limits and</text><text x="400" y="368" font-size="11.5" text-anchor="middle" fill="#475569">WebSocket rooms live in Redis/DB, never in one process's memory (or you need sticky sessions).</text></svg>