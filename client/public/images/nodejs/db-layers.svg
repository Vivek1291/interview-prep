stgreSQL 17, localhost)</text><text x="250" y="326" font-size="11.5" text-anchor="end" fill="#475569">new connection per query</text><rect x="260" y="310" width="391.8" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="657.8" y="326" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">6.53 ms</text><text x="250" y="360" font-size="11.5" text-anchor="end" fill="#475569">pooled query</text><rect x="260" y="344" width="14.28" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="280.28" y="360" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.238 ms</text></svg>