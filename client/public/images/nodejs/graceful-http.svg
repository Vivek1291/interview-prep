<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Shutdown sequence after SIGTERM; measured in-flight request completing, new requests refused, and server close taking 7.3 s because of idle keep-alive sockets vs 1.3 s when idle connections are closed after each response"><title>Shutdown sequence after SIGTERM; measured in-flight request completing, new requests refused, and server close taking 7.3 s because of idle keep-alive sockets vs 1.3 s when idle connections are closed after each response</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Graceful shutdown of an HTTP server (measured)</text><rect x="30" y="56" width="150" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="105" y="77" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">t=0  SIGTERM</text><rect x="186" y="56" width="584" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="76.9" font-size="11" text-anchor="middle" fill="#1e293b">mark not ready (readiness → 503), stop accepting new connections (server.close)</text><rect x="30" y="96" width="150" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="105" y="117" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">in-flight</text><rect x="186" y="96" width="584" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="116.9" font-size="11" text-anchor="middle" fill="#1e293b">/slow request keeps running and completes: 200 after 1,502 ms</text><rect x="30" y="136" width="150" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="105" y="157" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">new requests</text><rect x="186" y="136" width="584" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="156.9" font-size="11" text-anchor="middle" fill="#1e293b">ECONNREFUSED after the listener closed → fail readiness first, wait for the LB</text><rect x="30" y="176" width="150" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="105" y="197" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">keep-alive</text><rect x="186" y="176" width="584" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="196.9" font-size="11" text-anchor="middle" fill="#1e293b">idle sockets hold server.close open for keepAliveTimeout (5 s)</text><rect x="30" y="216" width="150" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="105" y="237" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">cleanup</text><rect x="186" y="216" width="584" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="236.9" font-size="11" text-anchor="middle" fill="#1e293b">close DB pools, Redis, queues, flush logs, exit 0 (force-exit timer)</text><text x="400" y="274" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: time from SIGTERM until server.close() finished (one in-flight 1.5 s request + keep-alive client)</text><text x="320" y="301" font-size="11.5" text-anchor="end" fill="#475569">server.close() only</text><rect x="330" y="286" width="189.85" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="525.85" y="301" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7302 ms (idle keep-alive socket)</text><text x="320" y="331" font-size="11.5" text-anchor="end" fill="#475569">+ closeIdleConnections() at SIGTERM</text><rect x="330" y="316" width="189.88" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="525.88" y="331" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7303 ms (became idle later)</text><text x="320" y="361" font-size="11.5" text-anchor="end" fill="#475569">+ closeIdleConnections() after each response</text><rect x="330" y="346" width="33.83" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="369.83" y="361" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1301 ms (just the in-flight request)</text></svg>