<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Dependency injection, repository, adapter, strategy, factory, observer, middleware chain and module singleton with what they do and why"><title>Dependency injection, repository, adapter, strategy, factory, observer, middleware chain and module singleton with what they do and why</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design patterns that actually appear in Node.js backends</text><rect x="30" y="54" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="75" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Dependency injection</text><rect x="226" y="54" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="74.7" font-size="10.5" text-anchor="middle" fill="#1e293b">pass collaborators in (createOrderService({ repo, mailer }))</text><rect x="592" y="54" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="74.7" font-size="10.5" text-anchor="middle" fill="#1e293b">testable, swappable</text><rect x="30" y="94" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Repository</text><rect x="226" y="94" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b">hide queries behind findById/save</text><rect x="592" y="94" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b">services don't know SQL/Mongo</text><rect x="30" y="134" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="155" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Adapter</text><rect x="226" y="134" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="154.7" font-size="10.5" text-anchor="middle" fill="#1e293b">wrap a vendor SDK behind your interface</text><rect x="592" y="134" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="154.7" font-size="10.5" text-anchor="middle" fill="#1e293b">switch SES ↔ SendGrid</text><rect x="30" y="174" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="195" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Strategy</text><rect x="226" y="174" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="194.7" font-size="10.5" text-anchor="middle" fill="#1e293b">pick an algorithm at runtime (pricing, shipping)</text><rect x="592" y="174" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="194.7" font-size="10.5" text-anchor="middle" fill="#1e293b">no giant if/else</text><rect x="30" y="214" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Factory</text><rect x="226" y="214" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="234.7" font-size="10.5" text-anchor="middle" fill="#1e293b">build configured objects (createApp(config))</text><rect x="592" y="214" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="234.7" font-size="10.5" text-anchor="middle" fill="#1e293b">one place for wiring</text><rect x="30" y="254" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="275" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Observer / pub-sub</text><rect x="226" y="254" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="274.7" font-size="10.5" text-anchor="middle" fill="#1e293b">EventEmitter, domain events</text><rect x="592" y="254" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="274.7" font-size="10.5" text-anchor="middle" fill="#1e293b">decouple side effects</text><rect x="30" y="294" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="315" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Middleware / chain</text><rect x="226" y="294" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="314.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Express pipeline</text><rect x="592" y="294" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="314.7" font-size="10.5" text-anchor="middle" fill="#1e293b">cross-cutting concerns</text><rect x="30" y="334" width="190" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="355" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Singleton (module)</text><rect x="226" y="334" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="354.7" font-size="10.5" text-anchor="middle" fill="#1e293b">one DB pool via the module cache</text><rect x="592" y="334" width="178" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="681" y="354.7" font-size="10.5" text-anchor="middle" fill="#1e293b">shared resources</text></svg>