<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="N+1 runs one query per row; measured 20.7 ms and 101 queries vs 0.53 ms for one JOIN and 0.64 ms for a batched IN query"><title>N+1 runs one query per row; measured 20.7 ms and 101 queries vs 0.53 ms for one JOIN and 0.64 ms for a batched IN query</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The N+1 query problem (measured)</text><rect x="30" y="60" width="360" height="140" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="105" font-size="11.5" text-anchor="middle" fill="#1e293b">N+1: 1 query for 100 orders</text><text x="210" y="119.5" font-size="11.5" text-anchor="middle" fill="#1e293b">+ 100 queries, one per user</text><text x="210" y="134" font-size="11.5" text-anchor="middle" fill="#1e293b"></text><text x="210" y="148.5" font-size="11.5" text-anchor="middle" fill="#1e293b">for (const o of orders)</text><text x="210" y="163" font-size="11.5" text-anchor="middle" fill="#1e293b">  o.user = await getUser(o.user_id)</text><rect x="410" y="60" width="360" height="140" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="105" font-size="11.5" text-anchor="middle" fill="#1e293b">Fix: 1 JOIN, or 2 queries</text><text x="590" y="119.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(orders, then users WHERE id = ANY($1))</text><text x="590" y="134" font-size="11.5" text-anchor="middle" fill="#1e293b"></text><text x="590" y="148.5" font-size="11.5" text-anchor="middle" fill="#1e293b">ORMs: include / populate / with,</text><text x="590" y="163" font-size="11.5" text-anchor="middle" fill="#1e293b">DataLoader for GraphQL</text><text x="400" y="228" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 100 latest orders with their user (PostgreSQL 17, indexed)</text><text x="240" y="253" font-size="11.5" text-anchor="end" fill="#475569">N+1 with pg (101 queries)</text><rect x="250" y="238" width="289.52" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="545.52" y="253" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">20.68 ms</text><text x="240" y="283" font-size="11.5" text-anchor="end" fill="#475569">N+1 Sequelize getUser()</text><rect x="250" y="268" width="406.14" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="662.14" y="283" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">29.01 ms</text><text x="240" y="313" font-size="11.5" text-anchor="end" fill="#475569">batched IN (2 queries)</text><rect x="250" y="298" width="8.96" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="264.96" y="313" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.64 ms</text><text x="240" y="343" font-size="11.5" text-anchor="end" fill="#475569">JOIN (1 query)</text><rect x="250" y="328" width="7.42" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="263.42" y="343" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.53 ms</text><text x="240" y="373" font-size="11.5" text-anchor="end" fill="#475569">Sequelize include (JOIN)</text><rect x="250" y="358" width="23.24" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279.24" y="373" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.66 ms</text></svg>