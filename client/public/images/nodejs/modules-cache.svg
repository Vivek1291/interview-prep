<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="require caches modules so they evaluate once; resolution order core, relative paths, node_modules, package exports; measured circular dependency where b sees a partially loaded a"><title>require caches modules so they evaluate once; resolution order core, relative paths, node_modules, package exports; measured circular dependency where b sees a partially loaded a</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Module caching, resolution and circular dependencies</text><rect x="30" y="66" width="350" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="44" y="108.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">require('./counter')  → evaluated once</text><text x="44" y="122.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">require('./counter')  → from require.cache</text><text x="44" y="137.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">c1 === c2  → true (same instance)</text><text x="44" y="151.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(measured: 'counter.js evaluated' printed once)</text><rect x="420" y="66" width="350" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="434" y="101" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Resolution order for require(&quot;x&quot;):</text><text x="434" y="115.5" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">1 core module (node:fs)</text><text x="434" y="130" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">2 ./ ../ / → file, .js/.json/.node, dir/index</text><text x="434" y="144.5" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">3 node_modules up the folders</text><text x="434" y="159" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">4 package.json &quot;exports&quot;/&quot;main&quot;</text><rect x="30" y="210" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="110" y="239.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">a.js</text><rect x="610" y="210" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="690" y="239.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">b.js</text><line x1="192" y1="226" x2="606" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="218" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">a: exports.done=false; require('./b')</text><line x1="606" y1="248" x2="192" y2="248" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="400" y="270" font-size="11" text-anchor="middle" fill="#ef4444" font-family="ui-monospace,Menlo,Consolas,monospace">b: require('./a') → PARTIAL a (done=false)</text><rect x="30" y="296" width="740" height="76" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="323.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Measured output:  in b, a.done = false (a is only partially loaded)  ·  in a, b.done = true</text><text x="400" y="338" font-size="11.5" text-anchor="middle" fill="#1e293b">Fix circular dependencies by moving shared code into a third module, injecting dependencies,</text><text x="400" y="352.5" font-size="11.5" text-anchor="middle" fill="#1e293b">or requiring lazily inside the function that needs it.</text></svg>