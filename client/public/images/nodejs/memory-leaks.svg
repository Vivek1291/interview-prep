<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured heap after 200,000 requests: 3.7 MB with no cache, 6.2 MB with a bounded LRU, 88.6 MB with an unbounded Map and 95.9 MB with leaked listeners; heap snapshot shows 200,000 Session objects; common leak causes and fixes"><title>Measured heap after 200,000 requests: 3.7 MB with no cache, 6.2 MB with a bounded LRU, 88.6 MB with an unbounded Map and 95.9 MB with leaked listeners; heap snapshot shows 200,000 Session objects; common leak causes and fixes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Memory leaks and heap snapshots (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: heap used (MB) after 200,000 requests</text><text x="260" y="85" font-size="11.5" text-anchor="end" fill="#475569">no cache</text><rect x="270" y="70" width="13.32" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="289.32" y="85" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">3.7 MB</text><text x="260" y="117" font-size="11.5" text-anchor="end" fill="#475569">bounded LRU (max 5,000)</text><rect x="270" y="102" width="22.32" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="298.32" y="117" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">6.2 MB</text><text x="260" y="149" font-size="11.5" text-anchor="end" fill="#475569">Map cache, never evicted</text><rect x="270" y="134" width="318.96" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="594.96" y="149" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">88.6 MB and growing</text><text x="260" y="181" font-size="11.5" text-anchor="end" fill="#475569">event listener added per request</text><rect x="270" y="166" width="345.24" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="621.24" y="181" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">95.9 MB + warning</text><rect x="30" y="210" width="740" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="233.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Heap snapshot of the leaking process (v8.writeHeapSnapshot): Session ×200,000, Object ×200,679, Array ×200,144</text><text x="400" y="248.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ compare two snapshots in DevTools (Comparison view) and follow the retainers to the Map</text><rect x="30" y="276" width="300" height="18" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="288.7" font-size="10.5" text-anchor="middle" fill="#1e293b">unbounded caches / Maps</text><rect x="336" y="276" width="434" height="18" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="288.7" font-size="10.5" text-anchor="middle" fill="#1e293b">LRU with max size + TTL</text><rect x="30" y="296" width="300" height="18" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="308.7" font-size="10.5" text-anchor="middle" fill="#1e293b">listeners never removed</text><rect x="336" y="296" width="434" height="18" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="308.7" font-size="10.5" text-anchor="middle" fill="#1e293b">off()/once(), AbortSignal, cleanup on close</text><rect x="30" y="316" width="300" height="18" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="328.7" font-size="10.5" text-anchor="middle" fill="#1e293b">timers/intervals never cleared</text><rect x="336" y="316" width="434" height="18" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="328.7" font-size="10.5" text-anchor="middle" fill="#1e293b">clearInterval, unref, stop on shutdown</text><rect x="30" y="336" width="300" height="18" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="348.7" font-size="10.5" text-anchor="middle" fill="#1e293b">closures holding big objects</text><rect x="336" y="336" width="434" height="18" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="348.7" font-size="10.5" text-anchor="middle" fill="#1e293b">keep only needed fields</text><rect x="30" y="356" width="300" height="18" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="368.7" font-size="10.5" text-anchor="middle" fill="#1e293b">globals and module-level arrays</text><rect x="336" y="356" width="434" height="18" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="368.7" font-size="10.5" text-anchor="middle" fill="#1e293b">bounded structures, WeakMap</text></svg>