text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• exact resolved versions of EVERY</text><text x="424" y="137.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  package (incl. transitive) + integrity hash</text><text x="424" y="152.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• commit it</text><text x="424" y="167.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• npm ci installs exactly the lockfile</text><text x="424" y="182.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  (clean, CI); npm install may update it</text><rect x="30" y="232" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="246.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">npm install pkg</text><rect x="296" y="232" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="246.9" font-size="11" text-anchor="middle" fill="#1e293b">add + save to package.json</text><rect x="30" y="257" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="271.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">npm ci</text><rect x="296" y="257" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="271.9" font-size="11" text-anchor="middle" fill="#1e293b">reproducible install from the lockfile</text><rect x="30" y="282" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">npx pkg</text><rect x="296" y="282" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b">run a package binary without global install</text><rect x="30" y="307" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">npm run build</text><rect x="296" y="307" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b">run a script from &quot;scripts&quot;</text><rect x="30" y="332" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="346.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">npm audit / outdated</text><rect x="296" y="332" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="346.9" font-size="11" text-anchor="middle" fill="#1e293b">vulnerabilities / newer versions</text><rect x="30" y="357" width="260" height="22" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="371.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">nvm / fnm / .nvmrc</text><rect x="296" y="357" width="474" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="371.9" font-size="11" text-anchor="middle" fill="#1e293b">pin the Node version per project</text></svg>