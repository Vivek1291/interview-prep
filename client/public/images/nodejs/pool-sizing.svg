d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Connection pool sizing (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 200 queries that each wait 20 ms in the DB (pg_sleep), by pool size</text><text x="110" y="85" font-size="11.5" text-anchor="end" fill="#475569">max 1</text><rect x="120" y="70" width="567.48" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="693.48" y="85" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4729 ms</text><text x="110" y="113" font-size="11.5" text-anchor="end" fill="#475569">max 5</text><rect x="120" y="98" width="114" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="240" y="113" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">950 ms</text><text x="110" y="141" font-size="11.5" text-anchor="end" fill="#475569">max 10</text><rect x="120" y="126" width="57.6" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="183.6" y="141" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">480 ms</text><text x="110" y="169" font-size="11.5" text-anchor="end" fill="#475569">max 20</text><rect x="120" y="154" width="27.6" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="153.6" y="169" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">230 ms</text><text x="110" y="197" font-size="11.5" text-anchor="end" fill="#475569">max 50</text><rect x="120" y="182" width="12" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="138" y="197" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">100 ms</text><text x="400" y="228" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 64 CPU-heavy queries (full scan of 1M rows), DB has 11 cores</text><text x="110" y="253" font-size="11.5" text-anchor="end" fill="#475569">max 4</text><rect x="120" y="238" width="292.74" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="418.74" y="253" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">697 ms p50 381</text><text x="110" y="281" font-size="11.5" text-anchor="end" fill="#475569">max 8</text><rect x="120" y="266" width="201.6" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="327.6" y="281" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">480 ms p50 287</text><text x="110" y="309" font-size="11.5" text-anchor="end" fill="#475569">max 16</text><rect x="120" y="294" width="138.6" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="264.6" y="309" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">330 ms p50 200</text><text x="110" y="337" font-size="11.5" text-anchor="end" fill="#475569">max 32</text><rect x="120" y="322" width="136.5" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="262.5" y="337" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">325 ms p50 240</text><rect x="560" y="238" width="210" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="665" y="268.9" font-size="11" text-anchor="middle" fill="#1e293b">Waiting queries scale</text><text x="665" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">with pool size; CPU-bound</text><text x="665" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b">ones stop scaling at</text><text x="665" y="310.9" font-size="11" text-anchor="middle" fill="#1e293b">~cores (16 vs 32: same</text><text x="665" y="324.9" font-size="11" text-anchor="middle" fill="#1e293b">total, worse median)</text></svg>