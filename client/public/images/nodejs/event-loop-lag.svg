<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measuring event-loop delay with monitorEventLoopDelay; measured a 75 ms JSON.parse raising ping latency from 2 to 77 ms and event-loop delay p99 from 11 to 75 ms"><title>Measuring event-loop delay with monitorEventLoopDelay; measured a 75 ms JSON.parse raising ping latency from 2 to 77 ms and event-loop delay p99 from 11 to 75 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Event-loop lag: how blocking shows up (measured)</text><rect x="30" y="58" width="740" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="84.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const h = perf_hooks.monitorEventLoopDelay({ resolution: 10 }); h.enable();</text><text x="400" y="98.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">export h.percentile(99) / 1e6 as a metric · alert when p99 event-loop delay &gt; 100 ms</text><text x="400" y="142" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: JSON.parse of an 18.8 MB payload inside a request handler</text><text x="280" y="169" font-size="11.5" text-anchor="end" fill="#475569">parse time per import</text><rect x="290" y="154" width="255" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="551" y="169" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">75 ms (blocks everything)</text><text x="280" y="201" font-size="11.5" text-anchor="end" fill="#475569">/ping max latency, idle</text><rect x="290" y="186" width="6.8" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302.8" y="201" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2 ms</text><text x="280" y="233" font-size="11.5" text-anchor="end" fill="#475569">/ping max latency during imports</text><rect x="290" y="218" width="261.8" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="557.8" y="233" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">77 ms</text><text x="280" y="265" font-size="11.5" text-anchor="end" fill="#475569">event-loop delay p99 idle</text><rect x="290" y="250" width="37.74" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="333.74" y="265" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">11.1 ms (≈ the 10 ms resolution)</text><text x="280" y="297" font-size="11.5" text-anchor="end" fill="#475569">event-loop delay p99 during imports</text><rect x="290" y="282" width="256.02" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="552.02" y="297" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">75.3 ms</text><text x="400" y="330" font-size="11.5" text-anchor="middle" fill="#475569">Usual blockers: big JSON.parse/stringify, sync crypto (pbkdf2Sync), readFileSync, huge loops,</text><text x="400" y="352" font-size="11.5" text-anchor="middle" fill="#475569">catastrophic regexes, sorting giant arrays. Fixes: stream, paginate, move to a worker, async APIs.</text><text x="400" y="374" font-size="11.5" text-anchor="middle" fill="#475569">Load-test with autocannon and watch p99 latency and event-loop delay together.</text></svg>