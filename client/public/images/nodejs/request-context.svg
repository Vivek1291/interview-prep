<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="AsyncLocalStorage carries a request id through async calls so logs deep in services include it; measured 20,501 vs 18,341 requests per second on a trivial route"><title>AsyncLocalStorage carries a request id through async calls so logs deep in services include it; measured 20,501 vs 18,341 requests per second on a trivial route</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Request context with AsyncLocalStorage (measured)</text><rect x="30" y="58" width="740" height="76" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const als = new AsyncLocalStorage();</text><text x="400" y="99.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">app.use((req, res, next) =&gt; als.run({ requestId: req.get('x-request-id') ?? randomUUID(), userId }, next));</text><text x="400" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">log() anywhere deeper: als.getStore()?.requestId   (no req object passed through services)</text><text x="400" y="158" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: logs from a service function two awaits deep</text><rect x="30" y="170" width="360" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="194.75" font-size="11.5" text-anchor="middle" fill="#1e293b">with AsyncLocalStorage</text><text x="210" y="209.25" font-size="11.5" text-anchor="middle" fill="#1e293b">{ requestId: "req-abc", msg: "loaded user 7" }</text><rect x="410" y="170" width="360" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="194.75" font-size="11.5" text-anchor="middle" fill="#1e293b">without</text><text x="590" y="209.25" font-size="11.5" text-anchor="middle" fill="#1e293b">{ msg: "loaded user 9" }  (which request?)</text><text x="400" y="252" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured overhead: Express 5 route with one await, 50 connections</text><text x="220" y="280" font-size="11.5" text-anchor="end" fill="#475569">without AsyncLocalStorage</text><rect x="230" y="264" width="287.01" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="523.01" y="280" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">20501 req/s · p99 4 ms</text><text x="220" y="314" font-size="11.5" text-anchor="end" fill="#475569">with AsyncLocalStorage</text><rect x="230" y="298" width="256.77" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="492.77" y="314" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">18341 req/s · p99 6 ms (~10% less)</text><text x="400" y="352" font-size="11.5" text-anchor="middle" fill="#475569">Used by pino/OpenTelemetry for request ids and trace context; real routes make the overhead negligible.</text></svg>