<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured 8 CPU tasks at 435 ms sequentially vs 115 ms in 8 workers, 12 ms worker startup, and 100 MB round trip of 72 ms copied vs 1.2 ms transferred"><title>Measured 8 CPU tasks at 435 ms sequentially vs 115 ms in 8 workers, 12 ms worker startup, and 100 MB round trip of 72 ms copied vs 1.2 ms transferred</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Worker threads: speed-up and messaging (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured (Node 22, 11-core M3 Pro)</text><text x="270" y="88" font-size="11.5" text-anchor="end" fill="#475569">8 × fib(35) on the main thread</text><rect x="280" y="72" width="326.17" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="612.17" y="88" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">434.9 ms</text><text x="270" y="122" font-size="11.5" text-anchor="end" fill="#475569">8 × fib(35) in 8 worker threads</text><rect x="280" y="106" width="86.03" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="372.03" y="122" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">114.7 ms (3.8× faster)</text><text x="270" y="156" font-size="11.5" text-anchor="end" fill="#475569">start one worker</text><rect x="280" y="140" width="9" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="295" y="156" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">12 ms</text><text x="400" y="192" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Moving 100 MB to a worker and back</text><text x="270" y="220" font-size="11.5" text-anchor="end" fill="#475569">postMessage(buf): structured clone</text><rect x="280" y="204" width="286.4" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="572.4" y="220" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">71.6 ms (copied twice)</text><text x="270" y="254" font-size="11.5" text-anchor="end" fill="#475569">postMessage(buf, [buf]): transfer</text><rect x="280" y="238" width="4.8" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="290.8" y="254" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.2 ms (sender buffer → 0 bytes)</text><rect x="30" y="284" width="740" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="318.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Each worker is a separate V8 isolate with its own heap and event loop (~12 ms to start, several MB of memory).</text><text x="400" y="333" font-size="11.5" text-anchor="middle" fill="#1e293b">Communicate with messages (copied), transfer ArrayBuffers (moved), or SharedArrayBuffer + Atomics (shared).</text><text x="400" y="347.5" font-size="11.5" text-anchor="middle" fill="#1e293b">10,000 small message round trips took 106 ms (~0.01 ms each): cheap, but not free.</text></svg>