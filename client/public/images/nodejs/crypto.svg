<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="When to use createHash, createHmac, randomBytes, scrypt or pbkdf2, and AES-GCM encryption; measured sha256 at 0.0017 ms and scrypt at 22 ms"><title>When to use createHash, createHmac, randomBytes, scrypt or pbkdf2, and AES-GCM encryption; measured sha256 at 0.0017 ms and scrypt at 22 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The crypto module: hash, HMAC, random, password hashing, encryption</text><rect x="30" y="60" width="270" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">createHash(&quot;sha256&quot;)</text><rect x="306" y="60" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b">fingerprint / checksum (fast: 0.002 ms)</text><rect x="572" y="60" width="198" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="671" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b">NOT for passwords</text><rect x="30" y="110" width="270" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">createHmac(&quot;sha256&quot;, key)</text><rect x="306" y="110" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">signature: webhooks, signed cookies</text><rect x="572" y="110" width="198" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="671" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">compare with timingSafeEqual</text><rect x="30" y="160" width="270" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">randomBytes / randomUUID</text><rect x="306" y="160" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">tokens, ids, salts (CSPRNG)</text><rect x="572" y="160" width="198" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="671" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">never Math.random()</text><rect x="30" y="210" width="270" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">scrypt / pbkdf2 (/ argon2, bcrypt)</text><rect x="306" y="210" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b">password hashing: slow on purpose</text><rect x="572" y="210" width="198" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="671" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b">scrypt 22 ms · pbkdf2 600k 55 ms</text><rect x="30" y="260" width="270" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">createCipheriv(&quot;aes-256-gcm&quot;)</text><rect x="306" y="260" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b">encrypt data at rest (with auth tag)</text><rect x="572" y="260" width="198" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="671" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b">unique IV per message</text><rect x="30" y="318" width="740" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="342.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Hash = one-way fingerprint · HMAC = hash with a secret key (proves who sent it) · Encryption = reversible with a key</text><text x="400" y="357.3" font-size="11.5" text-anchor="middle" fill="#1e293b">Measured on Node 22: sha256 0.0017 ms vs scrypt 22.4 ms → a GPU guesses fast hashes billions of times faster</text></svg>