<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured startup of a TypeScript server: compiled JavaScript 30 ms, Node type stripping 40 ms, tsx 90 ms, and a TypeScript 7 type check 50 ms; recommended tsconfig options and limitations of type stripping"><title>Measured startup of a TypeScript server: compiled JavaScript 30 ms, Node type stripping 40 ms, tsx 90 ms, and a TypeScript 7 type check 50 ms; recommended tsconfig options and limitations of type stripping</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">TypeScript with Node.js: ways to run it (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: start a small HTTP server written in TypeScript (median of 9 runs, TypeScript 7.0.2)</text><text x="310" y="87" font-size="11.5" text-anchor="end" fill="#475569">node dist/server.js (compiled by tsc)</text><rect x="320" y="72" width="108" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="434" y="87" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">30 ms</text><text x="310" y="119" font-size="11.5" text-anchor="end" fill="#475569">node server.ts (built-in type stripping)</text><rect x="320" y="104" width="144" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="470" y="119" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">40 ms</text><text x="310" y="151" font-size="11.5" text-anchor="end" fill="#475569">tsx server.ts (esbuild on the fly)</text><rect x="320" y="136" width="324" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="151" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">90 ms</text><text x="310" y="183" font-size="11.5" text-anchor="end" fill="#475569">tsc --noEmit (type check, TS 7)</text><rect x="320" y="168" width="180" height="22" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="506" y="183" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50 ms</text><rect x="30" y="210" width="740" height="164" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="260.9" font-size="11" text-anchor="start" fill="#1e293b">Node 22.18+/24 runs .ts files by STRIPPING types: no type checking, and only erasable syntax</text><text x="44" y="274.9" font-size="11" text-anchor="start" fill="#1e293b">(measured: enum → ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX; tsc with erasableSyntaxOnly flags it at build time).</text><text x="44" y="288.9" font-size="11" text-anchor="start" fill="#1e293b">Recommended setup: tsconfig strict, module/moduleResolution NodeNext, verbatimModuleSyntax,</text><text x="44" y="302.9" font-size="11" text-anchor="start" fill="#1e293b">erasableSyntaxOnly, types: ["node"] (TypeScript 7 no longer includes @types automatically: measured TS2591).</text><text x="44" y="316.9" font-size="11" text-anchor="start" fill="#1e293b">Dev: node --watch src/server.ts (or tsx) · CI: tsc --noEmit + tests · Prod: run compiled JS or .ts directly.</text><text x="44" y="330.9" font-size="11" text-anchor="start" fill="#1e293b">Share types: Zod schemas → z.infer types for DTOs; typed errors; typed config.</text></svg>