<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Operational errors are expected and handled with responses or retries; programmer errors are bugs that should crash and restart; custom error classes and central error middleware; measured Express 4 vs 5 async error behaviour"><title>Operational errors are expected and handled with responses or retries; programmer errors are bugs that should crash and restart; custom error classes and central error middleware; measured Express 4 vs 5 async error behaviour</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Operational vs programmer errors</text><rect x="30" y="60" width="360" height="190" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b">OPERATIONAL errors (expected)</text><text x="210" y="121.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="210" y="136.7" font-size="12" text-anchor="middle" fill="#1e293b">• invalid input, not found, conflict</text><text x="210" y="151.7" font-size="12" text-anchor="middle" fill="#1e293b">• DB timeout, network failure, 3rd-party 503</text><text x="210" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b">• out of stock, payment declined</text><text x="210" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="210" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">→ handle: return 4xx/5xx, retry, fallback</text><text x="210" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">→ the process keeps running</text><rect x="410" y="60" width="360" height="190" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b">PROGRAMMER errors (bugs)</text><text x="590" y="121.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="590" y="136.7" font-size="12" text-anchor="middle" fill="#1e293b">• undefined is not a function</text><text x="590" y="151.7" font-size="12" text-anchor="middle" fill="#1e293b">• wrong argument types, forgotten await</text><text x="590" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b">• broken invariants</text><text x="590" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="590" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">→ fix the code; log + crash + restart</text><text x="590" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">(state may be corrupted)</text><rect x="30" y="266" width="740" height="108" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="302.25" font-size="11.5" text-anchor="middle" fill="#1e293b">class AppError extends Error { constructor(status, code, message) {…} }</text><text x="400" y="316.75" font-size="11.5" text-anchor="middle" fill="#1e293b">NotFoundError(404) · ValidationError(400, details) · ConflictError(409) · UnauthorizedError(401)</text><text x="400" y="331.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ one error middleware maps AppError → { error: { code, message } }; anything else → 500 + log with stack</text><text x="400" y="345.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Measured: Express 4 async throw → hung request (timeout); Express 5 → error middleware, 500 JSON</text></svg>