<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Zod schemas converted to OpenAPI components and served with Swagger UI; measured two invalid attempts and the working configuration validated with swagger-parser"><title>Zod schemas converted to OpenAPI components and served with Swagger UI; measured two invalid attempts and the working configuration validated with swagger-parser</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">API documentation with OpenAPI generated from Zod (measured)</text><rect x="30" y="60" width="210" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="135" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">Zod schemas</text><text x="135" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">UserCreate.meta({ id })</text><text x="135" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">User · ApiError</text><line x1="240" y1="120" x2="290" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="290" y="60" width="220" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="110.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">z.toJSONSchema(registry,</text><text x="400" y="123.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">{ target: openapi-3.0,</text><text x="400" y="137.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"> uri → #/components/schemas })</text><line x1="510" y1="120" x2="560" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="560" y="60" width="210" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="665" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">openapi.json</text><text x="665" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">paths · components</text><text x="665" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">securitySchemes</text><text x="400" y="210" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured with @apidevtools/swagger-parser:</text><rect x="30" y="222" width="740" height="64" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="243.9" font-size="11" text-anchor="middle" fill="#1e293b">1st try: per-schema conversion → "Missing $ref pointer #/definitions/UserCreate" (invalid)</text><text x="400" y="257.9" font-size="11" text-anchor="middle" fill="#1e293b">2nd: registry + uri → "$id" not allowed in OpenAPI 3.0 schema objects (invalid)</text><text x="400" y="271.9" font-size="11" text-anchor="middle" fill="#1e293b">3rd: registry + uri, $id removed → valid OpenAPI 3.0; served with swagger-ui-express at /docs (200)</text><rect x="30" y="300" width="230" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="314.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Swagger UI / Redoc</text><rect x="266" y="300" width="504" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="314.9" font-size="11" text-anchor="middle" fill="#1e293b">interactive docs for frontend and partners</text><rect x="30" y="326" width="230" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">client generation</text><rect x="266" y="326" width="504" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b">openapi-typescript, orval → typed fetch clients</text><rect x="30" y="352" width="230" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="366.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">contract tests</text><rect x="266" y="352" width="504" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="366.9" font-size="11" text-anchor="middle" fill="#1e293b">validate requests/responses against the spec in CI</text></svg>