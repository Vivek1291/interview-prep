<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Concurrency interleaves waiting tasks on one event loop; parallelism runs tasks on several cores with worker threads, child processes, cluster or more containers"><title>Concurrency interleaves waiting tasks on one event loop; parallelism runs tasks on several cores with worker threads, child processes, cluster or more containers</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Concurrency vs parallelism in Node.js</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="210" y="99.7" font-size="12" text-anchor="middle" fill="#1e293b">CONCURRENCY: many tasks in progress</text><text x="210" y="114.7" font-size="12" text-anchor="middle" fill="#1e293b">one event loop interleaves them while they wait</text><text x="210" y="129.7" font-size="12" text-anchor="middle" fill="#1e293b">(10,000 sockets, DB queries, timers)</text><text x="210" y="144.7" font-size="12" text-anchor="middle" fill="#1e293b">→ great for I/O-bound work</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="99.7" font-size="12" text-anchor="middle" fill="#1e293b">PARALLELISM: tasks running at the same instant</text><text x="590" y="114.7" font-size="12" text-anchor="middle" fill="#1e293b">on several CPU cores</text><text x="590" y="129.7" font-size="12" text-anchor="middle" fill="#1e293b">(worker threads, child processes, cluster, more pods)</text><text x="590" y="144.7" font-size="12" text-anchor="middle" fill="#1e293b">→ needed for CPU-bound work</text><rect x="30" y="196" width="170" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">worker_threads</text><rect x="206" y="196" width="330" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="371" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b">same process, separate V8 isolates, shared memory possible</text><rect x="542" y="196" width="228" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b">CPU work inside one service</text><rect x="30" y="240" width="170" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="262.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">child_process</text><rect x="206" y="240" width="330" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="371" y="262.9" font-size="11" text-anchor="middle" fill="#1e293b">separate OS process, any program, IPC/stdio</text><rect x="542" y="240" width="228" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="262.9" font-size="11" text-anchor="middle" fill="#1e293b">run tools (ffmpeg, git), isolate crashes</text><rect x="30" y="284" width="170" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">cluster</text><rect x="206" y="284" width="330" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="371" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">N Node processes sharing one port</text><rect x="542" y="284" width="228" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">use all cores for an HTTP server</text><rect x="30" y="328" width="170" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="350.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">more containers/pods</text><rect x="206" y="328" width="330" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="371" y="350.9" font-size="11" text-anchor="middle" fill="#1e293b">N instances behind a load balancer</text><rect x="542" y="328" width="228" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="350.9" font-size="11" text-anchor="middle" fill="#1e293b">the modern default for scaling</text></svg>