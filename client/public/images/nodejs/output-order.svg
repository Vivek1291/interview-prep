<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured output of the A E D C B puzzle; nextTick before promises before timers; inside an I/O callback setImmediate beats setTimeout; at top level the order is nondeterministic; nextTick starvation delayed a timer by 73 ms"><title>Measured output of the A E D C B puzzle; nextTick before promises before timers; inside an I/O callback setImmediate beats setTimeout; at top level the order is nondeterministic; nextTick starvation delayed a timer by 73 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Predicting Node.js output order</text><rect x="30" y="62" width="300" height="130" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="102" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log(&quot;A&quot;)</text><text x="44" y="116.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">setTimeout(() =&gt; log(&quot;B&quot;), 0)</text><text x="44" y="131" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Promise.resolve().then(() =&gt; log(&quot;C&quot;))</text><text x="44" y="145.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">process.nextTick(() =&gt; log(&quot;D&quot;))</text><text x="44" y="160" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log(&quot;E&quot;)</text><rect x="360" y="70" width="74" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="397" y="101.3" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="700">A</text><text x="397" y="140" font-size="9.5" text-anchor="middle" fill="#475569">sync</text><rect x="442" y="70" width="74" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="479" y="101.3" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="700">E</text><text x="479" y="140" font-size="9.5" text-anchor="middle" fill="#475569">sync</text><rect x="524" y="70" width="74" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="561" y="101.3" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="700">D</text><text x="561" y="140" font-size="9.5" text-anchor="middle" fill="#475569">nextTick queue</text><rect x="606" y="70" width="74" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="643" y="101.3" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="700">C</text><text x="643" y="140" font-size="9.5" text-anchor="middle" fill="#475569">promise microtask</text><rect x="688" y="70" width="74" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="725" y="101.3" font-size="18" text-anchor="middle" fill="#1e293b" font-weight="700">B</text><text x="725" y="140" font-size="9.5" text-anchor="middle" fill="#475569">timers phase</text><text x="560" y="170" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured output: A E D C B</text><rect x="30" y="214" width="360" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="248.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Inside an I/O callback (measured 5/5):</text><text x="210" y="263" font-size="11.5" text-anchor="middle" fill="#1e293b">nextTick → promise → immediate → timeout</text><text x="210" y="277.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(check phase comes right after poll)</text><rect x="410" y="214" width="360" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="241.3" font-size="11.5" text-anchor="middle" fill="#1e293b">Top level, setTimeout(0) vs setImmediate:</text><text x="590" y="255.8" font-size="11.5" text-anchor="middle" fill="#1e293b">measured 16× immediate, 4× timeout of 20</text><text x="590" y="270.3" font-size="11.5" text-anchor="middle" fill="#1e293b">→ NOT deterministic; with 2 ms sync work</text><text x="590" y="284.8" font-size="11.5" text-anchor="middle" fill="#1e293b">first: timeout 20/20</text><rect x="30" y="318" width="740" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="342.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Starvation: 1,000,000 recursive process.nextTick calls delayed a 0 ms timer to 73 ms (measured).</text><text x="400" y="357.3" font-size="11.5" text-anchor="middle" fill="#1e293b">nextTick and promise queues are drained completely before the loop moves on.</text></svg>