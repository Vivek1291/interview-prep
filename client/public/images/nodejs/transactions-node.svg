<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Running BEGIN and ROLLBACK through pool.query used different connections so the rollback did nothing; read-then-write oversold 15 items from stock 10 while an atomic update or SELECT FOR UPDATE sold exactly 10"><title>Running BEGIN and ROLLBACK through pool.query used different connections so the rollback did nothing; read-then-write oversold 15 items from stock 10 while an atomic update or SELECT FOR UPDATE sold exactly 10</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Transactions and race conditions in Node.js (measured)</text><rect x="30" y="60" width="360" height="170" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">WRONG: pool.query('BEGIN')</text><text x="210" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b">pool.query('UPDATE …')</text><text x="210" y="134.9" font-size="11" text-anchor="middle" fill="#1e293b">pool.query('ROLLBACK')</text><text x="210" y="148.9" font-size="11" text-anchor="middle" fill="#1e293b"></text><text x="210" y="162.9" font-size="11" text-anchor="middle" fill="#1e293b">each call may use a DIFFERENT connection</text><text x="210" y="176.9" font-size="11" text-anchor="middle" fill="#1e293b">measured: BEGIN on pid 836, UPDATE on pid 837</text><text x="210" y="190.9" font-size="11" text-anchor="middle" fill="#1e293b">→ ROLLBACK did nothing: stock 49, expected 50</text><rect x="410" y="60" width="360" height="170" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b">RIGHT: const client = await pool.connect()</text><text x="590" y="127.9" font-size="11" text-anchor="middle" fill="#1e293b">try { BEGIN … COMMIT }</text><text x="590" y="141.9" font-size="11" text-anchor="middle" fill="#1e293b">catch { ROLLBACK; throw }</text><text x="590" y="155.9" font-size="11" text-anchor="middle" fill="#1e293b">finally { client.release() }</text><text x="590" y="169.9" font-size="11" text-anchor="middle" fill="#1e293b"></text><text x="590" y="183.9" font-size="11" text-anchor="middle" fill="#1e293b">measured: rolled back, stock 50</text><text x="400" y="256" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 50 concurrent "buy 1" requests, stock 10</text><text x="320" y="284" font-size="11.5" text-anchor="end" fill="#475569">SELECT then UPDATE stock = $1</text><rect x="330" y="268" width="180" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="516" y="284" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">15 sold (oversold!), stock left 8</text><text x="320" y="318" font-size="11.5" text-anchor="end" fill="#475569">UPDATE … SET stock = stock - 1 WHERE stock &gt; 0</text><rect x="330" y="302" width="120" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="456" y="318" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10 sold, stock 0</text><text x="320" y="352" font-size="11.5" text-anchor="end" fill="#475569">BEGIN; SELECT … FOR UPDATE; UPDATE; COMMIT</text><rect x="330" y="336" width="120" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="456" y="352" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10 sold, stock 0</text></svg>