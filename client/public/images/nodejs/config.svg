<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Config from .env files, environment variables and secret managers validated once at startup into a typed object; measured missing variables causing a clear error and exit code 1"><title>Config from .env files, environment variables and secret managers validated once at startup into a typed object; measured missing variables causing a clear error and exit code 1</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Configuration and environments (measured)</text><rect x="30" y="60" width="250" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="155" y="86" font-size="11.5" text-anchor="middle" fill="#1e293b">.env (local only, git-ignored)</text><line x1="280" y1="82" x2="330" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="112" width="250" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="155" y="138" font-size="11.5" text-anchor="middle" fill="#1e293b">environment variables (Docker, K8s, CI)</text><line x1="280" y1="134" x2="330" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="164" width="250" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="155" y="190" font-size="11.5" text-anchor="middle" fill="#1e293b">secret manager (AWS SM, Vault, SSM)</text><line x1="280" y1="186" x2="330" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="330" y="110" width="200" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="430" y="129.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">config.js</text><text x="430" y="144" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">validate once at startup</text><text x="430" y="158.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">(zod schema)</text><line x1="530" y1="140" x2="580" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="530" y1="140" x2="580" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="580" y="84" width="190" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="675" y="105.9" font-size="11" text-anchor="middle" fill="#1e293b">typed, frozen config object</text><text x="675" y="119.9" font-size="11" text-anchor="middle" fill="#1e293b">used by the whole app</text><rect x="580" y="150" width="190" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="675" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b">invalid → print every problem</text><text x="675" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">and exit(1) (fail fast)</text><text x="400" y="236" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: missing DATABASE_URL and JWT_SECRET → "Invalid configuration" listing both, exit 1</text><text x="400" y="256" font-size="11.5" text-anchor="middle" fill="#475569">Valid env → PORT coerced to 8080, CORS_ORIGINS split into an array, secrets masked in the startup log</text><rect x="30" y="274" width="230" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">12-factor</text><rect x="266" y="274" width="504" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b">config in the environment, same image for dev/staging/prod</text><rect x="30" y="308" width="230" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="326.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">no secrets in code or images</text><rect x="266" y="308" width="504" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="326.9" font-size="11" text-anchor="middle" fill="#1e293b">inject at runtime; rotate; never log them</text><rect x="30" y="342" width="230" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="360.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">defaults only for safe values</text><rect x="266" y="342" width="504" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="360.9" font-size="11" text-anchor="middle" fill="#1e293b">PORT, LOG_LEVEL yes; secrets and DB URLs never</text></svg>