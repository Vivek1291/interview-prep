<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Expand, backfill, dual write, switch and contract steps; measured a blocking CREATE INDEX holding writes for 177 ms vs 2 ms with CONCURRENTLY"><title>Expand, backfill, dual write, switch and contract steps; measured a blocking CREATE INDEX holding writes for 177 ms vs 2 ms with CONCURRENTLY</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Zero-downtime schema migrations (measured)</text><rect x="30" y="60" width="140" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="100" y="82.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">expand</text><rect x="176" y="60" width="594" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="473" y="82" font-size="11.5" text-anchor="middle" fill="#1e293b">add new column/table (nullable or with default: 3 ms on 1M rows)</text><rect x="30" y="104" width="140" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="100" y="126.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">backfill</text><rect x="176" y="104" width="594" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="473" y="126" font-size="11.5" text-anchor="middle" fill="#1e293b">copy data in batches (one UPDATE of 1M rows: 10.7 s and long locks)</text><rect x="30" y="148" width="140" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="100" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">dual write</text><rect x="176" y="148" width="594" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="473" y="170" font-size="11.5" text-anchor="middle" fill="#1e293b">app writes old + new; deploy readers of the new column</text><rect x="30" y="192" width="140" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="100" y="214.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">switch</text><rect x="176" y="192" width="594" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="473" y="214" font-size="11.5" text-anchor="middle" fill="#1e293b">reads use new column; add NOT NULL / constraints</text><rect x="30" y="236" width="140" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="100" y="258.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">contract</text><rect x="176" y="236" width="594" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="473" y="258" font-size="11.5" text-anchor="middle" fill="#1e293b">drop the old column in a later release</text><text x="400" y="296" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured while writes ran continuously (1M-row table)</text><text x="210" y="322" font-size="11.5" text-anchor="end" fill="#475569">CREATE INDEX</text><rect x="220" y="306" width="247.8" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="473.8" y="322" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">177 ms longest blocked write</text><text x="210" y="356" font-size="11.5" text-anchor="end" fill="#475569">CREATE INDEX CONCURRENTLY</text><rect x="220" y="340" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="229" y="356" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2 ms longest write</text></svg>