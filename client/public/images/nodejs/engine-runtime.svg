<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="V8 is the engine that runs JavaScript; the browser runtime adds the DOM and Web APIs, the Node.js runtime adds libuv, file system, network, process and Buffer"><title>V8 is the engine that runs JavaScript; the browser runtime adds the DOM and Web APIs, the Node.js runtime adds libuv, file system, network, process and Buffer</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">JavaScript engine vs runtime (browser vs Node.js)</text><rect x="30" y="66" width="230" height="250" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="145" y="135.2" font-size="12" text-anchor="middle" fill="#1e293b">JavaScript ENGINE (V8)</text><text x="145" y="150.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="145" y="165.2" font-size="12" text-anchor="middle" fill="#1e293b">• parses + compiles JS (JIT)</text><text x="145" y="180.2" font-size="12" text-anchor="middle" fill="#1e293b">• call stack, heap, GC</text><text x="145" y="195.2" font-size="12" text-anchor="middle" fill="#1e293b">• Object, Array, Promise,</text><text x="145" y="210.2" font-size="12" text-anchor="middle" fill="#1e293b">  JSON, Math…</text><text x="145" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="145" y="240.2" font-size="12" text-anchor="middle" fill="#1e293b">no timers, no files,</text><text x="145" y="255.2" font-size="12" text-anchor="middle" fill="#1e293b">no network, no DOM</text><rect x="290" y="66" width="230" height="250" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="405" y="135.2" font-size="12" text-anchor="middle" fill="#1e293b">BROWSER runtime</text><text x="405" y="150.2" font-size="12" text-anchor="middle" fill="#1e293b">= V8/SpiderMonkey + Web APIs</text><text x="405" y="165.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="405" y="180.2" font-size="12" text-anchor="middle" fill="#1e293b">window, document (DOM),</text><text x="405" y="195.2" font-size="12" text-anchor="middle" fill="#1e293b">fetch, localStorage,</text><text x="405" y="210.2" font-size="12" text-anchor="middle" fill="#1e293b">setTimeout, events,</text><text x="405" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b">rendering</text><text x="405" y="240.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="405" y="255.2" font-size="12" text-anchor="middle" fill="#1e293b">sandboxed: no files</text><rect x="550" y="66" width="220" height="250" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660" y="135.2" font-size="12" text-anchor="middle" fill="#1e293b">NODE.JS runtime</text><text x="660" y="150.2" font-size="12" text-anchor="middle" fill="#1e293b">= V8 + libuv + core modules</text><text x="660" y="165.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="660" y="180.2" font-size="12" text-anchor="middle" fill="#1e293b">globalThis, process,</text><text x="660" y="195.2" font-size="12" text-anchor="middle" fill="#1e293b">require / import,</text><text x="660" y="210.2" font-size="12" text-anchor="middle" fill="#1e293b">fs, http, crypto, streams,</text><text x="660" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b">Buffer, setImmediate</text><text x="660" y="240.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="660" y="255.2" font-size="12" text-anchor="middle" fill="#1e293b">no DOM; full OS access</text><rect x="30" y="334" width="740" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="360.2" font-size="12" text-anchor="middle" fill="#1e293b">Same language, different host APIs: fetch, URL, timers, crypto.subtle and Web Streams now exist in both.</text></svg>