<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Recording CPU profiles with --cpu-prof or the inspector; measured profile showing pbkdf2Sync using 98.5 percent of CPU time although only every tenth request called it"><title>Recording CPU profiles with --cpu-prof or the inspector; measured profile showing pbkdf2Sync using 98.5 percent of CPU time although only every tenth request called it</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">CPU profiling a Node.js app (measured)</text><rect x="30" y="58" width="740" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="82.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">node --cpu-prof app.js  → .cpuprofile (open in Chrome DevTools Performance or speedscope)</text><text x="400" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">node --inspect app.js   → chrome://inspect → record a profile while load testing · clinic flame · 0x</text><text x="400" y="138" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 2,000 requests; only every 10th request hashes a password synchronously</text><text x="290" y="167" font-size="11.5" text-anchor="end" fill="#475569">pbkdf2Sync (hashPassword)</text><rect x="300" y="150" width="305.35" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="611.35" y="167" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">98.5 % of CPU (960 ms)</text><text x="290" y="203" font-size="11.5" text-anchor="end" fill="#475569">everything else (render, regex, slugify)</text><rect x="300" y="186" width="4.65" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="310.65" y="203" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.5 %</text><rect x="30" y="236" width="740" height="138" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="272.75" font-size="11.5" text-anchor="start" fill="#1e293b">How to read a profile:</text><text x="44" y="287.25" font-size="11.5" text-anchor="start" fill="#1e293b">• self time = time spent in the function itself → the hot spot (here pbkdf2Sync)</text><text x="44" y="301.75" font-size="11.5" text-anchor="start" fill="#1e293b">• total time = including callees → which path is expensive</text><text x="44" y="316.25" font-size="11.5" text-anchor="start" fill="#1e293b">• flame graph: width = time; look for wide plateaus</text><text x="44" y="330.75" font-size="11.5" text-anchor="start" fill="#1e293b">Guessing would have blamed the regex or string work; the profile pointed straight at 1 line.</text><text x="44" y="345.25" font-size="11.5" text-anchor="start" fill="#1e293b">Fix: async crypto.scrypt/pbkdf2 (thread pool) or a worker; then re-measure.</text></svg>