<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Fast producer, writable buffer and slow consumer; measured 250 MB queued when ignoring write return values vs 0.06 MB with drain or pipeline"><title>Fast producer, writable buffer and slow consumer; measured 250 MB queued when ignoring write return values vs 0.06 MB with drain or pipeline</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Backpressure (measured)</text><rect x="30" y="62" width="160" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="110" y="91.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">fast producer</text><rect x="610" y="62" width="160" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="91.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">slow consumer</text><rect x="240" y="70" width="320" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="92" font-size="11.5" text-anchor="middle" fill="#475569">writable buffer (highWaterMark 64 KB)</text><line x1="190" y1="87" x2="240" y2="87" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="560" y1="87" x2="610" y2="87" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="140" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">write() returns false when the buffer is full → STOP → wait for 'drain' → continue</text><text x="400" y="176" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 250 MB pushed into a slow writable (Node 22)</text><text x="250" y="214" font-size="12" text-anchor="end" fill="#475569">ignoring write() return value</text><rect x="260" y="198" width="274.93" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="542.93" y="216" font-size="12" text-anchor="start" fill="#1e293b" font-weight="700">249.94 MB queued at peak</text><text x="250" y="254" font-size="12" text-anchor="end" fill="#475569">waiting for 'drain'</text><rect x="260" y="238" width="4" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="272" y="256" font-size="12" text-anchor="start" fill="#1e293b" font-weight="700">0.06 MB queued at peak</text><text x="250" y="294" font-size="12" text-anchor="end" fill="#475569">pipeline()</text><rect x="260" y="278" width="4" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="272" y="296" font-size="12" text-anchor="start" fill="#1e293b" font-weight="700">0.06 MB queued at peak</text><text x="400" y="330" font-size="11.5" text-anchor="middle" fill="#475569">Without backpressure the whole stream sits in memory, exactly what streams were meant to avoid.</text><text x="400" y="356" font-size="11.5" text-anchor="middle" fill="#475569">HTTP: res.write() to a slow client is the same situation.</text></svg>