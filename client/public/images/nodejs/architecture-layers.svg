<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A folder layout for a Node.js backend and the layers route/controller, service, repository/adapter and domain, with dependencies pointing inward as in clean and hexagonal architecture"><title>A folder layout for a Node.js backend and the layers route/controller, service, repository/adapter and domain, with dependencies pointing inward as in clean and hexagonal architecture</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Structuring a Node.js backend: layers and folders</text><rect x="30" y="58" width="250" height="316" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="142.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">src/</text><text x="44" y="156.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ app.ts (express app, no listen)</text><text x="44" y="170.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ server.ts (listen, shutdown)</text><text x="44" y="184.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ config/ (validated env)</text><text x="44" y="198.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ routes/ (URL → controller)</text><text x="44" y="212.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ controllers/ (HTTP in/out)</text><text x="44" y="226.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ services/ (business rules)</text><text x="44" y="240.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ repositories/ (DB access)</text><text x="44" y="254.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ models/ · validators/</text><text x="44" y="268.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ middleware/ (auth, errors)</text><text x="44" y="282.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">├─ jobs/ · events/</text><text x="44" y="296.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">└─ utils/ · types/</text><rect x="300" y="62" width="470" height="52" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="535" y="84.75" font-size="11.5" text-anchor="middle" fill="#1e293b">route / controller</text><text x="535" y="99.25" font-size="11.5" text-anchor="middle" fill="#1e293b">parse request, call a service, map result → HTTP</text><line x1="535" y1="114" x2="535" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="124" width="470" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="535" y="146.75" font-size="11.5" text-anchor="middle" fill="#1e293b">service (use case)</text><text x="535" y="161.25" font-size="11.5" text-anchor="middle" fill="#1e293b">business rules, transactions, no req/res</text><line x1="535" y1="176" x2="535" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="186" width="470" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="535" y="208.75" font-size="11.5" text-anchor="middle" fill="#1e293b">repository / adapter</text><text x="535" y="223.25" font-size="11.5" text-anchor="middle" fill="#1e293b">SQL, Mongo, HTTP clients, queues</text><line x1="535" y1="238" x2="535" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="248" width="470" height="52" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="535" y="270.75" font-size="11.5" text-anchor="middle" fill="#1e293b">domain / models</text><text x="535" y="285.25" font-size="11.5" text-anchor="middle" fill="#1e293b">entities, invariants, pure functions</text><rect x="300" y="316" width="470" height="58" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="535" y="341.9" font-size="11" text-anchor="middle" fill="#1e293b">Dependencies point inward: HTTP → services → interfaces ← adapters.</text><text x="535" y="355.9" font-size="11" text-anchor="middle" fill="#1e293b">Clean/hexagonal: services depend on ports (interfaces); DB/HTTP are plug-in adapters.</text></svg>