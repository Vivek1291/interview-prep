<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Request stages parse, authenticate, validate, authorize, business logic and database with the status code each one returns"><title>Request stages parse, authenticate, validate, authorize, business logic and database with the status code each one returns</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The request pipeline: where validation and checks happen</text><rect x="30" y="60" width="200" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="84.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">parse</text><rect x="240" y="60" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b">body size limit, JSON parse → 400/413</text><line x1="130" y1="100" x2="130" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="110" width="200" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="130" y="134.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">authenticate</text><rect x="240" y="110" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="134.2" font-size="12" text-anchor="middle" fill="#1e293b">who are you? token/session → 401</text><line x1="130" y1="150" x2="130" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="160" width="200" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="184.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">validate</text><rect x="240" y="160" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b">schema: types, ranges, unknown keys → 400/422</text><line x1="130" y1="200" x2="130" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="210" width="200" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="130" y="234.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">authorize</text><rect x="240" y="210" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="234.2" font-size="12" text-anchor="middle" fill="#1e293b">may THIS user do THIS to THIS resource? → 403/404</text><line x1="130" y1="250" x2="130" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="260" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="284.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">business logic</text><rect x="240" y="260" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b">rules: stock, state transitions → 409/422</text><line x1="130" y1="300" x2="130" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="310" width="200" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="334.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">database</text><rect x="240" y="310" width="530" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="334.2" font-size="12" text-anchor="middle" fill="#1e293b">constraints are the last line of defence</text><text x="400" y="372" font-size="11.5" text-anchor="middle" fill="#475569">Reject as early and as cheaply as possible; each layer trusts nothing from the one before.</text></svg>