<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Comparison of spawn, execFile, exec and fork with measured startup times; exec failed on 6.6 MB of output with a maxBuffer error while spawn streamed it; fork IPC 10,000 round trips in 142 ms"><title>Comparison of spawn, execFile, exec and fork with measured startup times; exec failed on 6.6 MB of output with a maxBuffer error while spawn streamed it; fork IPC 10,000 round trips in 142 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Child processes: spawn, execFile, exec, fork (measured)</text><rect x="30" y="58" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="81.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">spawn(cmd, args)</text><rect x="206" y="58" width="240" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="81.7" font-size="10.5" text-anchor="middle" fill="#1e293b">streams stdout/stderr, no shell</text><rect x="452" y="58" width="230" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="567" y="81.7" font-size="10.5" text-anchor="middle" fill="#1e293b">large output, long-running tools</text><rect x="688" y="58" width="82" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="729" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">2.4 ms</text><rect x="30" y="104" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="127.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">execFile(file, args)</text><rect x="206" y="104" width="240" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="127.7" font-size="10.5" text-anchor="middle" fill="#1e293b">buffers output, no shell</text><rect x="452" y="104" width="230" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="567" y="127.7" font-size="10.5" text-anchor="middle" fill="#1e293b">short commands with arguments</text><rect x="688" y="104" width="82" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="729" y="127.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">3.3 ms</text><rect x="30" y="150" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="173.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">exec("cmd | pipe")</text><rect x="206" y="150" width="240" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="173.7" font-size="10.5" text-anchor="middle" fill="#1e293b">runs a shell, buffers output (maxBuffer 1 MB)</text><rect x="452" y="150" width="230" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="567" y="173.7" font-size="10.5" text-anchor="middle" fill="#1e293b">quick shell one-liners (trusted input only)</text><rect x="688" y="150" width="82" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="729" y="173.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">3.8 ms</text><rect x="30" y="196" width="170" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="219.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">fork(script)</text><rect x="206" y="196" width="240" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="219.7" font-size="10.5" text-anchor="middle" fill="#1e293b">new Node process + IPC channel</text><rect x="452" y="196" width="230" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="567" y="219.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Node workers, crash isolation</text><rect x="688" y="196" width="82" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="729" y="219.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">17.5 ms</text><text x="400" y="260" font-size="11.5" text-anchor="middle" fill="#475569">Measured: medians of 20 runs (startup to completion)</text><rect x="30" y="274" width="360" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="306.25" font-size="11.5" text-anchor="middle" fill="#1e293b">exec on a command printing 6.6 MB</text><text x="210" y="320.75" font-size="11.5" text-anchor="middle" fill="#1e293b">→ ERR_CHILD_PROCESS_STDIO_MAXBUFFER</text><text x="210" y="335.25" font-size="11.5" text-anchor="middle" fill="#1e293b">spawn on the same command</text><text x="210" y="349.75" font-size="11.5" text-anchor="middle" fill="#1e293b">→ streamed all 6.7 MB</text><rect x="410" y="274" width="360" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="306.25" font-size="11.5" text-anchor="middle" fill="#1e293b">fork IPC: 10,000 round trips in 142 ms</text><text x="590" y="320.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Pass arguments as an array (execFile/spawn),</text><text x="590" y="335.25" font-size="11.5" text-anchor="middle" fill="#1e293b">never build shell strings from user input;</text><text x="590" y="349.75" font-size="11.5" text-anchor="middle" fill="#1e293b">set timeouts and kill children on shutdown.</text></svg>