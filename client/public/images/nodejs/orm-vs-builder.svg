h d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Raw driver vs query builder vs ORM</text><rect x="30" y="60" width="230" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="86" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">raw driver (pg)</text><rect x="266" y="60" width="330" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="431" y="85.9" font-size="11" text-anchor="middle" fill="#1e293b">full SQL control, fastest, manual mapping</text><rect x="602" y="60" width="168" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686" y="85.7" font-size="10.5" text-anchor="middle" fill="#1e293b">SQL you write: ok for hot paths</text><rect x="30" y="110" width="230" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="136" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">query builder (Knex, Kysely)</text><rect x="266" y="110" width="330" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="431" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">composable SQL in JS, migrations, still close to SQL</text><rect x="602" y="110" width="168" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686" y="135.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Kysely: typed</text><rect x="30" y="160" width="230" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="145" y="186" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">ORM (Prisma, Sequelize, TypeORM)</text><rect x="266" y="160" width="330" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="431" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">models, relations, migrations, less SQL</text><rect x="602" y="160" width="168" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686" y="185.7" font-size="10.5" text-anchor="middle" fill="#1e293b">watch N+1, generated SQL</text><rect x="30" y="210" width="230" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="236" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">ODM (Mongoose)</text><rect x="266" y="210" width="330" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="431" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b">schemas, validation, hooks, populate for MongoDB</text><rect x="602" y="210" width="168" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686" y="235.7" font-size="10.5" text-anchor="middle" fill="#1e293b">lean() for reads</text><text x="400" y="280" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: fetch 5,000 rows (PostgreSQL 17)</text><text x="240" y="304" font-size="11.5" text-anchor="end" fill="#475569">pg</text><rect x="250" y="290" width="177" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="433" y="304" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">5.9 ms</text><text x="240" y="330" font-size="11.5" text-anchor="end" fill="#475569">knex</text><rect x="250" y="316" width="167.4" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="423.4" y="330" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">5.58 ms</text><text x="240" y="356" font-size="11.5" text-anchor="end" fill="#475569">sequelize (model instances)</text><rect x="250" y="342" width="368.1" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="624.1" y="356" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">12.27 ms</t