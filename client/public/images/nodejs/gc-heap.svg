<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="V8 young and old generation garbage collection with measured scavenge pauses, an out-of-memory crash with exit code 134 at a 64 MB heap limit, and Map vs WeakMap retaining 41.8 MB vs 4.2 MB"><title>V8 young and old generation garbage collection with measured scavenge pauses, an out-of-memory crash with exit code 134 at a 64 MB heap limit, and Map vs WeakMap retaining 41.8 MB vs 4.2 MB</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Garbage collection, heap limits and WeakMap (measured)</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="100.9" font-size="11" text-anchor="middle" fill="#1e293b">Young generation (new space)</text><text x="210" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">most objects die young → Scavenge: copy survivors</text><text x="210" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">measured: 2M short-lived objects → 30 scavenges,</text><text x="210" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">7.4 ms total pause, max 0.71 ms, 0 mark-compacts</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="590" y="100.9" font-size="11" text-anchor="middle" fill="#1e293b">Old generation (old space)</text><text x="590" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">survivors get promoted → Mark-Sweep-Compact</text><text x="590" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">incremental + concurrent marking, short pauses</text><text x="590" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">default heap limit here: 4,144 MB (18 GB machine)</text><rect x="30" y="188" width="740" height="72" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured: --max-old-space-size=64 with a leak → "FATAL ERROR: Reached heap limit Allocation failed -</text><text x="400" y="227.9" font-size="11" text-anchor="middle" fill="#1e293b">JavaScript heap out of memory", exit code 134 after a last Mark-Compact (65.2 → 63.6 MB).</text><text x="400" y="241.9" font-size="11" text-anchor="middle" fill="#1e293b">In containers set --max-old-space-size below the container memory limit.</text><text x="400" y="280" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: per-request metadata keyed by the request object, 100,000 requests</text><text x="220" y="308" font-size="11.5" text-anchor="end" fill="#475569">Map(req → meta)</text><rect x="230" y="292" width="334.4" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="570.4" y="308" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">41.8 MB heap (keys kept alive)</text><text x="220" y="342" font-size="11.5" text-anchor="end" fill="#475569">WeakMap(req → meta)</text><rect x="230" y="326" width="33.6" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="269.6" y="342" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4.2 MB heap (collected with the request)</text></svg>