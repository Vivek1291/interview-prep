<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured export of 300 thousand rows: buffered response first byte 330 ms and 355 MB, per-row stream 9 ms and 91 MB but 629 ms total, batched stream 7 ms, 84 MB and 261 ms total"><title>Measured export of 300 thousand rows: buffered response first byte 330 ms and 355 MB, per-row stream 9 ms and 91 MB but 629 ms total, batched stream 7 ms, 84 MB and 261 ms total</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Streaming a large HTTP response (measured)</text><text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: exporting 300,000 rows (34.2 MB) over HTTP, Node 22, fresh process each</text><text x="250" y="92" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">first byte (ms)</text><text x="520" y="92" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">server peak memory (MB)</text><rect x="30" y="100" width="210" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="135" y="126.9" font-size="11" text-anchor="middle" fill="#1e293b">build array, JSON.stringify, res.end</text><rect x="250" y="110" width="198" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="454" y="128" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">330 (total 362)</text><rect x="520" y="110" width="195.25" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="721.25" y="128" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">355</text><rect x="30" y="156" width="210" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="135" y="182.9" font-size="11" text-anchor="middle" fill="#1e293b">stream: one write per row (NDJSON)</text><rect x="250" y="166" width="5.4" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="261.4" y="184" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">9 (total 629)</text><rect x="520" y="166" width="50.05" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="576.05" y="184" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">91</text><rect x="30" y="212" width="210" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="135" y="238.9" font-size="11" text-anchor="middle" fill="#1e293b">stream: 1,000 rows per chunk</text><rect x="250" y="222" width="4.2" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="260.2" y="240" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">7 (total 261)</text><rect x="520" y="222" width="46.2" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="572.2" y="240" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">84</text><rect x="30" y="280" width="740" height="92" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="315.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Streaming: the client starts receiving after 7 ms instead of 330 ms, and memory no longer grows with the export size.</text><text x="400" y="330" font-size="11.5" text-anchor="middle" fill="#1e293b">Many tiny writes cost CPU (629 ms total); batching rows into bigger chunks made it the fastest overall (261 ms).</text><text x="400" y="344.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Source: a DB cursor (Mongo .cursor(), pg-query-stream) → Readable.from → pipeline(…, res).</text></svg>