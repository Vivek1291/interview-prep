<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured cache stampede: 200 database queries with 185 failures without protection vs 1 query with single-flight and a lock; negative caching reduced 1,000 lookups to 50; descriptions of stampede, penetration and avalanche"><title>Measured cache stampede: 200 database queries with 185 failures without protection vs 1 query with single-flight and a lock; negative caching reduced 1,000 lookups to 50; descriptions of stampede, penetration and avalanche</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Stampede, penetration and avalanche (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 200 concurrent requests for a cold key whose query takes ~37 ms</text><text x="280" y="84" font-size="11.5" text-anchor="end" fill="#475569">naive cache-aside: DB queries</text><rect x="290" y="68" width="280" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="576" y="84" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">200 (185 failed)</text><text x="280" y="118" font-size="11.5" text-anchor="end" fill="#475569">single-flight + Redis lock: DB queries</text><rect x="290" y="102" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="299" y="118" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1 (0 failed, 40–51 ms)</text><text x="400" y="140" font-size="11" text-anchor="middle" fill="#475569">the 185 failures: Postgres ran out of shared memory under 200 identical heavy queries</text><text x="400" y="158" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 1,000 requests for 50 ids that do not exist</text><text x="280" y="184" font-size="11.5" text-anchor="end" fill="#475569">no negative caching: DB lookups</text><rect x="290" y="168" width="300" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="596" y="184" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1000</text><text x="280" y="218" font-size="11.5" text-anchor="end" fill="#475569">cache "null" for 30 s: DB lookups</text><rect x="290" y="202" width="15" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="311" y="218" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50</text><rect x="30" y="252" width="130" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="95" y="274.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">stampede</text><rect x="166" y="252" width="260" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="296" y="273.9" font-size="11" text-anchor="middle" fill="#1e293b">hot key expires → everyone rebuilds it</text><rect x="432" y="252" width="338" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="601" y="273.9" font-size="11" text-anchor="middle" fill="#1e293b">single-flight, lock, refresh-ahead, stale-while-revalidate</text><rect x="30" y="294" width="130" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="95" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">penetration</text><rect x="166" y="294" width="260" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="296" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b">keys that never exist → always miss</text><rect x="432" y="294" width="338" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="601" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b">negative caching, input validation, Bloom filter</text><rect x="30" y="336" width="130" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="95" y="358.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">avalanche</text><rect x="166" y="336" width="260" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="296" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">many keys expire together / cache restarts</text><rect x="432" y="336" width="338" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="601" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">TTL jitter, warm-up, rate-limit rebuilds, HA cache</text></svg>