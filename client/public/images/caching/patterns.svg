<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Cache-aside, read-through, write-through, write-behind and refresh-ahead patterns with how they work and their trade-offs"><title>Cache-aside, read-through, write-through, write-behind and refresh-ahead patterns with how they work and their trade-offs</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Caching patterns</text><rect x="30" y="54" width="190" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="86.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">cache-aside (lazy)</text><rect x="226" y="54" width="340" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="78.9" font-size="11" text-anchor="middle" fill="#1e293b">app reads cache → miss → reads DB → writes cache</text><text x="396" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">writes go to DB, then delete the key</text><rect x="572" y="54" width="198" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="78.9" font-size="11" text-anchor="middle" fill="#1e293b">most common;</text><text x="671" y="92.9" font-size="11" text-anchor="middle" fill="#1e293b">only caches what is read</text><rect x="30" y="118" width="190" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="125" y="150.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">read-through</text><rect x="226" y="118" width="340" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">cache library loads from DB on a miss</text><rect x="572" y="118" width="198" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">like cache-aside, logic</text><text x="671" y="156.9" font-size="11" text-anchor="middle" fill="#1e293b">in the cache layer</text><rect x="30" y="182" width="190" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="214.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">write-through</text><rect x="226" y="182" width="340" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">write DB and cache in the same operation</text><rect x="572" y="182" width="198" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">fresh reads; slower writes</text><rect x="30" y="246" width="190" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="125" y="278.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">write-behind (back)</text><rect x="226" y="246" width="340" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">write cache now, flush to DB later in batches</text><rect x="572" y="246" width="198" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">fast writes; can lose data</text><rect x="30" y="310" width="190" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="125" y="342.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">refresh-ahead</text><rect x="226" y="310" width="340" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="341.9" font-size="11" text-anchor="middle" fill="#1e293b">refresh hot keys before they expire</text><rect x="572" y="310" width="198" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="341.9" font-size="11" text-anchor="middle" fill="#1e293b">no misses on hot keys</text></svg>