<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A slow reader writes an old value back to the cache after a writer updated the database and deleted the key; measured stale cache, and fixes: short TTL, delayed double delete, versioned keys and change-data-capture invalidation"><title>A slow reader writes an old value back to the cache after a writer updated the database and deleted the key; measured stale cache, and fixes: short TTL, delayed double delete, versioned keys and change-data-capture invalidation</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Cache invalidation race (measured)</text><rect x="30" y="58" width="110" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="85" y="79.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">reader</text><rect x="146" y="58" width="624" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="458" y="79" font-size="11.5" text-anchor="middle" fill="#1e293b">SELECT name → "Old Name" (slow request)</text><rect x="30" y="98" width="110" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="85" y="119.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">writer</text><rect x="146" y="98" width="624" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="458" y="119" font-size="11.5" text-anchor="middle" fill="#1e293b">UPDATE name = "New Name"</text><rect x="30" y="138" width="110" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="85" y="159.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">writer</text><rect x="146" y="138" width="624" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="458" y="159" font-size="11.5" text-anchor="middle" fill="#1e293b">DEL cache key</text><rect x="30" y="178" width="110" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="85" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">reader</text><rect x="146" y="178" width="624" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="458" y="199" font-size="11.5" text-anchor="middle" fill="#1e293b">SET cache = "Old Name" (stale value written back!)</text><rect x="30" y="222" width="740" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="246.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: DB says "New Name", cache says "Old Name" until the TTL expires</text><rect x="30" y="276" width="220" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">short TTL</text><rect x="256" y="276" width="514" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b">bounds how long staleness lasts</text><rect x="30" y="302" width="220" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="316.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">delete again after a delay</text><rect x="256" y="302" width="514" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="316.9" font-size="11" text-anchor="middle" fill="#1e293b">double delete catches the late writer</text><rect x="30" y="328" width="220" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">versioned keys</text><rect x="256" y="328" width="514" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">user:7:v12, bump the version on write</text><rect x="30" y="354" width="220" height="22" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="368.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">CDC / events</text><rect x="256" y="354" width="514" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="368.9" font-size="11" text-anchor="middle" fill="#1e293b">invalidate from the DB change stream (Debezium, Mongo change streams)</text></svg>