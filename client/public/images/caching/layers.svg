<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Cache layers from browser and CDN to in-process memory, Redis and the database with measured latencies; measured 50 requests per second without a cache vs 13,199 with Redis and 17,559 with memory"><title>Cache layers from browser and CDN to in-process memory, Redis and the database with measured latencies; measured 50 requests per second without a cache vs 13,199 with Redis and 17,559 with memory</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Where to cache: the layers (measured)</text><rect x="30" y="54" width="220" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="75.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">browser cache</text><rect x="256" y="54" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="74.9" font-size="11" text-anchor="middle" fill="#1e293b">Cache-Control, ETag</text><rect x="542" y="54" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="74.9" font-size="11" text-anchor="middle" fill="#1e293b">0 ms (no request)</text><rect x="30" y="94" width="220" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="115.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CDN / edge</text><rect x="256" y="94" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">s-maxage, stale-while-revalidate</text><rect x="542" y="94" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">~10–30 ms from the user</text><rect x="30" y="134" width="220" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="155.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">reverse proxy (Nginx)</text><rect x="256" y="134" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="154.9" font-size="11" text-anchor="middle" fill="#1e293b">proxy_cache for public GETs</text><rect x="542" y="134" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="154.9" font-size="11" text-anchor="middle" fill="#1e293b">no app work</text><rect x="30" y="174" width="220" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="195.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">in-process memory</text><rect x="256" y="174" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="194.9" font-size="11" text-anchor="middle" fill="#1e293b">Map/LRU per instance</text><rect x="542" y="174" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="194.9" font-size="11" text-anchor="middle" fill="#1e293b">0.0001 ms (measured)</text><rect x="30" y="214" width="220" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="140" y="235.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Redis (shared)</text><rect x="256" y="214" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="234.9" font-size="11" text-anchor="middle" fill="#1e293b">cache-aside, TTL</text><rect x="542" y="214" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="234.9" font-size="11" text-anchor="middle" fill="#1e293b">0.145 ms (measured)</text><rect x="30" y="254" width="220" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="140" y="275.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">database</text><rect x="256" y="254" width="280" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="396" y="274.9" font-size="11" text-anchor="middle" fill="#1e293b">buffer cache, materialised views</text><rect x="542" y="254" width="228" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="656" y="274.9" font-size="11" text-anchor="middle" fill="#1e293b">36.7 ms report (measured)</text><text x="400" y="316" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: GET /report (join + group over 1M orders), 20 connections, Express 5</text><text x="160" y="338.5" font-size="11.5" text-anchor="end" fill="#475569">no cache</text><rect x="170" y="326" width="3" height="17" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="179" y="338.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50 req/s · p50 377 ms</text><text x="160" y="360.5" font-size="11.5" text-anchor="end" fill="#475569">Redis</text><rect x="170" y="348" width="290.38" height="17" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="466.38" y="360.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">13199 req/s · p50 1 ms</text><text x="160" y="382.5" font-size="11.5" text-anchor="end" fill="#475569">in-process memory</text><rect x="170" y="370" width="386.3" height="17" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="562.3" y="382.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">17559 req/s · p50 &lt;1 ms</text></svg>