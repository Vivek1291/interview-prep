<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SLI, SLO and SLA definitions; a 99.9 percent monthly SLO allows 43.2 minutes of failure, 99 percent allows 432 minutes and 99.99 percent 4.32 minutes; alert on user-facing symptoms"><title>SLI, SLO and SLA definitions; a 99.9 percent monthly SLO allows 43.2 minutes of failure, 99 percent allows 432 minutes and 99.99 percent 4.32 minutes; alert on user-facing symptoms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">SLIs, SLOs, error budgets and alerting</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="93" font-size="11.5" text-anchor="middle" fill="#1e293b">SLI: what you measure</text><text x="210" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b">"% of requests &lt; 300 ms and not 5xx"</text><text x="210" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b">SLO: the target</text><text x="210" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b">"99.9% over 30 days"</text><text x="210" y="151" font-size="11.5" text-anchor="middle" fill="#1e293b">SLA: the contract (with penalties)</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="93" font-size="11.5" text-anchor="middle" fill="#1e293b">Error budget = 100% - SLO</text><text x="590" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b">99.9% of 30 days = 43.2 min of failure</text><text x="590" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b">99.99% = 4.3 min · 99% = 7.2 h</text><text x="590" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b">budget left → ship faster</text><text x="590" y="151" font-size="11.5" text-anchor="middle" fill="#1e293b">budget spent → freeze, fix reliability</text><text x="400" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Allowed downtime per 30 days</text><text x="150" y="228" font-size="11.5" text-anchor="end" fill="#475569">99%</text><rect x="160" y="214" width="518.4" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="684.4" y="228" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">432 min</text><text x="150" y="256" font-size="11.5" text-anchor="end" fill="#475569">99.9%</text><rect x="160" y="242" width="51.84" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="217.84" y="256" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">43.2 min</text><text x="150" y="284" font-size="11.5" text-anchor="end" fill="#475569">99.99%</text><rect x="160" y="270" width="5.18" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="171.18" y="284" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4.32 min</text><rect x="30" y="306" width="740" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="337.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Alert on symptoms users feel (error-rate, latency SLO burn rate), not on every CPU spike.</text><text x="400" y="352.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Every page must be actionable and link a runbook + dashboard; everything else is a ticket or a dashboard.</text></svg>