<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured 410,841 lines per second for console.log JSON to a file, 733,456 for pino, 419,993 for winston and 770,797 for pino to a pipe; disabled debug logs cost almost nothing"><title>Measured 410,841 lines per second for console.log JSON to a file, 733,456 for pino, 419,993 for winston and 770,797 for pino to a pipe; disabled debug logs cost almost nothing</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Structured logging in Node.js (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 100,000 structured log lines (Node 22)</text><text x="220" y="87" font-size="11.5" text-anchor="end" fill="#475569">console.log(JSON) → file</text><rect x="230" y="72" width="205.42" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="441.42" y="87" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">410841 logs/s</text><text x="220" y="117" font-size="11.5" text-anchor="end" fill="#475569">pino → file</text><rect x="230" y="102" width="366.73" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="602.73" y="117" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">733456 logs/s</text><text x="220" y="147" font-size="11.5" text-anchor="end" fill="#475569">winston (JSON) → stream</text><rect x="230" y="132" width="210" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="446" y="147" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">419993 logs/s</text><text x="220" y="177" font-size="11.5" text-anchor="end" fill="#475569">pino → pipe</text><rect x="230" y="162" width="385.4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="621.4" y="177" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">770797 logs/s</text><text x="400" y="210" font-size="11.5" text-anchor="middle" fill="#10b981">pino.debug() while level = "info": 77 million calls/s (a disabled level is almost free)</text><rect x="30" y="226" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="276" font-size="11.5" text-anchor="middle" fill="#1e293b">Good log line</text><text x="210" y="290.5" font-size="11.5" text-anchor="middle" fill="#1e293b">JSON, one event per line, to stdout</text><text x="210" y="305" font-size="11.5" text-anchor="middle" fill="#1e293b">level, time, msg, requestId/traceId</text><text x="210" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">userId, route, status, durationMs</text><text x="210" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">err with stack (pino serializers)</text><rect x="410" y="226" width="360" height="150" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="268.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Avoid</text><text x="590" y="283.25" font-size="11.5" text-anchor="middle" fill="#1e293b">passwords, tokens, cards, full bodies</text><text x="590" y="297.75" font-size="11.5" text-anchor="middle" fill="#1e293b">(use redact paths)</text><text x="590" y="312.25" font-size="11.5" text-anchor="middle" fill="#1e293b">string-concatenated messages</text><text x="590" y="326.75" font-size="11.5" text-anchor="middle" fill="#1e293b">logging every loop iteration</text><text x="590" y="341.25" font-size="11.5" text-anchor="middle" fill="#1e293b">info in hot paths → use debug</text></svg>