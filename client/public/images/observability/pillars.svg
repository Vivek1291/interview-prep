<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Logs record events, metrics count and time things for dashboards and alerts, traces show where one request spent time; RED, USE and golden signals; trace ids link the three"><title>Logs record events, metrics count and time things for dashboards and alerts, traces show where one request spent time; RED, USE and golden signals; trace ids link the three</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Logs, metrics and traces</text><rect x="30" y="58" width="236" height="160" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="148" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b">LOGS: what happened</text><text x="148" y="128.2" font-size="10.5" text-anchor="middle" fill="#1e293b">{"level":"error","msg":"payment failed",</text><text x="148" y="141.7" font-size="10.5" text-anchor="middle" fill="#1e293b">"requestId":"r-42","orderId":7}</text><text x="148" y="155.2" font-size="10.5" text-anchor="middle" fill="#1e293b">events with detail · search by id</text><text x="148" y="168.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Loki, ELK, CloudWatch Logs</text><rect x="282" y="58" width="236" height="160" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b">METRICS: how much / how often</text><text x="400" y="128.2" font-size="10.5" text-anchor="middle" fill="#1e293b">http_requests_total{status="500"}</text><text x="400" y="141.7" font-size="10.5" text-anchor="middle" fill="#1e293b">numbers over time · cheap · alerting</text><text x="400" y="155.2" font-size="10.5" text-anchor="middle" fill="#1e293b">Prometheus + Grafana, CloudWatch,</text><text x="400" y="168.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Datadog</text><rect x="534" y="58" width="236" height="160" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="652" y="114.7" font-size="10.5" text-anchor="middle" fill="#1e293b">TRACES: where the time went</text><text x="652" y="128.2" font-size="10.5" text-anchor="middle" fill="#1e293b">one request across services:</text><text x="652" y="141.7" font-size="10.5" text-anchor="middle" fill="#1e293b">api 105 ms → pg 29 ms → stock 37 ms</text><text x="652" y="155.2" font-size="10.5" text-anchor="middle" fill="#1e293b">spans + trace id in headers</text><text x="652" y="168.7" font-size="10.5" text-anchor="middle" fill="#1e293b">OpenTelemetry → Jaeger, Tempo, X-Ray</text><rect x="30" y="236" width="360" height="140" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="281.9" font-size="11" text-anchor="middle" fill="#1e293b">What to measure</text><text x="210" y="295.9" font-size="11" text-anchor="middle" fill="#1e293b">RED (each service): Rate, Errors, Duration</text><text x="210" y="309.9" font-size="11" text-anchor="middle" fill="#1e293b">USE (each resource): Utilisation, Saturation, Errors</text><text x="210" y="323.9" font-size="11" text-anchor="middle" fill="#1e293b">Golden signals: latency, traffic, errors, saturation</text><text x="210" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b">Node extras: event-loop delay, heap, GC, pool waits</text><rect x="410" y="236" width="360" height="140" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="281.9" font-size="11" text-anchor="middle" fill="#1e293b">Monitoring vs observability</text><text x="590" y="295.9" font-size="11" text-anchor="middle" fill="#1e293b">monitoring: known questions (dashboards, alerts)</text><text x="590" y="309.9" font-size="11" text-anchor="middle" fill="#1e293b">observability: answer NEW questions from telemetry</text><text x="590" y="323.9" font-size="11" text-anchor="middle" fill="#1e293b">("why only EU users on Android?")</text><text x="590" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b">link them: the trace id in every log line</text></svg>