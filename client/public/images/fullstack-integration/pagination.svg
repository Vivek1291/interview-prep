ess, the next page fetched in advance</text><rect x="30" y="70" width="740" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="94.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">https://app.example.com/users?page=2&amp;q=as</text><rect x="80" y="150" width="180" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="170" y="198.6" font-size="13" text-anchor="middle" fill="#1e293b">page 1</text><text x="170" y="214.6" font-size="13" text-anchor="middle" fill="#1e293b"></text><text x="170" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b">cached</text><rect x="310" y="150" width="180" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="198.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">page 2</text><text x="400" y="214.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700"></text><text x="400" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">on screen</text><rect x="540" y="150" width="180" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="630" y="198.6" font-size="13" text-anchor="middle" fill="#1e293b">page 3</text><text x="630" y="214.6" font-size="13" text-anchor="middle" fill="#1e293b"></text><text x="630" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b">prefetched</text><line x1="260" y1="210" x2="306" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="490" y1="210" x2="536" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="300" font-size="12.5" text-anchor="middle" fill="#6366f1" font-weight="700">Next → 10 ms (prefetched) · jump to an unfetched page → 183 ms (150 ms network)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Label &quot;Showing 21–40 of 120&quot; comes 