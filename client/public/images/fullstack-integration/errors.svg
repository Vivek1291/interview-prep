<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="API errors"><title>API errors</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A receipt-style error note</text><rect x="40" y="75" width="340" height="230" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="194.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="60" y="105" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ &quot;error&quot;: {</text><text x="60" y="132" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;code&quot;: &quot;VALIDATION_ERROR&quot;,</text><text x="60" y="159" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;message&quot;: &quot;Some fields are invalid&quot;,</text><text x="60" y="186" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;details&quot;: [</text><text x="60" y="213" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">      { &quot;field&quot;: &quot;name&quot;,</text><text x="60" y="240" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">        &quot;message&quot;: &quot;min 2 chars&quot; } ],</text><text x="60" y="267" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;requestId&quot;: &quot;377f72fd-…&quot; } }</text><rect x="410" y="75" width="360" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="98.2" font-size="12" text-anchor="middle" fill="#1e293b">VALIDATION_ERROR → message under the field</text><rect x="410" y="122" width="360" height="38" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="590" y="145.2" font-size="12" text-anchor="middle" fill="#1e293b">TOKEN_EXPIRED → refresh once, retry</text><rect x="410" y="169" width="360" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="192.2" font-size="12" text-anchor="middle" fill="#1e293b">403 · 404 · 409 → inline message</text><rect x="410" y="216" width="360" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="239.2" font-size="12" text-anchor="middle" fill="#1e293b">5xx · network → retry ×3, then error state</text><rect x="410" y="263" width="360" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="590" y="286.2" font-size="12" text-anchor="middle" fill="#1e293b">requestId → support finds the log line</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">4xx: 1 attempt · 5xx and network: 3 attempts (measured)</text></svg>