<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="S3 upload"><title>S3 upload</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A signed delivery slip: drive the parcel straight to the warehouse</text><rect x="30" y="90" width="150" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BROWSER</text><text x="105" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700"></text><text x="105" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">avatar.png</text><text x="105" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">2,008 bytes</text><rect x="320" y="70" width="170" height="80" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="405" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">API (office)</text><text x="405" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b">checks type, size</text><text x="405" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b">signs a 60 s slip</text><rect x="320" y="200" width="170" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="405" y="229.2" font-size="12" text-anchor="middle" fill="#1e293b">S3 (warehouse)</text><text x="405" y="244.2" font-size="12" text-anchor="middle" fill="#1e293b">checks the slip:</text><text x="405" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b">type + length</text><rect x="600" y="70" width="170" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="685" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b">confirm: HeadObject</text><text x="685" y="121.7" font-size="12" text-anchor="middle" fill="#1e293b">→ save key in MongoDB</text><line x1="180" y1="115" x2="316" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="248" y="104" font-size="12" text-anchor="middle" fill="#475569">1 presign</text><line x1="180" y1="185" x2="316" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="248" y="228.5" font-size="12" text-anchor="middle" fill="#475569">2 PUT bytes</text><line x1="490" y1="110" x2="596" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="543" y="104" font-size="12" text-anchor="middle" fill="#475569">3 confirm</text><rect x="560" y="200" width="210" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="665" y="229.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">20 × 5 MB uploads</text><text x="665" y="244.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API received 2.5 KB</text><text x="665" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(proxy: 100 MB, 256 MB RAM)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Wrong size or type → 403 from S3 · someone else's key → 403 from the API</text></svg>