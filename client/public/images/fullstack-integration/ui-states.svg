<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Loading, error and empty states"><title>Loading, error and empty states</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Every screen has the same five states</text><rect x="20" y="90" width="140" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">LOADING</text><text x="90" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="90" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">skeleton rows</text><text x="90" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">aria-busy</text><rect x="176" y="90" width="140" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="246" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">ERROR</text><text x="246" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="246" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">message + requestId</text><text x="246" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">Try again</text><rect x="332" y="90" width="140" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="402" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">EMPTY</text><text x="402" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="402" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">explain + action</text><text x="402" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">&quot;Start shopping&quot;</text><rect x="488" y="90" width="140" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="558" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">SUCCESS</text><text x="558" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="558" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b">render the data</text><rect x="644" y="90" width="140" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="714" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">REFRESHING</text><text x="714" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="714" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">keep data visible</text><text x="714" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">thin progress bar</text><rect x="120" y="245" width="560" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="279.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Optimistic ★: flips before the server answers · rolls back on error · invalidates when settled</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">One AsyncView component handles the states for every page</text></svg>