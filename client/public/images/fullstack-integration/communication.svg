<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="React to Node communication"><title>React to Node communication</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One front door: the browser only ever talks to one address</text><rect x="30" y="90" width="170" height="150" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="115" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BROWSER</text><text x="115" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">React app</text><text x="115" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700"></text><text x="115" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">same-origin</text><text x="115" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">security guard</text><rect x="270" y="130" width="170" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="355" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b">front door</text><text x="355" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b">Vite proxy (dev)</text><text x="355" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b">Nginx / CloudFront</text><rect x="510" y="70" width="260" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="640" y="104.2" font-size="12" text-anchor="middle" fill="#1e293b">/ and /assets → React build</text><rect x="510" y="160" width="260" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">/api/* → Express API → MongoDB</text><line x1="200" y1="165" x2="266" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="233" y="157" font-size="12" text-anchor="middle" fill="#475569">same origin</text><line x1="440" y1="150" x2="506" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="440" y1="180" x2="506" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="275" width="740" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="302.2" font-size="12" text-anchor="middle" fill="#1e293b">Different origins (app.example.com → api.example.com): CORS allowlist + credentials + OPTIONS preflight for JSON</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">CORS is a browser rule, not API security: auth and permissions still protect the API</text></svg>