<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Authentication"><title>Authentication</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A wristband for quick entry, a ticket in a locker only the office opens</text><rect x="30" y="80" width="220" height="80" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">ACCESS TOKEN (wristband)</text><text x="140" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">15 min · in memory</text><text x="140" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">Authorization: Bearer</text><rect x="30" y="190" width="220" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="140" y="219.2" font-size="12" text-anchor="middle" fill="#1e293b">REFRESH TOKEN (locker ticket)</text><text x="140" y="234.2" font-size="12" text-anchor="middle" fill="#1e293b">7 days · httpOnly cookie</text><text x="140" y="249.2" font-size="12" text-anchor="middle" fill="#1e293b">Path=/api/v1/auth · rotated</text><rect x="320" y="120" width="200" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="420" y="149.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">expired → 401</text><text x="420" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700"></text><text x="420" y="179.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">ONE refresh call</text><text x="420" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(single flight)</text><text x="420" y="209.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">then retry</text><rect x="580" y="80" width="190" height="80" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="675" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">naive: 5 refreshes</text><text x="675" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">old ticket reused</text><text x="675" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">→ 2 failures</text><rect x="580" y="190" width="190" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="675" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">single flight:</text><text x="675" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">1 refresh, 0 failures</text><line x1="250" y1="120" x2="316" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="250" y1="230" x2="316" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="520" y1="150" x2="576" y2="120" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="520" y1="190" x2="576" y2="225" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">ProtectedRoute: checking → authenticated or redirect to /login · API checks every request</text></svg>