<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Optimize a slow API"><title>Optimize a slow API</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Time each step, run them together, keep a jug ready, pack it small</text><rect x="30" y="80" width="230" height="110" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="145" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">Server-Timing</text><text x="145" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">stats 2.9 ms</text><text x="145" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">recent 2.4 ms</text><text x="145" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">recs 122 ms ← bottleneck</text><rect x="290" y="80" width="220" height="110" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">Promise.all</text><text x="400" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">sequential ≈ sum</text><text x="400" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">parallel ≈ slowest</text><text x="400" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">(220 → 120 ms demo)</text><rect x="540" y="80" width="230" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="655" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Redis cache-aside</text><text x="655" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">miss 124 ms</text><text x="655" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">hit 1.3 ms</text><text x="655" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">30 s TTL, per-user key</text><rect x="160" y="220" width="480" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="254.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">gzip: 15,609 B → 1,321 B (brotli 750 B) for 100 users</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measure first · fix the biggest cost · measure again</text></svg>