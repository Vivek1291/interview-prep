<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A generic function first&lt;T&gt; infers T from each call so the return type follows the input; constraints with extends, defaults, and keyof-based generics"><title>A generic function first&lt;T&gt; infers T from each call so the return type follows the input; constraints with extends, defaults, and keyof-based generics</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Generics: types as parameters</text><rect x="30" y="66" width="360" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="44" y="94.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function first&lt;T&gt;(</text><text x="44" y="109.9" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  items: T[]</text><text x="44" y="125.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">): T | undefined {</text><text x="44" y="140.9" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  return items[0]</text><text x="44" y="156.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><rect x="30" y="196" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="217.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">first([1, 2, 3])</text><line x1="232" y1="213" x2="262" y2="213" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="266" y="196" width="300" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="416" y="217.2" font-size="12" text-anchor="middle" fill="#1e293b">T = number → number | undefined</text><rect x="30" y="238" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">first(['a'])</text><line x1="232" y1="255" x2="262" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="266" y="238" width="300" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="416" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b">T = string → string | undefined</text><rect x="30" y="280" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">first&lt;User&gt;(users)</text><line x1="232" y1="297" x2="262" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="266" y="280" width="300" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="416" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">T = User (explicit)</text><rect x="420" y="66" width="350" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="434" y="103.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">constraint: &lt;T extends { id: string }&gt;</text><text x="434" y="117.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">default:    &lt;T = unknown&gt;</text><text x="434" y="132.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">keyof:      &lt;T, K extends keyof T&gt;</text><text x="434" y="146.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">            (o: T, k: K) =&gt; T[K]</text><rect x="590" y="196" width="180" height="118" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="680" y="229.2" font-size="12" text-anchor="middle" fill="#1e293b">A generic is a type</text><text x="680" y="244.2" font-size="12" text-anchor="middle" fill="#1e293b">PARAMETER: decided</text><text x="680" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b">at each call, keeps</text><text x="680" y="274.2" font-size="12" text-anchor="middle" fill="#1e293b">the link between</text><text x="680" y="289.2" font-size="12" text-anchor="middle" fill="#1e293b">input and output</text><text x="400" y="352" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">any loses the link (input any → output any); generics keep it.</text></svg>