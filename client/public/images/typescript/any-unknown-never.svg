<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="any disables type checking, unknown accepts anything but must be narrowed before use, never represents values that cannot exist"><title>any disables type checking, unknown accepts anything but must be narrowed before use, never represents values that cannot exist</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">any vs unknown vs never</text><rect x="30" y="66" width="240" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="150" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">any</text><text x="150" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">top type, NO checks</text><rect x="30" y="126" width="240" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="175.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">let x: any = JSON.parse(s)</text><text x="44" y="189.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">x.foo.bar()</text><text x="44" y="203.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// compiles, may crash</text><rect x="280" y="66" width="240" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">unknown</text><text x="400" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">top type, SAFE</text><rect x="280" y="126" width="240" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="294" y="175.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">let x: unknown = JSON.parse(s)</text><text x="294" y="189.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">x.foo   // error</text><text x="294" y="203.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">if (isUser(x)) x.name ✓</text><rect x="530" y="66" width="240" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="650" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">never</text><text x="650" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">bottom type: no value</text><rect x="530" y="126" width="240" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="544" y="175.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function fail(m: string): never</text><text x="544" y="189.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">{ throw new Error(m) }</text><text x="544" y="203.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">exhaustive switch checks</text><text x="400" y="280" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Everything is assignable TO unknown, but unknown is assignable only to unknown/any.</text><text x="400" y="304" font-size="12.5" text-anchor="middle" fill="#475569">never is assignable to everything, nothing is assignable to never.</text><text x="400" y="340" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Rule: use unknown for untrusted data (API responses, JSON, catch errors), never use any to silence errors.</text></svg>