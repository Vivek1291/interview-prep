<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An enum compiles to a runtime object and is not supported by type-stripping tools; a union of string literals derived from an as-const array has no runtime cost and accepts plain strings"><title>An enum compiles to a runtime object and is not supported by type-stripping tools; a union of string literals derived from an as-const array has no runtime cost and accepts plain strings</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Enums vs union literal types</text><rect x="30" y="66" width="360" height="140" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="44" y="118.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">enum Role { Admin = 'ADMIN', User = 'USER' }</text><text x="44" y="132.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="146.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// emits a real JS object at run time:</text><text x="44" y="160.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">var Role; (function (Role) { … })(Role ||= {})</text><rect x="410" y="66" width="360" height="140" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="111.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const ROLES = ['ADMIN', 'USER'] as const</text><text x="424" y="125.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">type Role = typeof ROLES[number]</text><text x="424" y="139.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// 'ADMIN' | 'USER'</text><text x="424" y="153.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="424" y="167.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// no extra JS except the array you wrote</text><rect x="30" y="222" width="226" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="143" y="240.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="260" y="222" width="251" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="385.5" y="240.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">enum</text><rect x="515" y="222" width="251" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="640.5" y="240.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">union + as const</text><rect x="30" y="254" width="226" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="143" y="272.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">runtime object</text><rect x="260" y="254" width="251" height="29" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="385.5" y="272.4" font-size="11" text-anchor="middle" fill="#1e293b">yes (numeric enums: reverse map)</text><rect x="515" y="254" width="251" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640.5" y="272.4" font-size="11" text-anchor="middle" fill="#1e293b">only if you keep the array</text><rect x="30" y="286" width="226" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="143" y="304.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">erasable / Node type-stripping</text><rect x="260" y="286" width="251" height="29" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="385.5" y="304.4" font-size="11" text-anchor="middle" fill="#1e293b">✗ not supported</text><rect x="515" y="286" width="251" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640.5" y="304.4" font-size="11" text-anchor="middle" fill="#1e293b">✓</text><rect x="30" y="318" width="226" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="143" y="336.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">iterate values</text><rect x="260" y="318" width="251" height="29" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="385.5" y="336.4" font-size="11" text-anchor="middle" fill="#1e293b">Object.values(Role)</text><rect x="515" y="318" width="251" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640.5" y="336.4" font-size="11" text-anchor="middle" fill="#1e293b">ROLES.map(…)</text><rect x="30" y="350" width="226" height="29" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="143" y="368.4" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">plain strings accepted</text><rect x="260" y="350" width="251" height="29" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="385.5" y="368.4" font-size="11" text-anchor="middle" fill="#1e293b">✗ must use Role.Admin</text><rect x="515" y="350" width="251" height="29" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640.5" y="368.4" font-size="11" text-anchor="middle" fill="#1e293b">✓ 'ADMIN'</text></svg>