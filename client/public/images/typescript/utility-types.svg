<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Partial, Required, Readonly, Pick, Omit, Record, ReturnType, Parameters, Awaited and NonNullable with what they produce and when to use them"><title>Partial, Required, Readonly, Pick, Omit, Record, ReturnType, Parameters, Awaited and NonNullable with what they produce and when to use them</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Built-in utility types</text><rect x="250" y="60" width="300" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="86.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">type User = { id; name; email; age? }</text><rect x="30" y="118" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Partial&lt;User&gt;</text><rect x="224" y="118" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="312" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b">all optional</text><text x="312" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b">(PATCH bodies, forms)</text><rect x="410" y="118" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="505" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Required&lt;User&gt;</text><rect x="604" y="118" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="692" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b">all required</text><text x="692" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b">(after defaults applied)</text><rect x="30" y="170" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="195.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Readonly&lt;User&gt;</text><rect x="224" y="170" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="312" y="188.9" font-size="11" text-anchor="middle" fill="#1e293b">no reassignment</text><text x="312" y="202.9" font-size="11" text-anchor="middle" fill="#1e293b">(state, config)</text><rect x="410" y="170" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="505" y="195.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Pick&lt;User, 'id'|'name'&gt;</text><rect x="604" y="170" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="692" y="188.9" font-size="11" text-anchor="middle" fill="#1e293b">only these keys</text><text x="692" y="202.9" font-size="11" text-anchor="middle" fill="#1e293b">(list items)</text><rect x="30" y="222" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="247.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Omit&lt;User, 'id'&gt;</text><rect x="224" y="222" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="312" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b">all except</text><text x="312" y="254.9" font-size="11" text-anchor="middle" fill="#1e293b">(create payloads)</text><rect x="410" y="222" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="505" y="247.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Record&lt;Role, string[]&gt;</text><rect x="604" y="222" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="692" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b">object from keys</text><text x="692" y="254.9" font-size="11" text-anchor="middle" fill="#1e293b">(lookup tables)</text><rect x="30" y="274" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="299.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">ReturnType&lt;typeof fn&gt;</text><rect x="224" y="274" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="312" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b">a function's result</text><text x="312" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">(infer from code)</text><rect x="410" y="274" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="505" y="299.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Parameters&lt;typeof fn&gt;</text><rect x="604" y="274" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="692" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b">its argument tuple</text><text x="692" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">(wrappers)</text><rect x="30" y="326" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="351.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Awaited&lt;Promise&lt;T&gt;&gt;</text><rect x="224" y="326" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="312" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">unwrap promises</text><text x="312" y="358.9" font-size="11" text-anchor="middle" fill="#1e293b">(async results)</text><rect x="410" y="326" width="190" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="505" y="351.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">NonNullable&lt;T&gt;</text><rect x="604" y="326" width="176" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="692" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">drop null/undefined</text><text x="692" y="358.9" font-size="11" text-anchor="middle" fill="#1e293b">(after checks)</text></svg>