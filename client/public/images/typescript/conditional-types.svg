<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Conditional types choose a type based on extends, infer captures a part of a type like an array element or promise value, and unions distribute over conditional types"><title>Conditional types choose a type based on extends, infer captures a part of a type like an array element or promise value, and unions distribute over conditional types</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Conditional types and infer</text><rect x="140" y="62" width="520" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="89.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">T extends U ? X : Y</text><rect x="40" y="124" width="520" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="300" y="147" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">IsString&lt;&quot;a&quot;&gt;</text><line x1="562" y1="143" x2="590" y2="143" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="594" y="124" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="147.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">true</text><rect x="40" y="168" width="520" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="300" y="191" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">ElementType&lt;string[]&gt;  (T extends (infer E)[] ? E : T)</text><line x1="562" y1="187" x2="590" y2="187" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="594" y="168" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="191.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">string</text><rect x="40" y="212" width="520" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="300" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">UnwrapPromise&lt;Promise&lt;User&gt;&gt;  (infer V)</text><line x1="562" y1="231" x2="590" y2="231" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="594" y="212" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="235.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">User</text><rect x="40" y="256" width="520" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="300" y="279" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Exclude&lt;'a'|'b'|'c', 'a'&gt;  (distributive)</text><line x1="562" y1="275" x2="590" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="594" y="256" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="279.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'b' | 'c'</text><rect x="40" y="300" width="520" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="300" y="323" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">NonNullable&lt;string | null&gt;</text><line x1="562" y1="319" x2="590" y2="319" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="594" y="300" width="170" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="323.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">string</text><text x="400" y="362" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">infer = &quot;capture this part of the type&quot;; unions are checked member by member (distributive).</text></svg>