<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Types are compatible when they have the required members, regardless of names; fresh object literals get excess property checks while variables with extra fields are accepted"><title>Types are compatible when they have the required members, regardless of names; fresh object literals get excess property checks while variables with extra fields are accepted</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Structural typing</text><rect x="30" y="70" width="220" height="80" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">interface Point</text><text x="140" y="121.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ x: number; y: number }</text><rect x="30" y="170" width="220" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">class Vector</text><text x="140" y="221.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ x = 1; y = 2; len() {…} }</text><line x1="252" y1="210" x2="330" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="300" y="160" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">fits</text><rect x="334" y="90" width="200" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="434" y="124.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">draw(p: Point)</text><text x="640" y="90" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Compatible = has the</text><text x="640" y="110" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">required members</text><text x="640" y="140" font-size="12" text-anchor="middle" fill="#475569">names of types do not</text><text x="640" y="158" font-size="12" text-anchor="middle" fill="#475569">matter (unlike Java/C#)</text><rect x="30" y="280" width="360" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="44" y="314.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">draw({ x: 1, y: 2, z: 3 })</text><text x="44" y="329" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">→ error: excess property 'z'</text><text x="44" y="343.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(only for fresh object literals)</text><rect x="410" y="280" width="360" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="424" y="314.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const p3 = { x: 1, y: 2, z: 3 }</text><text x="424" y="329" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">draw(p3)   // OK: extra fields allowed</text><text x="424" y="343.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(variables are not 'fresh')</text></svg>