<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="typeof, in, instanceof, custom type predicates and discriminant switches narrow a union to one member; a never check makes switches exhaustive"><title>typeof, in, instanceof, custom type predicates and discriminant switches narrow a union to one member; a never check makes switches exhaustive</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Narrowing a union with type guards</text><rect x="260" y="62" width="280" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="88.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">value: string | number | User</text><line x1="400" y1="108" x2="94" y2="150" stroke="undefined" stroke-width="2" marker-end="url(#a-#6366f1)"/><rect x="20" y="154" width="150" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="179.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">typeof v === 'string'</text><line x1="95" y1="200" x2="95" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="20" y="230" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="254" font-size="11.5" text-anchor="middle" fill="#1e293b">string</text><line x1="400" y1="108" x2="250" y2="150" stroke="undefined" stroke-width="2" marker-end="url(#a-#10b981)"/><rect x="176" y="154" width="150" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="251" y="179.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'email' in v</text><line x1="251" y1="200" x2="251" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="176" y="230" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="251" y="254" font-size="11.5" text-anchor="middle" fill="#1e293b">User</text><line x1="400" y1="108" x2="406" y2="150" stroke="undefined" stroke-width="2" marker-end="url(#a-#f59e0b)"/><rect x="332" y="154" width="150" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="407" y="179.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">v instanceof Date</text><line x1="407" y1="200" x2="407" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="332" y="230" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="407" y="254" font-size="11.5" text-anchor="middle" fill="#1e293b">Date</text><line x1="400" y1="108" x2="562" y2="150" stroke="undefined" stroke-width="2" marker-end="url(#a-#0ea5e9)"/><rect x="488" y="154" width="150" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="563" y="179.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">isUser(v): v is User</text><line x1="563" y1="200" x2="563" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="488" y="230" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="254" font-size="11.5" text-anchor="middle" fill="#1e293b">User (custom guard)</text><line x1="400" y1="108" x2="718" y2="150" stroke="undefined" stroke-width="2" marker-end="url(#a-#ef4444)"/><rect x="644" y="154" width="150" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="719" y="179.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">switch (shape.kind)</text><line x1="719" y1="200" x2="719" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="644" y="230" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="719" y="254" font-size="11.5" text-anchor="middle" fill="#1e293b">Circle | Square (tag)</text><rect x="60" y="296" width="680" height="76" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="330.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Exhaustiveness: in the default branch write  const _never: never = shape;</text><text x="400" y="346.1" font-size="12.5" text-anchor="middle" fill="#1e293b">Adding a new kind to the union then fails to compile until every switch handles it.</text></svg>