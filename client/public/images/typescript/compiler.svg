<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="tsc scans text into tokens, parses an AST, binds symbols, type-checks and emits JavaScript; measured on 563 files: parse 0.12 s, bind 0.06 s, check 0.38 s"><title>tsc scans text into tokens, parses an AST, binds symbols, type-checks and emits JavaScript; measured on 563 files: parse 0.12 s, bind 0.06 s, check 0.38 s</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How the TypeScript compiler works</text><rect x="30" y="66" width="140" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="90.7" font-size="12" text-anchor="middle" fill="#1e293b">Scanner</text><text x="100" y="105.7" font-size="12" text-anchor="middle" fill="#1e293b">text → tokens</text><line x1="172" y1="94" x2="180" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="182" y="66" width="140" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="252" y="90.7" font-size="12" text-anchor="middle" fill="#1e293b">Parser</text><text x="252" y="105.7" font-size="12" text-anchor="middle" fill="#1e293b">tokens → AST</text><line x1="324" y1="94" x2="332" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="334" y="66" width="140" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="404" y="90.7" font-size="12" text-anchor="middle" fill="#1e293b">Binder</text><text x="404" y="105.7" font-size="12" text-anchor="middle" fill="#1e293b">symbols, scopes</text><line x1="476" y1="94" x2="484" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="486" y="66" width="140" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="556" y="90.7" font-size="12" text-anchor="middle" fill="#1e293b">Checker</text><text x="556" y="105.7" font-size="12" text-anchor="middle" fill="#1e293b">types, errors</text><line x1="628" y1="94" x2="636" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="638" y="66" width="140" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="708" y="90.7" font-size="12" text-anchor="middle" fill="#1e293b">Emitter</text><text x="708" y="105.7" font-size="12" text-anchor="middle" fill="#1e293b">AST → .js / .d.ts</text><text x="400" y="152" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: tsc --extendedDiagnostics on 563 files (500 generated + lib)</text><text x="200" y="184" font-size="12" text-anchor="end" fill="#475569">Parse</text><rect x="210" y="171" width="108" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="326" y="186" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0.12 s</text><text x="200" y="214" font-size="12" text-anchor="end" fill="#475569">Bind</text><rect x="210" y="201" width="54" height="20" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="272" y="216" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0.06 s</text><text x="200" y="244" font-size="12" text-anchor="end" fill="#475569">Check</text><rect x="210" y="231" width="342" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="560" y="246" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0.38 s</text><text x="200" y="274" font-size="12" text-anchor="end" fill="#475569">Emit (noEmit)</text><rect x="210" y="261" width="3" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="221" y="276" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0 s</text><rect x="30" y="296" width="740" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="325.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">AST of  const total: number = items.reduce(...)</text><text x="44" y="339.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">SourceFile → VariableStatement → VariableDeclaration → Identifier(total), NumberKeyword, CallExpression…</text><text x="44" y="353.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Emit drops the NumberKeyword node → const total = items.reduce(...)</text></svg>