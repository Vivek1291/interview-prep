><text x="568" y="326.7" font-size="12" text-anchor="middle" fill="#1e293b">safe for esbuild, swc, Vite</text><rect x="40" y="342" width="330" height="31" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="205" y="361.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">moduleResolution: bundler</text><rect x="376" y="342" width="384" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="568" y="361.7" font-size="12" text-anchor="middle" fill="#1e293b">matches Vite / Next.js imports</text><text x="400" y="386" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">New projects: strict on from day one. Old JS projects: allowJs + checkJs, then tighten file by file.</text></svg>