<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A DataTable&lt;T&gt; component whose columns use keyof T; T is inferred from the rows so invalid column keys are compile errors"><title>A DataTable&lt;T&gt; component whose columns use keyof T; T is inferred from the rows so invalid column keys are compile errors</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Generic React components</text><rect x="30" y="66" width="360" height="180" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="44" y="116.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">type Column&lt;T&gt; = {</text><text x="44" y="131" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  key: keyof T</text><text x="44" y="145.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  header: string</text><text x="44" y="160" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  render?: (row: T) =&gt; ReactNode</text><text x="44" y="174.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><text x="44" y="189" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function DataTable&lt;T&gt;({ rows, columns }:</text><text x="44" y="203.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  { rows: T[]; columns: Column&lt;T&gt;[] })</text><rect x="410" y="66" width="360" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="95.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">&lt;DataTable rows={users}</text><text x="424" y="110" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  columns={[</text><text x="424" y="124.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">    { key: 'email', header: 'Email' }]} /&gt;</text><text x="590" y="170" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">T inferred from rows = User</text><rect x="410" y="186" width="360" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="212.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ key: 'mail' } → error:</text><text x="590" y="227.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'mail' is not assignable to keyof User</text><rect x="30" y="266" width="740" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="305.2" font-size="12" text-anchor="middle" fill="#1e293b">One component, many data types: the column keys, render callbacks and onRowClick all get the</text><text x="400" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">exact row type. Constrain when needed: &lt;T extends { id: string | number }&gt; for stable React keys.</text><text x="400" y="335.2" font-size="12" text-anchor="middle" fill="#1e293b">In .tsx files write &lt;T,&gt; for arrow-function generics so TS does not parse &lt;T&gt; as a JSX tag.</text></svg>