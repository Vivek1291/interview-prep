 stroke-width="2" marker-end="url(#a-slate)"/><rect x="616" y="118" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="696" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">'id' | 'name'</text><rect x="290" y="170" width="300" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="440" y="196" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">(typeof user)['name']</text><line x1="592" y1="192" x2="612" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="616" y="170" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="696" y="195.9" font-size="11" text-anchor="middle" fill="#1e293b">string  (indexed access)</text><rect x="290" y="222" width="300" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="440" y="248" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ [K in keyof U]?: U[K] }</text><line x1="592" y1="244" x2="612" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="616" y="222" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="696" y="247.9" font-size="11" text-anchor="middle" fill="#1e293b">mapped type = Partial&lt;U&gt;</text><rect x="290" y="274" width="300" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="440" y="299.3" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ [K in keyof U as `get${Capitalize&lt;K&gt;}`]… }</text><line x1="592" y1="296" x2="612" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="616" y="274" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="696" y="299.9" font-size="11" text-anchor="middle" fill="#1e293b">remap → getId, getName</text><text x="400" y="352" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">typeof: value → type · keyof: type → union of keys · T[K]: look up a property type · [K in …]: loop over keys</text></svg>