<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Primitive types, structural types like arrays, tuples and object types, and special types any, unknown, never, void and literal types, plus how inference works"><title>Primitive types, structural types like arrays, tuples and object types, and special types any, unknown, never, void and literal types, plus how inference works</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">TypeScript basic types</text><rect x="30" y="64" width="240" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="88.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Primitives</text><rect x="30" y="110" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="129.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">string</text><rect x="30" y="146" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="165.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">number</text><rect x="30" y="182" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="201.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">boolean</text><rect x="30" y="218" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="237.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">bigint</text><rect x="30" y="254" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="273.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">symbol</text><rect x="30" y="290" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="309.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">null / undefined</text><rect x="280" y="64" width="240" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="88.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Structures</text><rect x="280" y="110" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="129.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">number[] / Array&lt;T&gt;</text><rect x="280" y="146" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="165.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[string, number] tuple</text><rect x="280" y="182" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="201.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ id: number; name?: string }</text><rect x="280" y="218" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="237.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">readonly string[]</text><rect x="280" y="254" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="273.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Record&lt;string, T&gt;</text><rect x="530" y="64" width="240" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="88.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Special</text><rect x="530" y="110" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="129.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">any: turns checking off</text><rect x="530" y="146" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="165.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">unknown: must check first</text><rect x="530" y="182" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="201.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">never: impossible value</text><rect x="530" y="218" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="237.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">void: returns nothing</text><rect x="530" y="254" width="240" height="31" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="273.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">literal: 'GET' | 'POST'</text><rect x="30" y="334" width="740" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="355.7" font-size="12" text-anchor="middle" fill="#1e293b">Inference: const n = 5 → number · let s = 'a' → string · const m = 'GET' → 'GET' (literal)</text><text x="400" y="370.7" font-size="12" text-anchor="middle" fill="#1e293b">Annotate parameters and public APIs; let TypeScript infer the rest.</text></svg>