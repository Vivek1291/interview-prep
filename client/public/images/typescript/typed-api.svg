<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A typed fetch checks res.ok and throws a typed ApiError, treats JSON as unknown and validates it with a Zod schema whose inferred type is the static type"><title>A typed fetch checks res.ok and throws a typed ApiError, treats JSON as unknown and validates it with a Zod schema whose inferred type is the static type</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Typing API calls end to end</text><rect x="30" y="66" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="92.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">fetch(url)</text><line x1="272" y1="88" x2="302" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="306" y="66" width="260" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="436" y="92.2" font-size="12" text-anchor="middle" fill="#1e293b">Response</text><line x1="150" y1="112" x2="150" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="118" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="144.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">res.ok?</text><line x1="272" y1="140" x2="302" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="306" y="118" width="260" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="436" y="144.2" font-size="12" text-anchor="middle" fill="#1e293b">no → ApiError(status, body)</text><line x1="150" y1="164" x2="150" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="170" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="196.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await res.json()</text><line x1="272" y1="192" x2="302" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="306" y="170" width="260" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="436" y="196.2" font-size="12" text-anchor="middle" fill="#1e293b">unknown</text><line x1="150" y1="216" x2="150" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="222" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="248.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Schema.safeParse(data)</text><line x1="272" y1="244" x2="302" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="306" y="222" width="260" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="436" y="248.2" font-size="12" text-anchor="middle" fill="#1e293b">success → User (validated)</text><rect x="590" y="66" width="180" height="200" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="604" y="113.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const User = z.object({</text><text x="604" y="127.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  id: z.number(),</text><text x="604" y="141.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  name: z.string(),</text><text x="604" y="155.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">})</text><text x="604" y="169.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">type User =</text><text x="604" y="183.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  z.infer&lt;typeof User&gt;</text><text x="604" y="197.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">→ ONE source for the</text><text x="604" y="211.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  runtime check AND</text><text x="604" y="225.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  the static type</text><rect x="30" y="290" width="740" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Types alone trust the server: res.json() as User compiles even if the API returns { id: &quot;1&quot;, name: null }.</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">Typed errors: a discriminated Result&lt;T&gt; = { ok: true; data: T } | { ok: false; error: ApiError } forces callers</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b">to handle failures; zod errors list exactly which field is wrong.</text></svg>