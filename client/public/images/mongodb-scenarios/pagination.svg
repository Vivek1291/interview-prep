<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pagination"><title>Pagination</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Counting from the start every time vs a bookmark</text><rect x="30" y="75" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b">skip(1,999,980).limit(20)</text><text x="210" y="126.6" font-size="13" text-anchor="middle" fill="#1e293b"></text><text x="210" y="142.6" font-size="13" text-anchor="middle" fill="#1e293b">walk 2,000,000 index entries</text><text x="210" y="158.6" font-size="13" text-anchor="middle" fill="#1e293b">then return 20 → 499 ms</text><rect x="410" y="75" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b">after bookmark (createdAt, _id)</text><text x="590" y="126.6" font-size="13" text-anchor="middle" fill="#1e293b"></text><text x="590" y="142.6" font-size="13" text-anchor="middle" fill="#1e293b">seek in the index, read 20</text><text x="590" y="158.6" font-size="13" text-anchor="middle" fill="#1e293b">→ 1.2 ms at any depth</text><line x1="40" y1="260" x2="760" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="60" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="138" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="216" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="294" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="372" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="450" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="528" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="606" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="684" y="225" width="56" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="528" y="225" width="56" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="556" y="215" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">🔖 cursor</text><path d="M70 290 Q305 260 540 290" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="300" y="322" font-size="12" text-anchor="middle" fill="#ef4444">skip: counted every time</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">countDocuments 370 ms vs estimatedDocumentCount 0.6 ms on 2M users</text></svg>