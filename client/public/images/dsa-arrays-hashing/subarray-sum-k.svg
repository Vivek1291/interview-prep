fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="560" y="360" width="70" height="22" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="595" y="375.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="630" y="360" width="60" height="22" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="660" y="375.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="60" y="290" font-size="13" text-anchor="start" fill="#475569" font-weight="700">sum(i..j) = prefix[j] − prefix[i − 1]</text><text x="60" y="314" font-size="13" text-anchor="start" fill="#475569">We want that to equal k, so look up</text><text x="60" y="334" font-size="13" text-anchor="start" fill="#475569">prefix[j] − k in a map of earlier prefixes.</text><text x="60" y="364" font-size="13" text-anchor="start" fill="#ef4444" font-weight="700">Start the map with {0: 1} (the empty prefix).</text></svg>