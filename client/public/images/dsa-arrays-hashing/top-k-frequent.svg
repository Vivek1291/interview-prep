<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Buckets indexed by frequency; walking from the top gives 1 then 2"><title>Buckets indexed by frequency; walking from the top gives 1 then 2</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Top K Frequent Elements: bucket by frequency</text><text x="400" y="66" font-size="14" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">nums = [1,1,1,2,2,3], k = 2   →   counts: 1→3, 2→2, 3→1</text><rect x="70" y="130" width="85" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="112.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="112" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 0</text><rect x="165" y="130" width="85" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="207.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">[3]</text><text x="207" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 1</text><rect x="260" y="130" width="85" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">[2]</text><text x="302" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 2</text><rect x="355" y="130" width="85" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="397.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">[1]</text><text x="397" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 3</text><rect x="450" y="130" width="85" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="492.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="492" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 4</text><rect x="545" y="130" width="85" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="587.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="587" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 5</text><rect x="640" y="130" width="85" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="682.5" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="682" y="210" font-size="12" text-anchor="middle" fill="#475569">freq 6</text><text x="400" y="115" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">bucket[freq] = numbers that appear exactly freq times</text><line x1="690" y1="250" x2="110" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="244" font-size="12" text-anchor="middle" fill="#475569">walk from the highest frequency down, collect until k</text><rect x="320" y="285" width="160" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="309.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">answer [1, 2] ✅</text><text x="400" y="360" font-size="13" text-anchor="middle" fill="#475569">Buckets: O(n) · Min-heap of size k: O(n log k) · Sort by count: O(n log n)</text></svg>