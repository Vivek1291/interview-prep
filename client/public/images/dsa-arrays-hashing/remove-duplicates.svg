iddle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="440" y="100" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="466" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="466" y="159" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="492" y="100" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="518" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="518" y="159" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><rect x="544" y="100" width="52" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="570" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="570" y="159" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><line x1="362" y1="190" x2="362" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="362" y="206" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">write</text><line x1="570" y1="190" x2="570" y2="166" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="570" y="206" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">read</text><text x="400" y="74" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">original: [0, 0, 1, 1, 1, 2, 2, 3]</text><text x="400" y="270" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">Sorted ⇒ duplicates sit next to each other.</text><text x="400" y="296" font-size="13" text-anchor="middle" fill="#475569">If nums[read] differs from the last kept value nums[write − 1], copy it to write and move write.</text><text x="400" y="330" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Answer k = write = 4 → first 4 slots are [0, 1, 2, 3]</text></svg>