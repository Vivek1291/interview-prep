<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="In babad, expanding from center a gives bab"><title>In babad, expanding from center a gives bab</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Longest Palindromic Substring: expand around the center</text><rect x="270" y="110" width="56" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="298" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><text x="298" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="326" y="110" width="56" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="354" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="354" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="382" y="110" width="56" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="410" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><text x="410" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="438" y="110" width="56" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="466" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="466" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="494" y="110" width="56" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="522" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">d</text><text x="522" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="354" y="92" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">center</text><path d="M336 180 Q313 210 290 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><path d="M372 180 Q395 210 418 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="230" font-size="13" text-anchor="middle" fill="#475569">Expand while s[l] === s[r]: &quot;a&quot; → &quot;bab&quot; (b = b) → stop (out of bounds)</text><text x="400" y="256" font-size="13" text-anchor="middle" fill="#475569">Try every center: n letters (odd length) + n − 1 gaps (even length, e.g. &quot;abba&quot;)</text><text x="400" y="300" font-size="14" text-anchor="middle" fill="#6366f1" font-weight="700">Answer: &quot;bab&quot; (or &quot;aba&quot;) · O(n²) time, O(1) space</text></svg>