<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Bar chart of prices 7 1 5 3 6 4; buy at 1 on day 2, sell at 6 on day 5 for profit 5"><title>Bar chart of prices 7 1 5 3 6 4; buy at 1 on day 2, sell at 6 on day 5 for profit 5</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Best Time to Buy and Sell Stock</text><text x="400" y="54" font-size="13" text-anchor="middle" fill="#475569">Remember the cheapest day so far; every later day asks &quot;what if I sell today?&quot;</text><rect x="70" y="120" width="60" height="210" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="112" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><text x="100" y="348" font-size="12" text-anchor="middle" fill="#475569">day 1</text><rect x="160" y="300" width="60" height="30" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="190" y="292" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><text x="190" y="348" font-size="12" text-anchor="middle" fill="#475569">day 2</text><rect x="250" y="180" width="60" height="150" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="280" y="172" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><text x="280" y="348" font-size="12" text-anchor="middle" fill="#475569">day 3</text><rect x="340" y="240" width="60" height="90" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="370" y="232" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><text x="370" y="348" font-size="12" text-anchor="middle" fill="#475569">day 4</text><rect x="430" y="150" width="60" height="180" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="460" y="142" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">6</text><text x="460" y="348" font-size="12" text-anchor="middle" fill="#475569">day 5</text><rect x="520" y="210" width="60" height="120" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="550" y="202" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><text x="550" y="348" font-size="12" text-anchor="middle" fill="#475569">day 6</text><line x1="50" y1="330" x2="610" y2="330" stroke="#64748b" stroke-width="2"/><text x="190" y="370" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">BUY here (min so far = 1)</text><line x1="190" y1="288" x2="460" y2="138" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-indigo)"/><text x="460" y="116" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">SELL → profit 6 − 1 = 5</text><text x="705" y="130" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Scan once:</text><text x="705" y="154" font-size="12" text-anchor="middle" fill="#475569">minPrice = min so far</text><text x="705" y="174" font-size="12" text-anchor="middle" fill="#475569">profit = price − min</text><text x="705" y="194" font-size="12" text-anchor="middle" fill="#475569">best = max profit</text></svg>