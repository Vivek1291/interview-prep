<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Array 2 7 11 15, at index 1 we need 2, the map already has 2 at index 0, so return 0 and 1"><title>Array 2 7 11 15, at index 1 we need 2, the map already has 2 at index 0, so return 0 and 1</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Two Sum: look up the partner in a hash map</text><text x="50" y="137" font-size="13" text-anchor="end" fill="#475569" font-weight="700">nums</text><rect x="60" y="110" width="52" height="44" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="86" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="86" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="112" y="110" width="52" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="138" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><text x="138" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="164" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">11</text><text x="190" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="216" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="242" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">15</text><text x="242" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><line x1="138" y1="200" x2="138" y2="176" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="138" y="216" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">i = 1</text><text x="165" y="92" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">target = 9</text><rect x="300" y="105" width="200" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="128.6" font-size="13" text-anchor="middle" fill="#1e293b">need = 9 − 7 = 2</text><text x="400" y="144.6" font-size="13" text-anchor="middle" fill="#1e293b">is 2 in the map?</text><line x1="272" y1="132" x2="298" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="630" y="102" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">map (seen so far)</text><rect x="560" y="110" width="70" height="28" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="595" y="128.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">value</text><rect x="630" y="110" width="70" height="28" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="665" y="128.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">index</text><rect x="560" y="138" width="70" height="28" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="595" y="156.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="630" y="138" width="70" height="28" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="665" y="156.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><line x1="500" y1="140" x2="556" y2="158" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="528" y="182" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">yes → index 0</text><rect x="560" y="200" width="140" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="630" y="224.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">return [0, 1] ✅</text><text x="400" y="290" font-size="14" text-anchor="middle" fill="#475569">One pass: for each number, first LOOK UP its partner (target − x), then STORE x → index.</text><text x="400" y="314" font-size="13" text-anchor="middle" fill="#475569">Checking before storing means a number can never pair with itself.</text><text x="400" y="350" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Brute force: check every pair → n²/2 checks.   Hash map: 1 lookup per number → n checks.</text></svg>