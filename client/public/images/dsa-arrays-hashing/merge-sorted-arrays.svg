f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Merge Sorted Array: three pointers from the back</text><text x="140" y="117" font-size="13" text-anchor="end" fill="#475569" font-weight="700">nums1</text><rect x="150" y="90" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="176" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="176" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="202" y="90" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="228" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="228" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="254" y="90" width="52" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="280" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="280" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="306" y="90" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="332" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><text x="332" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="358" y="90" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="384" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><text x="384" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="410" y="90" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="436" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><text x="436" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><line x1="280" y1="180" x2="280" y2="156" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="280" y="196" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">i</text><line x1="384" y1="180" x2="384" y2="156" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="384" y="196" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">k</text><text x="140" y="267" font-size="13" text-anchor="end" fill="#475569" font-weight="700">nums2</text><rect x="150" y="240" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="176" y="267.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="176" y="299" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="202" y="240" width="52" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="228" y="267.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="228" y="299" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="254" y="240" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="280" y="267.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><text x="280" y="299" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><line x1="228" y1="330" x2="228" y2="306" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="228" y="346" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">j</text><text x="560" y="110" font-size="13" text-anchor="start" fill="#475569">Compare nums1[i]=3 and nums2[j]=5</text><text x="560" y="132" font-size="13" text-anchor="start" fill="#475569">bigger (5) goes to slot k, from the BACK</text><text x="560" y="160" font-size="13" text-anchor="start" fill="#10b981" font-weight="700">Filling from the back never</text><text x="560" y="178" font-size="13" text-anchor="start" fill="#10b981" font-weight="700">overwrites unread numbers.</text><text x="400" y="370" font-size="13" text-anchor="middle" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Result: [1, 2, 2, 3, 5, 6]   ·   O(m + n) time, O(1) extra space</text></svg>