32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How to approach any DSA problem</text><rect x="22" y="80" width="84" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="64" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1 Clarify</text><line x1="106" y1="108" x2="117" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="118" y="80" width="84" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="160" y="104.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">2 Brute</text><text x="160" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">force</text><line x1="202" y1="108" x2="213" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="214" y="80" width="84" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="256" y="104.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">3 Find</text><text x="256" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">bottleneck</text><line x1="298" y1="108" x2="309" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="310" y="80" width="84" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="352" y="104.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">4 Optimise</text><text x="352" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(pattern)</text><line x1="394" y1="108" x2="405" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="406" y="80" width="84" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="448" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">5 Code</text><line x1="490" y1="108" x2="501" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="502" y="80" width="84" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="544" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">6 Test</text><line x1="586" y1="108" x2="597" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="598" y="80" width="84" height="56" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="640" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">7 Time</text><line x1="682" y1="108" x2="693" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="694" y="80" width="84" height="56" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="736" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">8 Space</text><text x="400" y="170" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Pattern triggers: what you SEE in the problem → which tool to reach for</text><rect x="30" y="190" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="135" y="212.2" font-size="12" text-anchor="middle" fill="#1e293b">fast lookup / &quot;seen before?&quot;</text><line x1="240" y1="208" x2="262" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="264" y="190" width="130" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="329" y="212.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Hash map / Set</text><rect x="410" y="190" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="515" y="212.2" font-size="12" text-anchor="middle" fill="#1e293b">sorted + pair relation</text><line x1="620" y1="208" x2="642" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="644" y="190" width="130" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="709" y="212.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Two pointers</text><rect x="30" y="238" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="135" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b">longest/shortest contiguous</text><line x1="240" y1="256" x2="262" y2="256" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="264" y="238" width="130" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="329" y="260.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Sliding window</text><rect x="410" y="238" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="515" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b">subarray sum = k</text><line x1="620" y1="256" x2="642" y2="256" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="644" y="238" width="130" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="709" y="260.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Prefix sum + map</text><rect x="30" y="286" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="135" y="308.2" font-size="12" text-anchor="middle" fill="#1e293b">next greater / warmer</text><line x1="240" y1="304" x2="262" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="264" y="286" width="130" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="329" y="308.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Monotonic stack</text><rect x="410" y="286" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="515" y="308.2" font-size="12" text-anchor="middle" fill="#1e293b">sorted / &quot;min speed that works&quot;</text><line x1="620" y1="304" x2="642" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="644" y="286" width="130" height="36" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="709" y="308.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Binary search</text><rect x="30" y="334" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="135" y="356.2" font-size="12" text-anchor="middle" fill="#1e293b">top K / median</text><line x1="240" y1="352" x2="262" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="264" y="334" width="130" height="36" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="329" y="356.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Heap</text><rect x="410" y="334" width="210" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="515" y="356.2" font-size="12" text-anchor="middle" fill="#1e293b">grid / graph / dependencies</text><line x1="620" y1="352" x2="642" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="644" y="334" width="130" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="709" y="356.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">BFS / DFS</text></svg>