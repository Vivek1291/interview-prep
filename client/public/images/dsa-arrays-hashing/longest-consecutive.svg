<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Set of numbers; 1 is a start and counts up to 4, length 4"><title>Set of numbers; 1 is a start and counts up to 4, length 4</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Longest Consecutive Sequence: only count from starts</text><text x="400" y="70" font-size="14" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">nums = [100, 4, 200, 1, 3, 2]   →   put all in a Set</text><circle cx="100" cy="160" r="24" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="100" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="170" cy="160" r="24" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="170" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="240" cy="160" r="24" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="240" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="310" cy="160" r="24" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="310" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><circle cx="520" cy="160" r="24" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="520" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">100</text><circle cx="640" cy="160" r="24" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="640" y="165" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">200</text><line x1="125" y1="160" x2="143" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><line x1="195" y1="160" x2="213" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><line x1="265" y1="160" x2="283" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><text x="205" y="215" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">length 4 ✅</text><text x="520" y="215" font-size="13" text-anchor="middle" fill="#475569">length 1</text><text x="640" y="215" font-size="13" text-anchor="middle" fill="#475569">length 1</text><rect x="100" y="259" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="120" y="271" font-size="12" text-anchor="start" fill="#475569">sequence START: n − 1 is NOT in the set → count upward</text><rect x="100" y="279" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="291" font-size="12" text-anchor="start" fill="#475569">not a start: skip it (someone else counts it)</text><text x="400" y="350" font-size="14" text-anchor="middle" fill="#6366f1" font-weight="700">Each number is touched at most twice → O(n), no sorting needed.</text></svg>