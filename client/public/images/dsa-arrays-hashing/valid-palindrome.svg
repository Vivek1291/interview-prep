<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Left and right pointers compare lowercase letters while skipping spaces and commas"><title>Left and right pointers compare lowercase letters while skipping spaces and commas</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Valid Palindrome: two pointers, skip non-alphanumerics</text><rect x="60" y="110" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="86" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><text x="86" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="112" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="138" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">␣</text><text x="138" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="164" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">m</text><text x="190" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="216" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="242" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="242" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="268" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="294" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">n</text><text x="294" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="320" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="346" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">,</text><text x="346" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="372" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="398" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">␣</text><text x="398" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><rect x="424" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="450" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="450" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><rect x="476" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="502" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">␣</text><text x="502" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="528" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="554" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">p</text><text x="554" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">9</text><rect x="580" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="606" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">l</text><text x="606" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><rect x="632" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="658" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="658" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">11</text><rect x="684" y="110" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="710" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">n</text><text x="710" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><line x1="86" y1="200" x2="86" y2="176" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="86" y="216" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">l</text><line x1="710" y1="200" x2="710" y2="176" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="710" y="216" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">r</text><text x="400" y="80" font-size="14" text-anchor="middle" fill="#475569">Two pointers walk inward, skipping anything that is not a letter or digit</text><text x="400" y="260" font-size="13" text-anchor="middle" fill="#475569">&quot;A&quot; vs &quot;n&quot;? Compare lowercase: a ≠ n → this short prefix is NOT a palindrome.</text><text x="400" y="286" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">Full input &quot;A man, a plan, a canal: Panama&quot; → &quot;amanaplanacanalpanama&quot; → palindrome ✅</text><text x="400" y="330" font-size="14" text-anchor="middle" fill="#6366f1" font-weight="700">No cleaned copy is built → O(1) extra space.</text></svg>