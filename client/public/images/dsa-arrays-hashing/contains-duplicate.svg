<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Array 1 2 3 1; the set already holds 1 2 3, so the second 1 is a duplicate"><title>Array 1 2 3 1; the set already holds 1 2 3, so the second 1 is a duplicate</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Contains Duplicate: a Set as a guest list</text><text x="70" y="147" font-size="13" text-anchor="end" fill="#475569" font-weight="700">nums</text><rect x="80" y="120" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="106" y="147.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="106" y="179" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="132" y="120" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="158" y="147.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="158" y="179" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="184" y="120" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="147.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="210" y="179" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="236" y="120" width="52" height="44" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="262" y="147.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="262" y="179" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><line x1="262" y1="210" x2="262" y2="186" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="262" y="226" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">current</text><text x="400" y="92" font-size="14" text-anchor="middle" fill="#1e293b">Walk left → right, remember every value in a Set (a &quot;guest list&quot;)</text><rect x="420" y="110" width="300" height="64" rx="30" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="570" y="194" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">seen = Set</text><circle cx="480" cy="142" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="480" y="147" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="570" cy="142" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="570" y="147" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="660" cy="142" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="660" y="147" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><path d="M318 140 Q387 105 456 150" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="387" y="117" font-size="12" text-anchor="middle" fill="#475569">1 is already in the Set!</text><rect x="450" y="220" width="240" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="570" y="245.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">return true (duplicate) ✅</text><text x="400" y="300" font-size="14" text-anchor="middle" fill="#475569">Set.has() and Set.add() are O(1) on average → the whole scan is O(n).</text><text x="400" y="326" font-size="13" text-anchor="middle" fill="#475569">If we reach the end without a hit → return false.</text></svg>