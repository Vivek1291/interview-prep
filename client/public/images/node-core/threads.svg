<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Threads inside Node"><title>Threads inside Node</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One JS thread, but many threads in the process</text><rect x="30" y="65" width="740" height="270" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="50" y="88" font-size="13" text-anchor="start" fill="#475569" font-weight="700">Node.js process</text><rect x="60" y="110" width="200" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="133.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Main thread</text><text x="160" y="149.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">V8 + event loop</text><text x="160" y="165.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">YOUR JavaScript</text><rect x="330" y="110" width="85" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="372.5" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">fs</text><rect x="425" y="110" width="85" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="467.5" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">crypto</text><rect x="520" y="110" width="85" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="562.5" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">zlib</text><rect x="615" y="110" width="85" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="657.5" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">dns.lookup</text><text x="518" y="175" font-size="12" text-anchor="middle" fill="#8b5cf6" font-weight="700">libuv thread pool (UV_THREADPOOL_SIZE = 4)</text><rect x="330" y="200" width="370" height="44" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="515" y="226.6" font-size="13" text-anchor="middle" fill="#1e293b">OS async sockets: epoll / kqueue / IOCP (no pool)</text><rect x="60" y="220" width="200" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="160" y="246.6" font-size="13" text-anchor="middle" fill="#1e293b">V8 GC + compiler threads</text><rect x="330" y="268" width="370" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="515" y="294.6" font-size="13" text-anchor="middle" fill="#1e293b">worker_threads: your CPU-heavy JS (own V8 isolate)</text><line x1="260" y1="132" x2="325" y2="132" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><line x1="260" y1="160" x2="325" y2="220" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><line x1="260" y1="175" x2="325" y2="285" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured: 8 parallel pbkdf2 → 372 ms with 1 pool thread, 88 ms with 4, 55 ms with 8</text></svg>