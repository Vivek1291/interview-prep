<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Priority ladder"><title>Priority ladder</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Who runs first after the current code?</text><rect x="250" y="66" width="300" height="44" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="400" y="92.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">1 process.nextTick</text><text x="562" y="93" font-size="12" text-anchor="start" fill="#475569">all of them, before promises</text><rect x="235" y="120" width="330" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="146.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">2 Promise.then / queueMicrotask</text><text x="577" y="147" font-size="12" text-anchor="start" fill="#475569">all microtasks</text><rect x="220" y="174" width="360" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="200.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">3 timers: setTimeout(fn, 0)</text><text x="592" y="201" font-size="12" text-anchor="start" fill="#475569">next timers phase, ≥ 1 ms</text><rect x="220" y="228" width="360" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="254.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">4 poll: I/O callbacks</text><text x="592" y="255" font-size="12" text-anchor="start" fill="#475569">file, DB, HTTP done</text><rect x="220" y="282" width="360" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="308.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">5 check: setImmediate</text><text x="592" y="309" font-size="12" text-anchor="start" fill="#475569">right after poll</text><text x="150" y="90" font-size="13" text-anchor="middle" fill="#ec4899" font-weight="700">microtasks</text><text x="150" y="230" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">event loop</text><text x="150" y="246" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">phases</text><text x="400" y="368" font-size="12" t