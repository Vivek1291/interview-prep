<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Node architecture"><title>Node architecture</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Node.js = V8 + libuv + core modules</text><rect x="250" y="70" width="300" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="94.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Your app (Express routes, services)</text><rect x="250" y="125" width="300" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="149.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Core modules: http, fs, crypto, stream, events</text><rect x="250" y="180" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="201.6" font-size="13" text-anchor="middle" fill="#1e293b">C++ bindings</text><rect x="250" y="228" width="140" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="320" y="252.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">V8</text><text x="320" y="268.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">JIT + heap + GC</text><rect x="410" y="228" width="140" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="480" y="252.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">libuv</text><text x="480" y="268.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">event loop + pool</text><rect x="250" y="300" width="300" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="321.6" font-size="13" text-anchor="middle" fill="#1e293b">Operating system: files, sockets</text><rect x="40" y="150" width="150" height="120" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="115" y="198.6" font-size="13" text-anchor="middle" fill="#1e293b">10,000 clients</text><text x="115" y="214.6" font-size="13" text-anchor="middle" fill="#1e293b">mostly WAITING</text><text x="115" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b">on the network</text><line x1="190" y1="210" x2="245" y2="210" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><rect x="610" y="150" width="150" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="685" y="190.6" font-size="13" text-anchor="middle" fill="#1e293b">Good for:</text><text x="685" y="206.6" font-size="13" text-anchor="middle" fill="#1e293b">APIs, real time,</text><text x="685" y="222.6" font-size="13" text-anchor="middle" fill="#1e293b">streaming, BFF,</text><text x="685" y="238.6" font-size="13" text-anchor="middle" fill="#1e293b">serverless</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Weak spot: CPU-heavy work on the main thread → worker threads / queues</text></svg>