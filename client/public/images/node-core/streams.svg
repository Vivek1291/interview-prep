w, backpressure slows the source</text><rect x="20" y="160" width="130" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="85" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Readable</text><text x="85" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">big.csv (2 GB)</text><rect x="220" y="160" width="130" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="285" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Transform</text><text x="285" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">parse CSV</text><rect x="420" y="160" width="130" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="485" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Transform</text><text x="485" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">gzip</text><rect x="620" y="160" width="150" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="695" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Writable</text><text x="695" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP response</text><rect x="160" y="120" width="44" height="26" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="182" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">64K</text><rect x="360" y="120" width="44" height="26" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="382" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">64K</text><rect x="560" y="120" width="44" height="26" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="582" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">64K</text><line x1="150" y1="190" x2="215" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="350" y1="190" x2="415" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="550" y1="190" x2="615" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><path d="M695 224 Q390 304 85 224" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/><text x="390" y="282" font-size="12" text-anchor="middle" fill="#475569">write() returned false → pause until drain</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured: hashing a 300 MB file peaked at 337 MB (readFile) vs ~110 MB (stream)</text></svg>