<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Event loop diagram"><title>Event loop diagram</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The event loop: one JS thread, many waiting operations</text><line x1="80" y1="130" x2="80" y2="197" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="140" y1="230" x2="227" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="183.5" y="224" font-size="11" text-anchor="middle" fill="#475569">async call</text><line x1="380" y1="230" x2="467" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="423.5" y="224" font-size="11" text-anchor="middle" fill="#475569">done → callback</text><line x1="620" y1="230" x2="657" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="620" y1="105" x2="720" y2="197" stroke="#ec4899" stroke-width="2" marker-end="url(#a-pink)"/><text x="710" y="145" font-size="11" text-anchor="middle" fill="#475569">after every callback</text><rect x="20" y="80" width="120" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="80" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Your JS code</text><rect x="20" y="200" width="120" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="80" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Call stack</text><text x="80" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(one thread)</text><rect x="230" y="200" width="150" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="305" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">libuv: OS async I/O</text><text x="305" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">+ thread pool (4)</text><rect x="470" y="200" width="150" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="545" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Phase queues:</text><text x="545" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">timers, poll, check</text><rect x="470" y="80" width="150" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="545" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Microtasks:</text><text x="545" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">nextTick, Promises</text><rect x="660" y="200" width="120" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="720" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Event loop:</text><text x="720" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">stack empty?</text><path d="M720 262 Q400 332 80 262" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="315" font-size="12" text-anchor="middle" fill="#475569">run next callback on the stack</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Order: sync → nextTick → promises → timers → I/O (poll) → setImmediate (check) → close</text></svg>