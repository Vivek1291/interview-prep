<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Error flow"><title>Error flow</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Where async errors go</text><line x1="140" y1="135" x2="172" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="156" y="125" font-size="11" text-anchor="middle" fill="#475569">throw</text><line x1="295" y1="135" x2="327" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="450" y1="135" x2="482" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="605" y1="135" x2="657" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="631" y="125" font-size="11" text-anchor="middle" fill="#475569">next(err)</text><line x1="450" y1="273" x2="557" y2="273" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="503.5" y="263" font-size="11" text-anchor="middle" fill="#475569">escapes</text><rect x="20" y="110" width="120" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="80" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">DB rejects</text><text x="80" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(timeout)</text><rect x="175" y="110" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="235" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">repository</text><text x="235" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">await</text><rect x="330" y="110" width="120" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="390" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">service</text><text x="390" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">wrap + rethrow</text><rect x="485" y="110" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="545" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">route</text><text x="545" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">asyncHandler</text><rect x="660" y="110" width="120" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="720" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">error</text><text x="720" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">middleware</text><rect x="300" y="250" width="150" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="375" y="277.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">missing await</text><rect x="560" y="250" width="200" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="660" y="269.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">unhandledRejection</text><text x="660" y="284.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">→ process exits</text><text x="720" y="200" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">503 JSON</text><line x1="720" y1="162" x2="720" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="80" y="270" font-size="12" text-anchor="middle" fill="#475569">try/catch can only</text><text x="80" y="286" font-size="12" text-anchor="middle" fill="#475569">catch AWAITED promises</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">await turns a rejection into a throw → try/catch, finally for cleanup</text></svg>