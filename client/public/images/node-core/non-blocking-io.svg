<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Blocking vs non-blocking timeline"><title>Blocking vs non-blocking timeline</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Blocking vs non-blocking: what the one JS thread does</text><text x="400" y="70" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="700">Blocking (readFileSync / pbkdf2Sync)</text><text x="30" y="107" font-size="13" text-anchor="start" fill="#1e293b" font-weight="700">JS thread</text><rect x="150" y="85" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="180" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b">req A</text><rect x="210" y="85" width="260" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="340" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b">WAITING for disk / CPU</text><rect x="470" y="85" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="500" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b">req B</text><rect x="530" y="85" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="560" y="106.2" font-size="12" text-anchor="middle" fill="#1e293b">req C</text><text x="570" y="140" font-size="12" text-anchor="start" fill="#ef4444">B and C waited ~345 ms</text><text x="400" y="190" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">Non-blocking (readFile / pbkdf2 callback)</text><text x="30" y="227" font-size="13" text-anchor="start" fill="#1e293b" font-weight="700">JS thread</text><rect x="150" y="205" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="180" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">req A</text><rect x="210" y="205" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="240" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">req B</text><rect x="270" y="205" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="300" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">req C</text><rect x="450" y="205" width="80" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="490" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">A callback</text><text x="30" y="277" font-size="13" text-anchor="start" fill="#1e293b" font-weight="700">libuv / OS</text><rect x="210" y="255" width="240" height="34" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="330" y="276.2" font-size="12" text-anchor="middle" fill="#1e293b">reading / hashing in background</text><text x="550" y="230" font-size="12" text-anchor="start" fill="#10b981">B and C answered in ~3 ms</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Measured: /health latency next to 4 heavy requests: 345 ms (sync) vs 3 ms (async)</text></svg>