<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Event loop phases"><title>Event loop phases</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One loop iteration: six phases, microtasks after every callback</text><rect x="338" y="70" width="124" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="94.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1 timers</text><text x="475" y="87.8" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><rect x="446.3" y="127.5" width="124" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="508.3" y="152.1" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">2 pending</text><text x="550" y="209" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><rect x="446.3" y="242.5" width="124" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="508.3" y="267.1" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">3 idle/prepare</text><text x="475" y="330.2" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><rect x="338" y="300" width="124" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="324.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">4 poll (I/O)</text><text x="325" y="330.2" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><rect x="229.7" y="242.5" width="124" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="291.7" y="267.1" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">5 check</text><text x="250" y="209" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><rect x="229.7" y="127.5" width="124" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="291.7" y="152.1" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">6 close</text><text x="325" y="87.8" font-size="12" text-anchor="middle" fill="#ec4899" font-weight="700">⟳ μ</text><circle cx="400" cy="205" r="46" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="400" y="210" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">tick</text><text x="250" y="88" font-size="12" text-anchor="end" fill="#f59e0b">setTimeout, setInterval →</text><text x="160" y="320" font-size="12" text-anchor="start" fill="#10b981">← setImmediate</text><text x="545" y="330" font-size="12" text-anchor="start" fill="#6366f1">← file / DB / HTTP callbacks</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">⟳ μ = drain process.nextTick queue, then the Promise queue</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Inside an I/O callback, check (setImmediate) always runs before the next timers phase</text></svg>