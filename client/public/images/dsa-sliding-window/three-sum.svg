<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Sorted array; i fixed at -1, l at -1, r at 2 gives sum 0"><title>Sorted array; i fixed at -1, l at -1, r at 2 gives sum 0</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">3Sum: sort, fix one number, two pointers for the pair</text><text x="400" y="74" font-size="14" text-anchor="middle" fill="#475569">sorted nums = [-4, -1, -1, 0, 1, 2]   ·   fix i, then two pointers on the rest</text><rect x="170" y="110" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-4</text><text x="205" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="240" y="110" width="70" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="275" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text><text x="275" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="310" y="110" width="70" height="44" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="345" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text><text x="345" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="380" y="110" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="415" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><text x="415" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="450" y="110" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="485" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="485" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="520" y="110" width="70" height="44" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="555" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="555" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><line x1="275" y1="200" x2="275" y2="176" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="275" y="216" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">i (fixed)</text><line x1="345" y1="200" x2="345" y2="176" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="345" y="216" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">l</text><line x1="555" y1="200" x2="555" y2="176" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="555" y="216" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">r</text><rect x="230" y="270" width="340" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="294.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">-1 + (-1) + 2 = 0  →  triplet [-1, -1, 2] ✅</text><text x="400" y="340" font-size="12" text-anchor="middle" fill="#475569">sum &lt; 0 → l++ (need bigger)   ·   sum &gt; 0 → r-- (need smaller)   ·   skip equal neighbours to avoid duplicates</text></svg>