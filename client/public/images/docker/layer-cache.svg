<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured rebuild after a code change 5.2 s when copying everything before npm install vs 0.8 s when copying package files first; build context 106.9 MB without .dockerignore vs 96 kB with it"><title>Measured rebuild after a code change 5.2 s when copying everything before npm install vs 0.8 s when copying package files first; build context 106.9 MB without .dockerignore vs 96 kB with it</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Layer caching and .dockerignore (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: TypeScript + Express app, code change then rebuild (BuildKit, Docker 29)</text><text x="290" y="91" font-size="11.5" text-anchor="end" fill="#475569">COPY . . then npm install</text><rect x="300" y="74" width="176.8" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="482.8" y="91" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">5.2 s: every code change reinstalls deps</text><text x="290" y="127" font-size="11.5" text-anchor="end" fill="#475569">COPY package*.json, npm ci, COPY src</text><rect x="300" y="110" width="27.2" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="333.2" y="127" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.8 s: deps layer reused from cache</text><text x="400" y="170" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: build context sent to the builder</text><text x="290" y="201" font-size="11.5" text-anchor="end" fill="#475569">no .dockerignore (node_modules + .git)</text><rect x="300" y="184" width="342.08" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="648.08" y="201" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">106.9 MB</text><text x="290" y="237" font-size="11.5" text-anchor="end" fill="#475569">with .dockerignore</text><rect x="300" y="220" width="3" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="309" y="237" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.1 MB (96 kB)</text><rect x="30" y="270" width="740" height="106" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="312.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Each instruction = one cached layer. If a layer changes, every layer AFTER it is rebuilt.</text><text x="400" y="327" font-size="11.5" text-anchor="middle" fill="#1e293b">Order from least to most frequently changed: base image → OS packages → package*.json → npm ci → source → build.</text><text x="400" y="341.5" font-size="11.5" text-anchor="middle" fill="#1e293b">.dockerignore: node_modules, dist, .git, .env*, coverage, logs (smaller context, no secrets or host binaries in the image).</text></svg>