<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured image sizes: 1.86 GB naive node:22, 463 MB slim single stage, 256 MB alpine multi-stage and 231 MB distroless multi-stage"><title>Measured image sizes: 1.86 GB naive node:22, 463 MB slim single stage, 256 MB alpine multi-stage and 231 MB distroless multi-stage</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Image size by Dockerfile style (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: the same TypeScript + Express API, image size</text><text x="290" y="90" font-size="11.5" text-anchor="end" fill="#475569">node:22, COPY . ., npm install</text><rect x="300" y="74" width="390.6" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="696.6" y="90" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1860 MB</text><text x="290" y="124" font-size="11.5" text-anchor="end" fill="#475569">node:22-slim, single stage</text><rect x="300" y="108" width="97.23" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="403.23" y="124" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">463 MB</text><text x="290" y="158" font-size="11.5" text-anchor="end" fill="#475569">node:22-alpine, multi-stage, --omit=dev</text><rect x="300" y="142" width="53.76" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="359.76" y="158" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">256 MB</text><text x="290" y="192" font-size="11.5" text-anchor="end" fill="#475569">distroless nodejs22, multi-stage</text><rect x="300" y="176" width="48.51" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="354.51" y="192" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">231 MB</text><rect x="30" y="220" width="360" height="156" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="265.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Multi-stage build</text><text x="210" y="280.25" font-size="11.5" text-anchor="middle" fill="#1e293b">stage 1 "build": all deps + tsc/vite</text><text x="210" y="294.75" font-size="11.5" text-anchor="middle" fill="#1e293b">stage 2 "runtime": fresh small base,</text><text x="210" y="309.25" font-size="11.5" text-anchor="middle" fill="#1e293b">npm ci --omit=dev, COPY --from=build dist</text><text x="210" y="323.75" font-size="11.5" text-anchor="middle" fill="#1e293b">compilers, dev deps, source maps and</text><text x="210" y="338.25" font-size="11.5" text-anchor="middle" fill="#1e293b">caches never reach production</text><rect x="410" y="220" width="360" height="156" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="265.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Base image choice</text><text x="590" y="280.25" font-size="11.5" text-anchor="middle" fill="#1e293b">node:22 (Debian, ~1.1 GB): build tools, debugging</text><text x="590" y="294.75" font-size="11.5" text-anchor="middle" fill="#1e293b">-slim (Debian, small): safe default, glibc</text><text x="590" y="309.25" font-size="11.5" text-anchor="middle" fill="#1e293b">-alpine (musl): smallest, check native modules</text><text x="590" y="323.75" font-size="11.5" text-anchor="middle" fill="#1e293b">distroless: no shell or package manager</text><text x="590" y="338.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ smallest attack surface, harder to debug</text></svg>