<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured docker stop: 0.2 s with a SIGTERM handler, 0.1 s with npm start, 0.1 s with --init but exit 143, and 10.2 s then SIGKILL exit 137 with no handler"><title>Measured docker stop: 0.2 s with a SIGTERM handler, 0.1 s with npm start, 0.1 s with --init but exit 143, and 10.2 s then SIGKILL exit 137 with no handler</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">PID 1, SIGTERM and docker stop (measured)</text><rect x="30" y="58" width="740" height="52" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="88" font-size="11.5" text-anchor="middle" fill="#1e293b">docker stop → SIGTERM to PID 1 → wait the stop timeout → SIGKILL (exit 137)        Kubernetes: SIGTERM, 30 s grace, SIGKILL</text><text x="400" y="132" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: docker stop on Node 22 containers</text><text x="260" y="161" font-size="11.5" text-anchor="end" fill="#475569">node, SIGTERM handler</text><rect x="270" y="146" width="4.4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="280.4" y="161" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.2 s · exit 0 (clean shutdown)</text><text x="260" y="193" font-size="11.5" text-anchor="end" fill="#475569">npm start (npm 10 forwards)</text><rect x="270" y="178" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279" y="193" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.1 s · exit 0</text><text x="260" y="225" font-size="11.5" text-anchor="end" fill="#475569">node, NO handler, --init</text><rect x="270" y="210" width="3" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="279" y="225" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.1 s · exit 143 (killed by signal)</text><text x="260" y="257" font-size="11.5" text-anchor="end" fill="#475569">node, NO handler, timeout 10 s</text><rect x="270" y="242" width="224.4" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="500.4" y="257" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10.2 s · exit 137 (SIGKILL)</text><rect x="30" y="284" width="740" height="92" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Node as PID 1 gets no default signal handling: with no SIGTERM listener it ignores the signal and is killed after the timeout.</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">Fix: CMD ["node","dist/server.js"] (exec form) + process.on("SIGTERM") that stops accepting, drains, closes pools.</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Add --init / tini when you spawn children (it reaps zombies and forwards signals).</text></svg>