<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured Node 22 heap limit 2096 MB with no limit, 1048 MB with a 2 GB limit and 259 MB with a 512 MB limit; a 256 MB container growing memory was OOM-killed with exit 137; production and debugging checklists"><title>Measured Node 22 heap limit 2096 MB with no limit, 1048 MB with a 2 GB limit and 259 MB with a 512 MB limit; a 256 MB container growing memory was OOM-killed with exit 137; production and debugging checklists</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Running Node in containers: memory, health and debugging</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: Node 22 default heap limit inside a container (8 GB Docker VM)</text><text x="210" y="89" font-size="11.5" text-anchor="end" fill="#475569">no memory limit</text><rect x="220" y="74" width="419.2" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="645.2" y="89" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2096 MB heap limit</text><text x="210" y="121" font-size="11.5" text-anchor="end" fill="#475569">--memory=2g</text><rect x="220" y="106" width="209.6" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="435.6" y="121" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1048 MB (≈ 50%)</text><text x="210" y="153" font-size="11.5" text-anchor="end" fill="#475569">--memory=512m</text><rect x="220" y="138" width="51.8" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="277.8" y="153" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">259 MB (≈ 50%)</text><text x="400" y="196" font-size="11.5" text-anchor="middle" fill="#ef4444">--memory=256m and a growing buffer → container OOM-killed, exit 137 (no JS stack trace)</text><rect x="30" y="214" width="360" height="162" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="263.9" font-size="11" text-anchor="middle" fill="#1e293b">Production container checklist</text><text x="210" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">exec-form CMD, SIGTERM handler, USER node</text><text x="210" y="291.9" font-size="11" text-anchor="middle" fill="#1e293b">HEALTHCHECK or k8s liveness/readiness probes</text><text x="210" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">logs to stdout/stderr (JSON), no log files</text><text x="210" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">memory/CPU limits set; heap sized to the limit</text><text x="210" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">config from env vars, secrets from a secret store</text><rect x="410" y="214" width="360" height="162" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="263.9" font-size="11" text-anchor="middle" fill="#1e293b">Debug a running container</text><text x="590" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">docker logs -f api · docker exec -it api sh</text><text x="590" y="291.9" font-size="11" text-anchor="middle" fill="#1e293b">docker stats (CPU, memory) · docker inspect</text><text x="590" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">docker events (OOM, restarts)</text><text x="590" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">exit 137 = SIGKILL/OOM, 143 = SIGTERM,</text><text x="590" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">1 = app error (check logs)</text></svg>