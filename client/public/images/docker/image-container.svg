<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A Dockerfile is built into a read-only layered image which runs as containers; containers share the host kernel unlike VMs; images are pushed to and pulled from a registry"><title>A Dockerfile is built into a read-only layered image which runs as containers; containers share the host kernel unlike VMs; images are pushed to and pulled from a registry</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Dockerfile → image → container</text><rect x="30" y="58" width="200" height="150" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="130" y="96.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Dockerfile</text><text x="130" y="109.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">FROM node:22-alpine</text><text x="130" y="123.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">WORKDIR /app</text><text x="130" y="136.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">COPY package*.json ./</text><text x="130" y="150.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">RUN npm ci</text><text x="130" y="163.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">COPY src ./src</text><text x="130" y="177.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">CMD ["node","dist/server.js"]</text><line x1="234" y1="132" x2="306" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="270" y="126" font-size="10.5" text-anchor="middle" fill="#475569">docker build</text><rect x="310" y="58" width="210" height="150" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="415" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b">IMAGE (read-only, layered)</text><text x="415" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b">layer: base OS + node</text><text x="415" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b">layer: package*.json</text><text x="415" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">layer: node_modules</text><text x="415" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">layer: compiled app</text><text x="415" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b">metadata: CMD, ENV, USER</text><line x1="524" y1="132" x2="586" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="555" y="126" font-size="10.5" text-anchor="middle" fill="#475569">docker run</text><rect x="590" y="58" width="180" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="680" y="108.9" font-size="11" text-anchor="middle" fill="#1e293b">CONTAINER</text><text x="680" y="122.9" font-size="11" text-anchor="middle" fill="#1e293b">= image + thin writable layer</text><text x="680" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b">+ its own process tree (PID 1)</text><text x="680" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b">+ network + limits</text><text x="680" y="164.9" font-size="11" text-anchor="middle" fill="#1e293b">many containers per image</text><rect x="30" y="226" width="360" height="150" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="276.9" font-size="11" text-anchor="middle" fill="#1e293b">Containers vs virtual machines</text><text x="210" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b">VM: full guest OS + kernel, boots in tens of seconds</text><text x="210" y="304.9" font-size="11" text-anchor="middle" fill="#1e293b">container: shares the host kernel, isolated with</text><text x="210" y="318.9" font-size="11" text-anchor="middle" fill="#1e293b">Linux namespaces (pid, net, mnt) and cgroups (CPU, memory)</text><text x="210" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">starts in well under a second, tens of MB</text><rect x="410" y="226" width="360" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="276.9" font-size="11" text-anchor="middle" fill="#1e293b">Registry (Docker Hub, GHCR, ECR)</text><text x="590" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b">docker push ghcr.io/acme/api:3f2a1c9</text><text x="590" y="304.9" font-size="11" text-anchor="middle" fill="#1e293b">docker pull … on any server or cluster</text><text x="590" y="318.9" font-size="11" text-anchor="middle" fill="#1e293b">same image in CI, staging and production</text><text x="590" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">→ "works on my machine" goes away</text></svg>