<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Compose with web, api, postgres and redis services on one network; measured that depends_on without a healthcheck gave ECONNREFUSED while service_healthy connected in 18 ms"><title>Compose with web, api, postgres and redis services on one network; measured that depends_on without a healthcheck gave ECONNREFUSED while service_healthy connected in 18 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Docker Compose for a full-stack app (measured startup order)</text><rect x="30" y="58" width="220" height="120" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="140" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b">web (nginx + React build)</text><text x="140" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b">ports: 3000:80</text><text x="140" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b">depends_on: api</text><rect x="290" y="58" width="220" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="100.9" font-size="11" text-anchor="middle" fill="#1e293b">api (Node)</text><text x="400" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">DATABASE_URL=postgres://db:5432</text><text x="400" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">REDIS_URL=redis://cache:6379</text><text x="400" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">depends_on: service_healthy</text><rect x="550" y="58" width="220" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">db (postgres:17)</text><text x="660" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">volume pgdata · healthcheck</text><rect x="550" y="124" width="220" height="54" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="660" y="147.9" font-size="11" text-anchor="middle" fill="#1e293b">cache (redis:7)</text><text x="660" y="161.9" font-size="11" text-anchor="middle" fill="#1e293b">healthcheck: redis-cli ping</text><line x1="254" y1="118" x2="286" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="514" y1="100" x2="546" y2="86" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="514" y1="140" x2="546" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="204" font-size="11.5" text-anchor="middle" fill="#475569">One project network: services reach each other by NAME (db, cache), not localhost</text><text x="400" y="232" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: API container connecting to Postgres at startup</text><rect x="30" y="246" width="360" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="277.75" font-size="11.5" text-anchor="middle" fill="#1e293b">depends_on: [db] (only "started")</text><text x="210" y="292.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ FAILED to connect: ECONNREFUSED (exit 1)</text><rect x="410" y="246" width="360" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="277.75" font-size="11.5" text-anchor="middle" fill="#1e293b">depends_on: db: condition: service_healthy</text><text x="590" y="292.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ connected in 18 ms (PostgreSQL 17)</text><rect x="30" y="326" width="740" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="354.7" font-size="10.5" text-anchor="middle" fill="#1e293b">Named volumes keep data across restarts (docker compose down keeps them; down -v deletes them). Still retry DB connects in the app.</text></svg>