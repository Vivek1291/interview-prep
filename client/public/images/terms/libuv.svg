<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="libuv inside Node.js: JavaScript calls Node APIs, libuv uses a 4-thread pool for files, DNS and crypto and the OS async I/O for sockets, then queues callbacks that the event loop runs when the call stack is empty"><title>libuv inside Node.js: JavaScript calls Node APIs, libuv uses a 4-thread pool for files, DNS and crypto and the OS async I/O for sockets, then queues callbacks that the event loop runs when the call stack is empty</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">libuv: what does the waiting for Node.js</text><rect x="30" y="80" width="190" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="106.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Your JavaScript</text><text x="125" y="123.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">(V8, one thread)</text><rect x="30" y="170" width="190" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="125" y="191.6" font-size="13" text-anchor="middle" fill="#1e293b">Node APIs: fs, net,</text><text x="125" y="207.6" font-size="13" text-anchor="middle" fill="#1e293b">crypto, dns, timers</text><line x1="125" y1="140" x2="125" y2="166" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="255" y="70" width="330" height="300" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="420" y="96" font-size="16" text-anchor="middle" fill="#065f46" font-weight="700">libuv (C library)</text><rect x="275" y="110" width="290" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="420" y="132.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Event loop</text><text x="420" y="148.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">timers → poll (I/O) → check → close</text><rect x="275" y="178" width="140" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="345" y="194.7" font-size="12" text-anchor="middle" fill="#1e293b">Thread pool</text><text x="345" y="209.7" font-size="12" text-anchor="middle" fill="#1e293b">4 threads (default)</text><text x="345" y="224.7" font-size="12" text-anchor="middle" fill="#1e293b">fs, dns.lookup,</text><text x="345" y="239.7" font-size="12" text-anchor="middle" fill="#1e293b">crypto, zlib</text><rect x="425" y="178" width="140" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="495" y="202.2" font-size="12" text-anchor="middle" fill="#1e293b">OS async I/O</text><text x="495" y="217.2" font-size="12" text-anchor="middle" fill="#1e293b">epoll / kqueue /</text><text x="495" y="232.2" font-size="12" text-anchor="middle" fill="#1e293b">IOCP (sockets)</text><rect x="275" y="266" width="290" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="420" y="290.6" font-size="13" text-anchor="middle" fill="#1e293b">Callback queues (one per phase)</text><text x="420" y="330" font-size="12" text-anchor="middle" fill="#475569">finished work → callback queued → the loop</text><text x="420" y="348" font-size="12" text-anchor="middle" fill="#475569">runs it when the JS call stack is empty</text><line x1="220" y1="195" x2="271" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="232" y="186" font-size="12" text-anchor="middle" fill="#475569">call</text><line x1="345" y1="248" x2="345" y2="262" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><line x1="495" y1="248" x2="495" y2="262" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><rect x="615" y="178" width="160" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="695" y="201.6" font-size="13" text-anchor="middle" fill="#1e293b">Operating system</text><text x="695" y="217.6" font-size="13" text-anchor="middle" fill="#1e293b">kernel: disk,</text><text x="695" y="233.6" font-size="13" text-anchor="middle" fill="#1e293b">network</text><line x1="567" y1="213" x2="611" y2="213" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><line x1="255" y1="286" x2="125" y2="226" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text x="150" y="278" font-size="12" text-anchor="middle" fill="#8b5cf6">run callback</text><rect x="612" y="279" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="632" y="291" font-size="12" text-anchor="start" fill="#475569">sockets: OS, no threads</text><rect x="612" y="299" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="632" y="311" font-size="12" text-anchor="start" fill="#475569">files/crypto: pool</text><rect x="612" y="319" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="632" y="331" font-size="12" text-anchor="start" fill="#475569">order: event loop</text></svg>