<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Presigned upload: bytes go browser → S3, never through the API"><title>Presigned upload: bytes go browser → S3, never through the API</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Presigned upload: bytes go browser → S3, never through the API</text><line x1="130" y1="195" x2="370" y2="123" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="210" y="143" font-size="11" text-anchor="middle" fill="#475569">1 POST /uploads</text><line x1="130" y1="197.5" x2="577" y2="197.5" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="353.5" y="189.5" font-size="11" text-anchor="middle" fill="#475569">2 PUT bytes (signed URL)</text><line x1="440" y1="95" x2="660" y2="167" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="580" y="125" font-size="11" text-anchor="middle" fill="#475569">3 HEAD verify</text><line x1="440" y1="95" x2="545" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="20" y="170" width="110" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="75" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Browser</text><rect x="300" y="70" width="140" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="370" y="91.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API: validate,</text><text x="370" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">key, presign</text><rect x="580" y="170" width="160" height="60" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="660" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">S3 bucket</text><text x="660" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(private)</text><rect x="470" y="300" width="150" height="46" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="545" y="319.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">file record</text><text x="545" y="334.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">pending → ready</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">URL signs method, key, expiry and Content-Type (signableHeaders)</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Downloads: 60-second presigned GET · cleanup job for abandoned uploads</text></svg>