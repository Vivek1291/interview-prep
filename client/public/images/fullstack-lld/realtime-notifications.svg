<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Notifications: persist, publish, push, catch up"><title>Notifications: persist, publish, push, catch up</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Notifications: persist, publish, push, catch up</text><line x1="130" y1="195" x2="240" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="185" y="151" font-size="11" text-anchor="middle" fill="#475569">1 save</text><line x1="130" y1="195" x2="240" y2="267" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="185" y="225" font-size="11" text-anchor="middle" fill="#475569">2 publish</text><line x1="300" y1="295" x2="440" y2="249" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="300" y1="304" x2="377" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="223" x2="577" y2="223" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="313" x2="577" y2="313" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="560" y1="98" x2="303" y2="98" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><rect x="20" y="170" width="110" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="75" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">notify()</text><rect x="180" y="70" width="120" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="240" y="89.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">MongoDB</text><text x="240" y="104.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">seq per user</text><rect x="180" y="270" width="120" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="240" y="291.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Redis</text><text x="240" y="306.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">pub/sub</text><rect x="380" y="200" width="120" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="440" y="227.2" font-size="12" text-anchor="middle" fill="#