<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="In-stack holds 3 4, out-stack holds 2 1 with 1 on top, so pop returns 1"><title>In-stack holds 3 4, out-stack holds 2 1 with 1 on top, so pop returns 1</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Queue using two stacks</text><path d="M194 158 V326 H286 V158" fill="none" stroke="#64748b" stroke-width="2"/><rect x="200" y="282" width="80" height="35" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="240" y="304.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="200" y="244" width="80" height="35" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="240" y="266.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="240" y="344" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">in (push here)</text><path d="M464 158 V326 H556 V158" fill="none" stroke="#64748b" stroke-width="2"/><rect x="470" y="282" width="80" height="35" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="510" y="304.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="470" y="244" width="80" height="35" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="510" y="266.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="510" y="344" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">out (pop here)</text><path d="M300 200 Q380 150 460 200" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="380" y="140" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">out empty? pour ALL of in → order flips</text><text x="400" y="80" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">pushed 1, 2, then 3, 4.   pop() → 1 (oldest first ✅)</text><text x="400" y="380" font-size="13" text-anchor="middle" fill="#475569">Each element moves in → out at most once → amortised O(1) per operation.</text></svg>