<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Slow stops at node 3 when fast is null; node 4 is skipped"><title>Slow stops at node 3 when fast is null; node 4 is skipped</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Remove Nth Node From End: keep a fixed gap</text><text x="400" y="70" font-size="14" text-anchor="middle" fill="#475569">head = [1,2,3,4,5], n = 2: move fast n + 1 steps ahead of slow (from a dummy)</text><rect x="60" y="130" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="87" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">D</text><line x1="114" y1="148" x2="145" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="148" y="130" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="175" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><line x1="202" y1="148" x2="233" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="236" y="130" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="263" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><line x1="290" y1="148" x2="321" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="324" y="130" width="54" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="351" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><line x1="378" y1="148" x2="409" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="412" y="130" width="54" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="439" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><line x1="466" y1="148" x2="497" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="500" y="130" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="527" y="153.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><line x1="554" y1="148" x2="585" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="594" y="153" font-size="13" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">null</text><line x1="351" y1="196" x2="351" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="351" y="212" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">slow</text><text x="608" y="196" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">fast = null</text><path d="M378 140 Q466 90 554 140" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="466" y="107" font-size="12" text-anchor="middle" fill="#475569">slow.next = slow.next.next (skip 4)</text><text x="400" y="300" font-size="13" text-anchor="middle" fill="#475569">The gap between slow and fast stays n + 1 nodes. When fast falls off the end,</text><text x="400" y="322" font-size="13" text-anchor="middle" fill="#475569">slow is right BEFORE the node to delete. One pass, O(1) space.</text><text x="400" y="360" font-size="15" text-anchor="middle" fill="#6366f1" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Result: [1, 2, 3, 5]</text></svg>