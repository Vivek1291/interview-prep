<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A list whose tail points back to node -4, forming a loop"><title>A list whose tail points back to node -4, forming a loop</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Linked List Cycle: Floyd's tortoise and hare</text><line x1="144" y1="200" x2="193" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="244" y1="200" x2="293" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="344" y1="200" x2="393" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="440.6" y1="187.7" x2="496.8" y2="153.9" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="540.6" y1="152.3" x2="596.8" y2="186.1" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="599.4" y1="212.3" x2="543.2" y2="246.1" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="499.4" y1="247.7" x2="443.2" y2="213.9" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><circle cx="120" cy="200" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="120" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="220" cy="200" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="220" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="320" cy="200" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="320" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">0</text><circle cx="420" cy="200" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="420" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">-4</text><circle cx="520" cy="140" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="520" y="145" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><circle cx="620" cy="200" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="620" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">6</text><circle cx="520" cy="260" r="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="520" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><text x="420" y="245" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="700">cycle starts here</text><text x="400" y="80" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">slow moves 1 step, fast moves 2 steps</text><text x="400" y="102" font-size="13" text-anchor="middle" fill="#475569">Inside the loop fast gains 1 step per move on slow → they must meet</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">fast reaches null → no cycle.  slow === fast → cycle.  O(n) time, O(1) space</text></svg>