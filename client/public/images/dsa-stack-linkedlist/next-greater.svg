anchor="middle" fill="#1e293b" font-weight="700">Next Greater Element: stack + map</text><text x="190" y="117" font-size="13" text-anchor="end" fill="#475569" font-weight="700">nums2</text><rect x="200" y="90" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="235" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="235" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="270" y="90" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="305" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="305" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="340" y="90" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="375" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="375" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="410" y="90" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="445" y="117.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="445" y="149" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><path d="M235 90 Q270 55 305 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="270" y="64.5" font-size="12" text-anchor="middle" fill="#475569">3</text><path d="M305 90 Q340 55 375 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="340" y="64.5" font-size="12" text-anchor="middle" fill="#475569">4</text><rect x="560" y="100" width="70" height="28" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="595" y="118.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">value</text><rect x="630" y="100" width="100" height="28" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="680" y="118.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">next greater</text><rect x="560" y="128" width="70" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="595" y="146.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="630" y="128" width="100" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="680" y="146.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="560" y="156" width="70" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="595" y="174.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="630" y="156" width="100" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="680" y="174.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="560" y="184" width="70" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="595" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="630" y="184" width="100" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="680" y="202.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text><rect x="560" y="212" width="70" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="595" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="630" y="212" width="100" height="28" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="680" y="230.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text><text x="60" y="250" font-size="13" text-anchor="start" fill="#475569">Scan nums2 once with a decreasing stack: when x is bigger than the top,</text><text x="60" y="270" font-size="13" text-anchor="start" fill="#475569">x is the &quot;next greater&quot; of every smaller value it pops → store in a map.</text><text x="60" y="300" font-size="13" text-anchor="start" fill="#475569">Then answer each query in nums1 with one map lookup.</text><text x="60" y="340" font-size="15" text-anchor="start" fill="#6366f1" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">nums1 = [4, 1, 2] → [-1, 3, -1]</text></svg>