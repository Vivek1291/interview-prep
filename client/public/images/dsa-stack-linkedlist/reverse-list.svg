<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pointers prev, curr and next; node 1 already points to null and node 2 is flipped next"><title>Pointers prev, curr and next; node 1 already points to null and node 2 is flipped next</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Reverse Linked List: three pointers</text><text x="400" y="70" font-size="14" text-anchor="middle" fill="#475569">Each step: save next, flip curr.next to prev, move prev and curr one step right</text><text x="70" y="173" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">null</text><rect x="150" y="150" width="54" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="177" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="270" y="150" width="54" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="297" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="390" y="150" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="417" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="510" y="150" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="537" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><line x1="150" y1="168" x2="96" y2="168" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><line x1="324" y1="168" x2="387" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="444" y1="168" x2="507" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="564" y1="168" x2="604" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="610" y="173" font-size="13" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">null</text><path d="M280 186 Q237 226 194 186" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/><text x="237" y="236" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="700">next flip: 2 → 1</text><line x1="177" y1="116" x2="177" y2="146" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="177" y="110" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">prev</text><line x1="297" y1="116" x2="297" y2="146" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="297" y="110" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">curr</text><line x1="417" y1="116" x2="417" y2="146" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><text x="417" y="110" font-size="13" text-anchor="middle" fill="#0ea5e9" font-weight="700">next</text><text x="60" y="276" font-size="14" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">start:       1 → 2 → 3 → 4 → null</text><text x="60" y="302" font-size="14" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">after step 1: null ← 1 · 2 → 3 → 4 → null</text><text x="60" y="328" font-size="14" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">after step 2: null ← 1 ← 2 · 3 → 4 → null</text><text x="60" y="362" font-size="14" text-anchor="start" fill="#10b981" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">end:          null ← 1 ← 2 ← 3 ← 4   (return prev = 4)</text></svg>