monospace">4</text><rect x="280" y="180" width="70" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="315" y="207.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="350" y="180" width="70" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="385" y="207.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="420" y="180" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="455" y="207.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="490" y="180" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="525" y="207.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="560" y="180" width="70" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="207.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><path d="M385 90 Q417.5 60 450 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><path d="M315 90 Q387.5 35 460 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="387.5" y="54.5" font-size="12" text-anchor="middle" fill="#475569">72 is warmer: pop 69 (wait 1) and 71 (wait 2)</text><path d="M614 250 V356 H716 V250" fill="none" stroke="#64748b" stroke-width="2"/><rect x="620" y="320" width="90" height="27" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="665" y="338.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2: 75</text><rect x="620" y="290" width="90" height="27" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="665" y="308.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5: 72</text><text x="665" y="374" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">stack after i = 5</text><text x="60" y="300" font-size="13" text-anchor="start" fill="#475569">Stack keeps indices of days still waiting for a warmer day</text><text x="60" y="322" font-size="13" text-anchor="start" fill="#475569">(temperatures decreasing from bottom to top = &quot;monotonic&quot;).</text><text x="60" y="352" font-size="13" text-anchor="start" fill="#6366f1" font-weight="700">Each index is pushed once and popped once → O(n).</text></svg>