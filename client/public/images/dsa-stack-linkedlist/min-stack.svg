<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Values stack 5 3 7 2 with min stack 5 3 3 2"><title>Values stack 5 3 7 2 with min stack 5 3 3 2</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Min Stack: a second stack remembers the minimum at every level</text><path d="M214 160 V336 H306 V160" fill="none" stroke="#64748b" stroke-width="2"/><rect x="220" y="290" width="80" height="37" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="313.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="220" y="250" width="80" height="37" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="273.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="220" y="210" width="80" height="37" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="233.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><rect x="220" y="170" width="80" height="37" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="193.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="260" y="354" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">values</text><path d="M414 160 V336 H506 V160" fill="none" stroke="#64748b" stroke-width="2"/><rect x="420" y="290" width="80" height="37" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="460" y="313.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="420" y="250" width="80" height="37" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="460" y="273.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="420" y="210" width="80" height="37" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="460" y="233.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="420" y="170" width="80" height="37" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="460" y="193.1" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="460" y="354" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">min so far</text><text x="600" y="120" font-size="13" text-anchor="middle" fill="#475569">push(x): min = min(x, top of mins)</text><text x="600" y="145" font-size="13" text-anchor="middle" fill="#475569">pop(): pop both stacks</text><text x="600" y="170" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">getMin(): top of mins → O(1)</text><text x="600" y="230" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">After pop() → mins top = 3</text><text x="600" y="255" font-size="13" text-anchor="middle" fill="#475569">The old minimum comes back</text><text x="600" y="275" font-size="13" text-anchor="middle" fill="#475569">automatically.</text></svg>