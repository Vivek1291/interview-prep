<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="S3 security"><title>S3 security</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A bank vault: locked door, badges per drawer, time-limited tickets</text><rect x="290" y="90" width="220" height="190" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">PRIVATE BUCKET</text><text x="400" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Block Public Access</text><text x="400" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">SSE-KMS · versioning</text><text x="400" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">lifecycle · HTTPS-only</text><rect x="30" y="70" width="200" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="96.7" font-size="12" text-anchor="middle" fill="#1e293b">CloudFront (OAC)</text><text x="130" y="111.7" font-size="12" text-anchor="middle" fill="#1e293b">public web assets</text><rect x="30" y="160" width="200" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="186.7" font-size="12" text-anchor="middle" fill="#1e293b">user: presigned GET</text><text x="130" y="201.7" font-size="12" text-anchor="middle" fill="#1e293b">own file, 5 min</text><rect x="30" y="250" width="200" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="130" y="279.2" font-size="12" text-anchor="middle" fill="#1e293b">API role: avatars/*, videos/*</text><line x1="230" y1="100" x2="286" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="230" y1="190" x2="286" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="230" y1="275" x2="286" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="570" y="90" width="200" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="670" y="116.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">anonymous URL</text><text x="670" y="132.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">→ 403</text><rect x="570" y="175" width="200" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="670" y="201.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">plain HTTP</text><text x="670" y="217.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">→ explicit deny</text><line x1="566" y1="120" x2="514" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="566" y1="205" x2="514" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Explicit Deny wins · never make a bucket public to fix AccessDenied</text></svg>