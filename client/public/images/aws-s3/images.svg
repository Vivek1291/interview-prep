numbers, not photos glued on</text><rect x="30" y="80" width="330" height="210" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="195" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="195" y="103" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">image bytes inside MongoDB</text><text x="50" y="135" font-size="13" text-anchor="start" fill="#1e293b">200 docs → 200 MB of data</text><text x="50" y="169" font-size="13" text-anchor="start" fill="#1e293b">list 50 → 33.5 ms</text><text x="50" y="203" font-size="13" text-anchor="start" fill="#1e293b">JSON → 66 MB of base64</text><text x="50" y="237" font-size="13" text-anchor="start" fill="#1e293b">17 MB doc → rejected (16 MB)</text><rect x="430" y="80" width="340" height="210" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="600" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="600" y="103" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">keys in MongoDB, bytes in S3</text><text x="450" y="135" font-size="13" text-anchor="start" fill="#1e293b">200 docs → 27 KB of data</text><text x="450" y="169" font-size="13" text-anchor="start" fill="#1e293b">list 50 → 1.6 ms</text><text x="450" y="203" font-size="13" text-anchor="start" fill="#1e293b">JSON → 7 KB</text><text x="450" y="237" font-size="13" text-anchor="start" fill="#1e293b">Lambda + sharp → 300×300 WebP thumbs</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Store the key, build CDN or presigned URLs when reading</text></svg>