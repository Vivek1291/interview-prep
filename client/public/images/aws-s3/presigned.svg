<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Presigned URLs"><title>Presigned URLs</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A signed permission slip: one parcel, one locker, until 10:05</text><rect x="30" y="80" width="180" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">API (office)</text><text x="120" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">IAM role signs:</text><text x="120" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">PUT uploads/u42/doc.pdf</text><text x="120" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">type PDF · 60 s</text><rect x="300" y="80" width="200" height="110" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">browser</text><text x="400" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">carries the slip</text><text x="400" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(no AWS keys)</text><rect x="590" y="80" width="180" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="680" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">S3 (warehouse)</text><text x="680" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">checks signature,</text><text x="680" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b">key, type, time</text><line x1="210" y1="135" x2="296" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="135" x2="586" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="220" width="230" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="243.2" font-size="12" text-anchor="middle" fill="#1e293b">same slip, PDF → 200</text><rect x="280" y="220" width="230" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="395" y="243.2" font-size="12" text-anchor="middle" fill="#1e293b">type text/html → 403</text><rect x="530" y="220" width="230" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="645" y="243.2" font-size="12" text-anchor="middle" fill="#1e293b">key changed → 403</text><rect x="30" y="270" width="230" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="145" y="293.2" font-size="12" text-anchor="middle" fill="#1e293b">after expiry → 403</text><rect x="280" y="270" width="230" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="395" y="293.2" font-size="12" text-anchor="middle" fill="#1e293b">POST &gt; size range → 400</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Tested on SeaweedFS (verifies signatures) · the Moto mock accepted everything</text></svg>