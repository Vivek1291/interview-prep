<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SSE response format and EventSource client code; measured in Chrome five automatic reconnections each sending Last-Event-ID, delivering all nine events in order without duplicates"><title>SSE response format and EventSource client code; measured in Chrome five automatic reconnections each sending Last-Event-ID, delivering all nine events in order without duplicates</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Server-Sent Events and automatic reconnection (measured)</text><rect x="30" y="58" width="360" height="150" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="44" y="75.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">HTTP/1.1 200 OK</text><text x="44" y="89.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Content-Type: text/event-stream</text><text x="44" y="102.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cache-Control: no-cache</text><text x="44" y="116.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="129.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">retry: 500</text><text x="44" y="143.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="156.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">id: 7</text><text x="44" y="170.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">event: order</text><text x="44" y="183.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">data: {"id":7,"status":"shipped"}</text><text x="44" y="197.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><rect x="410" y="58" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="102.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const es = new EventSource('/events');</text><text x="424" y="116.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">es.addEventListener('order', (e) =&gt; {</text><text x="424" y="129.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  render(JSON.parse(e.data));</text><text x="424" y="143.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">});</text><text x="424" y="156.95" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// auto-reconnects, sends</text><text x="424" y="170.45" font-size="10.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">// Last-Event-ID: &lt;last id&gt;</text><text x="400" y="232" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured in Chrome: server cuts the stream after every 3 events</text><rect x="30" y="244" width="140" height="52" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="100" y="266.9" font-size="11" text-anchor="middle" fill="#1e293b">#1 at +5 ms</text><text x="100" y="280.9" font-size="11" text-anchor="middle" fill="#1e293b">Last-Event-ID: none</text><rect x="180" y="244" width="140" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="250" y="266.9" font-size="11" text-anchor="middle" fill="#1e293b">#2 at +813 ms</text><text x="250" y="280.9" font-size="11" text-anchor="middle" fill="#1e293b">Last-Event-ID: 2</text><rect x="330" y="244" width="140" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="266.9" font-size="11" text-anchor="middle" fill="#1e293b">#3 at +1634 ms</text><text x="400" y="280.9" font-size="11" text-anchor="middle" fill="#1e293b">Last-Event-ID: 4</text><rect x="480" y="244" width="140" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="550" y="266.9" font-size="11" text-anchor="middle" fill="#1e293b">#4 at +2442 ms</text><text x="550" y="280.9" font-size="11" text-anchor="middle" fill="#1e293b">Last-Event-ID: 6</text><rect x="630" y="244" width="140" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="700" y="266.9" font-size="11" text-anchor="middle" fill="#1e293b">#5 at +3253 ms</text><text x="700" y="280.9" font-size="11" text-anchor="middle" fill="#1e293b">Last-Event-ID: 8</text><rect x="30" y="312" width="740" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="339.9" font-size="11" text-anchor="middle" fill="#1e293b">Result: all 9 events, in order, no duplicates. The 3rd event of each burst was lost in flight (browser reported 2, not 3)</text><text x="400" y="353.9" font-size="11" text-anchor="middle" fill="#1e293b">and was re-sent because the server resumes from Last-Event-ID: resume logic is what makes SSE reliable.</text></svg>