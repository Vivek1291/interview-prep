<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pipeline from sensors through ingest, a stream, an aggregator and a WebSocket or SSE gateway to a React dashboard, with rules for throttling, snapshots, subscriptions, slow clients and alarms"><title>Pipeline from sensors through ingest, a stream, an aggregator and a WebSocket or SSE gateway to a React dashboard, with rules for throttling, snapshots, subscriptions, slow clients and alarms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Designing a real-time dashboard</text><rect x="30" y="70" width="130" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="95" y="102" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">sensors / PLCs</text><rect x="190" y="70" width="130" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="255" y="102" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">ingest service</text><rect x="350" y="70" width="130" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="415" y="102" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Kafka / Redis Streams</text><rect x="510" y="70" width="130" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="575" y="102" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">aggregator</text><rect x="650" y="70" width="130" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="715" y="102" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">WS/SSE gateway</text><line x1="160" y1="98" x2="190" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="320" y1="98" x2="350" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="480" y1="98" x2="510" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="640" y1="98" x2="650" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="350" y="160" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="415" y="179.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">TimescaleDB /</text><text x="415" y="193.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">PostgreSQL</text><line x1="415" y1="126" x2="415" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="650" y="160" width="130" height="46" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="715" y="187" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">React dashboard</text><line x1="715" y1="126" x2="715" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="226" width="170" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="242.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">throttle</text><rect x="206" y="226" width="564" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="242.9" font-size="11" text-anchor="middle" fill="#1e293b">send at most 2–5 updates/s per widget; coalesce to the latest value</text><rect x="30" y="256" width="170" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="272.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">snapshot + deltas</text><rect x="206" y="256" width="564" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="272.9" font-size="11" text-anchor="middle" fill="#1e293b">on (re)connect: send current state, then only changes with a sequence number</text><rect x="30" y="286" width="170" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="302.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">subscriptions</text><rect x="206" y="286" width="564" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="302.9" font-size="11" text-anchor="middle" fill="#1e293b">clients subscribe to the plants/tags they view; don't broadcast everything</text><rect x="30" y="316" width="170" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">slow clients</text><rect x="206" y="316" width="564" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">drop intermediate values (measured: 7.1 MB buffered vs 0.1 MB)</text><rect x="30" y="346" width="170" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="115" y="362.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">alarms</text><rect x="206" y="346" width="564" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="362.9" font-size="11" text-anchor="middle" fill="#1e293b">critical events never dropped: separate channel, ack + persisted</text></svg>