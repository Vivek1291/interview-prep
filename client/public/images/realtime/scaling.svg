<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Two instances behind a load balancer sharing broadcasts through Redis pub/sub; measured that without an adapter the client on the second instance received 0 of 50 messages and with the Redis adapter all 50"><title>Two instances behind a load balancer sharing broadcasts through Redis pub/sub; measured that without an adapter the client on the second instance received 0 of 50 messages and with the Redis adapter all 50</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Scaling WebSockets across instances (measured)</text><rect x="30" y="58" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="100" y="85.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">client X</text><rect x="30" y="148" width="140" height="46" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="100" y="175.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">client Y</text><rect x="230" y="58" width="160" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="310" y="85.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">instance A</text><rect x="230" y="148" width="160" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="310" y="175.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">instance B</text><line x1="170" y1="81" x2="230" y2="81" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="170" y1="171" x2="230" y2="171" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="470" y="100" width="160" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="550" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Redis pub/sub</text><line x1="390" y1="81" x2="470" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="470" y1="135" x2="390" y2="171" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="650" y="58" width="120" height="136" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="710" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b">load balancer</text><text x="710" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b">sticky sessions</text><text x="710" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b">only needed for</text><text x="710" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">long-polling</text><text x="710" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">fallback</text><text x="400" y="228" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: instance A emits 50 messages to room order:981 (clients on A and B)</text><text x="220" y="256" font-size="11.5" text-anchor="end" fill="#475569">no adapter: client on B</text><rect x="230" y="240" width="3" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="239" y="256" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 of 50 received</text><text x="220" y="290" font-size="11.5" text-anchor="end" fill="#475569">Redis adapter: client on B</text><rect x="230" y="274" width="150" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="386" y="290" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50 of 50 received (avg 1.28 ms vs 0.36 ms local)</text><rect x="30" y="320" width="740" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="343.9" font-size="11" text-anchor="middle" fill="#1e293b">Other options: a message broker (NATS, Kafka) feeding every instance; managed services (AWS API Gateway WebSockets,</text><text x="400" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">Azure Web PubSub, Pusher, Ably). Keep instances stateless: room/presence state lives in Redis.</text></svg>