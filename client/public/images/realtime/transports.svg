<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Comparison of short polling, long polling, SSE and WebSocket; measured average delay 594 ms for 1 second polling vs about 1 ms for the others, with request counts and bytes"><title>Comparison of short polling, long polling, SSE and WebSocket; measured average delay 594 ms for 1 second polling vs about 1 ms for the others, with request counts and bytes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Polling vs long polling vs SSE vs WebSocket (measured)</text><rect x="30" y="58" width="126" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="93" y="77.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="160" y="58" width="146" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="233" y="77.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">direction</text><rect x="310" y="58" width="116" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="368" y="77.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">latency</text><rect x="430" y="58" width="166" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="77.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">connections</text><rect x="600" y="58" width="166" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="683" y="77.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">best for</text><rect x="30" y="94" width="126" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="93" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">short polling</text><rect x="160" y="94" width="146" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="233" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b">client asks</text><rect x="310" y="94" width="116" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="368" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b">up to the interval</text><rect x="430" y="94" width="166" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="513" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b">new request each time</text><rect x="600" y="94" width="166" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="683" y="113.9" font-size="11" text-anchor="middle" fill="#1e293b">rare updates, simplest</text><rect x="30" y="130" width="126" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="93" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">long polling</text><rect x="160" y="130" width="146" height="32" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="233" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">server answers when ready</text><rect x="310" y="130" width="116" height="32" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="368" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">low</text><rect x="430" y="130" width="166" height="32" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="513" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">1 request per event</text><rect x="600" y="130" width="166" height="32" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="683" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">fallback, old proxies</text><rect x="30" y="166" width="126" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="93" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">SSE</text><rect x="160" y="166" width="146" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="233" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">server → client</text><rect x="310" y="166" width="116" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="368" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">low</text><rect x="430" y="166" width="166" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="513" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">1 long HTTP response</text><rect x="600" y="166" width="166" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="683" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b">feeds, alerts, dashboards</text><rect x="30" y="202" width="126" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="93" y="221.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">WebSocket</text><rect x="160" y="202" width="146" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="233" y="221.9" font-size="11" text-anchor="middle" fill="#1e293b">both ways</text><rect x="310" y="202" width="116" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="368" y="221.9" font-size="11" text-anchor="middle" fill="#1e293b">low</text><rect x="430" y="202" width="166" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="513" y="221.9" font-size="11" text-anchor="middle" fill="#1e293b">1 upgraded TCP connection</text><rect x="600" y="202" width="166" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="683" y="221.9" font-size="11" text-anchor="middle" fill="#1e293b">chat, games, collaboration</text><text x="400" y="262" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 20 events at random times over ~10 s (Node 22, localhost)</text><text x="160" y="286" font-size="11.5" text-anchor="end" fill="#475569">short polling (1 s)</text><rect x="170" y="272" width="237.48" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="413.48" y="286" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">593.7 ms avg · 11 requests · 2,987 B</text><text x="160" y="312" font-size="11.5" text-anchor="end" fill="#475569">long polling</text><rect x="170" y="298" width="3" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="179" y="312" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.1 ms · 21 requests · 4,947 B</text><text x="160" y="338" font-size="11.5" text-anchor="end" fill="#475569">SSE</text><rect x="170" y="324" width="3" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="179" y="338" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.4 ms · 1 request · 1,407 B</text><text x="160" y="364" font-size="11.5" text-anchor="end" fill="#475569">WebSocket</text><rect x="170" y="350" width="3" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="179" y="364" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.3 ms · 1 connection · 1,161 B</text></svg>