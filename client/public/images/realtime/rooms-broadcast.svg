<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Rooms, presence and slow-client policies; measured broadcast to 1,000 clients in 7 ms and 5,000 in 34 ms, and server buffering of 7.1 MB for a client that stops reading unless updates are dropped or the client is closed"><title>Rooms, presence and slow-client policies; measured broadcast to 1,000 clients in 7 ms and 5,000 in 34 ms, and server buffering of 7.1 MB for a client that stops reading unless updates are dropped or the client is closed</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Rooms, presence, broadcasting and slow clients (measured)</text><rect x="30" y="58" width="220" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="100.25" font-size="11.5" text-anchor="middle" fill="#1e293b">rooms</text><text x="140" y="114.75" font-size="11.5" text-anchor="middle" fill="#1e293b">order:981 → {sockA, sockB}</text><text x="140" y="129.25" font-size="11.5" text-anchor="middle" fill="#1e293b">user:42 → {phone, laptop}</text><text x="140" y="143.75" font-size="11.5" text-anchor="middle" fill="#1e293b">tenant:7 → {…}</text><rect x="270" y="58" width="230" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="385" y="100.25" font-size="11.5" text-anchor="middle" fill="#1e293b">presence</text><text x="385" y="114.75" font-size="11.5" text-anchor="middle" fill="#1e293b">online:{room} = set of userIds</text><text x="385" y="129.25" font-size="11.5" text-anchor="middle" fill="#1e293b">(+ TTL refreshed by heartbeat)</text><text x="385" y="143.75" font-size="11.5" text-anchor="middle" fill="#1e293b">join → broadcast "online"</text><rect x="520" y="58" width="250" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="645" y="100.25" font-size="11.5" text-anchor="middle" fill="#1e293b">slow client policy</text><text x="645" y="114.75" font-size="11.5" text-anchor="middle" fill="#1e293b">watch socket.bufferedAmount</text><text x="645" y="129.25" font-size="11.5" text-anchor="middle" fill="#1e293b">drop non-critical updates</text><text x="645" y="143.75" font-size="11.5" text-anchor="middle" fill="#1e293b">or close + resync on reconnect</text><text x="400" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: one broadcast with ws, perMessageDeflate off</text><text x="160" y="228" font-size="11.5" text-anchor="end" fill="#475569">1,000 clients</text><rect x="170" y="212" width="21" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="197" y="228" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7 ms until all received · 2.8 KB heap per connection</text><text x="160" y="260" font-size="11.5" text-anchor="end" fill="#475569">5,000 clients</text><rect x="170" y="244" width="102" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="278" y="260" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">34 ms until all received · 2.5 KB heap per connection</text><text x="400" y="296" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: client stops reading, server sends 20,000 small updates/s for 2 s</text><text x="160" y="319" font-size="11.5" text-anchor="end" fill="#475569">send always</text><rect x="170" y="306" width="284" height="18" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="460" y="319" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7.1 MB buffered (and growing)</text><text x="160" y="342" font-size="11.5" text-anchor="end" fill="#475569">drop above 64 KB</text><rect x="170" y="329" width="4" height="18" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="180" y="342" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.1 MB (32,850 updates dropped)</text><text x="160" y="365" font-size="11.5" text-anchor="end" fill="#475569">close above 1 MB</text><rect x="170" y="352" width="40" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="216" y="365" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1 MB, then disconnected</text></svg>