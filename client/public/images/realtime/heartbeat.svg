<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Ping/pong heartbeat logic and reconnect backoff; measured that without heartbeats a dead client is never detected, with 3 s pings it took 5.8 s and with 1 s pings 1.8 s"><title>Ping/pong heartbeat logic and reconnect backoff; measured that without heartbeats a dead client is never detected, with 3 s pings it took 5.8 s and with 1 s pings 1.8 s</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Heartbeats and reconnection (measured)</text><rect x="30" y="58" width="740" height="64" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="79.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">server, every 30 s: if (!socket.isAlive) terminate(); else { socket.isAlive = false; socket.ping() }</text><text x="400" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">on 'pong': socket.isAlive = true</text><text x="400" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">client: reconnect with exponential backoff + jitter (1 s, 2 s, 4 s … max 30 s)</text><text x="400" y="146" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: client vanishes without closing (network black hole, no FIN/RST)</text><text x="160" y="178" font-size="11.5" text-anchor="end" fill="#475569">no heartbeat</text><rect x="170" y="160" width="300" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="476" y="178" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">12000 ms: still "connected" after 12 s (forever)</text><text x="160" y="218" font-size="11.5" text-anchor="end" fill="#475569">ping every 3 s</text><rect x="170" y="200" width="144.98" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="320.98" y="218" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">5799 ms until terminated</text><text x="160" y="258" font-size="11.5" text-anchor="end" fill="#475569">ping every 1 s</text><rect x="170" y="240" width="44.9" height="28" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="220.9" y="258" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1796 ms until terminated</text><rect x="30" y="290" width="740" height="84" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="321.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Why: TCP has no idea a phone lost signal or a NAT dropped the mapping. Dead sockets keep memory,</text><text x="400" y="336" font-size="11.5" text-anchor="middle" fill="#1e293b">wrong presence ("online"), and messages sent into the void. Load balancers also close idle connections</text><text x="400" y="350.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(AWS ALB default 60 s): heartbeats keep them busy.</text></svg>