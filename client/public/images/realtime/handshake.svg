nospace" xml:space="preserve" style="white-space:pre">Upgrade: websocket</text><text x="424" y="129.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Connection: Upgrade</text><text x="424" y="143.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Sec-WebSocket-Accept:</text><text x="424" y="157.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  base64(SHA-1(key + GUID))</text><text x="424" y="171.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(measured: matches)</text><line x1="390" y1="120" x2="410" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="228" width="170" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="115" y="250.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CONNECTING</text><line x1="200" y1="246" x2="220" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="220" y="228" width="170" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="305" y="250.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">OPEN</text><line x1="390" y1="246" x2="410" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="410" y="228" width="170" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="495" y="250.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CLOSING</text><line x1="580" y1="246" x2="600" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="600" y="228" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="685" y="250.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CLOSED</text><text x="400" y="290" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured frame size for a 20-byte message</text><text x="220" y="311.5" font-size="11.5" text-anchor="end" fill="#475569">ws server → client</text><rect x="230" y="300" width="88" height="15" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="324" y="311.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">22 bytes (2-byte header)</text><text x="220" y="330.5" font-size="11.5" text-anchor="end" fill="#475569">ws client → server</text><rect x="230" y="319" width="104" height="15" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="340" y="330.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">26 bytes (+4-byte mask)</text><text x="220" y="349.5" font-size="11.5" text-anchor="end" fill="#475569">Socket.IO server → client</text><rect x="230" y="338" width="164" height="15" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="349.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">41 bytes (event name + packet type)</text><text x="220" y="368.5" font-size="11.5" text-anchor="end" fill="#475569">Socket.IO client → server</text><rect x="230" y="357" width="180" height="15" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="416" y="368.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">45 bytes</text></svg>