<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Next.js combines React with routing, server components, rendering strategies, server actions, route handlers, asset optimisation and bundling into a full-stack framework"><title>Next.js combines React with routing, server components, rendering strategies, server actions, route handlers, asset optimisation and bundling into a full-stack framework</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What Next.js adds to React</text><rect x="30" y="70" width="220" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="118.6" font-size="13" text-anchor="middle" fill="#1e293b">React (library)</text><text x="140" y="134.6" font-size="13" text-anchor="middle" fill="#1e293b">components, state,</text><text x="140" y="150.6" font-size="13" text-anchor="middle" fill="#1e293b">rendering UI</text><text x="290" y="132" font-size="30" text-anchor="middle" fill="#475569" font-weight="700">+</text><rect x="330" y="62" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="81" font-size="11.5" text-anchor="middle" fill="#1e293b">File-based routing + layouts</text><rect x="330" y="96" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b">Server Components + streaming</text><rect x="330" y="130" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="149" font-size="11.5" text-anchor="middle" fill="#1e293b">Static, dynamic and cached rendering</text><rect x="330" y="164" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="183" font-size="11.5" text-anchor="middle" fill="#1e293b">Server Actions + Route Handlers</text><rect x="330" y="198" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="217" font-size="11.5" text-anchor="middle" fill="#1e293b">Image, font, metadata optimisation</text><rect x="330" y="232" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="251" font-size="11.5" text-anchor="middle" fill="#1e293b">Bundling (Turbopack), code splitting</text><rect x="330" y="266" width="260" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="460" y="285" font-size="11.5" text-anchor="middle" fill="#1e293b">Proxy (runs before requests)</text><line x1="592" y1="180" x2="622" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="626" y="120" width="150" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="701" y="168.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Next.js</text><text x="701" y="184.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">= full-stack</text><text x="701" y="200.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">React framework</text><rect x="30" y="312" width="740" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="340.7" font-size="12" text-anchor="middle" fill="#1e293b">Vite SPA: the browser downloads JS, then fetches data, then renders (blank page first).</text><text x="400" y="355.7" font-size="12" text-anchor="middle" fill="#1e293b">Next.js: HTML (with data) comes from the server or CDN, then React hydrates only the interactive parts.</text></svg>