<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Requests pass through proxy.ts for redirects, rewrites and headers, then reach a page or a route handler exporting GET or POST; when to use route handlers, server actions or server components"><title>Requests pass through proxy.ts for redirects, rewrites and headers, then reach a page or a route handler exporting GET or POST; when to use route handlers, server actions or server components</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Route Handlers and Proxy</text><rect x="30" y="66" width="160" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="110" y="95.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Request</text><line x1="192" y1="91" x2="226" y2="91" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="230" y="66" width="230" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="345" y="95.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">proxy.ts (was middleware)</text><line x1="462" y1="91" x2="496" y2="91" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="500" y="66" width="270" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="635" y="95.4" font-size="12.5" text-anchor="middle" fill="#1e293b">route: page or route.ts</text><rect x="230" y="130" width="230" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="345" y="160" font-size="11.5" text-anchor="middle" fill="#1e293b">redirects, rewrites,</text><text x="345" y="174.5" font-size="11.5" text-anchor="middle" fill="#1e293b">headers, A/B tests,</text><text x="345" y="189" font-size="11.5" text-anchor="middle" fill="#1e293b">optimistic auth check</text><text x="345" y="203.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(cookie present?)</text><text x="345" y="218" font-size="11.5" text-anchor="middle" fill="#1e293b">NOT slow data / full auth</text><rect x="500" y="130" width="270" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="514" y="167.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">app/api/users/route.ts</text><text x="514" y="181.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">export async function GET(req)</text><text x="514" y="195.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">export async function POST(req)</text><text x="514" y="209.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">→ Response.json(...)</text><rect x="30" y="262" width="740" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">Use Route Handlers for: webhooks, public/mobile APIs, file downloads, OAuth callbacks.</text><text x="400" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b">Use Server Actions for: mutations triggered by your own UI.</text><text x="400" y="331.2" font-size="12" text-anchor="middle" fill="#1e293b">Use Server Components for: reading data for pages (no API needed).</text></svg>