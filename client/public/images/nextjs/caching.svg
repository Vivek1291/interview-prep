<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The use cache directive caches a function or component keyed by its arguments with a cacheLife lifetime and cacheTag tags; updateTag, revalidateTag, revalidatePath and cacheLife invalidate or refresh it"><title>The use cache directive caches a function or component keyed by its arguments with a cacheLife lifetime and cacheTag tags; updateTag, revalidateTag, revalidatePath and cacheLife invalidate or refresh it</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Caching in Next.js 16: 'use cache'</text><rect x="30" y="66" width="330" height="140" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="44" y="102.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">async function getProducts() {</text><text x="44" y="117.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  'use cache'</text><text x="44" y="132.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  cacheLife('hours')</text><text x="44" y="147.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  cacheTag('products')</text><text x="44" y="162.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  return db.products.findMany()</text><text x="44" y="177.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><line x1="362" y1="136" x2="400" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="404" y="66" width="366" height="140" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="587" y="110.2" font-size="12" text-anchor="middle" fill="#1e293b">Cache entry</text><text x="587" y="125.2" font-size="12" text-anchor="middle" fill="#1e293b">key = function + arguments</text><text x="587" y="140.2" font-size="12" text-anchor="middle" fill="#1e293b">lifetime = cacheLife profile</text><text x="587" y="155.2" font-size="12" text-anchor="middle" fill="#1e293b">tags = products</text><text x="587" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">(part of the static shell)</text><rect x="30" y="226" width="300" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="180" y="246" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">updateTag('products')</text><rect x="336" y="226" width="434" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="246" font-size="11.5" text-anchor="middle" fill="#1e293b">Server Action: expire now, user sees own write</text><rect x="30" y="264" width="300" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="180" y="284" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">revalidateTag('products', 'max')</text><rect x="336" y="264" width="434" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="284" font-size="11.5" text-anchor="middle" fill="#1e293b">stale-while-revalidate in the background</text><rect x="30" y="302" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="322" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">revalidatePath('/shop')</text><rect x="336" y="302" width="434" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="322" font-size="11.5" text-anchor="middle" fill="#1e293b">everything for a path (less precise)</text><rect x="30" y="340" width="300" height="32" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="180" y="360" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">cacheLife('minutes')</text><rect x="336" y="340" width="434" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="553" y="360" font-size="11.5" text-anchor="middle" fill="#1e293b">time-based refresh</text></svg>