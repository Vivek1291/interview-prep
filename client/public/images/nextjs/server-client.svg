<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Server components run only on the server and ship no JavaScript; client components hydrate in the browser. Measured: marked in a server component added 0 KB, in a client component 11.7 KB gzipped"><title>Server components run only on the server and ship no JavaScript; client components hydrate in the browser. Measured: marked in a server component added 0 KB, in a client component 11.7 KB gzipped</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Server Components vs Client Components</text><rect x="30" y="66" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="44" y="115.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Server Component (default)</text><text x="44" y="130.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• runs on the server only</text><text x="44" y="145.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• async/await data, DB, secrets OK</text><text x="44" y="160.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• its code never ships to the browser</text><text x="44" y="175.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• no state, effects, event handlers</text><rect x="410" y="66" width="360" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="424" y="115.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Client Component ('use client')</text><text x="424" y="130.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• prerendered to HTML, then hydrated</text><text x="424" y="145.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• useState, useEffect, onClick, browser APIs</text><text x="424" y="160.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• its code + imports ship as JS</text><text x="424" y="175.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• put the boundary as low as possible</text><text x="400" y="244" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured (Next 16, production): rendering 20 Markdown sections with the marked library</text><text x="250" y="280" font-size="12" text-anchor="end" fill="#475569">in a Server Component</text><rect x="260" y="266" width="291.1" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="559.1" y="282" font-size="12" text-anchor="start" fill="#475569" font-weight="700">132.3 KB (+0 KB)</text><text x="250" y="320" font-size="12" text-anchor="end" fill="#475569">in a Client Component</text><rect x="260" y="306" width="316.8" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="584.8" y="322" font-size="12" text-anchor="start" fill="#475569" font-weight="700">144 KB (+11.7 KB)</text><text x="400" y="352" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Baseline 132 KB = React + Next.js runtime; server-only libraries add nothing to it.</text></svg>