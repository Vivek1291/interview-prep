<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Metadata API and file conventions for SEO, next/image for responsive lazy images without layout shift, next/font for self-hosted fonts, and how they improve Core Web Vitals"><title>Metadata API and file conventions for SEO, next/image for responsive lazy images without layout shift, next/font for self-hosted fonts, and how they improve Core Web Vitals</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Metadata, next/image and next/font</text><rect x="30" y="66" width="240" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="150" y="90.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Metadata / SEO</text><rect x="30" y="112" width="240" height="130" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="152.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">export const metadata</text><text x="44" y="166.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">= { title, description }</text><text x="44" y="180.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">generateMetadata()</text><text x="44" y="194.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">opengraph-image.tsx</text><text x="44" y="208.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">sitemap.ts, robots.ts</text><rect x="280" y="66" width="240" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="90.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">next/image</text><rect x="280" y="112" width="240" height="130" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="294" y="152.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">&lt;Image src width height</text><text x="294" y="166.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  alt fetchPriority='high' /&gt;</text><text x="294" y="180.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">resizes, WebP/AVIF,</text><text x="294" y="194.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">lazy by default,</text><text x="294" y="208.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">reserves space (no CLS)</text><rect x="530" y="66" width="240" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="90.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">next/font</text><rect x="530" y="112" width="240" height="130" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="544" y="152.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Inter({ subsets: ['latin'] })</text><text x="544" y="166.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">self-hosted at build,</text><text x="544" y="180.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">no extra request,</text><text x="544" y="194.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">no layout shift</text><text x="544" y="208.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(size-adjust)</text><rect x="30" y="266" width="740" height="96" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="303.2" font-size="12" text-anchor="middle" fill="#1e293b">Core Web Vitals wins: LCP → fetchPriority=&quot;high&quot; on the hero Image, Server Components (less JS);</text><text x="400" y="318.2" font-size="12" text-anchor="middle" fill="#1e293b">CLS → width/height on images, next/font; INP → smaller client bundles, split client components;</text><text x="400" y="333.2" font-size="12" text-anchor="middle" fill="#1e293b">TTFB → static/cached rendering at the edge/CDN.</text></svg>