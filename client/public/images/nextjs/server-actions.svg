<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A server action marked use server is called from a form action, runs on the server, validates and writes data, then invalidates caches; useActionState and useOptimistic help on the client; each action is a public endpoint"><title>A server action marked use server is called from a form action, runs on the server, validates and writes data, then invalidates caches; useActionState and useOptimistic help on the client; each action is a public endpoint</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Server Actions: mutations without an API layer</text><rect x="30" y="66" width="330" height="150" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="44" y="101.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">async function addTodo(formData) {</text><text x="44" y="116" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  'use server'</text><text x="44" y="130.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  const session = await auth()</text><text x="44" y="145" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  if (!session) throw new Error('401')</text><text x="44" y="159.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  await db.todo.create(…)</text><text x="44" y="174" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  updateTag('todos')</text><text x="44" y="188.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><rect x="420" y="66" width="350" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="595" y="100.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;form action={addTodo}&gt;</text><line x1="595" y1="128" x2="595" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="420" y="154" width="350" height="62" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="595" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b">POST to the server (works even</text><text x="595" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">before JS loads: progressive)</text><rect x="30" y="236" width="740" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="267.7" font-size="12" text-anchor="middle" fill="#1e293b">Client side: useActionState(action, initial) gives [state, formAction, isPending];</text><text x="400" y="282.7" font-size="12" text-anchor="middle" fill="#1e293b">useFormStatus() for the submit button; useOptimistic() for instant UI.</text><rect x="30" y="320" width="740" height="56" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="352.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Security: every action is a PUBLIC endpoint. Validate input (zod), check auth and permissions inside it.</text></svg>