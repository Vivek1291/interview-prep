="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="115" y="270.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Client-side (CSR)</text><rect x="206" y="246" width="290" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="351" y="270" font-size="11.5" text-anchor="middle" fill="#1e293b">rendered in the browser after JS loads</text><rect x="502" y="246" width="170" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="587" y="270" font-size="11.5" text-anchor="middle" fill="#1e293b">highly interactive widgets</text><rect x="678" y="246" width="92" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="724" y="269.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">client</text><text x="400" y="312" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured on next start (local): time to first byte / full response</text><text x="400" y="336" font-size="12" text-anchor="middle" fill="#475569">static 3.6 ms · use cache (400 ms data) 1.5 ms · streamed shell 5.1 ms, data at 416 ms · route handler 1.7 ms</text><text x="400" y="362" font-size="11.5" text-anchor="middle" fill="#475569" font-style="italic">Next 16 decides per component: cached parts join the static shell, uncached parts stream inside &lt;Suspense&gt;.</text></svg>