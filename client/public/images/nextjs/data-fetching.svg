<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Sequential awaits create waterfalls while Promise.all fetches in parallel; Suspense and loading.tsx stream slow parts; React.cache dedupes requests"><title>Sequential awaits create waterfalls while Promise.all fetches in parallel; Suspense and loading.tsx stream slow parts; React.cache dedupes requests</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Fetching data in the App Router</text><text x="205" y="70" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">Sequential (waterfall)</text><rect x="40" y="84" width="140" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="110" y="102.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await getUser()</text><rect x="180" y="120" width="140" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="250" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await getPosts()</text><rect x="320" y="156" width="60" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="350" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">render</text><text x="595" y="70" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">Parallel</text><rect x="430" y="84" width="140" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="500" y="102.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getUser()</text><rect x="430" y="120" width="140" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="500" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getPosts()</text><rect x="580" y="100" width="190" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="675" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await Promise.all</text><rect x="40" y="210" width="340" height="100" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="210" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b">Streaming: wrap slow parts in</text><text x="210" y="256.7" font-size="12" text-anchor="middle" fill="#1e293b">&lt;Suspense fallback={…}&gt; (or loading.tsx).</text><text x="210" y="271.7" font-size="12" text-anchor="middle" fill="#1e293b">The shell is sent first, slow data</text><text x="210" y="286.7" font-size="12" text-anchor="middle" fill="#1e293b">streams in when ready.</text><rect x="420" y="210" width="350" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="595" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b">Dedupe: React.cache(fn) runs once per</text><text x="595" y="256.7" font-size="12" text-anchor="middle" fill="#1e293b">request; fetch() in Server Components</text><text x="595" y="271.7" font-size="12" text-anchor="middle" fill="#1e293b">is memoised too. Fetch where you need</text><text x="595" y="286.7" font-size="12" text-anchor="middle" fill="#1e293b">it, no prop drilling.</text><text x="400" y="346" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Server Components fetch directly (DB, fetch, ORM). Client Components use use(promise) or SWR / React Query.</text></svg>