<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Link prefetches routes in the viewport and navigates on the client; useRouter for programmatic navigation; redirect and notFound on the server; layouts persist across navigations"><title>Link prefetches routes in the viewport and navigates on the client; useRouter for programmatic navigation; redirect and notFound on the server; layouts persist across navigations</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Linking and navigating</text><rect x="30" y="66" width="230" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="100.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Link href=&quot;/blog&quot;&gt;</text><line x1="262" y1="96" x2="300" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="304" y="66" width="210" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="409" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">in viewport →</text><text x="409" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">prefetch the route</text><line x1="516" y1="96" x2="554" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="558" y="66" width="212" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="664" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">click → client-side</text><text x="664" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">navigation, no reload</text><rect x="30" y="150" width="360" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="44" y="194.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Client: useRouter() → router.push('/x')</text><text x="44" y="209" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">usePathname(), useSearchParams()</text><text x="44" y="223.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(from next/navigation)</text><rect x="410" y="150" width="360" height="110" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="424" y="194.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Server: redirect('/login'), notFound()</text><text x="424" y="209" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">permanentRedirect()</text><text x="424" y="223.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">next.config redirects for static rules</text><rect x="30" y="280" width="740" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="316.7" font-size="12" text-anchor="middle" fill="#1e293b">Shared layouts are NOT re-rendered on navigation (their state survives); only the changed segment loads.</text><text x="400" y="331.7" font-size="12" text-anchor="middle" fill="#1e293b">loading.tsx shows instantly while the next page streams in.</text></svg>