<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Folders under app define routes; layout, page, loading, error, not-found and route files have special roles; dynamic segments use brackets and route groups use parentheses"><title>Folders under app define routes; layout, page, loading, error, not-found and route files have special roles; dynamic segments use brackets and route groups use parentheses</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">App Router: folders are routes</text><rect x="40" y="60" width="470" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="54" y="76.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">app/</text><rect x="74" y="90" width="436" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="88" y="106.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">layout.tsx   → root layout (html, body)</text><rect x="74" y="120" width="436" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="88" y="136.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">page.tsx     → /</text><rect x="74" y="150" width="436" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="88" y="166.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">blog/</text><rect x="108" y="180" width="402" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="122" y="196.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">page.tsx       → /blog</text><rect x="108" y="210" width="402" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="122" y="226.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">[slug]/page.tsx → /blog/:slug  (await params)</text><rect x="108" y="240" width="402" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="122" y="256.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">loading.tsx    → Suspense fallback</text><rect x="108" y="270" width="402" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="122" y="286.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">error.tsx      → error boundary (client)</text><rect x="74" y="300" width="436" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="88" y="316.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(marketing)/about/page.tsx → /about (group)</text><rect x="74" y="330" width="436" height="26" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="88" y="346.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">api/users/route.ts → GET /api/users</text><rect x="74" y="360" width="436" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="88" y="376.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">not-found.tsx → 404 UI</text><rect x="540" y="60" width="230" height="150" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="554" y="102.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Nesting:</text><text x="554" y="117.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">RootLayout</text><text x="554" y="131.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"> └ BlogLayout</text><text x="554" y="146.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">    └ Suspense(loading)</text><text x="554" y="160.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">       └ ErrorBoundary</text><text x="554" y="175.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">          └ page</text><rect x="540" y="226" width="230" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="655" y="257.7" font-size="12" text-anchor="middle" fill="#1e293b">Layouts persist across</text><text x="655" y="272.7" font-size="12" text-anchor="middle" fill="#1e293b">navigations (state kept);</text><text x="655" y="287.7" font-size="12" text-anchor="middle" fill="#1e293b">only the page segment</text><text x="655" y="302.7" font-size="12" text-anchor="middle" fill="#1e293b">re-renders</text></svg>