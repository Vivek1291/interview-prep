<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Status codes"><title>Status codes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The first word of every reply</text><rect x="25" y="80" width="170" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="110" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2xx</text><text x="110" y="129.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">done</text><text x="110" y="180" font-size="12" text-anchor="middle" fill="#1e293b">200 OK</text><text x="110" y="202" font-size="12" text-anchor="middle" fill="#1e293b">201 Created</text><text x="110" y="224" font-size="12" text-anchor="middle" fill="#1e293b">202 Accepted</text><text x="110" y="246" font-size="12" text-anchor="middle" fill="#1e293b">204 No Content</text><rect x="220" y="80" width="170" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="305" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3xx</text><text x="305" y="129.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">look elsewhere</text><text x="305" y="180" font-size="12" text-anchor="middle" fill="#1e293b">301/308 moved</text><text x="305" y="202" font-size="12" text-anchor="middle" fill="#1e293b">302/307 temporary</text><text x="305" y="224" font-size="12" text-anchor="middle" fill="#1e293b">304 not modified</text><rect x="415" y="80" width="170" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4xx</text><text x="500" y="129.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">your mistake</text><text x="500" y="180" font-size="12" text-anchor="middle" fill="#1e293b">400 bad input</text><text x="500" y="202" font-size="12" text-anchor="middle" fill="#1e293b">401 who are you?</text><text x="500" y="224" font-size="12" text-anchor="middle" fill="#1e293b">403 not allowed</text><text x="500" y="246" font-size="12" text-anchor="middle" fill="#1e293b">404 · 409 · 429</text><rect x="610" y="80" width="170" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="695" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5xx</text><text x="695" y="129.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">our mistake</text><text x="695" y="180" font-size="12" text-anchor="middle" fill="#1e293b">500 bug</text><text x="695" y="202" font-size="12" text-anchor="middle" fill="#1e293b">502 app down</text><text x="695" y="224" font-size="12" text-anchor="middle" fill="#1e293b">503 overloaded</text><text x="695" y="246" font-size="12" text-anchor="middle" fill="#1e293b">504 too slow</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">401 = not authenticated · 403 = authenticated but forbidden</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Retry 429/503 after Retry-After; do not retry other 4xx</text></svg>