xt><rect x="40" y="75" width="360" height="230" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="194.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="55" y="102" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ &quot;data&quot;: {</text><text x="55" y="128" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;id&quot;: &quot;66f1c0a2&quot;,</text><text x="55" y="154" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;price&quot;: { &quot;amount&quot;: 49900,</text><text x="55" y="180" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">               &quot;currency&quot;: &quot;INR&quot; },</text><text x="55" y="206" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &quot;createdAt&quot;:</text><text x="55" y="232" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">      &quot;2026-09-30T04:00:00.000Z&quot;</text><text x="55" y="258" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  },</text><text x="55" y="284" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  &quot;pagination&quot;: { ... } }</text><rect x="440" y="80" width="320" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="600" y="102.6" font-size="13" text-anchor="middle" fill="#1e293b">ids as strings</text><rect x="440" y="126" width="320" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="600" y="148.6" font-size="13" text-anchor="middle" fill="#1e293b">money in minor units</text><rect x="440" y="172" width="320" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="600" y="194.6" font-size="13" text-anchor="middle" fill="#1e293b">ISO-8601 UTC dates</text><rect x="440" y="218" width="320" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="600" y="240.6" font-size="13" text-anchor="middle" fill="#1e293b">DTO: no passwordHash, __v</text><rect x="440" y="264" width="320" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600" y="286.6" font-size="13" text-anchor="middle" fill="#1e293b">Location · ETag · X-Request-Id</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Same envelope on every endpoint → one API client on the frontend</text></svg>