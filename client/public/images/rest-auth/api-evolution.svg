<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Non-breaking changes such as adding optional fields versus breaking changes such as renaming fields; merge patch vs JSON patch, bulk endpoints with per-item results, and deprecation headers"><title>Non-breaking changes such as adding optional fields versus breaking changes such as renaming fields; merge patch vs JSON patch, bulk endpoints with per-item results, and deprecation headers</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Evolving an API without breaking clients</text><rect x="30" y="60" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b">NON-BREAKING (ship any time)</text><text x="210" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="210" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">• add an optional field / endpoint</text><text x="210" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">• add an enum value clients ignore</text><text x="210" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">• make a required input optional</text><text x="210" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">• new response header</text><rect x="410" y="60" width="360" height="150" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b">BREAKING (needs a new version)</text><text x="590" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="590" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">• remove or rename a field</text><text x="590" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">• change a type (id: number → string)</text><text x="590" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">• make an optional input required</text><text x="590" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">• change status codes or error codes</text><rect x="30" y="226" width="260" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="245.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">PATCH merge-patch+json</text><rect x="296" y="226" width="474" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="245.9" font-size="11" text-anchor="middle" fill="#1e293b">{ "bio": "hi", "avatarUrl": null } → set bio, delete avatarUrl</text><rect x="30" y="263" width="260" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">PATCH json-patch+json</text><rect x="296" y="263" width="474" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">[{ "op": "replace", "path": "/bio", "value": "hi" }] → precise ops</text><rect x="30" y="300" width="260" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">POST /orders/bulk</text><rect x="296" y="300" width="474" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">207-style result: per-item status, partial success, max 100 items</text><rect x="30" y="337" width="260" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Deprecation + Sunset headers</text><rect x="296" y="337" width="474" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="533" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b">announce removal dates; track who still calls the old version</text></svg>