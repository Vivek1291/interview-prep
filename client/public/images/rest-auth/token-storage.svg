<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Token storage"><title>Token storage</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Where to keep the key</text><rect x="30" y="80" width="230" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="145" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">localStorage</text><text x="145" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(doormat)</text><text x="145" y="152.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">any injected script</text><text x="145" y="168.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">can read it</text><rect x="285" y="80" width="230" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">httpOnly cookie</text><text x="400" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(manager's locker)</text><text x="400" y="152.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">JS cannot read it;</text><text x="400" y="168.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">mind CSRF: SameSite</text><rect x="540" y="80" width="230" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="655" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">memory</text><text x="655" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(pocket)</text><text x="655" y="152.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">gone on reload;</text><text x="655" y="168.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">refresh to get a new one</text><rect x="150" y="240" width="500" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="266.6" font-size="13" text-anchor="middle" fill="#1e293b">SPA: access token in memory + refresh token in an</text><text x="400" y="282.6" font-size="13" text-anchor="middle" fill="#1e293b">httpOnly, Secure, SameSite cookie, rotated with reuse detection</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">No storage survives a live XSS attack completely: also prevent XSS (CSP, escaping)</text></svg>