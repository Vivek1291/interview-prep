<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Session vs JWT"><title>Session vs JWT</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Coat check (session) vs signed wristband (JWT)</text><text x="200" y="75" font-size="15" text-anchor="middle" fill="#8b5cf6" font-weight="700">Session</text><text x="600" y="75" font-size="15" text-anchor="middle" fill="#14b8a6" font-weight="700">JWT</text><rect x="50" y="95" width="140" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">cookie sid=abc</text><rect x="220" y="95" width="140" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="290" y="124.6" font-size="13" text-anchor="middle" fill="#1e293b">server</text><rect x="130" y="190" width="150" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="205" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">Redis: abc →</text><text x="205" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b">user 42, role</text><line x1="190" y1="120" x2="216" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="290" y1="145" x2="230" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="95" width="170" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="525" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Bearer h.p.sig</text><rect x="630" y="95" width="130" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="695" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">any server:</text><text x="695" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">verify sig + exp</text><line x1="610" y1="120" x2="626" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="600" y="205" font-size="12" text-anchor="middle" fill="#475569">no lookup</text><rect x="40" y="270" width="340" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="296.2" font-size="12" text-anchor="middle" fill="#1e293b">revoke instantly · ~125 µs lookup (local Redis)</text><rect x="420" y="270" width="340" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="296.2" font-size="12" text-anchor="middle" fill="#1e293b">hard to revoke · ~22 µs verify (HS256)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Hybrid: short access JWT + server-stored, rotated refresh token</text></svg>