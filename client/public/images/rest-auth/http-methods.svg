<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="HTTP methods"><title>HTTP methods</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Safe, idempotent, or neither?</text><rect x="40" y="80" width="220" height="100" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="150" y="118.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">SAFE</text><text x="150" y="134.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(no state change)</text><text x="150" y="150.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">GET · HEAD · OPTIONS</text><rect x="290" y="80" width="220" height="100" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="118.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">IDEMPOTENT</text><text x="400" y="134.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(repeat = same state)</text><text x="400" y="150.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">PUT · DELETE</text><rect x="540" y="80" width="220" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="650" y="118.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">NOT GUARANTEED</text><text x="650" y="134.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">POST · PATCH</text><text x="650" y="150.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(increments, appends)</text><text x="150" y="210" font-size="12" text-anchor="middle" fill="#475569">read a page</text><text x="400" y="210" font-size="12" text-anchor="middle" fill="#475569">rewrite / tear out a page</text><text x="650" y="210" font-size="12" text-anchor="middle" fill="#475569">add a new page</text><rect x="170" y="250" width="460" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="271.6" font-size="13" text-anchor="middle" fill="#1e293b">Retries are safe for the first two columns;</text><text x="400" y="287.6" font-size="13" text-anchor="middle" fill="#1e293b">POST needs an Idempotency-Key</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Safe methods are also idempotent and (GET, HEAD) cacheable</text></svg>