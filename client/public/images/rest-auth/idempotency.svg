<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Idempotency"><title>Idempotency</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Same ticket number → same receipt, one charge</text><line x1="140" y1="197" x2="257" y2="197" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="198.5" y="187" font-size="11" text-anchor="middle" fill="#475569">Idempotency-Key</text><line x1="390" y1="197" x2="480" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="390" y1="197" x2="480" y2="257" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="435" y="221" font-size="11" text-anchor="middle" fill="#475569">first time</text><line x1="560" y1="107" x2="700" y2="167" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><text x="630" y="131" font-size="11" text-anchor="middle" fill="#475569">repeat</text><rect x="20" y="170" width="120" height="54" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="80" y="193.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">client</text><text x="80" y="208.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">retries x3</text><rect x="260" y="170" width="130" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="325" y="193.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API</text><text x="325" y="208.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">claim key (NX)</text><rect x="400" y="80" width="160" height="54" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="480" y="103.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">key store</text><text x="480" y="118.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">user:abc → done</text><rect x="400" y="260" width="160" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="480" y="283.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">charge card</text><text x="480" y="298.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(once)</text><rect x="620" y="170" width="160" height="54" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="700" y="193.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">replay stored</text><text x="700" y="208.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">201 response</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Without a key: 3 retries = 3 charges · with one key: 1 charge, 2 replays</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Processing → 409 · same key, different body → 422</text></svg>