<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Bars 1 2 1 3 5 6 4; at index 3 the slope rises, so the peak 6 is on the right"><title>Bars 1 2 1 3 5 6 4; at index 3 the slope rises, so the peak 6 is on the right</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Find Peak Element: walk uphill with binary search</text><rect x="100" y="284" width="60" height="36" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="278" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><text x="130" y="336" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="180" y="248" width="60" height="72" rx="3" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="210" y="242" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><text x="210" y="336" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="260" y="284" width="60" height="36" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="290" y="278" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><text x="290" y="336" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="340" y="212" width="60" height="108" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="370" y="206" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><text x="370" y="336" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="420" y="140" width="60" height="180" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="450" y="134" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><text x="450" y="336" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="500" y="104" width="60" height="216" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="530" y="98" font-size="14" text-anchor="middle" fill="#1e293b" 