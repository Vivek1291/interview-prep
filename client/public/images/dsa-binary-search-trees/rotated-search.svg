<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="In 4 5 6 7 0 1 2 the left half is sorted and does not contain 0, so search right"><title>In 4 5 6 7 0 1 2 the left half is sorted and does not contain 0, so search right</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Search in Rotated Sorted Array</text><text x="400" y="66" font-size="14" text-anchor="middle" fill="#475569">target = 0. At least one half around mid is always sorted.</text><rect x="130" y="100" width="70" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="165" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="200" y="100" width="70" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="235" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="270" y="100" width="70" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="305" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><rect x="340" y="100" width="70" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="375" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><rect x="410" y="100" width="70" height="44" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="445" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="480" y="100" width="70" height="44" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="515" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="550" y="100" width="70" height="44" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="585" y="127.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="165" y="164" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">lo</text><text x="375" y="164" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">mid</text><text x="585" y="164" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">hi</text><text x="235" y="92" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">left half sorted: 4..7</text><text x="515" y="92" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">rotated part</text><text x="400" y="220" font-size="14" text-anchor="middle" fill="#475569">nums[lo] ≤ nums[mid] → left half [4..7] is sorted.</text><text x="400" y="246" font-size="14" text-anchor="middle" fill="#475569">Is 0 inside [4, 7]? No → search the right half (lo = mid + 1).</text><text x="400" y="290" font-size="13" text-anchor="middle" fill="#475569">Then [0, 1, 2]: mid = 1 &gt; 0 and 0 is in the sorted left part → found at index 4 ✅</text><text x="400" y="350" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Still O(log n): each step discards half, just with one extra &quot;which half is sorted?&quot; check.</text></svg>