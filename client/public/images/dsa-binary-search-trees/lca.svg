<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Tree rooted at 3; nodes 5 and 1 are on different sides, so their LCA is 3"><title>Tree rooted at 3; nodes 5 and 1 are on different sides, so their LCA is 3</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Lowest Common Ancestor</text><line x1="283.8" y1="111.8" x2="208.6" y2="166.5" stroke="#64748b" stroke-width="2"/><line x1="316.2" y1="111.8" x2="391.4" y2="166.5" stroke="#64748b" stroke-width="2"/><line x1="178" y1="196" x2="143.8" y2="241.6" stroke="#64748b" stroke-width="2"/><line x1="202" y1="196" x2="236.2" y2="241.6" stroke="#64748b" stroke-width="2"/><line x1="399.4" y1="197" x2="372.2" y2="240.5" stroke="#64748b" stroke-width="2"/><line x1="420.6" y1="197" x2="447.8" y2="240.5" stroke="#64748b" stroke-width="2"/><line x1="241.1" y1="277.9" x2="220.3" y2="319.4" stroke="#64748b" stroke-width="2"/><line x1="258.9" y1="277.9" x2="279.7" y2="319.4" stroke="#64748b" stroke-width="2"/><circle cx="360" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="360" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">0</text><circle cx="410" cy="180" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="410" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="250" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="250" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="300" cy="100" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="300" y="105" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="290" cy="340" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="290" y="345" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><circle cx="190" cy="180" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="190" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><circle cx="130" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="130" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">6</text><circle cx="210" cy="340" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="210" y="345" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><circle cx="460" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="460" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">8</text><text x="600" y="120" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">p = 5, q = 1 → LCA = 3</text><text x="600" y="160" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Recursion returns:</text><text x="600" y="182" font-size="12" text-anchor="middle" fill="#475569">• p or q if found in that subtree</text><text x="600" y="202" font-size="12" text-anchor="middle" fill="#475569">• null if neither is there</text><text x="600" y="230" font-size="13" text-anchor="middle" fill="#475569">Left AND right non-null →</text><text x="600" y="250" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">this node is the LCA</text><text x="600" y="300" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">p = 5, q = 4 → LCA = 5</text><text x="600" y="320" font-size="12" text-anchor="middle" fill="#475569">(a node is its own ancestor)</text></svg>