 text-anchor="middle" fill="#1e293b" font-weight="700">Maximum Depth of Binary Tree</text><line x1="245.9" y1="124.1" x2="186.3" y2="183.7" stroke="#64748b" stroke-width="2"/><line x1="274.1" y1="124.1" x2="333.7" y2="183.7" stroke="#64748b" stroke-width="2"/><line x1="340.3" y1="217.5" x2="311.2" y2="269.9" stroke="#64748b" stroke-width="2"/><line x1="359.7" y1="217.5" x2="388.8" y2="269.9" stroke="#64748b" stroke-width="2"/><circle cx="260" cy="110" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="260" y="115" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="400" cy="290" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="400" y="295" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><circle cx="170" cy="200" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="170" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">9</text><circle cx="300" cy="290" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="300" y="295" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">15</text><circle cx="350" cy="200" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="350" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">20</text><text x="80" y="115" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">depth 1</text><text x="80" y="205" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">depth 2</text><text x="80" y="295" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">depth 3</text><text x="560" y="120" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">depth(node) =</text><text x="560" y="145" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1 + max(depth(left), depth(right))</text><text x="560" y="175" font-size="13" text-anchor="middle" fill="#4755