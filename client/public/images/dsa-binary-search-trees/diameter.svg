<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Tree 1 2 3 4 5; longest path 4-2-1-3 has 3 edges"><title>Tree 1 2 3 4 5; longest path 4-2-1-3 has 3 edges</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Diameter / Balanced Binary Tree: heights from the bottom up</text><line x1="246.3" y1="124.6" x2="195.8" y2="178.3" stroke="#64748b" stroke-width="2"/><line x1="273.7" y1="124.6" x2="324.2" y2="178.3" stroke="#64748b" stroke-width="2"/><line x1="169.9" y1="212.2" x2="141.7" y2="260.2" stroke="#64748b" stroke-width="2"/><line x1="190.1" y1="212.2" x2="218.3" y2="260.2" stroke="#64748b" stroke-width="2"/><circle cx="260" cy="110" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="260" y="115" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="180" cy="195" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="180" y="200" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="340" cy="195" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="340" y="200" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="130" cy="280" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="130" y="285" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><circle cx="230" cy="280" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="230" y="285" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><text x="130" y="320" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">h=1</text><text x="230" y="320" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">h=1</text><text x="140" y="195" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">h=2</text><text x="380" y="195" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">h=1</text><text x="305" y="105" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">h=3</text><text x="580" y="110" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">longest path 4 → 2 → 1 → 3</text><text x="580" y="132" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">= 3 edges</text><text x="580" y="175" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">At each node:</text><text x="580" y="197" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">path through it = h(left) + h(right)</text><text x="580" y="219" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">return height = 1 + max(h(l), h(r))</text><text x="580" y="260" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Balanced: |h(left) − h(right)| ≤ 1</text><text x="580" y="280" font-size="12" text-anchor="middle" fill="#475569">at every node (same recursion)</text><text x="400" y="365" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">One post-order DFS computes heights and the best answer → O(n).</text></svg>