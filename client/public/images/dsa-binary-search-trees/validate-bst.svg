<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Tree 5 with right child 4: 4 is not greater than 5, so the tree is not a BST"><title>Tree 5 with right child 4: 4 is not greater than 5, so the tree is not a BST</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Validate BST: every node must fit its range</text><line x1="216.7" y1="124.9" x2="165.3" y2="182.8" stroke="#64748b" stroke-width="2"/><line x1="243.3" y1="124.9" x2="294.7" y2="182.8" stroke="#64748b" stroke-width="2"/><line x1="300.3" y1="217.5" x2="271.2" y2="269.9" stroke="#64748b" stroke-width="2"/><line x1="319.7" y1="217.5" x2="348.8" y2="269.9" stroke="#64748b" stroke-width="2"/><circle cx="150" cy="200" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="150" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="260" cy="290" r="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="260" y="295" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="310" cy="200" r="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="310" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><circle cx="230" cy="110" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="230" y="115" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><circle cx="360" cy="290" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="360" y="295" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">6</text><text x="150" y="240" font-size="12" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,Consolas,monospace">(−∞, 5)</text><text x="330" y="240" font-size="12" text-anchor="middle" fill="#ef4444" font-family="ui-monospace,Menlo,Consolas,monospace">must be in (5, +∞)</text><text x="560" y="120" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">Checking only parent vs child is NOT enough.</text><text x="560" y="150" font-size="13" text-anchor="middle" fill="#475569">Pass a valid range (low, high) down:</text><text x="560" y="175" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">left child → (low, node.val)</text><text x="560" y="198" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">right child → (node.val, high)</text><text x="560" y="240" font-size="13" text-anchor="middle" fill="#475569">4 is in the right subtree of 5</text><text x="560" y="260" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">but 4 &lt; 5 → invalid ❌</text><text x="400" y="365" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Or: an inorder traversal of a valid BST is strictly increasing.</text></svg>