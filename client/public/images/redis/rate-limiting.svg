<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Fixed window, sliding log, sliding window counter, token bucket and leaky bucket; measured fixed window allowing 20 of 20 requests across a window boundary while sliding log and token bucket allowed 10"><title>Fixed window, sliding log, sliding window counter, token bucket and leaky bucket; measured fixed window allowing 20 of 20 requests across a window boundary while sliding log and token bucket allowed 10</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Rate limiting algorithms with Redis (measured)</text><rect x="30" y="54" width="190" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="125" y="73" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">fixed window</text><rect x="226" y="54" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="72.7" font-size="10.5" text-anchor="middle" fill="#1e293b">INCR rl:{user}:{second} + EXPIRE</text><rect x="532" y="54" width="238" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="651" y="72.7" font-size="10.5" text-anchor="middle" fill="#1e293b">simple, cheap; bursts at boundaries</text><rect x="30" y="88" width="190" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="107" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">sliding log</text><rect x="226" y="88" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="106.7" font-size="10.5" text-anchor="middle" fill="#1e293b">ZADD timestamps, ZREMRANGEBYSCORE, ZCARD</text><rect x="532" y="88" width="238" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="651" y="106.7" font-size="10.5" text-anchor="middle" fill="#1e293b">exact; memory per request</text><rect x="30" y="122" width="190" height="30" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="125" y="141" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">sliding window counter</text><rect x="226" y="122" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="140.7" font-size="10.5" text-anchor="middle" fill="#1e293b">weighted sum of 2 fixed windows</text><rect x="532" y="122" width="238" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="651" y="140.7" font-size="10.5" text-anchor="middle" fill="#1e293b">cheap approximation</text><rect x="30" y="156" width="190" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="125" y="175" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">token bucket</text><rect x="226" y="156" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="174.7" font-size="10.5" text-anchor="middle" fill="#1e293b">tokens refill at rate r, burst up to b (Lua)</text><rect x="532" y="156" width="238" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="651" y="174.7" font-size="10.5" text-anchor="middle" fill="#1e293b">allows controlled bursts</text><rect x="30" y="190" width="190" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="125" y="209" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">leaky bucket</text><rect x="226" y="190" width="300" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="376" y="208.7" font-size="10.5" text-anchor="middle" fill="#1e293b">queue drained at a fixed rate</text><rect x="532" y="190" width="238" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="651" y="208.7" font-size="10.5" text-anchor="middle" fill="#1e293b">smooth output</text><text x="400" y="244" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: limit 10/s, 10 requests at t=990 ms and 10 at t=1010 ms</text><text x="150" y="269" font-size="11.5" text-anchor="end" fill="#475569">fixed window</text><rect x="160" y="254" width="280" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="446" y="269" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">20 of 20 allowed (2× the limit)</text><text x="150" y="299" font-size="11.5" text-anchor="end" fill="#475569">sliding log</text><rect x="160" y="284" width="140" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="306" y="299" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10 of 20 allowed</text><text x="150" y="329" font-size="11.5" text-anchor="end" fill="#475569">token bucket</text><rect x="160" y="314" width="140" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="306" y="329" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10 of 20 allowed</text><text x="400" y="362" font-size="11.5" text-anchor="middle" fill="#475569">200 parallel requests from several instances: fixed window still allowed exactly 10 (INCR is atomic)</text></svg>