<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Redis is in-memory and single-threaded; measured hundreds of thousands of operations per second, and from Node a GET at 0.145 ms vs a Postgres primary key lookup at 0.163 ms and a report query at 36.7 ms"><title>Redis is in-memory and single-threaded; measured hundreds of thousands of operations per second, and from Node a GET at 0.145 ms vs a Postgres primary key lookup at 0.163 ms and a report query at 36.7 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What Redis is and how fast it is (measured)</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b">in memory · single-threaded command execution</text><text x="210" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b">(no locks, each command atomic) · event loop + epoll</text><text x="210" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b">I/O threads optional · persistence in background</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b">redis-benchmark inside the container (Redis 7.4)</text><text x="590" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b">SET 276k/s · GET 267k/s · ZADD 290k/s (p50 ~0.09 ms)</text><text x="590" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b">pipelined ×16: SET 2.96M/s · GET 3.4M/s</text><text x="400" y="204" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured from Node 22: one read (ms, average)</text><text x="260" y="231" font-size="11.5" text-anchor="end" fill="#475569">in-process Map</text><rect x="270" y="216" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279" y="231" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.0001 ms</text><text x="260" y="261" font-size="11.5" text-anchor="end" fill="#475569">Redis GET</text><rect x="270" y="246" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279" y="261" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.145 ms</text><text x="260" y="291" font-size="11.5" text-anchor="end" fill="#475569">Postgres primary-key lookup</text><rect x="270" y="276" width="3" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="279" y="291" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.163 ms</text><text x="260" y="321" font-size="11.5" text-anchor="end" fill="#475569">Postgres revenue report (1M rows)</text><rect x="270" y="306" width="440.15" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="716.15" y="321" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">36.679 ms</text><text x="400" y="352" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Caching a cheap indexed lookup gains little; caching the 36.7 ms report gains 300×.</text><text x="400" y="376" font-size="11.5" text-anchor="middle" fill="#475569">10,000 concurrent GETs from one Node process: 45 ms (node-redis auto-pipelines them).</text></svg>