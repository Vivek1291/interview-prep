<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Lock acquire with SET NX PX and token-checked release; measured 20 job runs without a lock vs 1 with it, and a reproduced expiry pitfall where a blind delete removed another worker lock"><title>Lock acquire with SET NX PX and token-checked release; measured 20 job runs without a lock vs 1 with it, and a reproduced expiry pitfall where a blind delete removed another worker lock</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Distributed locks with Redis (measured)</text><rect x="30" y="58" width="740" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">acquire: SET lock:invoice-job &lt;random token&gt; NX PX 30000</text><text x="400" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">release: Lua: if GET(key) == token then DEL(key)   (never a blind DEL)</text><text x="400" y="138" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 20 instances start the nightly invoice job at the same moment</text><text x="150" y="164" font-size="11.5" text-anchor="end" fill="#475569">no lock</text><rect x="160" y="148" width="280" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="446" y="164" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">20 runs (20 × invoices)</text><text x="150" y="198" font-size="11.5" text-anchor="end" fill="#475569">SET NX PX</text><rect x="160" y="182" width="14" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="180" y="198" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1 run</text><rect x="30" y="232" width="740" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="256.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured pitfall: A's lock expired (100 ms TTL) while A was still working → B acquired it → A's blind DEL</text><text x="400" y="270.9" font-size="11" text-anchor="middle" fill="#1e293b">removed B's lock → C acquired it too. Fixes: token check on release, TTL &gt; job time with renewal,</text><text x="400" y="284.9" font-size="11" text-anchor="middle" fill="#1e293b">and fencing tokens (an increasing number the database checks) for correctness.</text><rect x="30" y="316" width="740" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">Redis locks are for efficiency (avoid duplicate work), not strict correctness: GC pauses, clock jumps</text><text x="400" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b">and failover can let two holders overlap. For money/inventory use DB constraints, row locks or fencing.</text></svg>