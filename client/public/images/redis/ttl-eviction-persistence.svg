<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Key expiry with TTL; measured noeviction rejecting 22,103 writes vs allkeys-lru evicting keys; after kill -9 RDB-only kept 0 of 1,100 recent writes and AOF kept all 1,100"><title>Key expiry with TTL; measured noeviction rejecting 22,103 writes vs allkeys-lru evicting keys; after kill -9 RDB-only kept 0 of 1,100 recent writes and AOF kept all 1,100</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">TTL, eviction and persistence (measured)</text><rect x="30" y="58" width="740" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">SET otp:42 913204 EX 120   ·   TTL otp:42 → 120   ·   measured: EX 2 → GET after 2.1 s = (nil)</text><text x="400" y="122" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: maxmemory 20 MB, writing 40,000 × 1 KB values</text><rect x="30" y="132" width="360" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="163.75" font-size="11.5" text-anchor="middle" fill="#1e293b">noeviction (default)</text><text x="210" y="178.25" font-size="11.5" text-anchor="middle" fill="#1e293b">17,897 writes ok · 22,103 rejected with OOM errors</text><rect x="410" y="132" width="360" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="163.75" font-size="11.5" text-anchor="middle" fill="#1e293b">allkeys-lru</text><text x="590" y="178.25" font-size="11.5" text-anchor="middle" fill="#1e293b">40,000 writes ok · 22,126 least-recently-used keys evicted</text><text x="400" y="226" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: kill -9 the Redis process right after 1,100 writes</text><rect x="30" y="236" width="360" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="267.75" font-size="11.5" text-anchor="middle" fill="#1e293b">RDB snapshots only (default config)</text><text x="210" y="282.25" font-size="11.5" text-anchor="middle" fill="#1e293b">kept 0 / 1,100 writes since the last snapshot</text><rect x="410" y="236" width="360" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="267.75" font-size="11.5" text-anchor="middle" fill="#1e293b">AOF, appendfsync everysec</text><text x="590" y="282.25" font-size="11.5" text-anchor="middle" fill="#1e293b">kept 1,100 / 1,100 (OS crash can lose ≤ 1 s)</text><rect x="30" y="320" width="740" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">Cache → allkeys-lru, no persistence needed · Sessions/queues/locks → noeviction + AOF</text><text x="400" y="358.9" font-size="11" text-anchor="middle" fill="#1e293b">High availability: replicas + Sentinel (failover) or Redis Cluster (sharding); managed: ElastiCache, Upstash, Redis Cloud</text></svg>