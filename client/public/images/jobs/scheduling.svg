<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="node-cron runs in every instance while a BullMQ job scheduler runs once per tick; measured 18 runs vs 6 for three instances over five seconds"><title>node-cron runs in every instance while a BullMQ job scheduler runs once per tick; measured 18 runs vs 6 for three instances over five seconds</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Scheduled jobs across instances (measured)</text><rect x="30" y="58" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">node-cron / setInterval in the app</text><text x="210" y="117.2" font-size="12" text-anchor="middle" fill="#1e293b">runs in EVERY instance</text><text x="210" y="132.2" font-size="12" text-anchor="middle" fill="#1e293b">3 pods → 3 runs per tick</text><rect x="410" y="58" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">BullMQ job scheduler (repeatable job)</text><text x="590" y="117.2" font-size="12" text-anchor="middle" fill="#1e293b">schedule stored once in Redis (same id)</text><text x="590" y="132.2" font-size="12" text-anchor="middle" fill="#1e293b">3 pods → 1 run per tick, any worker</text><text x="400" y="194" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 3 instances for ~5 s, schedule "every second"</text><text x="190" y="222" font-size="11.5" text-anchor="end" fill="#475569">node-cron</text><rect x="200" y="206" width="360" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="566" y="222" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">18 runs</text><text x="190" y="256" font-size="11.5" text-anchor="end" fill="#475569">BullMQ job scheduler</text><rect x="200" y="240" width="120" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="326" y="256" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">6 runs</text><rect x="30" y="288" width="740" height="86" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="320.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Other options: one dedicated scheduler process, Kubernetes CronJob, EventBridge Scheduler / Cloud Scheduler,</text><text x="400" y="335" font-size="11.5" text-anchor="middle" fill="#1e293b">or cron + a distributed lock. Whatever you pick, make the job idempotent (unique (job, period) key):</text><text x="400" y="349.5" font-size="11.5" text-anchor="middle" fill="#1e293b">retries, deploys and clock drift can still run it twice. Use UTC and think about DST for "daily at 02:00".</text></svg>