<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SIGTERM handler closing a BullMQ worker; measured abrupt exit causing the job to run twice vs graceful close finishing it once"><title>SIGTERM handler closing a BullMQ worker; measured abrupt exit causing the job to run twice vs graceful close finishing it once</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Graceful shutdown of workers (measured)</text><rect x="30" y="58" width="740" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">process.on('SIGTERM', async () =&gt; { await worker.close(); await redis.quit(); process.exit(0) })</text><text x="400" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">worker.close() stops fetching new jobs and waits for active jobs to finish</text><text x="400" y="136" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: SIGTERM while a 2 s export job is running</text><rect x="30" y="148" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="184.7" font-size="12" text-anchor="middle" fill="#1e293b">abrupt exit</text><text x="210" y="199.7" font-size="12" text-anchor="middle" fill="#1e293b">exited 2 ms after SIGTERM</text><text x="210" y="214.7" font-size="12" text-anchor="middle" fill="#1e293b">job stalled → re-run by another worker</text><text x="210" y="229.7" font-size="12" text-anchor="middle" fill="#1e293b">export started 2×, finished 1×</text><rect x="410" y="148" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="184.7" font-size="12" text-anchor="middle" fill="#1e293b">graceful worker.close()</text><text x="590" y="199.7" font-size="12" text-anchor="middle" fill="#1e293b">exited 2,017 ms after SIGTERM</text><text x="590" y="214.7" font-size="12" text-anchor="middle" fill="#1e293b">job finished before exit</text><text x="590" y="229.7" font-size="12" text-anchor="middle" fill="#1e293b">export started 1×, finished 1×</text><rect x="30" y="274" width="740" height="100" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="313.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Set the orchestrator grace period above your longest job (Kubernetes terminationGracePeriodSeconds, ECS stopTimeout),</text><text x="400" y="328" font-size="11.5" text-anchor="middle" fill="#1e293b">or split long jobs into resumable steps with progress checkpoints. Jobs must still be idempotent:</text><text x="400" y="342.5" font-size="11.5" text-anchor="middle" fill="#1e293b">OOM kills and crashes skip the handler entirely, and stalled jobs are re-run.</text></svg>