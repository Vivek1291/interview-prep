<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="API enqueues, an email worker renders templates and sends through a provider, webhooks report bounces; measured two temporary 451 rejections retried with backoff and accepted on the third attempt"><title>API enqueues, an email worker renders templates and sends through a provider, webhooks report bounces; measured two temporary 451 rejections retried with backoff and accepted on the third attempt</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Email and notifications architecture (measured retries)</text><rect x="30" y="58" width="150" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="82.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API</text><rect x="186" y="58" width="584" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="82" font-size="11.5" text-anchor="middle" fill="#1e293b">validate, write DB, enqueue { template, to, data, idempotencyKey }</text><rect x="30" y="104" width="150" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="105" y="128.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">email worker</text><rect x="186" y="104" width="584" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="128" font-size="11.5" text-anchor="middle" fill="#1e293b">render template (MJML/React Email), check suppression list</text><rect x="30" y="150" width="150" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="105" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">provider</text><rect x="186" y="150" width="584" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="174" font-size="11.5" text-anchor="middle" fill="#1e293b">SES / SendGrid / Postmark / SMTP: rate limits, 4xx temporary, 5xx permanent</text><rect x="30" y="196" width="150" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="105" y="220.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">webhooks</text><rect x="186" y="196" width="584" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="478" y="220" font-size="11.5" text-anchor="middle" fill="#1e293b">delivered / bounced / complained → update status, suppress bounced addresses</text><text x="400" y="264" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: local SMTP server answers 451 to the first two attempts (BullMQ attempts 5, backoff 500 ms)</text><rect x="30" y="276" width="236" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="148" y="296.75" font-size="11.5" text-anchor="middle" fill="#1e293b">attempt 1 · 440 ms</text><text x="148" y="311.25" font-size="11.5" text-anchor="middle" fill="#1e293b">451 temporary failure</text><rect x="280" y="276" width="236" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="398" y="296.75" font-size="11.5" text-anchor="middle" fill="#1e293b">attempt 2 · 1,359 ms</text><text x="398" y="311.25" font-size="11.5" text-anchor="middle" fill="#1e293b">451 temporary failure</text><rect x="530" y="276" width="236" height="48" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="648" y="296.75" font-size="11.5" text-anchor="middle" fill="#1e293b">attempt 3 · 2,842 ms</text><text x="648" y="311.25" font-size="11.5" text-anchor="middle" fill="#1e293b">250 accepted</text><text x="400" y="352" font-size="11.5" text-anchor="middle" fill="#475569">SMTP 4xx = retry later · 5xx = permanent (bad address): stop, mark bounced, never retry forever</text><text x="400" y="374" font-size="11.5" text-anchor="middle" fill="#475569">Same architecture for SMS, push and WhatsApp: queue per channel, provider-specific rate limits</text></svg>