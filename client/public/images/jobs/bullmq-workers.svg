<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="BullMQ job lifecycle; measured throughput rising from 19 to 843 jobs per second for I/O-bound jobs with higher concurrency, but staying at about 50 for CPU-bound jobs"><title>BullMQ job lifecycle; measured throughput rising from 19 to 843 jobs per second for I/O-bound jobs with higher concurrency, but staying at about 50 for CPU-bound jobs</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">BullMQ workers and concurrency (measured)</text><rect x="30" y="54" width="740" height="76" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="82.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">API → queue.add(name, data, { attempts, backoff, delay, priority, jobId }) → Redis</text><text x="400" y="95.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">new Worker(queue, processor, { concurrency })</text><text x="400" y="109.2" font-size="10.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">waiting → active → completed | failed (retry with backoff) · delayed · stalled → re-run</text><text x="400" y="146" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: one worker process, BullMQ 6</text><text x="290" y="172" font-size="11.5" text-anchor="end" fill="#475569">I/O job (50 ms wait), concurrency 1</text><rect x="300" y="156" width="7.98" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="313.98" y="172" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">19 jobs/s</text><text x="290" y="206" font-size="11.5" text-anchor="end" fill="#475569">I/O job, concurrency 10</text><rect x="300" y="190" width="78.96" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="384.96" y="206" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">188 jobs/s</text><text x="290" y="240" font-size="11.5" text-anchor="end" fill="#475569">I/O job, concurrency 50</text><rect x="300" y="224" width="354.06" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660.06" y="240" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">843 jobs/s</text><text x="290" y="274" font-size="11.5" text-anchor="end" fill="#475569">CPU job (20 ms busy), concurrency 1</text><rect x="300" y="258" width="20.16" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326.16" y="274" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">48 jobs/s</text><text x="290" y="308" font-size="11.5" text-anchor="end" fill="#475569">CPU job, concurrency 10</text><rect x="300" y="292" width="21" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="327" y="308" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50 jobs/s (no gain)</text><text x="290" y="342" font-size="11.5" text-anchor="end" fill="#475569">CPU job, concurrency 50</text><rect x="300" y="326" width="21" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="327" y="342" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">50 jobs/s (no gain)</text></svg>