<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A shallow copy shares nested objects with the original; a deep copy duplicates them. Measured 10,000 copies: spread 0.7 ms, custom deepClone 26 ms, JSON 45 ms, structuredClone 52 ms"><title>A shallow copy shares nested objects with the original; a deep copy duplicates them. Measured 10,000 copies: spread 0.7 ms, custom deepClone 26 ms, JSON 45 ms, structuredClone 52 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Shallow vs deep copy</text><rect x="40" y="72" width="170" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="125" y="98.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">original</text><rect x="40" y="160" width="170" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="125" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">shallow copy</text><rect x="270" y="110" width="170" height="54" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="355" y="133.6" font-size="12.5" text-anchor="middle" fill="#1e293b">address { city }</text><text x="355" y="149.1" font-size="12.5" text-anchor="middle" fill="#1e293b">(SHARED)</text><line x1="212" y1="94" x2="266" y2="126" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="212" y1="182" x2="266" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="480" y="72" width="140" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="550" y="98.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">original</text><rect x="480" y="160" width="140" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="550" y="186.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">deep copy</text><rect x="650" y="72" width="120" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="710" y="98.4" font-size="12.5" text-anchor="middle" fill="#1e293b">address</text><line x1="622" y1="94" x2="646" y2="94" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="650" y="160" width="120" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="710" y="186.4" font-size="12.5" text-anchor="middle" fill="#1e293b">address (new)</text><line x1="622" y1="182" x2="646" y2="182" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="236" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (Node 22, 10,000 copies of a nested object):</text><text x="220" y="268" font-size="12" text-anchor="end" fill="#475569">spread / Object.assign</text><rect x="230" y="254" width="4.2" height="20" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="244.2" y="268" font-size="12" text-anchor="start" fill="#475569" font-weight="700">0.7 ms</text><text x="220" y="298" font-size="12" text-anchor="end" fill="#475569">custom deepClone</text><rect x="230" y="284" width="156" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="396" y="298" font-size="12" text-anchor="start" fill="#475569" font-weight="700">26 ms</text><text x="220" y="328" font-size="12" text-anchor="end" fill="#475569">JSON parse+stringify</text><rect x="230" y="314" width="270" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="510" y="328" font-size="12" text-anchor="start" fill="#475569" font-weight="700">45 ms</text><text x="220" y="358" font-size="12" text-anchor="end" fill="#475569">structuredClone</text><rect x="230" y="344" width="312" height="20" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="552" y="358" font-size="12" text-anchor="start" fill="#475569" font-weight="700">52 ms</text><text x="612" y="268" font-size="11.5" text-anchor="start" fill="#475569">structuredClone: slowest here but</text><text x="612" y="284" font-size="11.5" text-anchor="start" fill="#475569">keeps Date, Map, Set, cycles</text><text x="612" y="312" font-size="11.5" text-anchor="start" fill="#475569">JSON: loses Date, undefined,</text><text x="612" y="328" font-size="11.5" text-anchor="start" fill="#475569">functions; throws on cycles</text></svg>