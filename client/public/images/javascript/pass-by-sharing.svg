<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Primitives are copied into each variable; object variables hold references, so two variables can point to the same object and see each other's changes"><title>Primitives are copied into each variable; object variables hold references, so two variables can point to the same object and see each other's changes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Primitives are copied, objects are shared</text><text x="160" y="66" font-size="14" text-anchor="middle" fill="#6366f1" font-weight="700">Stack (variables)</text><text x="560" y="66" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="700">Heap (objects)</text><rect x="60" y="84" width="200" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="106.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">let a = 5</text><rect x="60" y="126" width="200" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="148.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">let b = a  // copy of 5</text><rect x="60" y="190" width="200" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="212.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">let user  ─●</text><rect x="60" y="232" width="200" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="254.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">let copy  ─●</text><rect x="440" y="196" width="260" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="454" y="224.6" font-size="13" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">{ name: 'Asha' }</text><text x="454" y="240.6" font-size="13" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(one object)</text><line x1="262" y1="208" x2="436" y2="216" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><line x1="262" y1="250" x2="436" y2="240" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="160" y="296" font-size="12.5" text-anchor="middle" fill="#475569">b = 7 changes only b</text><text x="560" y="296" font-size="12.5" text-anchor="middle" fill="#ef4444">copy.name = &quot;Ravi&quot; → user.name is &quot;Ravi&quot; too</text><rect x="110" y="316" width="580" height="48" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="336.6" font-size="12.5" text-anchor="middle" fill="#1e293b">JavaScript always passes the VALUE of a variable. For objects that value is a</text><text x="400" y="352.1" font-size="12.5" text-anchor="middle" fill="#1e293b">reference, so both names point to the same object (&quot;call by sharing&quot;).</text></svg>