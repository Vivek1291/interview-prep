<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="new creates an empty object, links its prototype to the constructor prototype, runs the constructor with this set to it, and returns it; class syntax is sugar over constructor functions and prototypes"><title>new creates an empty object, links its prototype to the constructor prototype, runs the constructor with this set to it, and returns it; class syntax is sugar over constructor functions and prototypes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What new does, and how classes map to prototypes</text><rect x="40" y="70" width="300" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="190" y="94.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const p = new Person('Asha')</text><rect x="40" y="130" width="46" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="63" y="157.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><rect x="92" y="130" width="330" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="257" y="156.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Create an empty object  {}</text><rect x="40" y="186" width="46" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="63" y="213.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><rect x="92" y="186" width="330" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="257" y="212.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Link it: obj.[[Prototype]] = Fn.prototype</text><rect x="40" y="242" width="46" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="63" y="269.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><rect x="92" y="242" width="330" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="257" y="268.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Run Fn with this = obj  (this.name = name)</text><rect x="40" y="298" width="46" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="63" y="325.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><rect x="92" y="298" width="330" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="257" y="324.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Return obj (unless Fn returns its own object)</text><text x="600" y="80" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">class syntax does the same thing</text><rect x="460" y="96" width="300" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="474" y="138.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">class Person {</text><text x="474" y="152.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  constructor(name) { this.name = name }</text><text x="474" y="167.3" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  greet() { return this.name }</text><text x="474" y="181.8" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><text x="610" y="236" font-size="22" text-anchor="middle" fill="#475569" font-weight="700">≈</text><rect x="460" y="250" width="300" height="100" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="474" y="289.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function Person(name) { this.name = name }</text><text x="474" y="303.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Person.prototype.greet =</text><text x="474" y="317.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  function () { return this.name }</text><text x="400" y="382" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Classes add: strict mode, no call without new, #private fields, extends/super</text></svg>