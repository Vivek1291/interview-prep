<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="New objects are created from a template with Object.create or structuredClone; measured 100,000 objects: 4.7 MB with prototype methods versus about 30 MB when each object gets its own method copies"><title>New objects are created from a template with Object.create or structuredClone; measured 100,000 objects: 4.7 MB with prototype methods versus about 30 MB when each object gets its own method copies</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Prototype pattern: clone and share</text><rect x="40" y="70" width="220" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="54" y="96.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const shapeProto = {</text><text x="54" y="111.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  area() {…},</text><text x="54" y="126.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  scale() {…}</text><text x="54" y="141.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><line x1="262" y1="115" x2="300" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="262" y1="115" x2="300" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="304" y="70" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="404" y="94" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Object.create(shapeProto)</text><rect x="304" y="124" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="404" y="148" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">structuredClone(template)</text><text x="640" y="82" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">clone a TEMPLATE object</text><text x="640" y="102" font-size="12" text-anchor="middle" fill="#475569">instead of building from scratch</text><text x="640" y="132" font-size="12" text-anchor="middle" fill="#475569">methods shared via the prototype,</text><text x="640" y="150" font-size="12" text-anchor="middle" fill="#475569">data copied per object</text><text x="400" y="196" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (Node 22): memory for 100,000 objects with 4 methods each</text><text x="300" y="232" font-size="12" text-anchor="end" fill="#475569">class (methods on the prototype)</text><rect x="310" y="218" width="47" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="365" y="234" font-size="12" text-anchor="start" fill="#475569" font-weight="700">4.7 MB · 1.4 ms</text><text x="300" y="270" font-size="12" text-anchor="end" fill="#475569">Object.create(proto)</text><rect x="310" y="256" width="62" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="380" y="272" font-size="12" text-anchor="start" fill="#475569" font-weight="700">6.2 MB · 2.7 ms</text><text x="300" y="308" font-size="12" text-anchor="end" fill="#475569">methods defined on every object</text><rect x="310" y="294" width="291" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="609" y="310" font-size="12" text-anchor="start" fill="#475569" font-weight="700">29.1 MB · 41.4 ms</text><text x="300" y="346" font-size="12" text-anchor="end" fill="#475569">factory returning closures</text><rect x="310" y="332" width="322" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="640" y="348" font-size="12" text-anchor="start" fill="#475569" font-weight="700">32.2 MB · 31.6 ms</text></svg>