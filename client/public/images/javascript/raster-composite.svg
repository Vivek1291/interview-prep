<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="After layout the main thread paints draw commands, raster threads turn them into pixel tiles and the compositor combines layers on the GPU; measured: animating left caused 62 layouts in one second, transform caused 1"><title>After layout the main thread paints draw commands, raster threads turn them into pixel tiles and the compositor combines layers on the GPU; measured: animating left caused 62 layouts in one second, transform caused 1</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Paint, rasterization and compositing</text><rect x="30" y="66" width="140" height="64" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="94.7" font-size="12" text-anchor="middle" fill="#1e293b">Style</text><text x="100" y="109.7" font-size="12" text-anchor="middle" fill="#1e293b">CPU main</text><line x1="172" y1="98" x2="180" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="182" y="66" width="140" height="64" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="252" y="94.7" font-size="12" text-anchor="middle" fill="#1e293b">Layout</text><text x="252" y="109.7" font-size="12" text-anchor="middle" fill="#1e293b">CPU main</text><line x1="324" y1="98" x2="332" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="334" y="66" width="140" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="404" y="87.2" font-size="12" text-anchor="middle" fill="#1e293b">Paint</text><text x="404" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">CPU main</text><text x="404" y="117.2" font-size="12" text-anchor="middle" fill="#1e293b">(display list)</text><line x1="476" y1="98" x2="484" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="486" y="66" width="140" height="64" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="556" y="87.2" font-size="12" text-anchor="middle" fill="#1e293b">Rasterize</text><text x="556" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">GPU/raster</text><text x="556" y="117.2" font-size="12" text-anchor="middle" fill="#1e293b">threads (tiles)</text><line x1="628" y1="98" x2="636" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="638" y="66" width="140" height="64" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="708" y="87.2" font-size="12" text-anchor="middle" fill="#1e293b">Composite</text><text x="708" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">compositor</text><text x="708" y="117.2" font-size="12" text-anchor="middle" fill="#1e293b">thread + GPU</text><text x="105" y="152" font-size="11" text-anchor="middle" fill="#475569">WHERE (boxes)</text><text x="410" y="152" font-size="11" text-anchor="middle" fill="#475569">WHAT (draw commands)</text><text x="560" y="152" font-size="11" text-anchor="middle" fill="#475569">pixels</text><text x="712" y="152" font-size="11" text-anchor="middle" fill="#475569">layers → screen</text><text x="400" y="186" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome: animating a box 500 px for 1 s</text><text x="250" y="220" font-size="12" text-anchor="end" fill="#475569">left (layout every frame)</text><rect x="260" y="206" width="372" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="640" y="223" font-size="12" text-anchor="start" fill="#475569" font-weight="700">62 layouts</text><text x="250" y="258" font-size="12" text-anchor="end" fill="#475569">transform (compositor)</text><rect x="260" y="244" width="6" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="274" y="261" font-size="12" text-anchor="start" fill="#475569" font-weight="700">1 layout</text><rect x="30" y="290" width="740" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="319.2" font-size="12" text-anchor="middle" fill="#1e293b">transform / opacity on a promoted layer skip layout and paint: the compositor just moves the</text><text x="400" y="334.2" font-size="12" text-anchor="middle" fill="#1e293b">already-rasterized layer on the GPU, so it stays smooth even if the main thread is busy.</text><text x="400" y="349.2" font-size="12" text-anchor="middle" fill="#1e293b">Too many layers cost GPU memory: will-change only where it helps.</text></svg>