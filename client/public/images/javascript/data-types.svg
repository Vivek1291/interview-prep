<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Seven primitive types: string, number, bigint, boolean, undefined, null, symbol; and objects (plain objects, arrays, functions, Date, Map, Set) held by reference"><title>Seven primitive types: string, number, bigint, boolean, undefined, null, symbol; and objects (plain objects, arrays, functions, Date, Map, Set) held by reference</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">JavaScript data types</text><text x="205" y="70" font-size="14" text-anchor="middle" fill="#6366f1" font-weight="700">7 primitive types (immutable values)</text><rect x="40" y="84" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="103.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">string</text><rect x="156" y="84" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="103.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;hi&quot;</text><rect x="40" y="120" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="139.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">number</text><rect x="156" y="120" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">42, 3.14, NaN</text><rect x="40" y="156" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="175.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">bigint</text><rect x="156" y="156" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="175.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">9007199254740993n</text><rect x="40" y="192" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="211.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">boolean</text><rect x="156" y="192" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="211.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">true / false</text><rect x="40" y="228" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="247.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">undefined</text><rect x="156" y="228" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="247.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">let x;</text><rect x="40" y="264" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="283.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">null</text><rect x="156" y="264" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="283.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">typeof → &quot;object&quot; (bug)</text><rect x="40" y="300" width="110" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="95" y="319.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">symbol</text><rect x="156" y="300" width="210" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="261" y="319.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Symbol('id')</text><text x="595" y="70" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="700">1 reference type: object</text><rect x="430" y="84" width="140" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="104.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">{ }</text><rect x="576" y="84" width="190" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="104.2" font-size="12" text-anchor="middle" fill="#1e293b">plain object</text><rect x="430" y="124" width="140" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="144.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">[ ]</text><rect x="576" y="124" width="190" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="144.2" font-size="12" text-anchor="middle" fill="#1e293b">array</text><rect x="430" y="164" width="140" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="184.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">function</text><rect x="576" y="164" width="190" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b">typeof → &quot;function&quot;</text><rect x="430" y="204" width="140" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="224.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Date, Map, Set…</text><rect x="576" y="204" width="190" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="671" y="224.2" font-size="12" text-anchor="middle" fill="#1e293b">built-in objects</text><rect x="430" y="252" width="336" height="78" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="598" y="279.9" font-size="12.5" text-anchor="middle" fill="#1e293b">Variables hold a REFERENCE to the object</text><text x="598" y="295.4" font-size="12.5" text-anchor="middle" fill="#1e293b">(copy the variable → share the object);</text><text x="598" y="310.9" font-size="12.5" text-anchor="middle" fill="#1e293b">objects are mutable</text><text x="400" y="362" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Check arrays with Array.isArray(x), null with x === null; typeof is not enough.</text></svg>