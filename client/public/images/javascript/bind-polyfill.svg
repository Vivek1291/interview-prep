<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="myBind returns a bound function; a normal call applies the original with the bound context and preset plus new arguments; a call with new ignores the bound context and uses the new instance"><title>myBind returns a bound function; a normal call applies the original with the bound context and preset plus new arguments; a call with new ignores the bound context and uses the new instance</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How a bind polyfill works</text><rect x="30" y="70" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="96.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fn.myBind(ctx, a)</text><line x1="272" y1="92" x2="306" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="310" y="70" width="220" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="420" y="96.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">returns bound(...rest)</text><line x1="420" y1="116" x2="420" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="330" y="154" width="180" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="420" y="180.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">called how?</text><line x1="330" y1="176" x2="200" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="510" y1="176" x2="600" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="40" y="234" width="300" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="190" y="265.6" font-size="12.5" text-anchor="middle" fill="#1e293b">bound(b)  (normal call)</text><text x="190" y="281.1" font-size="12.5" text-anchor="middle" fill="#1e293b">fn.apply(ctx, [a, b])</text><text x="190" y="322" font-size="12" text-anchor="middle" fill="#475569">this = ctx, args = preset + new</text><rect x="460" y="234" width="300" height="70" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="610" y="265.6" font-size="12.5" text-anchor="middle" fill="#1e293b">new bound(b)</text><text x="610" y="281.1" font-size="12.5" text-anchor="middle" fill="#1e293b">fn.apply(newObject, [a, b])</text><text x="610" y="322" font-size="12" text-anchor="middle" fill="#475569">new wins: this = the new instance</text><text x="400" y="360" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Check: this instanceof bound → called with new. Also copy the prototype so instanceof works.</text></svg>