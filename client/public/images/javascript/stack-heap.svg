<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="The call stack holds function frames with primitives and references; the heap holds objects; the garbage collector marks everything reachable from the roots and sweeps the rest"><title>The call stack holds function frames with primitives and references; the heap holds objects; the garbage collector marks everything reachable from the roots and sweeps the rest</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">JavaScript memory: stack and heap</text><rect x="30" y="64" width="260" height="300" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="86" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Stack (call frames)</text><rect x="50" y="100" width="220" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="160" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">greet() frame</text><text x="160" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">name = ─●  count = 2</text><rect x="50" y="180" width="220" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="160" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">main() frame</text><text x="160" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">user = ─●  total = 99</text><text x="160" y="280" font-size="12" text-anchor="middle" fill="#475569">small, fast, LIFO</text><text x="160" y="300" font-size="12" text-anchor="middle" fill="#475569">freed when the function returns</text><text x="160" y="330" font-size="11.5" text-anchor="middle" fill="#ef4444">too deep → RangeError:</text><text x="160" y="346" font-size="11.5" text-anchor="middle" fill="#ef4444">Maximum call stack size exceeded</text><rect x="330" y="64" width="440" height="300" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="550" y="86" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">Heap (objects, arrays, functions, closures)</text><rect x="370" y="140" width="170" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="455" y="166.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ name: 'Asha' }</text><rect x="570" y="140" width="170" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="655" y="166.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'Asha' string</text><rect x="370" y="206" width="170" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="455" y="232.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[ … 10,000 items ]</text><text x="455" y="266" font-size="11.5" text-anchor="middle" fill="#ef4444">unreachable → collected</text><line x1="272" y1="210" x2="366" y2="170" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><path d="M272 112 Q456 95 640 138" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="350" y="280" width="400" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="550" y="304.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Garbage collector (mark and sweep): start from the roots</text><text x="550" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b">(globals, the stack), MARK everything reachable,</text><text x="550" y="333.5" font-size="11.5" text-anchor="middle" fill="#1e293b">SWEEP the rest. Reachable = alive, even if you never use it.</text></svg>