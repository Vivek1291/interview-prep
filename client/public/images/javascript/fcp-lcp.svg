<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured: FCP at 16 ms from a heading and LCP updated to a photo at 816 ms; low-entropy images are ignored; a slow stylesheet delays FCP to 612 ms while a missing stylesheet or failing scripts do not block painting"><title>Measured: FCP at 16 ms from a heading and LCP updated to a photo at 816 ms; low-entropy images are ignored; a slow stylesheet delays FCP to 612 ms while a missing stylesheet or failing scripts do not block painting</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How FCP and LCP are measured</text><text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome 154: when does the page first paint (FCP) and what is LCP?</text><rect x="30" y="76" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;h1&gt; + photo (arrives at 800 ms)</text><rect x="336" y="76" width="434" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="97.2" font-size="12" text-anchor="middle" fill="#1e293b">FCP 16 ms · LCP = &lt;h1&gt; at 16 ms → photo at 816 ms</text><rect x="30" y="116" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;h1&gt; + flat one-colour image</text><rect x="336" y="116" width="434" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="553" y="137.2" font-size="12" text-anchor="middle" fill="#1e293b">image ignored (low entropy) · LCP stays &lt;h1&gt;</text><rect x="30" y="156" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="176.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">stylesheet takes 600 ms</text><rect x="336" y="156" width="434" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="553" y="177.2" font-size="12" text-anchor="middle" fill="#1e293b">FCP 612 ms (render-blocking)</text><rect x="30" y="196" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="216.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">stylesheet 404</text><rect x="336" y="196" width="434" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="217.2" font-size="12" text-anchor="middle" fill="#1e293b">FCP 28 ms (unstyled HTML)</text><rect x="30" y="236" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="256.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script&gt; 404 mid-page</text><rect x="336" y="236" width="434" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="257.2" font-size="12" text-anchor="middle" fill="#1e293b">FCP 24 ms, HTML after it rendered</text><rect x="30" y="276" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script&gt; throws an error</text><rect x="336" y="276" width="434" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="553" y="297.2" font-size="12" text-anchor="middle" fill="#1e293b">FCP 28 ms, HTML after it rendered</text><rect x="30" y="324" width="740" height="52" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="346.8" font-size="11.5" text-anchor="middle" fill="#1e293b">FCP = first text/image/canvas pixel. LCP = largest image or text block in the viewport, updated as bigger ones paint,</text><text x="400" y="361.3" font-size="11.5" text-anchor="middle" fill="#1e293b">finalised at the first user input or scroll. Links to PDFs, hidden or offscreen content do not count.</text></svg>