<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="var is function-scoped and hoisted as undefined; let and const are block-scoped and in the temporal dead zone until their declaration; const cannot be reassigned"><title>var is function-scoped and hoisted as undefined; let and const are block-scoped and in the temporal dead zone until their declaration; const cannot be reassigned</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">var, let and const: scope and the TDZ</text><rect x="30" y="66" width="360" height="230" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="86" font-size="13" text-anchor="middle" fill="#64748b" font-weight="700">function scope</text><rect x="50" y="98" width="320" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="210" y="119.4" font-size="12.5" text-anchor="middle" fill="#1e293b">var a = 1   → visible in the WHOLE function</text><rect x="50" y="146" width="320" height="126" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="210" y="164" font-size="12.5" text-anchor="middle" fill="#6366f1" font-weight="700">block { … }  (if / for / {})</text><rect x="70" y="176" width="280" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="196.2" font-size="12" text-anchor="middle" fill="#1e293b">let b = 2   → only inside this block</text><rect x="70" y="216" width="280" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="236.2" font-size="12" text-anchor="middle" fill="#1e293b">const c = 3 → block + no reassignment</text><text x="210" y="268" font-size="11.5" text-anchor="middle" fill="#f59e0b">var inside the block leaks out of it</text><text x="590" y="80" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">Temporal Dead Zone (TDZ)</text><rect x="420" y="96" width="340" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{  // scope starts: x exists but is UNINITIALIZED</text><rect x="420" y="136" width="340" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">   console.log(x)  // ReferenceError (TDZ)</text><rect x="420" y="176" width="340" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="197.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">   let x = 5       // TDZ ends here</text><rect x="420" y="216" width="340" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">   console.log(x)  // 5</text><text x="590" y="270" font-size="12" text-anchor="middle" fill="#475569">var: hoisted as undefined (no TDZ)</text><rect x="200" y="304" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="250" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="300" y="304" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="350" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">var</text><rect x="400" y="304" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="450" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">let</text><rect x="500" y="304" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="550" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">const</text><rect x="200" y="326" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="250" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">scope</text><rect x="300" y="326" width="100" height="22" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="350" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b">function</text><rect x="400" y="326" width="100" height="22" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="450" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b">block</text><rect x="500" y="326" width="100" height="22" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="550" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b">block</text><rect x="200" y="348" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="250" y="363" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">redeclare</text><rect x="300" y="348" width="100" height="22" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="350" y="363" font-size="11.5" text-anchor="middle" fill="#1e293b">yes</text><rect x="400" y="348" width="100" height="22" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="450" y="363" font-size="11.5" text-anchor="middle" fill="#1e293b">no</text><rect x="500" y="348" width="100" height="22" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="550" y="363" font-size="11.5" text-anchor="middle" fill="#1e293b">no</text><rect x="200" y="370" width="100" height="22" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="250" y="385" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">reassign</text><rect x="300" y="370" width="100" height="22" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="350" y="385" font-size="11.5" text-anchor="middle" fill="#1e293b">yes</text><rect x="400" y="370" width="100" height="22" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="450" y="385" font-size="11.5" text-anchor="middle" fill="#1e293b">yes</text><rect x="500" y="370" width="100" height="22" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text x="550" y="385" font-size="11.5" text-anchor="middle" fill="#1e293b">no</text></svg>