<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured in Chrome: three awaited 100 ms operations in sequence took 303.8 ms; started together with Promise.all they took 101.2 ms"><title>Measured in Chrome: three awaited 100 ms operations in sequence took 303.8 ms; started together with Promise.all they took 101.2 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">async/await: sequential vs parallel</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome 154: three independent 100 ms requests</text><text x="120" y="110" font-size="13" text-anchor="end" fill="#475569" font-weight="700">sequential</text><rect x="140" y="90" width="186" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="233" y="111.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await a()</text><rect x="330" y="90" width="186" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="423" y="111.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await b()</text><rect x="520" y="90" width="186" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="613" y="111.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await c()</text><text x="720" y="112" font-size="13" text-anchor="start" fill="#ef4444" font-weight="700">303.8 ms</text><text x="120" y="180" font-size="13" text-anchor="end" fill="#475569" font-weight="700">parallel</text><rect x="140" y="150" width="186" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="233" y="167.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a()</text><rect x="140" y="180" width="186" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="233" y="197.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b()</text><rect x="140" y="210" width="186" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="233" y="227.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">c()</text><text x="340" y="186" font-size="13" text-anchor="start" fill="#10b981" font-weight="700">await Promise.all([a(), b(), c()])  →  101.2 ms</text><rect x="140" y="260" width="570" height="1" rx="6" fill="#64748b" stroke="#64748b" stroke-width="1.5"/><text x="140" y="278" font-size="11" text-anchor="middle" fill="#475569">0 ms</text><text x="330" y="278" font-size="11" text-anchor="middle" fill="#475569">100 ms</text><text x="520" y="278" font-size="11" text-anchor="middle" fill="#475569">200 ms</text><text x="710" y="278" font-size="11" text-anchor="middle" fill="#475569">300 ms</text><rect x="80" y="300" width="640" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="329.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Start the promises first, await them together when they do not depend on each other.</text><text x="400" y="345.1" font-size="12.5" text-anchor="middle" fill="#1e293b">await in a loop (for … of) is sequential; use Promise.all (or allSettled) for parallel work.</text></svg>