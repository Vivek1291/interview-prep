 fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="498" y="197" font-size="11.5" text-anchor="middle" fill="#1e293b">.size</text><rect x="560" y="176" width="176" height="34" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="648" y="197" font-size="11.5" text-anchor="middle" fill="#1e293b">no size</text><rect x="30" y="214" width="106" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="83" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">GC</text><rect x="140" y="214" width="146" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="213" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b">holds keys</text><rect x="290" y="214" width="146" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="363" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b">holds keys</text><rect x="440" y="214" width="116" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="498" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b">holds values</text><rect x="560" y="214" width="176" height="34" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="648" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b">does NOT keep keys alive</text><rect x="30" y="252" width="106" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="83" y="273" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700">use for</text><rect x="140" y="252" width="146" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="213" y="273" font-size="11.5" text-anchor="middle" fill="#1e293b">records / JSON</text><rect x="290" y="252" width="146" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="363" y="273" font-size="11.5" text-anchor="middle" fill="#1e293b">dynamic dictionaries</text><rect x="440" y="252" width="116" heigh