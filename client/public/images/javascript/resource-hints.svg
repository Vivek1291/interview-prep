nsolas,monospace">preload</text><rect x="206" y="158" width="400" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b">fetch a resource needed for THIS page now, high priority</text><rect x="612" y="158" width="150" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="687" y="181" font-size="11.5" text-anchor="middle" fill="#1e293b">download</text><rect x="40" y="204" width="160" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="120" y="227.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">modulepreload</text><rect x="206" y="204" width="400" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="227.2" font-size="12" text-anchor="middle" fill="#1e293b">preload + parse a JS module and its deps</text><rect x="612" y="204" width="150" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="687" y="227" font-size="11.5" text-anchor="middle" fill="#1e293b">download + parse</text><rect x="40" y="250" width="160" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="120" y="273.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">prefetch</text><rect x="206" y="250" width="400" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="273.2" font-size="12" text-anchor="middle" fill="#1e293b">fetch a resource for the NEXT page, low priority (idle)</text><rect x="612" y="250" width="150" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="687" y="273" font-size="11.5" text-anchor="middle" fill="#1e293b">download (idle)</text><rect x="40" y="296" width="160" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="120" y="319.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fetchpriority</text><rect x="206" y="296" width="400" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="406" y="319.2" font-size="12" text-anchor="middle" fill="#1e293b">hint priority: high for the LCP image, low for others</text><rect x="612" y="296" width="150" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="687" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b">priority</text><rect x="40" y="346" width="722" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="401" y="367.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;link rel=&quot;preload&quot; href=&quot;/hero.webp&quot; as=&quot;image&quot; fetchpriority=&quot;high&quot;&gt;</text></svg>