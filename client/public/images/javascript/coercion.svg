<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Examples of implicit coercion: &quot;3&quot;+4 is &quot;34&quot;, &quot;3&quot;-4 is -1, true+1 is 2, null==undefined is true, NaN===NaN is false, 0==&quot;&quot; is true; list of falsy values"><title>Examples of implicit coercion: &quot;3&quot;+4 is &quot;34&quot;, &quot;3&quot;-4 is -1, true+1 is 2, null==undefined is true, NaN===NaN is false, 0==&quot;&quot; is true; list of falsy values</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Type coercion: what JavaScript converts, and how</text><text x="140" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">expression</text><text x="330" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">result</text><text x="560" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">why</text><rect x="40" y="76" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="92.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;3&quot; + 4</text><rect x="250" y="76" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="92.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;34&quot;</text><rect x="420" y="76" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="92.2" font-size="12" text-anchor="middle" fill="#1e293b">+ with a string → string</text><rect x="40" y="104" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="120.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;3&quot; - 4</text><rect x="250" y="104" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="120.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">-1</text><rect x="420" y="104" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="120.2" font-size="12" text-anchor="middle" fill="#1e293b">- * / → number</text><rect x="40" y="132" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="148.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;3&quot; * &quot;4&quot;</text><rect x="250" y="132" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="148.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><rect x="420" y="132" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="148.2" font-size="12" text-anchor="middle" fill="#1e293b">both converted to numbers</text><rect x="40" y="160" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="176.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">true + 1</text><rect x="250" y="160" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="176.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="420" y="160" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="176.2" font-size="12" text-anchor="middle" fill="#1e293b">true → 1</text><rect x="40" y="188" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[] + {}</text><rect x="250" y="188" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&quot;[object Object]&quot;</text><rect x="420" y="188" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">objects → primitive → string</text><rect x="40" y="216" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="232.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">null == undefined</text><rect x="250" y="216" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="232.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">true</text><rect x="420" y="216" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="232.2" font-size="12" text-anchor="middle" fill="#1e293b">special rule</text><rect x="40" y="244" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">null === undefined</text><rect x="250" y="244" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">false</text><rect x="420" y="244" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b">different types</text><rect x="40" y="272" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="288.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">NaN === NaN</text><rect x="250" y="272" width="160" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/><text x="330" y="288.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">false</text><rect x="420" y="272" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="288.2" font-size="12" text-anchor="middle" fill="#1e293b">use Number.isNaN</text><rect x="40" y="300" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0 == &quot;&quot;</text><rect x="250" y="300" width="160" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/><text x="330" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">true</text><rect x="420" y="300" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b">both → 0 ❗</text><rect x="40" y="328" width="200" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="140" y="344.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0 === &quot;&quot;</text><rect x="250" y="328" width="160" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/><text x="330" y="344.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">false</text><rect x="420" y="328" width="340" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="590" y="344.2" font-size="12" text-anchor="middle" fill="#1e293b">no conversion</text><text x="400" y="374" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Falsy: false, 0, -0, 0n, &quot;&quot;, null, undefined, NaN. Everything else is truthy ([] and {} too).</text></svg>