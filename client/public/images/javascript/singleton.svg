<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Every getInstance call or import receives the same instance, created on first use; useful for config, loggers and API clients, but it is global state that complicates testing"><title>Every getInstance call or import receives the same instance, created on first use; useful for config, loggers and API clients, but it is global state that complicates testing</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Singleton: one shared instance</text><rect x="40" y="80" width="160" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="104.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getInstance()</text><rect x="40" y="140" width="160" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="164.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">getInstance()</text><rect x="40" y="200" width="160" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="224.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">import config</text><line x1="202" y1="100" x2="336" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><line x1="202" y1="160" x2="336" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><line x1="202" y1="220" x2="336" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="340" y="120" width="200" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="440" y="156.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">the ONE instance</text><text x="440" y="172.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(created on first use)</text><rect x="580" y="70" width="190" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="675" y="119.2" font-size="12" text-anchor="middle" fill="#1e293b">Good for:</text><text x="675" y="134.2" font-size="12" text-anchor="middle" fill="#1e293b">config, logger,</text><text x="675" y="149.2" font-size="12" text-anchor="middle" fill="#1e293b">API client, cache,</text><text x="675" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b">WebSocket connection,</text><text x="675" y="179.2" font-size="12" text-anchor="middle" fill="#1e293b">store (Redux)</text><rect x="40" y="270" width="730" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="405" y="304.5" font-size="11.5" text-anchor="middle" fill="#1e293b">In JS the simplest singleton is a MODULE: ES modules are evaluated once and cached, so every import shares the same object.</text><text x="405" y="319" font-size="11.5" text-anchor="middle" fill="#1e293b">Risks: hidden global state, harder tests (state leaks between tests), tight coupling.</text><text x="405" y="333.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Tip: export the instance AND a factory, or allow reset in tests.</text></svg>