<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A createNotifier factory returns an email, SMS or push notifier based on a type name; all share a send interface so the client does not depend on concrete classes"><title>A createNotifier factory returns an email, SMS or push notifier based on a type name; all share a send interface so the client does not depend on concrete classes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Factory: create objects by type without new</text><rect x="30" y="140" width="180" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="174.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">createNotifier(type)</text><text x="120" y="120" font-size="12" text-anchor="middle" fill="#475569">client asks by NAME</text><line x1="212" y1="170" x2="300" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="256" y="80" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">'email'</text><rect x="304" y="70" width="230" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="419" y="96.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">EmailNotifier { send() }</text><line x1="212" y1="170" x2="300" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="256" y="156" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">'sms'</text><rect x="304" y="140" width="230" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="419" y="166.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">SmsNotifier { send() }</text><line x1="212" y1="170" x2="300" y2="232" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="256" y="220" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">'push'</text><rect x="304" y="210" width="230" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="419" y="236.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">PushNotifier { send() }</text><rect x="570" y="70" width="200" height="184" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="670" y="121.2" font-size="12" text-anchor="middle" fill="#1e293b">Same interface:</text><text x="670" y="136.2" font-size="12" text-anchor="middle" fill="#1e293b">notifier.send(msg)</text><text x="670" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="670" y="166.2" font-size="12" text-anchor="middle" fill="#1e293b">The client never uses</text><text x="670" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b">new EmailNotifier()</text><text x="670" y="196.2" font-size="12" text-anchor="middle" fill="#1e293b">directly → easy to add</text><text x="670" y="211.2" font-size="12" text-anchor="middle" fill="#1e293b">new types later</text><rect x="30" y="290" width="740" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="321.7" font-size="12" text-anchor="middle" fill="#1e293b">Unknown type → throw early. Register types in a map instead of a long switch:</text><text x="400" y="336.7" font-size="12" text-anchor="middle" fill="#1e293b">const registry = { email: EmailNotifier, sms: SmsNotifier }; registry[type]</text></svg>