<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A promise starts pending and settles once, either fulfilled via resolve or rejected via reject; then, catch and finally register callbacks and return new promises"><title>A promise starts pending and settles once, either fulfilled via resolve or rejected via reject; then, catch and finally register callbacks and return new promises</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Promise states</text><rect x="40" y="160" width="170" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="125" y="195.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">pending</text><line x1="212" y1="176" x2="330" y2="110" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="260" y="128" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">resolve(value)</text><line x1="212" y1="204" x2="330" y2="270" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="260" y="262" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">reject(error)</text><rect x="334" y="80" width="170" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="419" y="115.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">fulfilled</text><rect x="334" y="240" width="170" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="419" y="275.6" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="700">rejected</text><text x="419" y="196" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">settled = fulfilled or rejected</text><text x="419" y="214" font-size="11.5" text-anchor="middle" fill="#475569">(final: can never change again)</text><line x1="506" y1="110" x2="560" y2="110" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="564" y="88" width="200" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="664" y="114.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">.then(onFulfilled)</text><line x1="506" y1="270" x2="560" y2="270" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="564" y="248" width="200" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="664" y="274.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">.catch(onRejected)</text><rect x="564" y="168" width="200" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="664" y="194.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">.finally(cleanup)</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Every .then/.catch/.finally returns a NEW promise → chains.</text><text x="400" y="362" font-size="12" text-anchor="middle" fill="#475569">Callbacks always run asynchronously as microtasks, even if the promise is already settled.</text></svg>