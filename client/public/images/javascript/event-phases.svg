<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A click travels from window down to the target (capture), fires on the target, then bubbles back up; delegation puts one listener on a parent and uses event.target"><title>A click travels from window down to the target (capture), fires on the target, then bubbles back up; delegation puts one listener on a parent and uses event.target</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Event capturing, target and bubbling</text><rect x="290" y="70" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="93.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">window</text><rect x="290" y="120" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="143.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">document</text><rect x="290" y="170" width="220" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="193.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;ul id=&quot;list&quot;&gt;</text><rect x="290" y="220" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="243.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;li&gt;</text><rect x="290" y="270" width="220" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="293.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;button&gt; (target)</text><line x1="270" y1="84" x2="270" y2="296" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="160" y="170" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">1 capture</text><text x="160" y="190" font-size="11.5" text-anchor="middle" fill="#475569">(top → down)</text><text x="400" y="330" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">2 target</text><line x1="530" y1="296" x2="530" y2="84" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="640" y="170" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">3 bubble</text><text x="640" y="190" font-size="11.5" text-anchor="middle" fill="#475569">(bottom → up, default)</text><rect x="30" y="346" width="740" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="368" font-size="11.5" text-anchor="middle" fill="#1e293b">Delegation: list.addEventListener('click', e =&gt; e.target.closest('button')) handles every current and future button</text></svg>