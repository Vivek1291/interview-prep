<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Nested global, outer and inner scopes; a variable is looked up in the current scope first, then each outer scope, and a ReferenceError is thrown at the end of the chain"><title>Nested global, outer and inner scopes; a variable is looked up in the current scope first, then each outer scope, and a ReferenceError is thrown at the end of the chain</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Scope chain: looking up a variable</text><rect x="30" y="64" width="520" height="300" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="86" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Global scope</text><text x="330" y="86" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">const app = 'Hub'</text><rect x="60" y="100" width="460" height="250" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="160" y="122" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">outer() scope</text><text x="360" y="122" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">let user = 'Asha'</text><rect x="90" y="138" width="400" height="196" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="190" y="160" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">inner() scope</text><text x="370" y="160" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">let count = 1</text><rect x="120" y="180" width="340" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="290" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">console.log(count, user, app, missing)</text><text x="290" y="246" font-size="12.5" text-anchor="middle" fill="#10b981">1 count → found in inner</text><text x="290" y="268" font-size="12.5" text-anchor="middle" fill="#6366f1">2 user → not here, go OUT → found in outer</text><text x="290" y="290" font-size="12.5" text-anchor="middle" fill="#475569">3 app → out again → found in global</text><text x="290" y="312" font-size="12.5" text-anchor="middle" fill="#ef4444">4 missing → end of chain → ReferenceError</text><text x="670" y="90" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Lookup goes INSIDE → OUT,</text><text x="670" y="110" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">never out → in</text><line x1="670" y1="300" x2="670" y2="140" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="670" y="324" font-size="12.5" text-anchor="middle" fill="#475569">Lexical: decided by where</text><text x="670" y="342" font-size="12.5" text-anchor="middle" fill="#475569">the code is WRITTEN,</text><text x="670" y="360" font-size="12.5" text-anchor="middle" fill="#475569">not where it is called</text><rect x="590" y="160" width="160" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b">inner</text><rect x="590" y="204" width="160" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="670" y="225.2" font-size="12" text-anchor="middle" fill="#1e293b">outer</text><rect x="590" y="248" width="160" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="670" y="269.2" font-size="12" text-anchor="middle" fill="#1e293b">global</text></svg>