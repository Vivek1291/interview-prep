<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="flat with depth 1, 2 and Infinity on a nested array; measured flattening of 256,000 numbers: shared-output recursion 1.1 ms, iterative stack 1.5 ms, native 3.0 ms, reduce with concat 34.6 ms"><title>flat with depth 1, 2 and Infinity on a nested array; measured flattening of 256,000 numbers: shared-output recursion 1.1 ms, iterative stack 1.5 ms, native 3.0 ms, reduce with concat 34.6 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">flat and flatMap: depth and cost</text><rect x="40" y="66" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="90.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, [2, [3, [4]]], 5]</text><rect x="40" y="120" width="150" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="141.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">flat()  (depth 1)</text><rect x="196" y="120" width="200" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="296" y="141.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, 2, [3, [4]], 5]</text><rect x="40" y="160" width="150" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">flat(2)</text><rect x="196" y="160" width="200" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="296" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, 2, 3, [4], 5]</text><rect x="40" y="200" width="150" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">flat(Infinity)</text><rect x="196" y="200" width="200" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="296" y="221.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, 2, 3, 4, 5]</text><text x="600" y="70" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured (Node 22): flatten 256,000 numbers</text><text x="600" y="88" font-size="11.5" text-anchor="middle" fill="#475569">nested 5 levels deep, median of 9 runs</text><text x="470" y="114" font-size="11.5" text-anchor="start" fill="#475569">recursion, shared output</text><rect x="470" y="118" width="7.9" height="12" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="483.9" y="129" font-size="11" text-anchor="start" fill="#475569" font-weight="700">1.1 ms</text><text x="470" y="148" font-size="11.5" text-anchor="start" fill="#475569">iterative stack</text><rect x="470" y="152" width="11" height="12" rx="2" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="487" y="163" font-size="11" text-anchor="start" fill="#475569" font-weight="700">1.53 ms</text><text x="470" y="182" font-size="11.5" text-anchor="start" fill="#475569">native flat(Infinity)</text><rect x="470" y="186" width="21.3" height="12" rx="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="497.3" y="197" font-size="11" text-anchor="start" fill="#475569" font-weight="700">2.96 ms</text><text x="470" y="216" font-size="11.5" text-anchor="start" fill="#475569">recursion + push(...spread)</text><rect x="470" y="220" width="26.2" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="502.2" y="231" font-size="11" text-anchor="start" fill="#475569" font-weight="700">3.64 ms</text><text x="470" y="250" font-size="11.5" text-anchor="start" fill="#475569">toString().split hack</text><rect x="470" y="254" width="67.1" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="543.1" y="265" font-size="11" text-anchor="start" fill="#475569" font-weight="700">9.32 ms</text><text x="470" y="284" font-size="11.5" text-anchor="start" fill="#475569">reduce + concat</text><rect x="470" y="288" width="248.8" height="12" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="724.8" y="299" font-size="11" text-anchor="start" fill="#475569" font-weight="700">34.56 ms</text><rect x="40" y="260" width="360" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="54" y="291.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Recursive idea:</text><text x="54" y="306.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">for each item: if it is an array AND depth &gt; 0</text><text x="54" y="321.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  → flatten it with depth − 1</text><text x="54" y="336.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  else push the item</text><text x="600" y="330" font-size="11.5" text-anchor="middle" fill="#ef4444">reduce + concat copies the accumulator</text><text x="600" y="346" font-size="11.5" text-anchor="middle" fill="#ef4444">on every step: O(n²) in the worst case</text></svg>