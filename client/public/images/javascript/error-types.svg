<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SyntaxError, ReferenceError, TypeError, RangeError, URIError and AggregateError with typical causes, plus a custom error class extending Error"><title>SyntaxError, ReferenceError, TypeError, RangeError, URIError and AggregateError with typical causes, plus a custom error class extending Error</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Built-in error types</text><rect x="40" y="66" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="88.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">SyntaxError</text><rect x="216" y="66" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="88.2" font-size="12" text-anchor="middle" fill="#1e293b">code can't be parsed</text><rect x="452" y="66" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="88" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">JSON.parse(&quot;{bad}&quot;)</text><rect x="40" y="108" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="130.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ReferenceError</text><rect x="216" y="108" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="130.2" font-size="12" text-anchor="middle" fill="#1e293b">name doesn't exist</text><rect x="452" y="108" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="130" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">notDeclared + 1</text><rect x="40" y="150" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="172.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">TypeError</text><rect x="216" y="150" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="172.2" font-size="12" text-anchor="middle" fill="#1e293b">wrong type for the operation</text><rect x="452" y="150" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="172" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">null.length, x() not a fn</text><rect x="40" y="192" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="214.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">RangeError</text><rect x="216" y="192" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="214.2" font-size="12" text-anchor="middle" fill="#1e293b">value out of range</text><rect x="452" y="192" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="214" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">new Array(-1), deep recursion</text><rect x="40" y="234" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="256.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">URIError</text><rect x="216" y="234" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="256.2" font-size="12" text-anchor="middle" fill="#1e293b">bad URI encoding</text><rect x="452" y="234" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="256" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">decodeURIComponent('%')</text><rect x="40" y="276" width="170" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="125" y="298.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">AggregateError</text><rect x="216" y="276" width="230" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="331" y="298.2" font-size="12" text-anchor="middle" fill="#1e293b">many errors at once</text><rect x="452" y="276" width="310" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="607" y="298" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Promise.any all rejected</text><rect x="40" y="316" width="722" height="66" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="54" y="338.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">class ValidationError extends Error {</text><text x="54" y="353" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  constructor(msg, field) { super(msg); this.name = 'ValidationError'; this.field = field }</text><text x="54" y="367.5" font-size="11.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text></svg>