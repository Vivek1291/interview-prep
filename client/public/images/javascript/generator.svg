<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A generator function yields values one at a time; each next() call resumes it until the next yield and returns value and done; next can send a value back in"><title>A generator function yields values one at a time; each next() call resumes it until the next yield and returns value and done; next can send a value back in</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Generators: functions that pause and resume</text><rect x="30" y="70" width="250" height="170" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="114.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function* idGen() {</text><text x="44" y="129.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  let id = 1</text><text x="44" y="144.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  while (true) {</text><text x="44" y="159.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">    const reset = yield id++</text><text x="44" y="174.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">    if (reset) id = 1</text><text x="44" y="189.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  }</text><text x="44" y="204.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><rect x="310" y="74" width="140" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="380" y="96.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">gen.next()</text><line x1="452" y1="92" x2="476" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="74" width="290" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625" y="96" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ value: 1, done: false }</text><rect x="310" y="118" width="140" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="380" y="140.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">gen.next()</text><line x1="452" y1="136" x2="476" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="118" width="290" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625" y="140" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ value: 2, done: false }</text><rect x="310" y="162" width="140" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="380" y="184.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">gen.next(true)</text><line x1="452" y1="180" x2="476" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="162" width="290" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625" y="184" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ value: 1, done: false }  (reset)</text><rect x="310" y="206" width="140" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="380" y="228.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">gen.return(0)</text><line x1="452" y1="224" x2="476" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="206" width="290" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="625" y="228" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ value: 0, done: true }</text><text x="400" y="274" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">yield PAUSES the function and keeps its local state (a resumable function).</text><text x="400" y="298" font-size="12.5" text-anchor="middle" fill="#475569">next(value) resumes it, and value becomes the result of the yield expression.</text><rect x="60" y="318" width="680" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="339.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Uses: lazy/infinite sequences, custom iterators (for…of), pagination,</text><text x="400" y="355.1" font-size="12.5" text-anchor="middle" fill="#1e293b">redux-saga, and the idea behind async/await (generator + promises)</text></svg>