t="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Rest vs spread</text><text x="205" y="70" font-size="15" text-anchor="middle" fill="#6366f1" font-weight="700">SPREAD  …  expands</text><rect x="40" y="86" width="120" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="100" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, 2, 3]</text><line x1="162" y1="108" x2="200" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="204" y="86" width="170" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="289" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1 , 2 , 3</text><rect x="40" y="150" width="334" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="54" y="191.1" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Math.max(...nums)</text><text x="54" y="206.6" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const all = [...a, ...b]</text><text x="54" y="222.1" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const copy = { ...user, age: 31 }</text><text x="54" y="237.6" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">fn(...args)</text><text x="205" y="292" font-size="12" text-anchor="middle" fill="#475569">used where VALUES go: calls, arrays, objects</text><text x="595" y="70" font-size="15" text-anchor="middle" fill="#10b981" font-weight="700">REST  …  collects</text><rect x="426" y="86" width="170" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="511" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1 , 2 , 3</text><line x1="598" y1="108" x2="636" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="640" y="86" width="120" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="700" y="112.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">[1, 2, 3]</text><rect x="426" y="150" width="334" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="440" y="191.1" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function sum(...nums) {}</text><text x="440" y="206.6" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const [first, ...others] = arr</text><text x="440" y="222.1" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const { id, ...rest } = user</text><text x="440" y="237.6" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">(must be LAST)</text><text x="595" y="292" font-size="12" text-anchor="middle" fill="#475569">used where NAMES go: parameters, destructuring</text><text x="400" y="340" font-size="13.5" text-anchor="middle" fill="#475569" font-weight="700">Same three dots: position decides. Both copies are SHALLOW.</text></svg>