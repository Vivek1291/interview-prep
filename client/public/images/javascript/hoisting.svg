<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Before running code, the engine creates bindings: var as undefined, let and const uninitialized in the TDZ, function declarations fully defined; then code runs line by line"><title>Before running code, the engine creates bindings: var as undefined, let and const uninitialized in the TDZ, function declarations fully defined; then code runs line by line</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Hoisting: the creation phase before execution</text><rect x="30" y="70" width="230" height="200" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="121.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Your code</text><text x="44" y="136.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="151.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log(a)</text><text x="44" y="166.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log(b)</text><text x="44" y="181.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">sayHi()</text><text x="44" y="196.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">var a = 1</text><text x="44" y="211.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">let b = 2</text><text x="44" y="226.7" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function sayHi() {…}</text><line x1="262" y1="170" x2="296" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="300" y="70" width="220" height="200" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="410" y="135.6" font-size="12.5" text-anchor="middle" fill="#1e293b">1 · Creation phase</text><text x="410" y="151.1" font-size="12.5" text-anchor="middle" fill="#1e293b">(memory set up)</text><text x="410" y="166.6" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="410" y="182.1" font-size="12.5" text-anchor="middle" fill="#1e293b">a → undefined</text><text x="410" y="197.6" font-size="12.5" text-anchor="middle" fill="#1e293b">b → &lt;uninitialized&gt; (TDZ)</text><text x="410" y="213.1" font-size="12.5" text-anchor="middle" fill="#1e293b">sayHi → whole function</text><line x1="522" y1="170" x2="556" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="560" y="70" width="210" height="200" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="665" y="135.6" font-size="12.5" text-anchor="middle" fill="#1e293b">2 · Execution phase</text><text x="665" y="151.1" font-size="12.5" text-anchor="middle" fill="#1e293b">(line by line)</text><text x="665" y="166.6" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="665" y="182.1" font-size="12.5" text-anchor="middle" fill="#1e293b">undefined</text><text x="665" y="197.6" font-size="12.5" text-anchor="middle" fill="#1e293b">ReferenceError ✗</text><text x="665" y="213.1" font-size="12.5" text-anchor="middle" fill="#1e293b">&quot;Hi!&quot; ✓</text><text x="400" y="300" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Nothing is &quot;moved&quot;: the engine registers declarations before running the code.</text><text x="400" y="322" font-size="12.5" text-anchor="middle" fill="#475569">function declarations: fully usable early · var: undefined · let / const / class: TDZ</text><text x="400" y="350" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Function EXPRESSIONS (const f = () =&gt; …) follow their variable's rules.</text></svg>