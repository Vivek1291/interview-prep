<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Arrow functions take this from the outer scope, have no arguments object, cannot be constructors and have no prototype; regular functions get this from how they are called"><title>Arrow functions take this from the outer scope, have no arguments object, cannot be constructors and have no prototype; regular functions get this from how they are called</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Arrow functions vs regular functions</text><rect x="40" y="62" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="85.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="200" y="62" width="276" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="338" y="85.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">regular function</text><rect x="480" y="62" width="276" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="618" y="85.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">arrow function</text><rect x="40" y="104" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="127.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">this</text><rect x="200" y="104" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="127.4" font-size="12.5" text-anchor="middle" fill="#1e293b">set by the call (dot, new, call)</text><rect x="480" y="104" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="127.4" font-size="12.5" text-anchor="middle" fill="#1e293b">from the outer scope (lexical)</text><rect x="40" y="146" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="169.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">arguments</text><rect x="200" y="146" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="169.4" font-size="12.5" text-anchor="middle" fill="#1e293b">yes</text><rect x="480" y="146" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="169.4" font-size="12.5" text-anchor="middle" fill="#1e293b">no (use ...args)</text><rect x="40" y="188" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="211.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">new</text><rect x="200" y="188" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="211.4" font-size="12.5" text-anchor="middle" fill="#1e293b">can be a constructor</text><rect x="480" y="188" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="211.4" font-size="12.5" text-anchor="middle" fill="#1e293b">TypeError</text><rect x="40" y="230" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="253.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">prototype</text><rect x="200" y="230" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="253.4" font-size="12.5" text-anchor="middle" fill="#1e293b">has .prototype</text><rect x="480" y="230" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="253.4" font-size="12.5" text-anchor="middle" fill="#1e293b">none</text><rect x="40" y="272" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="295.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">call/apply/bind</text><rect x="200" y="272" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="295.4" font-size="12.5" text-anchor="middle" fill="#1e293b">change this</text><rect x="480" y="272" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="295.4" font-size="12.5" text-anchor="middle" fill="#1e293b">can't change this</text><rect x="40" y="314" width="156" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="118" y="337.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">best for</text><rect x="200" y="314" width="276" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="338" y="337.4" font-size="12.5" text-anchor="middle" fill="#1e293b">object methods, constructors</text><rect x="480" y="314" width="276" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="618" y="337.4" font-size="12.5" text-anchor="middle" fill="#1e293b">callbacks, closures, class fields</text><text x="400" y="372" font-size="12.5" text-anchor="middle" fill="#ef4444" font-weight="700">Classic bug: an arrow function as an object METHOD → this is not the object.</text></svg>