<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="HTTP/1.1 uses about six TCP connections, HTTP/2 multiplexes streams over one TCP connection, HTTP/3 uses QUIC over UDP without head-of-line blocking; measured: 60 images loaded in 430 ms over HTTP/1.1 and 58 ms over HTTP/2"><title>HTTP/1.1 uses about six TCP connections, HTTP/2 multiplexes streams over one TCP connection, HTTP/3 uses QUIC over UDP without head-of-line blocking; measured: 60 images loaded in 430 ms over HTTP/1.1 and 58 ms over HTTP/2</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP/1.1 vs HTTP/2 vs HTTP/3</text><rect x="30" y="60" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="78.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700"></text><rect x="180" y="60" width="186" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="273" y="78.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP/1.1</text><rect x="370" y="60" width="186" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="463" y="78.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP/2</text><rect x="560" y="60" width="206" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="663" y="78.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP/3</text><rect x="30" y="94" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="112.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">transport</text><rect x="180" y="94" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="112.7" font-size="10.5" text-anchor="middle" fill="#1e293b">TCP (+TLS)</text><rect x="370" y="94" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="112.7" font-size="10.5" text-anchor="middle" fill="#1e293b">TCP + TLS</text><rect x="560" y="94" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="112.7" font-size="10.5" text-anchor="middle" fill="#1e293b">QUIC over UDP (TLS 1.3 built in)</text><rect x="30" y="128" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="146.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">parallel requests</text><rect x="180" y="128" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="146.7" font-size="10.5" text-anchor="middle" fill="#1e293b">~6 connections per site</text><rect x="370" y="128" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="146.7" font-size="10.5" text-anchor="middle" fill="#1e293b">many streams, 1 connection</text><rect x="560" y="128" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="146.7" font-size="10.5" text-anchor="middle" fill="#1e293b">many streams, 1 connection</text><rect x="30" y="162" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="180.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">head-of-line blocking</text><rect x="180" y="162" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="180.7" font-size="10.5" text-anchor="middle" fill="#1e293b">per connection</text><rect x="370" y="162" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="180.7" font-size="10.5" text-anchor="middle" fill="#1e293b">at TCP level (packet loss)</text><rect x="560" y="162" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="180.7" font-size="10.5" text-anchor="middle" fill="#1e293b">none between streams</text><rect x="30" y="196" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="214.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">headers</text><rect x="180" y="196" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="214.7" font-size="10.5" text-anchor="middle" fill="#1e293b">plain text, repeated</text><rect x="370" y="196" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="214.7" font-size="10.5" text-anchor="middle" fill="#1e293b">HPACK compressed</text><rect x="560" y="196" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="214.7" font-size="10.5" text-anchor="middle" fill="#1e293b">QPACK compressed</text><rect x="30" y="230" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="248.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">connection setup</text><rect x="180" y="230" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="248.7" font-size="10.5" text-anchor="middle" fill="#1e293b">TCP + TLS (2–3 RTT)</text><rect x="370" y="230" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="248.7" font-size="10.5" text-anchor="middle" fill="#1e293b">TCP + TLS</text><rect x="560" y="230" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="248.7" font-size="10.5" text-anchor="middle" fill="#1e293b">1 RTT, 0-RTT on resume</text><rect x="30" y="264" width="146" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="103" y="282.7" font-size="10.5" text-anchor="middle" fill="#1e293b" font-weight="700">network change</text><rect x="180" y="264" width="186" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="273" y="282.7" font-size="10.5" text-anchor="middle" fill="#1e293b">reconnect</text><rect x="370" y="264" width="186" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="463" y="282.7" font-size="10.5" text-anchor="middle" fill="#1e293b">reconnect</text><rect x="560" y="264" width="206" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="663" y="282.7" font-size="10.5" text-anchor="middle" fill="#1e293b">connection migration</text><text x="400" y="310" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome (local TLS server, 60 images, 40 ms server delay each):</text><text x="140" y="336" font-size="12" text-anchor="end" fill="#475569">HTTP/1.1</text><rect x="150" y="322" width="516" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="674" y="337" font-size="12" text-anchor="start" fill="#475569" font-weight="700">430 ms</text><text x="140" y="364" font-size="12" text-anchor="end" fill="#475569">HTTP/2</text><rect x="150" y="350" width="69.6" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="227.6" y="365" font-size="12" text-anchor="start" fill="#475569" font-weight="700">58 ms</text></svg>