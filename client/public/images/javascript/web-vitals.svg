<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="LCP good at 2.5 seconds or less, INP 200 ms or less, CLS 0.1 or less, FCP 1.8 seconds, TTFB 0.8 seconds; judged at the 75th percentile of real users"><title>LCP good at 2.5 seconds or less, INP 200 ms or less, CLS 0.1 or less, FCP 1.8 seconds, TTFB 0.8 seconds; judged at the 75th percentile of real users</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Web Vitals and their thresholds</text><text x="565" y="66" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">good</text><text x="655" y="66" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">needs work</text><text x="740" y="66" font-size="12" text-anchor="middle" fill="#ef4444" font-weight="700">poor</text><rect x="30" y="76" width="70" height="42" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="65" y="101.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">LCP</text><rect x="106" y="76" width="250" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="231" y="93.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Largest Contentful Paint</text><text x="231" y="108.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(loading)</text><rect x="520" y="76" width="86" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="563" y="101.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 2.5 s</text><rect x="612" y="76" width="86" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="101.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 4 s</text><rect x="704" y="76" width="76" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="742" y="101.2" font-size="12" text-anchor="middle" fill="#1e293b">&gt; 4 s</text><rect x="30" y="126" width="70" height="42" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="65" y="151.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">INP</text><rect x="106" y="126" width="250" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="231" y="143.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Interaction to Next Paint</text><text x="231" y="158.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(responsiveness)</text><rect x="520" y="126" width="86" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="563" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 200 ms</text><rect x="612" y="126" width="86" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 500 ms</text><rect x="704" y="126" width="76" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="742" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b">&gt; 500 ms</text><rect x="30" y="176" width="70" height="42" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="65" y="201.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">CLS</text><rect x="106" y="176" width="250" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="231" y="193.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Cumulative Layout Shift</text><text x="231" y="208.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(visual stability)</text><rect x="520" y="176" width="86" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="563" y="201.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 0.1</text><rect x="612" y="176" width="86" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="201.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 0.25</text><rect x="704" y="176" width="76" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="742" y="201.2" font-size="12" text-anchor="middle" fill="#1e293b">&gt; 0.25</text><rect x="30" y="226" width="70" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="65" y="251.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">FCP</text><rect x="106" y="226" width="250" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="231" y="243.8" font-size="11.5" text-anchor="middle" fill="#1e293b">First Contentful Paint</text><text x="231" y="258.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(first pixels)</text><rect x="520" y="226" width="86" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="563" y="251.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 1.8 s</text><rect x="612" y="226" width="86" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="251.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 3 s</text><rect x="704" y="226" width="76" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="742" y="251.2" font-size="12" text-anchor="middle" fill="#1e293b">&gt; 3 s</text><rect x="30" y="276" width="70" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="65" y="301.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">TTFB</text><rect x="106" y="276" width="250" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="231" y="293.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Time to First Byte</text><text x="231" y="308.3" font-size="11.5" text-anchor="middle" fill="#1e293b">(server + network)</text><rect x="520" y="276" width="86" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="563" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 0.8 s</text><rect x="612" y="276" width="86" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">≤ 1.8 s</text><rect x="704" y="276" width="76" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="742" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">&gt; 1.8 s</text><text x="440" y="110" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Core Web Vitals</text><text x="440" y="128" font-size="11" text-anchor="middle" fill="#475569">(LCP, INP, CLS)</text><text x="400" y="352" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Judged at the 75th percentile of real users (field data, e.g. CrUX), not one Lighthouse run.</text></svg>