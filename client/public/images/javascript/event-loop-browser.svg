<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Call stack runs one thing at a time; Web APIs handle timers and network in parallel and queue callbacks; each loop turn runs one task, drains all microtasks, then renders if a frame is due"><title>Call stack runs one thing at a time; Web APIs handle timers and network in parallel and queue callbacks; each loop turn runs one task, drains all microtasks, then renders if a frame is due</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The browser event loop</text><rect x="30" y="64" width="170" height="300" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="115" y="84" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Call stack</text><rect x="45" y="300" width="140" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="115" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">main script</text><rect x="45" y="264" width="140" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="115" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b">handleClick()</text><rect x="45" y="228" width="140" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="115" y="248.2" font-size="12" text-anchor="middle" fill="#1e293b">render()</text><text x="115" y="352" font-size="11.5" text-anchor="middle" fill="#475569">ONE thing at a time</text><rect x="240" y="64" width="230" height="130" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="355" y="84" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">Web APIs (browser threads)</text><text x="355" y="110" font-size="12" text-anchor="middle" fill="#475569">timers · fetch / network</text><text x="355" y="130" font-size="12" text-anchor="middle" fill="#475569">DOM events · IndexedDB</text><text x="355" y="150" font-size="12" text-anchor="middle" fill="#475569">run in PARALLEL, then queue</text><text x="355" y="170" font-size="12" text-anchor="middle" fill="#475569">the callback</text><line x1="202" y1="110" x2="236" y2="110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text x="219" y="100" font-size="10" text-anchor="middle" fill="#475569">start</text><rect x="510" y="64" width="260" height="70" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640" y="84" font-size="12.5" text-anchor="middle" fill="#10b981" font-weight="700">Microtask queue  (ALL drained)</text><text x="640" y="108" font-size="11.5" text-anchor="middle" fill="#475569">promise.then · await · queueMicrotask</text><text x="640" y="124" font-size="11.5" text-anchor="middle" fill="#475569">MutationObserver</text><rect x="510" y="150" width="260" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="640" y="170" font-size="12.5" text-anchor="middle" fill="#f59e0b" font-weight="700">Task queue  (ONE per loop)</text><text x="640" y="194" font-size="11.5" text-anchor="middle" fill="#475569">setTimeout · setInterval · events</text><text x="640" y="210" font-size="11.5" text-anchor="middle" fill="#475569">MessageChannel · network callbacks</text><rect x="510" y="236" width="260" height="60" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="640" y="256" font-size="12.5" text-anchor="middle" fill="#0ea5e9" font-weight="700">Rendering (about every 16.7 ms)</text><text x="640" y="278" font-size="11.5" text-anchor="middle" fill="#475569">rAF → style → layout → paint</text><line x1="472" y1="140" x2="506" y2="100" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><line x1="472" y1="160" x2="506" y2="185" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><rect x="240" y="220" width="230" height="140" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="254" y="255.6" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Event loop, each turn:</text><text x="254" y="271.1" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">1  run ONE task</text><text x="254" y="286.6" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">2  drain ALL microtasks</text><text x="254" y="302.1" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">3  render if a frame is due</text><text x="254" y="317.6" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">   (rAF callbacks first)</text><text x="254" y="333.1" font-size="12.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">4  repeat</text><line x1="238" y1="200" x2="202" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="220" y="192" font-size="10" text-anchor="middle" fill="#475569">next</text><text x="640" y="330" font-size="11.5" text-anchor="middle" fill="#475569">Measured in Chrome 154: a 200 ms loop</text><text x="640" y="348" font-size="11.5" text-anchor="middle" fill="#475569" font-weight="700">delayed a 0 ms timer to 200.2 ms</text></svg>