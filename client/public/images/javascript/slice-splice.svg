 x="294" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">e</text><text x="294" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><line x1="205" y1="140" x2="205" y2="168" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="147" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="173" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><text x="173" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="199" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="225" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">c</text><text x="225" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="205" y="252" font-size="12" text-anchor="middle" fill="#475569">returns a NEW array · end is exclusive</text><text x="205" y="272" font-size="12" text-anchor="middle" fill="#475569">negative index = from the end: slice(-2) → [d, e]</text><text x="595" y="70" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">splice(1, 2, 'X'): edits in place</text><rect x="450" y="84" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="476" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="476" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="502" y="84" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="528" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><text x="528" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="554" y="84" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="580" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">c</text><text x="580" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="606" y="84" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="632" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">d</text><text x="632" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="658" y="84" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="684" y="111.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">e</text><text x="684" y="143" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><line x1="595" y1="140" x2="595" y2="168" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="479" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><text x="505" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="531" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="557" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">X</text><text x="557" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="583" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="609" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">d</text><text x="609" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="635" y="172" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="661" y="199.3" font-size="15" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">e</text><text x="661" y="231" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="595" y="252" font-size="12" text-anchor="middle" fill="#475569">returns the REMOVED items: ['b', 'c']</text><text x="595" y="272" font-size="12" text-anchor="middle" fill="#475569">mutates: shifts the following elements</text><rect x="60" y="300" width="680" height="64" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="328.6" font-size="12.5" text-anchor="middle" fill="#1e293b">slice(start, end) → copy (pure) · splice(start, deleteCount, ...items) → remove/insert (mutates)</text><text x="400" y="344.1" font-size="12.5" text-anchor="middle" fill="#1e293b">Immutable alternative to splice: toSpliced() (ES2023)</text></svg>