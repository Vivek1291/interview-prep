<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Creational patterns (singleton, factory, abstract factory, prototype, builder), structural patterns (module, decorator, adapter, facade, proxy) and behavioral patterns (observer, strategy, command, iterator, mediator, state)"><title>Creational patterns (singleton, factory, abstract factory, prototype, builder), structural patterns (module, decorator, adapter, facade, proxy) and behavioral patterns (observer, strategy, command, iterator, mediator, state)</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design pattern families</text><rect x="30" y="64" width="240" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b">Creational</text><text x="150" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b">HOW objects are created</text><rect x="50" y="130" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="151.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Singleton</text><rect x="50" y="170" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="191.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Factory</text><rect x="50" y="210" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="231.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Abstract Factory</text><rect x="50" y="250" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="271.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Prototype</text><rect x="50" y="290" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="311.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Builder</text><rect x="280" y="64" width="240" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b">Structural</text><text x="400" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b">HOW objects are composed</text><rect x="300" y="130" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="151.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Module / Revealing module</text><rect x="300" y="170" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="191.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Decorator (HOCs)</text><rect x="300" y="210" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="231.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Adapter</text><rect x="300" y="250" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="271.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Facade</text><rect x="300" y="290" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="311.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Proxy</text><rect x="530" y="64" width="240" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b">Behavioral</text><text x="650" y="103.6" font-size="13" text-anchor="middle" fill="#1e293b">HOW objects communicate</text><rect x="550" y="130" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="151.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Observer / Pub-Sub</text><rect x="550" y="170" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="191.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Strategy</text><rect x="550" y="210" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="231.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Command (undo)</text><rect x="550" y="250" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="271.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Iterator</text><rect x="550" y="290" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="311.4" font-size="12.5" text-anchor="middle" fill="#1e293b">Mediator, State</text><text x="400" y="346" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">In JS, many patterns are built from closures, modules, prototypes and first-class functions.</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Frontend examples: Redux store (singleton + observer), React HOCs (decorator), API clients (facade).</text></svg>