<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="HTML becomes the DOM and CSS becomes the CSSOM; together they form the render tree, then layout, paint and composite. Measured first contentful paint: 20 ms without blocking resources, about 512 ms with a slow script in the head or a slow stylesheet"><title>HTML becomes the DOM and CSS becomes the CSSOM; together they form the render tree, then layout, paint and composite. Measured first contentful paint: 20 ms without blocking resources, about 512 ms with a slow script in the head or a slow stylesheet</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The critical rendering path</text><rect x="30" y="70" width="120" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="96.4" font-size="12.5" text-anchor="middle" fill="#1e293b">HTML bytes</text><line x1="152" y1="92" x2="180" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="184" y="70" width="120" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="244" y="96.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">DOM tree</text><rect x="30" y="150" width="120" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="176.4" font-size="12.5" text-anchor="middle" fill="#1e293b">CSS bytes</text><line x1="152" y1="172" x2="180" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="184" y="150" width="120" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="244" y="176.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">CSSOM</text><line x1="306" y1="92" x2="352" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="306" y1="172" x2="352" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="356" y="110" width="120" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="416" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Render tree</text><line x1="478" y1="132" x2="500" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="504" y="110" width="80" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="544" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Layout</text><line x1="586" y1="132" x2="604" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="608" y="110" width="70" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="643" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Paint</text><line x1="680" y1="132" x2="696" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="700" y="110" width="80" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="740" y="136.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Composite</text><text x="245" y="218" font-size="11.5" text-anchor="middle" fill="#475569">JS can change both: a sync &lt;script&gt; PAUSES parsing</text><text x="416" y="178" font-size="11" text-anchor="middle" fill="#475569">visible nodes + styles</text><text x="544" y="178" font-size="11" text-anchor="middle" fill="#475569">sizes, positions</text><text x="643" y="178" font-size="11" text-anchor="middle" fill="#475569">pixels</text><text x="740" y="178" font-size="11" text-anchor="middle" fill="#475569">GPU layers</text><text x="400" y="252" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome 154 (500 ms script or stylesheet): first contentful paint</text><text x="300" y="277" font-size="11.5" text-anchor="end" fill="#475569">no blocking resource</text><rect x="310" y="265" width="15" height="16" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="331" y="277" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">20 ms</text><text x="300" y="299" font-size="11.5" text-anchor="end" fill="#475569">&lt;script async&gt;</text><rect x="310" y="287" width="15" height="16" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="331" y="299" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">20 ms</text><text x="300" y="321" font-size="11.5" text-anchor="end" fill="#475569">&lt;script&gt; at end of body</text><rect x="310" y="309" width="15" height="16" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="331" y="321" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">20 ms</text><text x="300" y="343" font-size="11.5" text-anchor="end" fill="#475569">&lt;script defer&gt;</text><rect x="310" y="331" width="36" height="16" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="352" y="343" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">48 ms</text><text x="300" y="365" font-size="11.5" text-anchor="end" fill="#475569">&lt;link stylesheet&gt; (render-blocking)</text><rect x="310" y="353" width="387" height="16" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="703" y="365" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">516 ms</text><text x="300" y="387" font-size="11.5" text-anchor="end" fill="#475569">&lt;script&gt; in &lt;head&gt; (parser-blocking)</text><rect x="310" y="375" width="384" height="16" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="700" y="387" font-size="11.5" text-anchor="start" fill="#475569" font-weight="700">512 ms</text></svg>