<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="call invokes now with comma-separated arguments, apply invokes now with an array of arguments, bind returns a new function with this fixed to call later"><title>call invokes now with comma-separated arguments, apply invokes now with an array of arguments, bind returns a new function with this fixed to call later</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">call vs apply vs bind</text><rect x="170" y="64" width="460" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="88" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">function greet(greeting, mark) { … this.name … }</text><rect x="30" y="130" width="240" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="155.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">call</text><rect x="30" y="176" width="240" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="210.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">greet.call(user, 'Hi', '!')</text><rect x="30" y="244" width="240" height="62" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="271.6" font-size="12.5" text-anchor="middle" fill="#1e293b">calls NOW</text><text x="150" y="287.1" font-size="12.5" text-anchor="middle" fill="#1e293b">args one by one</text><rect x="280" y="130" width="240" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="155.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">apply</text><rect x="280" y="176" width="240" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="210.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">greet.apply(user, ['Hi', '!'])</text><rect x="280" y="244" width="240" height="62" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="271.6" font-size="12.5" text-anchor="middle" fill="#1e293b">calls NOW</text><text x="400" y="287.1" font-size="12.5" text-anchor="middle" fill="#1e293b">args as an ARRAY</text><rect x="530" y="130" width="240" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="155.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">bind</text><rect x="530" y="176" width="240" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="203.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const g = greet.bind(user, 'Hi')</text><text x="650" y="217.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">g('!')</text><rect x="530" y="244" width="240" height="62" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="271.6" font-size="12.5" text-anchor="middle" fill="#1e293b">returns a NEW function</text><text x="650" y="287.1" font-size="12.5" text-anchor="middle" fill="#1e293b">call it later (args can be pre-filled)</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">All three set &quot;this&quot; to user. Memory aid: Call = Comma, Apply = Array, Bind = Later.</text><text x="400" y="364" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">bind on an arrow function or an already-bound function cannot change its this.</text></svg>