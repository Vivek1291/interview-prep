<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="add(1,2,3) versus curried(1)(2)(3): each call returns a new function until all arguments are collected, which enables partial application"><title>add(1,2,3) versus curried(1)(2)(3): each call returns a new function until all arguments are collected, which enables partial application</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Currying: one argument at a time</text><rect x="30" y="80" width="220" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="106.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">add(1, 2, 3)</text><text x="140" y="146" font-size="12" text-anchor="middle" fill="#475569">one call, all arguments</text><rect x="300" y="80" width="140" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="370" y="106.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">curried(1)</text><line x1="442" y1="102" x2="470" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="474" y="80" width="120" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="534" y="106.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">(2)</text><line x1="596" y1="102" x2="624" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="628" y="80" width="140" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="698" y="106.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">(3) → 6</text><text x="370" y="146" font-size="11.5" text-anchor="middle" fill="#475569">returns a function</text><text x="535" y="146" font-size="11.5" text-anchor="middle" fill="#475569">returns a function</text><text x="698" y="146" font-size="11.5" text-anchor="middle" fill="#475569">enough args → result</text><rect x="60" y="190" width="680" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="74" y="221.6" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const withTax = price =&gt; rate =&gt; price * (1 + rate)</text><text x="74" y="237.1" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const logError = log('error')     // pre-filled first argument, reused everywhere</text><rect x="60" y="280" width="330" height="76" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="225" y="314.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Generic curry(fn): collect args until</text><text x="225" y="330.1" font-size="12.5" text-anchor="middle" fill="#1e293b">args.length &gt;= fn.length, then call fn</text><rect x="410" y="280" width="330" height="76" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="575" y="314.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Why: partial application, reusable</text><text x="575" y="330.1" font-size="12.5" text-anchor="middle" fill="#1e293b">configured functions, composition (pipe)</text></svg>