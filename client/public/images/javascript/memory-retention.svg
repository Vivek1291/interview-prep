<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured heap: a Map still held 80.7 MB after its keys were dropped, a WeakMap fell to 3.6 MB; 100 closures over large arrays retained 76.3 MB until the handlers were removed"><title>Measured heap: a Map still held 80.7 MB after its keys were dropped, a WeakMap fell to 3.6 MB; 100 closures over large arrays retained 76.3 MB until the handlers were removed</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What keeps memory alive (measured)</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured with node --expose-gc (V8, Node 22): heap used after a forced GC</text><text x="330" y="108" font-size="12" text-anchor="end" fill="#475569">Map: 10,000 object keys → 8 KB values</text><rect x="340" y="92" width="338.9" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686.9" y="110" font-size="12" text-anchor="start" fill="#475569" font-weight="700">80.7 MB</text><text x="330" y="152" font-size="12" text-anchor="end" fill="#475569">Map: after the keys are dropped</text><rect x="340" y="136" width="338.9" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="686.9" y="154" font-size="12" text-anchor="start" fill="#475569" font-weight="700">80.7 MB</text><text x="330" y="196" font-size="12" text-anchor="end" fill="#475569">WeakMap: while the keys are alive</text><rect x="340" y="180" width="338.9" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="686.9" y="198" font-size="12" text-anchor="start" fill="#475569" font-weight="700">80.7 MB</text><text x="330" y="240" font-size="12" text-anchor="end" fill="#475569">WeakMap: after the keys are dropped</text><rect x="340" y="224" width="15.1" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="363.1" y="242" font-size="12" text-anchor="start" fill="#475569" font-weight="700">3.6 MB</text><text x="330" y="284" font-size="12" text-anchor="end" fill="#475569">100 handlers closing over 100k arrays</text><rect x="340" y="268" width="320.5" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="668.5" y="286" font-size="12" text-anchor="start" fill="#475569" font-weight="700">76.3 MB</text><text x="330" y="328" font-size="12" text-anchor="end" fill="#475569">after removing those handlers</text><rect x="340" y="312" width="3" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="348.4" y="330" font-size="12" text-anchor="start" fill="#475569" font-weight="700">≈0 MB</text><text x="400" y="370" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Anything still reachable stays in memory: a Map keeps its keys alive, a closure keeps its scope alive.</text></svg>