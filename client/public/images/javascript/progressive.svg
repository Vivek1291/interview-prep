<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured streamed page: the header painted at 28 ms, the sidebar at 308 ms and the main text at 612 ms; the browser paints progressively as HTML arrives, and LCP candidates update"><title>Measured streamed page: the header painted at 28 ms, the sidebar at 308 ms and the main text at 612 ms; the browser paints progressively as HTML arrives, and LCP candidates update</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Does the browser paint the page all at once?</text><text x="400" y="64" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: a streamed page (server sends 3 chunks, 300 ms apart)</text><rect x="40" y="80" width="220" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="150" y="270" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">paint at 28 ms</text><rect x="50" y="90" width="200" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="150" y="108.9" font-size="11" text-anchor="middle" fill="#1e293b">header</text><rect x="290" y="80" width="220" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="400" y="270" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">paint at 308 ms</text><rect x="300" y="90" width="200" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="108.9" font-size="11" text-anchor="middle" fill="#1e293b">header</text><rect x="300" y="128" width="70" height="112" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="335" y="187.7" font-size="10.5" text-anchor="middle" fill="#1e293b">sidebar</text><rect x="540" y="80" width="220" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="650" y="270" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">paint at 612 ms</text><rect x="550" y="90" width="200" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="108.9" font-size="11" text-anchor="middle" fill="#1e293b">header</text><rect x="550" y="128" width="70" height="112" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="585" y="187.7" font-size="10.5" text-anchor="middle" fill="#1e293b">sidebar</text><rect x="628" y="128" width="122" height="112" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="689" y="187.9" font-size="11" text-anchor="middle" fill="#1e293b">main text</text><rect x="30" y="292" width="740" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="321.5" font-size="11.5" text-anchor="middle" fill="#1e293b">The parser builds the DOM as bytes arrive and the browser paints what it has at the next frame, so users see</text><text x="400" y="336" font-size="11.5" text-anchor="middle" fill="#1e293b">content in chunks. LCP updated each time a bigger element appeared: header (28 ms) → sidebar (308 ms) → main text (612 ms).</text><text x="400" y="350.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Blockers: CSS in &lt;head&gt; (no paint until loaded) and parser-blocking scripts.</text></svg>