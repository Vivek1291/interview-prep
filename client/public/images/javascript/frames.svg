<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Frames are presented on vsync every 16.7 ms; measured: a 25 ms task made the next frame appear at about 33.3 ms (one dropped frame); a 120 ms task appeared as a 135.6 ms long animation frame"><title>Frames are presented on vsync every 16.7 ms; measured: a 25 ms task made the next frame appear at about 33.3 ms (one dropped frame); a 120 ms task appeared as a 135.6 ms long animation frame</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Frames, vsync and dropped frames</text><text x="400" y="64" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Frames at 60 Hz: one every 16.7 ms (vsync)</text><line x1="60" y1="80" x2="60" y2="200" stroke="#64748b" stroke-dasharray="4 3"/><text x="60" y="214" font-size="11" text-anchor="middle" fill="#475569">0.0 ms</text><line x1="230" y1="80" x2="230" y2="200" stroke="#64748b" stroke-dasharray="4 3"/><text x="230" y="214" font-size="11" text-anchor="middle" fill="#475569">16.7 ms</text><line x1="400" y1="80" x2="400" y2="200" stroke="#64748b" stroke-dasharray="4 3"/><text x="400" y="214" font-size="11" text-anchor="middle" fill="#475569">33.4 ms</text><line x1="570" y1="80" x2="570" y2="200" stroke="#64748b" stroke-dasharray="4 3"/><text x="570" y="214" font-size="11" text-anchor="middle" fill="#475569">50.1 ms</text><line x1="740" y1="80" x2="740" y2="200" stroke="#64748b" stroke-dasharray="4 3"/><text x="740" y="214" font-size="11" text-anchor="middle" fill="#475569">66.8 ms</text><rect x="62" y="96" width="120" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="122" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b">frame 1 ✓</text><rect x="232" y="96" width="255" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="359.5" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">long task 25 ms (misses 16.7 deadline)</text><rect x="402" y="140" width="120" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="462" y="158.9" font-size="11" text-anchor="middle" fill="#1e293b">frame shown here</text><rect x="572" y="96" width="120" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="632" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b">back on time ✓</text><text x="400" y="244" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome: rAF callback gaps 16.5 → 25.0 → 8.4 → 16.6 ms</text><text x="400" y="264" font-size="12" text-anchor="middle" fill="#475569">25 + 8.4 = 33.4 ms: the work finished at 25 ms but was shown at the next vsync (33.3 ms): one dropped frame</text><rect x="30" y="286" width="360" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="210" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">Budget per frame ≈ 16.7 ms (60 Hz), 8.3 ms (120 Hz)</text><text x="210" y="335.2" font-size="12" text-anchor="middle" fill="#1e293b">for JS + style + layout + paint.</text><text x="210" y="350.2" font-size="12" text-anchor="middle" fill="#1e293b">Miss it → jank (animation jumps 1 → 3).</text><rect x="410" y="286" width="360" height="90" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="590" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">Long Animation Frames API: a 120 ms</text><text x="590" y="335.2" font-size="12" text-anchor="middle" fill="#1e293b">blocking task was reported as a 135.6 ms</text><text x="590" y="350.2" font-size="12" text-anchor="middle" fill="#1e293b">long-animation-frame entry (what INP sees).</text></svg>