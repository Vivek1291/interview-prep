<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Steps after typing a URL: DNS lookup through resolvers, TCP connect, TLS handshake, HTTP request, server response, then parsing and rendering"><title>Steps after typing a URL: DNS lookup through resolvers, TCP connect, TLS handshake, HTTP request, server response, then parsing and rendering</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">From URL to pixels</text><rect x="40" y="64" width="40" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="60" y="86.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><rect x="86" y="64" width="170" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="171" y="86.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">URL typed</text><rect x="262" y="64" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="86" font-size="11.5" text-anchor="middle" fill="#1e293b">parse, check HSTS &amp; cache</text><rect x="40" y="108" width="40" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="60" y="130.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><rect x="86" y="108" width="170" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="171" y="130.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">DNS lookup</text><rect x="262" y="108" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="130" font-size="11.5" text-anchor="middle" fill="#1e293b">browser → OS → resolver → root → .com → domain</text><rect x="40" y="152" width="40" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="60" y="174.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><rect x="86" y="152" width="170" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="171" y="174.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">TCP connect</text><rect x="262" y="152" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="174" font-size="11.5" text-anchor="middle" fill="#1e293b">SYN, SYN-ACK, ACK (1 round trip)</text><rect x="40" y="196" width="40" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="60" y="218.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><rect x="86" y="196" width="170" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="171" y="218.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">TLS handshake</text><rect x="262" y="196" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="218" font-size="11.5" text-anchor="middle" fill="#1e293b">certificates + keys (1 RTT with TLS 1.3)</text><rect x="40" y="240" width="40" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="60" y="262.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><rect x="86" y="240" width="170" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="171" y="262.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP request</text><rect x="262" y="240" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="262" font-size="11.5" text-anchor="middle" fill="#1e293b">GET / with cookies, headers (HTTP/2 or 3)</text><rect x="40" y="284" width="40" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="60" y="306.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">6</text><rect x="86" y="284" width="170" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="171" y="306.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Server response</text><rect x="262" y="284" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="306" font-size="11.5" text-anchor="middle" fill="#1e293b">TTFB: server work + network</text><rect x="40" y="328" width="40" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="60" y="350.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><rect x="86" y="328" width="170" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="171" y="350.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Parse + render</text><rect x="262" y="328" width="330" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="427" y="350" font-size="11.5" text-anchor="middle" fill="#1e293b">DOM, CSSOM, JS, layout, paint (CRP)</text><rect x="610" y="64" width="160" height="124" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="690" y="101" font-size="11.5" text-anchor="middle" fill="#1e293b">DNS caches:</text><text x="690" y="115.5" font-size="11.5" text-anchor="middle" fill="#1e293b">browser cache</text><text x="690" y="130" font-size="11.5" text-anchor="middle" fill="#1e293b">OS cache</text><text x="690" y="144.5" font-size="11.5" text-anchor="middle" fill="#1e293b">router / ISP resolver</text><text x="690" y="159" font-size="11.5" text-anchor="middle" fill="#1e293b">(TTL decides how long)</text><rect x="610" y="200" width="160" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="235" font-size="11.5" text-anchor="middle" fill="#1e293b">Speed-ups:</text><text x="690" y="249.5" font-size="11.5" text-anchor="middle" fill="#1e293b">CDN close to users</text><text x="690" y="264" font-size="11.5" text-anchor="middle" fill="#1e293b">preconnect</text><text x="690" y="278.5" font-size="11.5" text-anchor="middle" fill="#1e293b">HTTP/2, HTTP/3 (QUIC)</text><text x="690" y="293" font-size="11.5" text-anchor="middle" fill="#1e293b">keep-alive</text><text x="400" y="382" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Each round trip costs latency (e.g. 50 to 150 ms on mobile), so fewer origins and early connects matter.</text></svg>