<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="makeCounter returns a function that keeps a reference to its lexical environment containing count, so count survives after makeCounter returns; each call creates a separate environment"><title>makeCounter returns a function that keeps a reference to its lexical environment containing count, so count survives after makeCounter returns; each call creates a separate environment</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Closure: a function plus the variables it remembers</text><rect x="30" y="70" width="290" height="150" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="118.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">function makeCounter() {</text><text x="44" y="133.9" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  let count = 0</text><text x="44" y="149.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  return () =&gt; ++count</text><text x="44" y="164.9" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><text x="44" y="180.4" font-size="12.5" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">const next = makeCounter()</text><text x="175" y="240" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">makeCounter() has FINISHED…</text><text x="175" y="260" font-size="12.5" text-anchor="middle" fill="#475569">…but count is still alive</text><line x1="324" y1="140" x2="400" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="410" y="76" width="170" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="495" y="107.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">next  (the function)</text><path d="M495 132 Q527.5 136 560 200" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><rect x="520" y="200" width="240" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="640" y="233.6" font-size="13" text-anchor="middle" fill="#1e293b">🎒 closure (backpack)</text><text x="640" y="249.6" font-size="13" text-anchor="middle" fill="#1e293b">lexical environment</text><text x="640" y="265.6" font-size="13" text-anchor="middle" fill="#1e293b">{ count: 2 }</text><text x="545" y="320" font-size="12.5" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">next() → 1   next() → 2</text><text x="545" y="342" font-size="12" text-anchor="middle" fill="#475569">(count lives on in the heap)</text><rect x="40" y="296" width="280" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="180" y="327.7" font-size="12" text-anchor="middle" fill="#1e293b">Each makeCounter() call creates a NEW</text><text x="180" y="342.7" font-size="12" text-anchor="middle" fill="#1e293b">environment → independent counters</text><text x="680" y="92" font-size="12" text-anchor="middle" fill="#475569">Uses: private state,</text><text x="680" y="110" font-size="12" text-anchor="middle" fill="#475569">factories, debounce,</text><text x="680" y="128" font-size="12" text-anchor="middle" fill="#475569">React hooks</text></svg>