<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A normal script pauses HTML parsing while it downloads and runs; async downloads in parallel and runs as soon as ready, interrupting parsing; defer downloads in parallel and runs after parsing in order; modules are deferred by default"><title>A normal script pauses HTML parsing while it downloads and runs; async downloads in parallel and runs as soon as ready, interrupting parsing; defer downloads in parallel and runs after parsing in order; modules are deferred by default</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Script loading: normal vs async vs defer</text><text x="136" y="98" font-size="13" text-anchor="end" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script&gt;</text><rect x="160" y="80" width="150" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="235" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">parse</text><rect x="310" y="80" width="175" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="397.5" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">download</text><rect x="485" y="80" width="75" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="522.5" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">run</text><rect x="560" y="80" width="200" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="660" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">parse</text><text x="136" y="120" font-size="11" text-anchor="end" fill="#475569" font-style="italic">blocks parsing</text><text x="136" y="168" font-size="13" text-anchor="end" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script async&gt;</text><rect x="160" y="150" width="600" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="460" y="166.9" font-size="11" text-anchor="middle" fill="#1e293b">parse (continues)</text><rect x="310" y="176" width="175" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="397.5" y="192.9" font-size="11" text-anchor="middle" fill="#1e293b">download</text><rect x="485" y="176" width="75" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="522.5" y="192.9" font-size="11" text-anchor="middle" fill="#1e293b">run</text><text x="136" y="190" font-size="11" text-anchor="end" fill="#475569" font-style="italic">runs when ready</text><text x="136" y="308" font-size="13" text-anchor="end" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script defer&gt;</text><rect x="160" y="290" width="500" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="410" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">parse (continues)</text><rect x="310" y="316" width="175" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="397.5" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">download</text><rect x="660" y="316" width="75" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="697.5" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">run</text><text x="136" y="330" font-size="11" text-anchor="end" fill="#475569" font-style="italic">after parsing, in order</text><text x="136" y="378" font-size="13" text-anchor="end" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">type=&quot;module&quot;</text><rect x="160" y="360" width="500" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="410" y="376.9" font-size="11" text-anchor="middle" fill="#1e293b">parse</text><rect x="310" y="386" width="175" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="397.5" y="402.9" font-size="11" text-anchor="middle" fill="#1e293b">download + deps</text><rect x="660" y="386" width="75" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="697.5" y="402.9" font-size="11" text-anchor="middle" fill="#1e293b">run</text><text x="136" y="400" font-size="11" text-anchor="end" fill="#475569" font-style="italic">deferred by default</text><text x="400" y="370" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">async: independent scripts (analytics). defer / module: app code that needs the DOM, keeps order.</text></svg>