<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Take a baseline snapshot, repeat the suspect action, take another snapshot, compare deltas, inspect retainers, fix and verify; shallow vs retained size and detached DOM nodes explained"><title>Take a baseline snapshot, repeat the suspect action, take another snapshot, compare deltas, inspect retainers, fix and verify; shallow vs retained size and detached DOM nodes explained</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Finding a memory leak with heap snapshots</text><rect x="30" y="70" width="240" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="103.9" font-size="12.5" text-anchor="middle" fill="#1e293b">1 · Baseline snapshot</text><text x="150" y="119.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="150" y="134.9" font-size="12.5" text-anchor="middle" fill="#1e293b">after the page settles</text><rect x="280" y="70" width="240" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="103.9" font-size="12.5" text-anchor="middle" fill="#1e293b">2 · Repeat the action</text><text x="400" y="119.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="400" y="134.9" font-size="12.5" text-anchor="middle" fill="#1e293b">open/close the modal 5–10 times</text><rect x="530" y="70" width="240" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="103.9" font-size="12.5" text-anchor="middle" fill="#1e293b">3 · Snapshot again</text><text x="650" y="119.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="650" y="134.9" font-size="12.5" text-anchor="middle" fill="#1e293b">collect garbage first (trash icon)</text><rect x="30" y="180" width="240" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="150" y="213.9" font-size="12.5" text-anchor="middle" fill="#1e293b">4 · Comparison view</text><text x="150" y="229.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="150" y="244.9" font-size="12.5" text-anchor="middle" fill="#1e293b">sort by # Delta / Size Delta</text><rect x="280" y="180" width="240" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="213.9" font-size="12.5" text-anchor="middle" fill="#1e293b">5 · Retainers</text><text x="400" y="229.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="400" y="244.9" font-size="12.5" text-anchor="middle" fill="#1e293b">who still references the object?</text><rect x="530" y="180" width="240" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="213.9" font-size="12.5" text-anchor="middle" fill="#1e293b">6 · Fix + verify</text><text x="650" y="229.4" font-size="12.5" text-anchor="middle" fill="#1e293b"></text><text x="650" y="244.9" font-size="12.5" text-anchor="middle" fill="#1e293b">remove listener / clear ref, re-measure</text><rect x="30" y="300" width="740" height="76" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="334.7" font-size="12" text-anchor="middle" fill="#1e293b">Shallow size = the object itself · Retained size = what would be freed with it</text><text x="400" y="349.7" font-size="12" text-anchor="middle" fill="#1e293b">Distance = hops from a root · &quot;Detached&quot; in the class filter = DOM nodes removed from the page but still referenced</text></svg>