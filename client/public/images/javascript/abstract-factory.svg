<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An abstract UI factory interface is implemented by light and dark theme factories, each creating a matching button, input and tooltip; app code picks one factory and gets a consistent family"><title>An abstract UI factory interface is implemented by light and dark theme factories, each creating a matching button, input and tooltip; app code picks one factory and gets a consistent family</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Abstract factory: families of related objects</text><rect x="200" y="58" width="400" height="54" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="81.6" font-size="12.5" text-anchor="middle" fill="#1e293b">UI factory interface</text><text x="400" y="97.1" font-size="12.5" text-anchor="middle" fill="#1e293b">createButton() · createInput() · createTooltip()</text><rect x="60" y="150" width="280" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="200" y="176.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">lightTheme factory</text><rect x="460" y="150" width="280" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="600" y="176.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">darkTheme factory</text><line x1="300" y1="114" x2="220" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="114" x2="580" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="60" y="214" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="105" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">LightButton</text><rect x="155" y="214" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="200" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">LightInput</text><rect x="250" y="214" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="295" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">LightTooltip</text><rect x="460" y="214" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="505" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">DarkButton</text><rect x="555" y="214" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="600" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">DarkInput</text><rect x="650" y="214" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="695" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">DarkTooltip</text><rect x="60" y="280" width="680" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="309.2" font-size="12" text-anchor="middle" fill="#1e293b">App code: const ui = theme === &quot;dark&quot; ? darkTheme : lightTheme</text><text x="400" y="324.2" font-size="12" text-anchor="middle" fill="#1e293b">ui.createButton(), ui.createInput() … always a MATCHING FAMILY (never a dark button in a light form)</text><text x="400" y="339.2" font-size="12" text-anchor="middle" fill="#1e293b">Factory = one product by type · Abstract factory = a family of related products</text></svg>