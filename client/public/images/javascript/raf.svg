<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Each 16.7 ms frame runs JavaScript, then requestAnimationFrame callbacks, then layout and paint; rAF syncs with the display and pauses in background tabs, unlike setTimeout"><title>Each 16.7 ms frame runs JavaScript, then requestAnimationFrame callbacks, then layout and paint; rAF syncs with the display and pauses in background tabs, unlike setTimeout</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">requestAnimationFrame</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">A frame every 16.7 ms at 60 Hz (measured in Chrome 154: 16.5 to 16.8 ms)</text><rect x="40" y="80" width="176" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="128" y="98" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">frame 1</text><rect x="48" y="108" width="52" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="74" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">JS</text><rect x="102" y="108" width="40" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="122" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">rAF</text><rect x="144" y="108" width="64" height="26" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="176" y="124.5" font-size="10" text-anchor="middle" fill="#1e293b">layout+paint</text><text x="128" y="156" font-size="11" text-anchor="middle" fill="#475569">16.7 ms budget</text><rect x="220" y="80" width="176" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="308" y="98" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">frame 2</text><rect x="228" y="108" width="52" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="254" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">JS</text><rect x="282" y="108" width="40" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">rAF</text><rect x="324" y="108" width="64" height="26" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="356" y="124.5" font-size="10" text-anchor="middle" fill="#1e293b">layout+paint</text><text x="308" y="156" font-size="11" text-anchor="middle" fill="#475569">16.7 ms budget</text><rect x="400" y="80" width="176" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="488" y="98" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">frame 3</text><rect x="408" y="108" width="52" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="434" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">JS</text><rect x="462" y="108" width="40" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="482" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">rAF</text><rect x="504" y="108" width="64" height="26" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="536" y="124.5" font-size="10" text-anchor="middle" fill="#1e293b">layout+paint</text><text x="488" y="156" font-size="11" text-anchor="middle" fill="#475569">16.7 ms budget</text><rect x="580" y="80" width="176" height="90" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="668" y="98" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">frame 4</text><rect x="588" y="108" width="52" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="614" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">JS</text><rect x="642" y="108" width="40" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="662" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">rAF</text><rect x="684" y="108" width="64" height="26" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="716" y="124.5" font-size="10" text-anchor="middle" fill="#1e293b">layout+paint</text><text x="668" y="156" font-size="11" text-anchor="middle" fill="#475569">16.7 ms budget</text><text x="220" y="210" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">requestAnimationFrame(update)</text><text x="220" y="232" font-size="12" text-anchor="middle" fill="#475569">runs right before the next paint, once per frame</text><text x="220" y="252" font-size="12" text-anchor="middle" fill="#475569">paused in background tabs (saves battery)</text><text x="220" y="272" font-size="12" text-anchor="middle" fill="#475569">receives a timestamp → time-based motion</text><text x="590" y="210" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">setTimeout(update, 16)</text><text x="590" y="232" font-size="12" text-anchor="middle" fill="#475569">not synced with the display → dropped/double frames</text><text x="590" y="252" font-size="12" text-anchor="middle" fill="#475569">keeps running in background tabs (throttled)</text><text x="590" y="272" font-size="12" text-anchor="middle" fill="#475569">drifts; clamped and delayed by long tasks</text><rect x="60" y="300" width="680" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="331.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Animate transform and opacity (compositor only), read layout before writing,</text><text x="400" y="347.1" font-size="12.5" text-anchor="middle" fill="#1e293b">move by elapsed time: x += speed × (now − last), cancel with cancelAnimationFrame(id).</text></svg>