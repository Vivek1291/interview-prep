<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="rex links to Dog.prototype, which links to Animal.prototype, then Object.prototype, then null; property lookups walk this chain"><title>rex links to Dog.prototype, which links to Animal.prototype, then Object.prototype, then null; property lookups walk this chain</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The prototype chain</text><rect x="40" y="80" width="200" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="113.6" font-size="13" text-anchor="middle" fill="#1e293b">rex</text><text x="140" y="129.6" font-size="13" text-anchor="middle" fill="#1e293b">{ name: 'Rex' }</text><text x="140" y="145.6" font-size="13" text-anchor="middle" fill="#1e293b">own properties</text><line x1="242" y1="125" x2="296" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="269" y="114" font-size="10.5" text-anchor="middle" fill="#475569">[[Prototype]]</text><rect x="300" y="80" width="200" height="90" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="121.6" font-size="13" text-anchor="middle" fill="#1e293b">Dog.prototype</text><text x="400" y="137.6" font-size="13" text-anchor="middle" fill="#1e293b">bark()</text><line x1="502" y1="125" x2="556" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="560" y="80" width="200" height="90" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="660" y="121.6" font-size="13" text-anchor="middle" fill="#1e293b">Animal.prototype</text><text x="660" y="137.6" font-size="13" text-anchor="middle" fill="#1e293b">eat()</text><line x1="660" y1="172" x2="660" y2="206" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="560" y="210" width="200" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="660" y="241.7" font-size="12" text-anchor="middle" fill="#1e293b">Object.prototype</text><text x="660" y="256.7" font-size="12" text-anchor="middle" fill="#1e293b">toString(), hasOwnProperty()</text><line x1="660" y1="282" x2="660" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="600" y="314" width="120" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="660" y="335.4" font-size="12.5" text-anchor="middle" fill="#1e293b">null (end)</text><text x="250" y="220" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">rex.eat() lookup:</text><text x="250" y="244" font-size="12.5" text-anchor="middle" fill="#475569">1 own props of rex → no</text><text x="250" y="266" font-size="12.5" text-anchor="middle" fill="#475569">2 Dog.prototype → no</text><text x="250" y="288" font-size="12.5" text-anchor="middle" fill="#10b981">3 Animal.prototype → found eat() ✓</text><text x="250" y="310" font-size="12.5" text-anchor="middle" fill="#475569">(not found at null → undefined)</text><text x="250" y="350" font-size="12" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">Object.getPrototypeOf(rex) === Dog.prototype</text></svg>