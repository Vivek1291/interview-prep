<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A subject keeps a set of subscribers and notifies each one when an event is emitted; subscribe returns an unsubscribe function that must be called in cleanup"><title>A subject keeps a set of subscribers and notifies each one when an event is emitted; subscribe returns an unsubscribe function that must be called in cleanup</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Observer / Pub-Sub</text><rect x="200" y="62" width="400" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="93.6" font-size="12.5" text-anchor="middle" fill="#1e293b">Subject / EventEmitter (subscribers: Set)</text><text x="400" y="109.1" font-size="12.5" text-anchor="middle" fill="#1e293b">emit('cart:add', item) → every subscriber is notified</text><line x1="400" y1="132" x2="140" y2="196" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="60" y="200" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="226.6" font-size="13" text-anchor="middle" fill="#1e293b">cart badge</text><line x1="400" y1="132" x2="400" y2="196" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="320" y="200" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="226.6" font-size="13" text-anchor="middle" fill="#1e293b">analytics</text><line x1="400" y1="132" x2="660" y2="196" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="580" y="200" width="160" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="660" y="226.6" font-size="13" text-anchor="middle" fill="#1e293b">toast</text><rect x="40" y="270" width="360" height="92" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="220" y="305.2" font-size="12" text-anchor="middle" fill="#1e293b">subscribe(fn) → returns unsubscribe()</text><text x="220" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">emit(event, data) → call each fn</text><text x="220" y="335.2" font-size="12" text-anchor="middle" fill="#1e293b">unsubscribe in cleanup (or leak!)</text><rect x="420" y="270" width="350" height="92" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="305.2" font-size="12" text-anchor="middle" fill="#1e293b">Seen in: DOM events, Node EventEmitter,</text><text x="595" y="320.2" font-size="12" text-anchor="middle" fill="#1e293b">Redux store.subscribe, RxJS, WebSockets,</text><text x="595" y="335.2" font-size="12" text-anchor="middle" fill="#1e293b">useSyncExternalStore</text></svg>