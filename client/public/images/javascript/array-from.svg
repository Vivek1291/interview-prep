<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Array.from turns iterables like strings, Sets, Maps and NodeLists, and array-likes with a length, into real arrays, optionally mapping each item; isArray is checked with Object.prototype.toString"><title>Array.from turns iterables like strings, Sets, Maps and NodeLists, and array-likes with a length, into real arrays, optionally mapping each item; isArray is checked with Object.prototype.toString</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Array.from and Array.isArray</text><rect x="40" y="70" width="140" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="110" y="101.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">iterable</text><rect x="186" y="70" width="330" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="351" y="101" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'abc', new Set(), new Map(), NodeList</text><line x1="518" y1="97" x2="560" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><rect x="40" y="140" width="140" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="110" y="171.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">array-like</text><rect x="186" y="140" width="330" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="351" y="171" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ length: 3, 0: …, 1: … }, arguments</text><line x1="518" y1="167" x2="560" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><rect x="40" y="210" width="140" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="110" y="241.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">with mapFn</text><rect x="186" y="210" width="330" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="351" y="241" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Array.from({ length: 5 }, (_, i) =&gt; i * 2)</text><line x1="518" y1="237" x2="560" y2="160" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="564" y="128" width="200" height="64" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="664" y="156.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">a real Array</text><text x="664" y="172.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(map, filter, …)</text><rect x="40" y="290" width="724" height="76" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="402" y="324.7" font-size="12" text-anchor="middle" fill="#1e293b">Polyfill order: 1) has Symbol.iterator? → iterate · 2) else read .length (ToLength) and index 0…length−1</text><text x="402" y="339.7" font-size="12" text-anchor="middle" fill="#1e293b">3) call mapFn(value, index) if given · Array.isArray(x) → Object.prototype.toString.call(x) === &quot;[object Array]&quot;</text></svg>