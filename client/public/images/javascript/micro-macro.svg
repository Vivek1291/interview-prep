<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Synchronous logs first, then all microtasks (promise then and queueMicrotask), then the setTimeout task, then requestAnimationFrame before the next paint; measured costs of microtasks vs timers"><title>Synchronous logs first, then all microtasks (promise then and queueMicrotask), then the setTimeout task, then requestAnimationFrame before the next paint; measured costs of microtasks vs timers</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Output order: sync → microtasks → task → frame</text><rect x="30" y="66" width="330" height="190" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="44" y="120.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log('1 sync')</text><text x="44" y="135.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">setTimeout(() =&gt; log('5 timeout'), 0)</text><text x="44" y="150.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Promise.resolve()</text><text x="44" y="165.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  .then(() =&gt; log('3 promise'))</text><text x="44" y="180.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">queueMicrotask(() =&gt; log('4 microtask'))</text><text x="44" y="195.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">requestAnimationFrame(() =&gt; log('6 raf'))</text><text x="44" y="210.2" font-size="12" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">console.log('2 sync')</text><rect x="400" y="66" width="130" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="465" y="86.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1 sync</text><text x="545" y="87" font-size="11.5" text-anchor="start" fill="#475569">call stack</text><rect x="400" y="106" width="130" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="465" y="126.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2 sync</text><text x="545" y="127" font-size="11.5" text-anchor="start" fill="#475569">call stack</text><rect x="400" y="146" width="130" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="465" y="166.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3 promise</text><text x="545" y="167" font-size="11.5" text-anchor="start" fill="#475569">microtasks: drained right after the script</text><rect x="400" y="186" width="130" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="465" y="206.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4 microtask</text><rect x="400" y="226" width="130" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="465" y="246.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5 timeout</text><text x="545" y="247" font-size="11.5" text-anchor="start" fill="#475569">next task</text><rect x="400" y="266" width="130" height="32" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="465" y="286.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">6 raf</text><text x="545" y="287" font-size="11.5" text-anchor="start" fill="#475569">before the next paint</text><text x="400" y="316" font-size="12" text-anchor="middle" fill="#475569">Measured in Chrome 154: 1,000 promise callbacks = 0.1 ms; 1,000 setTimeout(0) = 6.2 ms;</text><text x="400" y="336" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">1,000 CHAINED setTimeout(0) = 4,503 ms (after 5 nested levels, timers are clamped to ≥4 ms)</text><text x="400" y="362" font-size="11.5" text-anchor="middle" fill="#475569" font-style="italic">rAF vs timeout order can vary: rAF runs only when a frame is rendered.</text></svg>