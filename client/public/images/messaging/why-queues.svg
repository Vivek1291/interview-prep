<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Producer, queue and workers; measured signup endpoint at 15 requests per second when sending email inline vs 11,209 when enqueuing, and the backlog that builds when producers outpace workers"><title>Producer, queue and workers; measured signup endpoint at 15 requests per second when sending email inline vs 11,209 when enqueuing, and the backlog that builds when producers outpace workers</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Why use a queue? (measured)</text><rect x="30" y="58" width="220" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">producer (API)</text><rect x="260" y="58" width="220" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="370" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">queue / broker</text><rect x="520" y="58" width="220" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="630" y="87.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">consumers (workers)</text><line x1="250" y1="83" x2="260" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="480" y1="83" x2="520" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="132" font-size="12" text-anchor="middle" fill="#475569">enqueue → 201 to the user immediately · workers do the slow part · ack when done</text><text x="400" y="162" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: POST /signup sends a welcome email (SMTP ~300 ms), 20 connections, 5 s</text><text x="220" y="190" font-size="11.5" text-anchor="end" fill="#475569">email sent inline</text><rect x="230" y="174" width="3" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="239" y="190" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">15 req/s · p50 1,222 ms</text><text x="220" y="224" font-size="11.5" text-anchor="end" fill="#475569">email enqueued (BullMQ)</text><rect x="230" y="208" width="336.27" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="572.27" y="224" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">11209 req/s · p50 1 ms</text><rect x="30" y="254" width="740" height="120" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="289" font-size="11.5" text-anchor="middle" fill="#1e293b">The other side: 5 s of traffic queued ~56,000 emails; the worker drained them at the provider's pace</text><text x="400" y="303.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(~17/s) and most were still waiting 2 minutes later. A queue absorbs bursts, it does not create capacity:</text><text x="400" y="318" font-size="11.5" text-anchor="middle" fill="#1e293b">monitor queue depth and age of the oldest job, scale workers, and rate-limit to the provider's limits.</text><text x="400" y="332.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Use queues for: emails/SMS/push, PDFs and exports, image/video processing, webhooks to partners,</text><text x="400" y="347" font-size="11.5" text-anchor="middle" fill="#1e293b">search indexing, anything slow, flaky or not needed for the response.</text></svg>