<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured 27 of 50 orders ending in the wrong state with parallel workers, none with serial or partitioned processing; how Kafka, SQS FIFO, RabbitMQ and BullMQ provide per-key ordering"><title>Measured 27 of 50 orders ending in the wrong state with parallel workers, none with serial or partitioned processing; how Kafka, SQS FIFO, RabbitMQ and BullMQ provide per-key ordering</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Message ordering vs parallelism (measured)</text><rect x="30" y="58" width="740" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="77.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Events per order: created → paid → shipped.</text><text x="400" y="92.25" font-size="11.5" text-anchor="middle" fill="#1e293b">If two workers process the same order's events in parallel, "paid" can finish after "shipped".</text><text x="400" y="128" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 50 orders × 3 events, 0–20 ms processing time each</text><text x="240" y="157" font-size="11.5" text-anchor="end" fill="#475569">parallel (concurrency 10)</text><rect x="250" y="140" width="162" height="26" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="418" y="157" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">27 / 50 orders in the wrong final state · 143 ms</text><text x="240" y="193" font-size="11.5" text-anchor="end" fill="#475569">serial (concurrency 1)</text><rect x="250" y="176" width="3" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="259" y="193" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 wrong · 1,746 ms</text><text x="240" y="229" font-size="11.5" text-anchor="end" fill="#475569">partitioned by order id (5 lanes)</text><rect x="250" y="212" width="3" height="26" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="259" y="229" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 wrong · 347 ms</text><rect x="30" y="262" width="740" height="112" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="300.9" font-size="11" text-anchor="middle" fill="#1e293b">Kafka: ordering per partition (key = orderId) · SQS FIFO: per MessageGroupId · RabbitMQ: per queue with one consumer</text><text x="400" y="314.9" font-size="11" text-anchor="middle" fill="#1e293b">BullMQ: one queue per partition, or BullMQ Pro groups · Redis Streams: consumer groups give no per-key order</text><text x="400" y="328.9" font-size="11" text-anchor="middle" fill="#1e293b">Alternative: make handlers order-independent: version numbers / state machines that ignore older events</text><text x="400" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">("paid" arriving after "shipped" is dropped because version 2 &lt; 3).</text></svg>