<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured retry timelines: a flaky job succeeding on attempt 4, a broken job failing after 5 attempts into the failed set, and an invalid job failing immediately with an unrecoverable error"><title>Measured retry timelines: a flaky job succeeding on attempt 4, a broken job failing after 5 attempts into the failed set, and an invalid job failing immediately with an unrecoverable error</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Retries, backoff and dead-letter queues (measured)</text><text x="400" y="60" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured (BullMQ, attempts 5, exponential backoff 200 ms)</text><text x="170" y="98" font-size="11.5" text-anchor="end" fill="#1e293b" font-weight="700">flaky (503 ×3)</text><rect x="180" y="88" width="400" height="2" rx="0" fill="#64748b" stroke="#64748b" stroke-width="1.5"/><circle cx="180.99502487562188" cy="89" r="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="181" y="110" font-size="9.5" text-anchor="middle" fill="#475569">8</text><circle cx="217.56218905472636" cy="89" r="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="217.56" y="110" font-size="9.5" text-anchor="middle" fill="#475569">302</text><circle cx="269.55223880597015" cy="89" r="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="269.55" y="110" font-size="9.5" text-anchor="middle" fill="#475569">720</text><circle cx="372.66169154228857" cy="89" r="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="372.66" y="110" font-size="9.5" text-anchor="middle" fill="#475569">1549</text><text x="600" y="94" font-size="11" text-anchor="start" fill="#475569">completed on attempt 4</text><text x="170" y="154" font-size="11.5" text-anchor="end" fill="#1e293b" font-weight="700">broken (500 always)</text><rect x="180" y="144" width="400" height="2" rx="0" fill="#64748b" stroke="#64748b" stroke-width="1.5"/><circle cx="180.99502487562188" cy="145" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="181" y="166" font-size="9.5" text-anchor="middle" fill="#475569">8</text><circle cx="217.6865671641791" cy="145" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="217.69" y="166" font-size="9.5" text-anchor="middle" fill="#475569">303</text><circle cx="269.55223880597015" cy="145" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="269.55" y="166" font-size="9.5" text-anchor="middle" fill="#475569">720</text><circle cx="372.66169154228857" cy="145" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="372.66" y="166" font-size="9.5" text-anchor="middle" fill="#475569">1549</text><circle cx="580" cy="145" r="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="580" y="166" font-size="9.5" text-anchor="middle" fill="#475569">3216</text><text x="600" y="150" font-size="11" text-anchor="start" fill="#475569">failed → failed set (DLQ)</text><text x="170" y="210" font-size="11.5" text-anchor="end" fill="#1e293b" font-weight="700">invalid (400)</text><rect x="180" y="200" width="400" height="2" rx="0" fill="#64748b" stroke="#64748b" stroke-width="1.5"/><circle cx="180.99502487562188" cy="201" r="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="181" y="222" font-size="9.5" text-anchor="middle" fill="#475569">8</text><text x="600" y="206" font-size="11" text-anchor="start" fill="#475569">UnrecoverableError → failed at once</text><text x="380" y="254" font-size="11.5" text-anchor="middle" fill="#475569">ms since the first attempt: gaps ~300 → 420 → 830 → 1,670 (doubling)</text><rect x="30" y="272" width="740" height="102" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">Retry transient errors (timeouts, 429, 5xx, 451) with exponential backoff + jitter; fail fast on permanent ones (4xx,</text><text x="400" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">validation) so they don't waste attempts. After the last attempt the job goes to a dead-letter queue (BullMQ: failed set,</text><text x="400" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">SQS: DLQ, RabbitMQ: dead-letter exchange): alert on it, inspect, fix, then replay (measured: manual retry re-queued it).</text><text x="400" y="347.9" font-size="11" text-anchor="middle" fill="#1e293b">Poison messages must never block the queue forever.</text></svg>