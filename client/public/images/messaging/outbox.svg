<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Dual write losing events when publishing fails after commit vs the outbox pattern writing events in the same transaction; measured 10 of 100 events lost vs 0"><title>Dual write losing events when publishing fails after commit vs the outbox pattern writing events in the same transaction; measured 10 of 100 events lost vs 0</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The transactional outbox pattern (measured)</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="99.7" font-size="12" text-anchor="middle" fill="#1e293b">Dual write (unsafe)</text><text x="210" y="114.7" font-size="12" text-anchor="middle" fill="#1e293b">1. INSERT order → COMMIT</text><text x="210" y="129.7" font-size="12" text-anchor="middle" fill="#1e293b">2. queue.add(order.created)  ← can fail</text><text x="210" y="144.7" font-size="12" text-anchor="middle" fill="#1e293b">→ order exists, event never sent</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="99.7" font-size="12" text-anchor="middle" fill="#1e293b">Transactional outbox</text><text x="590" y="114.7" font-size="12" text-anchor="middle" fill="#1e293b">1. BEGIN; INSERT order; INSERT outbox row; COMMIT</text><text x="590" y="129.7" font-size="12" text-anchor="middle" fill="#1e293b">2. relay: SELECT unpublished … SKIP LOCKED</text><text x="590" y="144.7" font-size="12" text-anchor="middle" fill="#1e293b">→ publish, mark published, retry on failure</text><text x="400" y="204" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 100 orders, 1 in 10 publishes fails (simulated Redis error)</text><text x="220" y="232" font-size="11.5" text-anchor="end" fill="#475569">dual write: events lost</text><rect x="230" y="216" width="200" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="436" y="232" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10 of 100, forever</text><text x="220" y="266" font-size="11.5" text-anchor="end" fill="#475569">outbox: events lost</text><rect x="230" y="250" width="3" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="239" y="266" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 of 100 (relay retried over 4 rounds)</text><rect x="30" y="300" width="740" height="74" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="326.5" font-size="11.5" text-anchor="middle" fill="#1e293b">The outbox gives at-least-once publishing → consumers must be idempotent (jobId = event id).</text><text x="400" y="341" font-size="11.5" text-anchor="middle" fill="#1e293b">Relay options: polling with SKIP LOCKED, LISTEN/NOTIFY, or CDC (Debezium reading the WAL → Kafka).</text><text x="400" y="355.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Same idea on the consumer side: the inbox pattern stores processed event ids.</text></svg>