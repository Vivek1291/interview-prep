<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="At-most-once, at-least-once and effectively-once delivery; measured a crashed worker causing a double charge without an idempotency key and a single charge with one"><title>At-most-once, at-least-once and effectively-once delivery; measured a crashed worker causing a double charge without an idempotency key and a single charge with one</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Delivery guarantees and idempotency (measured)</text><rect x="30" y="58" width="180" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="120" y="81.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">at-most-once</text><rect x="216" y="58" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b">ack before processing</text><rect x="442" y="58" width="200" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="542" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b">may lose messages, never duplicates</text><rect x="648" y="58" width="122" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="709" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b">metrics, logs</text><rect x="30" y="102" width="180" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="120" y="125.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">at-least-once</text><rect x="216" y="102" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">ack after processing (default)</text><rect x="442" y="102" width="200" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="542" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">never lost, may be duplicated</text><rect x="648" y="102" width="122" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="709" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">almost everything</text><rect x="30" y="146" width="180" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">exactly-once (effect)</text><rect x="216" y="146" width="220" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="326" y="168.9" font-size="11" text-anchor="middle" fill="#1e293b">at-least-once + idempotent consumer</text><rect x="442" y="146" width="200" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="542" y="168.9" font-size="11" text-anchor="middle" fill="#1e293b">duplicates have no extra effect</text><rect x="648" y="146" width="122" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="709" y="168.9" font-size="11" text-anchor="middle" fill="#1e293b">payments, orders</text><text x="400" y="210" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured (BullMQ): worker charges the customer, then is killed before the job completes</text><text x="210" y="238" font-size="11.5" text-anchor="end" fill="#475569">no idempotency key</text><rect x="220" y="222" width="80" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="306" y="238" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2 charges (job redelivered after the stall check)</text><text x="210" y="272" font-size="11.5" text-anchor="end" fill="#475569">idempotency key per order</text><rect x="220" y="256" width="40" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="266" y="272" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1 charge (duplicate skipped)</text><rect x="30" y="304" width="740" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="328.9" font-size="11" text-anchor="middle" fill="#1e293b">Best idempotency: let the side effect itself dedupe: payment provider Idempotency-Key = order id, DB unique</text><text x="400" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">constraint on (event_id), upserts. A "processed" flag set BEFORE the side effect can skip the work forever if the</text><text x="400" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b">worker crashes in between; set it in the same transaction as the effect when you can.</text></svg>