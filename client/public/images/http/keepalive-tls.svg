<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Round trips needed for a new HTTPS connection, a reused connection and HTTP/3; measured 0.999 ms per request with new TLS connections vs 0.134 ms with keep-alive on localhost"><title>Round trips needed for a new HTTPS connection, a reused connection and HTTP/3; measured 0.999 ms per request with new TLS connections vs 0.134 ms with keep-alive on localhost</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Connections: keep-alive, TLS and HTTP/3</text><text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Round trips before the first byte of the response (TLS 1.3)</text><text x="210" y="106" font-size="11.5" text-anchor="end" fill="#475569">new connection over HTTPS</text><rect x="220" y="86" width="176" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="308" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">TCP SYN/ACK</text><rect x="402" y="86" width="176" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="490" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">TLS hello</text><rect x="584" y="86" width="176" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="672" y="106.9" font-size="11" text-anchor="middle" fill="#1e293b">request → response</text><text x="210" y="162" font-size="11.5" text-anchor="end" fill="#475569">reused keep-alive connection</text><rect x="220" y="142" width="176" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="308" y="162.9" font-size="11" text-anchor="middle" fill="#1e293b">request → response</text><text x="210" y="218" font-size="11.5" text-anchor="end" fill="#475569">HTTP/3 (QUIC) new connection</text><rect x="220" y="198" width="176" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="308" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b">QUIC + TLS together</text><rect x="402" y="198" width="176" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="490" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b">request → response</text><text x="400" y="268" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 200 sequential requests from Node 22 on localhost (no network latency)</text><text x="290" y="295" font-size="11" text-anchor="end" fill="#475569">HTTPS, new connection each time</text><rect x="300" y="283" width="379.62" height="18" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="685.62" y="296" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">0.999 ms</text><text x="290" y="319" font-size="11" text-anchor="end" fill="#475569">HTTPS, keep-alive (1 connection)</text><rect x="300" y="307" width="50.92" height="18" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="356.92" y="320" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">0.134 ms</text><text x="290" y="343" font-size="11" text-anchor="end" fill="#475569">HTTP, new connection</text><rect x="300" y="331" width="114.38" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="420.38" y="344" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">0.301 ms</text><text x="290" y="367" font-size="11" text-anchor="end" fill="#475569">HTTP, keep-alive</text><rect x="300" y="355" width="21.28" height="18" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="327.28" y="368" font-size="11" text-anchor="start" fill="#1e293b" font-weight="700">0.056 ms</text></svg>