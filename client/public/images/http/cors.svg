<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Sequence of an OPTIONS preflight followed by the real POST; measured which requests trigger a preflight and that a blocked response was still executed by the server"><title>Sequence of an OPTIONS preflight followed by the real POST; measured which requests trigger a preflight and that a blocked response was still executed by the server</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">CORS and the preflight request (measured in Chrome)</text><rect x="30" y="60" width="200" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">page on app.example</text><rect x="570" y="60" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API on api.example</text><line x1="130" y1="132" x2="670" y2="132" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="400" y="124" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">OPTIONS /orders</text><text x="400" y="146" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Origin, Access-Control-Request-Method: POST, -Headers: content-type</text><line x1="670" y1="182" x2="130" y2="182" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="400" y="174" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">204 · Allow-Origin: app.example · Allow-Methods · Allow-Headers · Max-Age: 600</text><line x1="130" y1="232" x2="670" y2="232" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="400" y="224" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">POST /orders (the real request)</text><line x1="670" y1="282" x2="130" y2="282" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="400" y="274" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">201 + Access-Control-Allow-Origin → JS may read the response</text><rect x="30" y="330" width="360" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="349.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured: simple GET / form POST → no preflight</text><text x="210" y="363.9" font-size="11" text-anchor="middle" fill="#1e293b">JSON body, Authorization, PUT/DELETE → OPTIONS first</text><rect x="410" y="330" width="360" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="349.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured: response without CORS headers → server RAN</text><text x="590" y="363.9" font-size="11" text-anchor="middle" fill="#1e293b">the request; the browser only hid the response</text></svg>