<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Cache-Control directives and what they do; measured that max-age prevented the second request and an ETag turned a 15,791 byte response into an empty 304"><title>Cache-Control directives and what they do; measured that max-age prevented the second request and an ETag turned a 15,791 byte response into an empty 304</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP caching: Cache-Control and ETag (measured)</text><rect x="30" y="60" width="320" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="190" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cache-Control: max-age=60</text><rect x="356" y="60" width="414" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b">fresh for 60 s: served from cache, NO request</text><rect x="30" y="100" width="320" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="190" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cache-Control: no-cache + ETag</text><rect x="356" y="100" width="414" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="120.9" font-size="11" text-anchor="middle" fill="#1e293b">always revalidate: If-None-Match → 304, no body</text><rect x="30" y="140" width="320" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="190" y="160.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cache-Control: no-store</text><rect x="356" y="140" width="414" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="160.9" font-size="11" text-anchor="middle" fill="#1e293b">never stored (private/sensitive data)</text><rect x="30" y="180" width="320" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="190" y="200.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">public / private</text><rect x="356" y="180" width="414" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="200.9" font-size="11" text-anchor="middle" fill="#1e293b">shared caches (CDN) may store / only the browser</text><rect x="30" y="220" width="320" height="34" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="190" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">immutable + hashed file name</text><rect x="356" y="220" width="414" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="563" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b">app.3f9a1c.js cached for a year</text><text x="400" y="278" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured in Chrome: same API fetched twice</text><rect x="30" y="290" width="360" height="84" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="321.2" font-size="12" text-anchor="middle" fill="#1e293b">max-age=60</text><text x="210" y="336.2" font-size="12" text-anchor="middle" fill="#1e293b">1st: GET → 200</text><text x="210" y="351.2" font-size="12" text-anchor="middle" fill="#1e293b">2nd: no request reached the server</text><rect x="410" y="290" width="360" height="84" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="321.2" font-size="12" text-anchor="middle" fill="#1e293b">ETag + no-cache</text><text x="590" y="336.2" font-size="12" text-anchor="middle" fill="#1e293b">1st: GET → 200, 15,791 bytes</text><text x="590" y="351.2" font-size="12" text-anchor="middle" fill="#1e293b">2nd: GET → 304, 0 bytes (body from cache)</text></svg>