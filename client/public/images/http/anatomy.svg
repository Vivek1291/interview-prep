<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A POST request with request line, headers and JSON body, and a 201 response with headers and body; what the request line, headers, body and status line contain"><title>A POST request with request line, headers and JSON body, and a 201 response with headers and body; what the request line, headers, body and status line contain</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Anatomy of an HTTP request and response</text><rect x="30" y="60" width="360" height="200" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="44" y="114.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">POST /api/orders?notify=true HTTP/1.1</text><text x="44" y="128.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Host: shop.example</text><text x="44" y="142.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Content-Type: application/json</text><text x="44" y="156.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Accept: application/json</text><text x="44" y="170.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Authorization: Bearer eyJ…</text><text x="44" y="184.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cookie: sid=abc123</text><text x="44" y="198.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="44" y="212.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">{"productId": 42, "qty": 2}</text><rect x="410" y="60" width="360" height="200" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="121.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">HTTP/1.1 201 Created</text><text x="424" y="135.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Content-Type: application/json</text><text x="424" y="149.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Location: /api/orders/981</text><text x="424" y="163.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Cache-Control: no-store</text><text x="424" y="177.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Set-Cookie: sid=abc123; HttpOnly; Secure</text><text x="424" y="191.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre"></text><text x="424" y="205.9" font-size="11" text-anchor="start" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">{"id": 981, "status": "pending"}</text><line x1="390" y1="120" x2="410" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="276" width="180" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">request line</text><rect x="216" y="276" width="554" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="493" y="290.9" font-size="11" text-anchor="middle" fill="#1e293b">method + path + query + version</text><rect x="30" y="301" width="180" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">headers</text><rect x="216" y="301" width="554" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="493" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b">metadata: type, auth, cookies, caching</text><rect x="30" y="326" width="180" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">body</text><rect x="216" y="326" width="554" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="493" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b">payload (JSON, form, file); GET has none</text><rect x="30" y="351" width="180" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="365.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">status line</text><rect x="216" y="351" width="554" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="493" y="365.9" font-size="11" text-anchor="middle" fill="#1e293b">1xx info · 2xx ok · 3xx redirect · 4xx client · 5xx server</text></svg>