<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Set-Cookie attributes HttpOnly, Secure, SameSite, Domain, Path and Max-Age explained, and how a server-side session works with a cookie"><title>Set-Cookie attributes HttpOnly, Secure, SameSite, Domain, Path and Max-Age explained, and how a server-side session works with a cookie</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Cookies and sessions</text><rect x="30" y="60" width="740" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="84.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Set-Cookie: sid=9f2c…; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400</text><rect x="30" y="112" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">HttpOnly</text><rect x="256" y="112" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">JavaScript cannot read it → XSS cannot steal it</text><rect x="30" y="142" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="158.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Secure</text><rect x="256" y="142" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="158.9" font-size="11" text-anchor="middle" fill="#1e293b">only sent over HTTPS</text><rect x="30" y="172" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="188.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">SameSite=Lax</text><rect x="256" y="172" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="188.9" font-size="11" text-anchor="middle" fill="#1e293b">not sent on cross-site POST / fetch; sent on top-level link clicks</text><rect x="30" y="202" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">SameSite=Strict / None</text><rect x="256" y="202" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="218.9" font-size="11" text-anchor="middle" fill="#1e293b">never cross-site / always (None requires Secure)</text><rect x="30" y="232" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="248.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Domain / Path</text><rect x="256" y="232" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="248.9" font-size="11" text-anchor="middle" fill="#1e293b">which hosts and paths receive it</text><rect x="30" y="262" width="220" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140" y="278.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">Max-Age / Expires</text><rect x="256" y="262" width="514" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="513" y="278.9" font-size="11" text-anchor="middle" fill="#1e293b">persistent cookie; without them it ends with the browser session</text><rect x="30" y="300" width="740" height="72" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="325.9" font-size="11" text-anchor="middle" fill="#1e293b">Session flow: login → server stores session {userId} under a random id → Set-Cookie: sid=id</text><text x="400" y="339.9" font-size="11" text-anchor="middle" fill="#1e293b">→ the browser sends Cookie: sid=id on every request → server looks it up (Redis/DB) → logout deletes it</text><text x="400" y="353.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured earlier (Chrome): cross-site POST carried only SameSite=None cookies; a link click carried Lax + None</text></svg>