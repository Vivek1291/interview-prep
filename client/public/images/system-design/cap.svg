<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="CAP says that during a partition a system chooses consistency or availability; PACELC adds the latency versus consistency trade-off in normal operation; five consistency models from strong to eventual with use cases"><title>CAP says that during a partition a system chooses consistency or availability; PACELC adds the latency versus consistency trade-off in normal operation; five consistency models from strong to eventual with use cases</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">CAP, PACELC and consistency models</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">CAP: during a network PARTITION you choose</text><text x="210" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">Consistency (refuse/ block) or Availability</text><text x="210" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">(answer, maybe stale). P is not optional.</text><text x="210" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">CP: etcd, ZooKeeper, a single Postgres primary</text><text x="210" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">AP: DynamoDB/Cassandra (tunable), DNS, caches</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="590" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">PACELC: if Partition → A or C,</text><text x="590" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">Else (normal operation) → Latency or Consistency</text><text x="590" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">sync replicas = consistent but slower writes</text><text x="590" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">async replicas = fast but stale reads</text><text x="590" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">most real trade-offs are the "ELC" part</text><rect x="30" y="194" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Strong / linearizable</text><rect x="236" y="194" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">every read sees the latest write</text><rect x="542" y="194" width="228" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="656" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">balances, inventory, locks</text><rect x="30" y="230" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Read-your-writes</text><rect x="236" y="230" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b">you see your own changes</text><rect x="542" y="230" width="228" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="656" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b">profile edits, posts</text><rect x="30" y="266" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Monotonic reads</text><rect x="236" y="266" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b">never go back in time</text><rect x="542" y="266" width="228" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="656" y="285.9" font-size="11" text-anchor="middle" fill="#1e293b">feeds, chat history</text><rect x="30" y="302" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Causal</text><rect x="236" y="302" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b">effects after causes</text><rect x="542" y="302" width="228" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="656" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b">comments after posts</text><rect x="30" y="338" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b" font-weight="700">Eventual</text><rect x="236" y="338" width="300" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">converges if writes stop</text><rect x="542" y="338" width="228" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="656" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">likes, view counts, search</text></svg>