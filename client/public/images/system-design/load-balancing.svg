<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured least-connections at 601 requests per second and p99 193 ms vs round-robin at 516 and 400 ms; with one degraded backend least-connections kept 444 requests per second while round-robin fell to 194 with a p99 over a second"><title>Measured least-connections at 601 requests per second and p99 193 ms vs round-robin at 516 and 400 ms; with one degraded backend least-connections kept 444 requests per second while round-robin fell to 194 with a p99 over a second</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Horizontal scaling and load balancing (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 3 Node backends behind a Node load balancer, 10% of requests do 40 ms of CPU</text><text x="190" y="85" font-size="11.5" text-anchor="end" fill="#475569">round-robin</text><rect x="200" y="70" width="283.8" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="489.8" y="85" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">516 req/s · p99 400 ms</text><text x="190" y="115" font-size="11.5" text-anchor="end" fill="#475569">random</text><rect x="200" y="100" width="273.35" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="479.35" y="115" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">497 req/s · p99 264 ms</text><text x="190" y="145" font-size="11.5" text-anchor="end" fill="#475569">least-connections</text><rect x="200" y="130" width="330.55" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="536.55" y="145" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">601 req/s · p99 193 ms</text><text x="400" y="178" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Same, but one backend is 3× slower (degraded instance)</text><text x="190" y="205" font-size="11.5" text-anchor="end" fill="#475569">round-robin</text><rect x="200" y="190" width="106.7" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="312.7" y="205" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">194 req/s · p99 1,174 ms</text><text x="190" y="235" font-size="11.5" text-anchor="end" fill="#475569">random</text><rect x="200" y="220" width="103.95" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="309.95" y="235" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">189 req/s · p99 980 ms</text><text x="190" y="265" font-size="11.5" text-anchor="end" fill="#475569">least-connections</text><rect x="200" y="250" width="244.2" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="450.2" y="265" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">444 req/s · p99 378 ms (sent it 13%)</text><rect x="30" y="292" width="740" height="84" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="323.9" font-size="11" text-anchor="middle" fill="#1e293b">Scale out only works if instances are STATELESS: sessions, caches, rate limits, uploads and WebSocket membership live in</text><text x="400" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b">Redis / DB / S3, not in one process. Then any instance can serve any request, and the LB can add, remove or skip them.</text><text x="400" y="351.9" font-size="11" text-anchor="middle" fill="#1e293b">L4 LB (TCP, NLB) vs L7 LB (HTTP routing, TLS, ALB/Nginx); health checks remove dead instances.</text></svg>