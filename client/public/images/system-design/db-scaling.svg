<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Read replicas, partitioning and sharding compared; measured key movement from 4 to 5 shards: 80 percent with modulo hashing, 35.4 percent with a simple ring and 24.4 percent with 100 virtual nodes"><title>Read replicas, partitioning and sharding compared; measured key movement from 4 to 5 shards: 80 percent with modulo hashing, 35.4 percent with a simple ring and 24.4 percent with 100 virtual nodes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Scaling the database: replicas, partitions, shards (measured hashing)</text><rect x="30" y="58" width="230" height="112" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="89.9" font-size="11" text-anchor="middle" fill="#1e293b">Read replicas</text><text x="145" y="103.9" font-size="11" text-anchor="middle" fill="#1e293b">primary takes writes,</text><text x="145" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">replicas serve reads</text><text x="145" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b">async lag: read-your-writes</text><text x="145" y="145.9" font-size="11" text-anchor="middle" fill="#1e293b">needs the primary</text><rect x="285" y="58" width="230" height="112" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">Partitioning (one DB)</text><text x="400" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">split a big table by time/key</text><text x="400" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">Postgres declarative partitions</text><text x="400" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b">drop old months instantly</text><rect x="540" y="58" width="230" height="112" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="89.9" font-size="11" text-anchor="middle" fill="#1e293b">Sharding (many DBs)</text><text x="655" y="103.9" font-size="11" text-anchor="middle" fill="#1e293b">shard key → shard</text><text x="655" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">cross-shard joins/transactions</text><text x="655" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b">are hard: pick the key from</text><text x="655" y="145.9" font-size="11" text-anchor="middle" fill="#1e293b">the main access pattern</text><text x="400" y="194" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 100,000 keys, going from 4 to 5 shards (ideal: 20% must move)</text><text x="240" y="221" font-size="11.5" text-anchor="end" fill="#475569">hash(key) % N</text><rect x="250" y="206" width="288" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="544" y="221" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">80 % of keys moved</text><text x="240" y="251" font-size="11.5" text-anchor="end" fill="#475569">hash ring, 1 point per node</text><rect x="250" y="236" width="127.44" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="383.44" y="251" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">35.4 % moved, loads 2,351…35,389</text><text x="240" y="281" font-size="11.5" text-anchor="end" fill="#475569">hash ring, 100 virtual nodes</text><rect x="250" y="266" width="87.84" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="343.84" y="281" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">24.4 % moved, loads 17,018…24,385</text><rect x="30" y="306" width="740" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="337.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Order of moves: query tuning + indexes → caching → read replicas → partitioning → vertical scale → sharding.</text><text x="400" y="352.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Hot keys (one celebrity, one big tenant) defeat any sharding: split or cache them specially.</text></svg>