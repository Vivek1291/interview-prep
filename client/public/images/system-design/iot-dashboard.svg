<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Sensors to edge gateway to MQTT or Kafka to ingest workers and a time-series store, with an alarm engine and a realtime latest-value feed; measured latest value per device at 172 ms with DISTINCT ON, 5.4 ms with a lateral index query and 1.5 ms from a maintained table"><title>Sensors to edge gateway to MQTT or Kafka to ingest workers and a time-series store, with an alarm engine and a realtime latest-value feed; measured latest value per device at 172 ms with DISTINCT ON, 5.4 ms with a lateral index query and 1.5 ms from a maintained table</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design an IoT / SCADA real-time monitoring dashboard (measured)</text><rect x="30" y="58" width="150" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="105" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">PLCs / sensors</text><text x="105" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">(Modbus, OPC UA)</text><rect x="200" y="58" width="140" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="270" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">edge gateway</text><text x="270" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">buffer + batch</text><rect x="360" y="58" width="140" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="430" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">MQTT broker /</text><text x="430" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">Kafka</text><rect x="520" y="58" width="120" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="580" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">ingest</text><text x="580" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">workers</text><rect x="660" y="58" width="110" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="715" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">time-series</text><text x="715" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">DB</text><line x1="184" y1="88" x2="196" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="344" y1="88" x2="356" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="504" y1="88" x2="516" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="644" y1="88" x2="656" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="520" y="136" width="250" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="645" y="157.95" font-size="10.5" text-anchor="middle" fill="#1e293b">alarm engine: thresholds +</text><text x="645" y="171.45" font-size="10.5" text-anchor="middle" fill="#1e293b">hysteresis + dedupe → notify</text><rect x="200" y="136" width="300" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="350" y="157.95" font-size="10.5" text-anchor="middle" fill="#1e293b">realtime: latest value per device</text><text x="350" y="171.45" font-size="10.5" text-anchor="middle" fill="#1e293b">→ WebSocket/SSE, throttled to 1–2 Hz</text><line x1="580" y1="122" x2="580" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="210" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: latest reading per device, 2,000 devices × 500 readings (1M rows)</text><text x="260" y="236" font-size="11.5" text-anchor="end" fill="#475569">DISTINCT ON (device_id)</text><rect x="270" y="222" width="327.56" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="603.56" y="236" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">172.4 ms</text><text x="260" y="264" font-size="11.5" text-anchor="end" fill="#475569">LATERAL + (device_id, ts) index</text><rect x="270" y="250" width="10.26" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="286.26" y="264" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">5.4 ms</text><text x="260" y="292" font-size="11.5" text-anchor="end" fill="#475569">device_latest table (upsert 6.6 ms)</text><rect x="270" y="278" width="3" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279" y="292" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1.5 ms</text><rect x="30" y="312" width="740" height="64" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b">Ingest in batches (measured 4,418 rows/s single INSERTs vs ~230,000 rows/s batched); downsample for charts (1 s raw → 1 min</text><text x="400" y="354.9" font-size="11" text-anchor="middle" fill="#1e293b">rollups); store-and-forward at the edge when the network drops; operators need alarms, acknowledgement and an audit trail.</text></svg>