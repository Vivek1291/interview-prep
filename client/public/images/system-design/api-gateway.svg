<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An API gateway terminates TLS, checks authentication, applies quotas, routes and traces requests to services, with config in a store and counters in Redis; measured one Node gateway hop adding about 0.07 ms at median"><title>An API gateway terminates TLS, checks authentication, applies quotas, routes and traces requests to services, with config in a store and counters in Redis; measured one Node gateway hop adding about 0.07 ms at median</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design an API gateway (measured hop)</text><rect x="30" y="58" width="140" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="84.9" font-size="11" text-anchor="middle" fill="#1e293b">web, mobile,</text><text x="100" y="98.9" font-size="11" text-anchor="middle" fill="#1e293b">partners</text><rect x="200" y="58" width="380" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="390" y="84.95" font-size="10.5" text-anchor="middle" fill="#1e293b">API GATEWAY: TLS · authn check · rate limits/quotas · routing</text><text x="390" y="98.45" font-size="10.5" text-anchor="middle" fill="#1e293b">request id + tracing · request/response transforms · caching</text><rect x="610" y="58" width="160" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="74.7" font-size="10.5" text-anchor="middle" fill="#1e293b">orders service</text><rect x="610" y="92" width="160" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="108.7" font-size="10.5" text-anchor="middle" fill="#1e293b">users service</text><line x1="174" y1="88" x2="196" y2="88" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="584" y1="76" x2="606" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="584" y1="100" x2="606" y2="104" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="200" y="136" width="380" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="390" y="157.95" font-size="10.5" text-anchor="middle" fill="#1e293b">config store (routes, plans, keys) → hot reload</text><text x="390" y="171.45" font-size="10.5" text-anchor="middle" fill="#1e293b">Redis: quota counters · OpenTelemetry → traces</text><text x="400" y="208" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: one gateway hop (Node, keep-alive pool, route table, request id)</text><text x="210" y="234" font-size="11.5" text-anchor="end" fill="#475569">direct</text><rect x="220" y="220" width="84" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="310" y="234" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.12 ms median</text><text x="210" y="262" font-size="11.5" text-anchor="end" fill="#475569">Node gateway</text><rect x="220" y="248" width="133" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="359" y="262" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.19 ms median (+0.07 ms)</text><text x="210" y="290" font-size="11.5" text-anchor="end" fill="#475569">Nginx in Docker Desktop</text><rect x="220" y="276" width="336" height="20" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="562" y="290" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.48 ms (crosses the VM network)</text><rect x="30" y="312" width="740" height="64" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b">Keep it thin: no business logic. Stateless instances behind an L4 LB; limits in Redis; config versioned and validated.</text><text x="400" y="354.9" font-size="11" text-anchor="middle" fill="#1e293b">Buy before build: Kong, Envoy, AWS API Gateway, Apigee; build only for special routing or edge logic.</text></svg>