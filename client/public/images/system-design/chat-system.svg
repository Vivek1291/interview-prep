<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Chat architecture with WebSocket gateways behind a load balancer, Redis fan-out, a message service with per-conversation sequence numbers, a partitioned message store and push notifications; measured 1,869 duplicate sequence numbers with max plus one vs zero with an atomic counter"><title>Chat architecture with WebSocket gateways behind a load balancer, Redis fan-out, a message service with per-conversation sequence numbers, a partitioned message store and push notifications; measured 1,869 duplicate sequence numbers with max plus one vs zero with an atomic counter</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design a chat system (measured ordering)</text><rect x="30" y="58" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="86.9" font-size="11" text-anchor="middle" fill="#1e293b">mobile / web</text><rect x="180" y="58" width="160" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="86.9" font-size="11" text-anchor="middle" fill="#1e293b">LB (WebSocket, L7)</text><rect x="370" y="58" width="180" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="460" y="79.95" font-size="10.5" text-anchor="middle" fill="#1e293b">chat gateway × N</text><text x="460" y="93.45" font-size="10.5" text-anchor="middle" fill="#1e293b">(ws, presence, heartbeats)</text><rect x="580" y="58" width="190" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="675" y="79.95" font-size="10.5" text-anchor="middle" fill="#1e293b">Redis pub/sub / Streams</text><text x="675" y="93.45" font-size="10.5" text-anchor="middle" fill="#1e293b">(fan-out across gateways)</text><line x1="154" y1="83" x2="176" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="344" y1="83" x2="366" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="554" y1="83" x2="576" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="370" y="130" width="180" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="460" y="151.95" font-size="10.5" text-anchor="middle" fill="#1e293b">message service</text><text x="460" y="165.45" font-size="10.5" text-anchor="middle" fill="#1e293b">seq per conversation</text><rect x="580" y="130" width="190" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="675" y="151.95" font-size="10.5" text-anchor="middle" fill="#1e293b">messages DB</text><text x="675" y="165.45" font-size="10.5" text-anchor="middle" fill="#1e293b">partitioned by conversation</text><rect x="180" y="130" width="160" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="260" y="151.95" font-size="10.5" text-anchor="middle" fill="#1e293b">push service</text><text x="260" y="165.45" font-size="10.5" text-anchor="middle" fill="#1e293b">(APNs/FCM offline)</text><line x1="460" y1="112" x2="460" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="554" y1="155" x2="576" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="366" y1="155" x2="344" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="206" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 20 concurrent senders, 2,000 messages to one conversation (Postgres 17)</text><text x="220" y="233" font-size="11.5" text-anchor="end" fill="#475569">SELECT max(seq)+1, INSERT</text><rect x="230" y="218" width="317.73" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="553.73" y="233" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">1869 duplicate sequence numbers</text><text x="220" y="263" font-size="11.5" text-anchor="end" fill="#475569">UPDATE counter RETURNING</text><rect x="230" y="248" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="239" y="263" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 duplicates (4,972 msgs/s)</text><rect x="30" y="288" width="740" height="88" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="321.9" font-size="11" text-anchor="middle" fill="#1e293b">Earlier measurements: broadcast to 1,000 sockets in 7 ms; without a pub/sub adapter a second instance got 0/50 messages,</text><text x="400" y="335.9" font-size="11" text-anchor="middle" fill="#1e293b">with Redis 50/50 (1.28 ms). Delivery: client sends with a client id (dedupe) → server assigns seq → ack → recipients ack</text><text x="400" y="349.9" font-size="11" text-anchor="middle" fill="#1e293b">(delivered/read receipts) → reconnect = "give me everything after seq N". Media goes to S3 via pre-signed URLs + CDN.</text></svg>