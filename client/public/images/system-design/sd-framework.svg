" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A framework for system design interviews</text><rect x="30" y="58" width="230" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="77.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1. Requirements</text><rect x="30" y="92" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="145" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">functional: what it does</text><text x="145" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b">non-functional: scale,</text><text x="145" y="145.9" font-size="11" text-anchor="middle" fill="#1e293b">latency, availability</text><rect x="280" y="58" width="230" height="30" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="395" y="77.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">2. Estimates</text><rect x="280" y="92" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="395" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">users, QPS (peak),</text><text x="395" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b">storage/day, bandwidth,</text><text x="395" y="145.9" font-size="11" text-anchor="middle" fill="#1e293b">read:write ratio</text><rect x="530" y="58" width="230" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="645" y="77.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">3. API</text><rect x="530" y="92" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="645" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">endpoints / events</text><text x="645" y="131.9" font-size="11" text-anchor="middle" fill="#1e293b">request + response</text><text x="645" y="145.9" font-size="11" text-anchor="middle" fill="#1e293b">pagination, idempotency</text><rect x="30" y="178" width="230" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="145" y="197.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">4. Data model</text><rect x="30" y="212" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="145" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">entities, keys, indexes</text><text x="145" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">SQL vs NoSQL</text><text x="145" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">access patterns first</text><rect x="280" y="178" width="230" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="395" y="197.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">5. High level</text><rect x="280" y="212" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="395" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">clients → LB → services</text><text x="395" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">→ cache → DB, queues,</text><text x="395" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">CDN, object storage</text><rect x="530" y="178" width="230" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="645" y="197.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">6. Deep dives</text><rect x="530" y="212" width="230" height="72" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="645" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">bottlenecks, scaling,</text><text x="645" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">failure modes, consistency,</text><text x="645" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">hot keys, monitoring</text><rect x="30" y="302" width="740" height="74" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="335.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Time box (45 min): 5 requirements · 5 estimates · 5 API + data · 10 high level · 15 deep dives · 5 wrap-up.</text><text x="400" y="350.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Say trade-offs out loud ("I pick X because Y; it costs Z"). Ask before assuming. Start simple, then scale the part that breaks.</text></svg>