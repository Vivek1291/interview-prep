<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Shared schema, schema per tenant and database per tenant compared; measured a small tenant query at 100 ms with only a created_at index versus 0.37 ms with a tenant_id and created_at index; row-level security confined a query missing its tenant filter to one tenant"><title>Shared schema, schema per tenant and database per tenant compared; measured a small tenant query at 100 ms with only a created_at index versus 0.37 ms with a tenant_id and created_at index; row-level security confined a query missing its tenant filter to one tenant</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design a multi-tenant SaaS backend (measured)</text><rect x="30" y="58" width="230" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="145" y="88.9" font-size="11" text-anchor="middle" fill="#1e293b">Shared DB, shared schema</text><text x="145" y="102.9" font-size="11" text-anchor="middle" fill="#1e293b">tenant_id on every row</text><text x="145" y="116.9" font-size="11" text-anchor="middle" fill="#1e293b">+ cheapest, simplest ops</text><text x="145" y="130.9" font-size="11" text-anchor="middle" fill="#1e293b">- isolation by code/RLS,</text><text x="145" y="144.9" font-size="11" text-anchor="middle" fill="#1e293b">  noisy neighbours</text><rect x="285" y="58" width="230" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="88.9" font-size="11" text-anchor="middle" fill="#1e293b">Schema per tenant</text><text x="400" y="102.9" font-size="11" text-anchor="middle" fill="#1e293b">same DB, many schemas</text><text x="400" y="116.9" font-size="11" text-anchor="middle" fill="#1e293b">+ easier per-tenant restore</text><text x="400" y="130.9" font-size="11" text-anchor="middle" fill="#1e293b">- migrations × N schemas,</text><text x="400" y="144.9" font-size="11" text-anchor="middle" fill="#1e293b">  connection/catalog limits</text><rect x="540" y="58" width="230" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="655" y="88.9" font-size="11" text-anchor="middle" fill="#1e293b">Database per tenant</text><text x="655" y="102.9" font-size="11" text-anchor="middle" fill="#1e293b">+ strongest isolation,</text><text x="655" y="116.9" font-size="11" text-anchor="middle" fill="#1e293b">  per-tenant region/backup</text><text x="655" y="130.9" font-size="11" text-anchor="middle" fill="#1e293b">- costly, fleet of DBs to</text><text x="655" y="144.9" font-size="11" text-anchor="middle" fill="#1e293b">  migrate and monitor</text><text x="400" y="192" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured on 5M rows: "latest 20 events" for a small tenant (2,654 rows)</text><text x="250" y="219" font-size="11.5" text-anchor="end" fill="#475569">index on (created_at) only</text><rect x="260" y="204" width="240.96" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="506.96" y="219" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">100.4 ms (scans newest rows of all tenants)</text><text x="250" y="249" font-size="11.5" text-anchor="end" fill="#475569">index on (tenant_id, created_at)</text><rect x="260" y="234" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="269" y="249" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.37 ms</text><rect x="30" y="272" width="740" height="104" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">Postgres row-level security: policy tenant_id = current_setting('app.tenant_id') → a query that FORGOT the filter still saw</text><text x="400" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">only 1 tenant's 2,654 rows (no measurable overhead). Set the tenant per request/transaction from the authenticated user.</text><text x="400" y="334.9" font-size="11" text-anchor="middle" fill="#1e293b">Also: tenant id in logs/metrics/cache keys, per-tenant quotas and rate limits, plans and feature flags, hybrid model</text><text x="400" y="348.9" font-size="11" text-anchor="middle" fill="#1e293b">(pooled small tenants, dedicated DB for the biggest).</text></svg>