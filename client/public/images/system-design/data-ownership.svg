<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Each service owns its database and shares data through APIs or events, the transactional outbox makes publishing reliable, and CQRS keeps separate read models fed by events"><title>Each service owns its database and shares data through APIs or events, the transactional outbox makes publishing reliable, and CQRS keeps separate read models fed by events</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Data in microservices: ownership, outbox, CQRS</text><rect x="30" y="58" width="230" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="102.5" font-size="11.5" text-anchor="middle" fill="#1e293b">orders service</text><text x="145" y="117" font-size="11.5" text-anchor="middle" fill="#1e293b">owns orders DB</text><text x="145" y="131.5" font-size="11.5" text-anchor="middle" fill="#1e293b">publishes OrderPlaced</text><rect x="285" y="58" width="230" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="102.5" font-size="11.5" text-anchor="middle" fill="#1e293b">inventory service</text><text x="400" y="117" font-size="11.5" text-anchor="middle" fill="#1e293b">owns stock DB</text><text x="400" y="131.5" font-size="11.5" text-anchor="middle" fill="#1e293b">reacts: reserve stock</text><rect x="540" y="58" width="230" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="102.5" font-size="11.5" text-anchor="middle" fill="#1e293b">search service</text><text x="655" y="117" font-size="11.5" text-anchor="middle" fill="#1e293b">keeps its OWN copy</text><text x="655" y="131.5" font-size="11.5" text-anchor="middle" fill="#1e293b">(read model) of products</text><line x1="264" y1="113" x2="281" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="519" y1="113" x2="536" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="186" width="360" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="223.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Database per service</text><text x="210" y="237.75" font-size="11.5" text-anchor="middle" fill="#1e293b">no other service reads your tables;</text><text x="210" y="252.25" font-size="11.5" text-anchor="middle" fill="#1e293b">they call your API or consume your events</text><text x="210" y="266.75" font-size="11.5" text-anchor="middle" fill="#1e293b">→ you can change schema and scale alone</text><rect x="410" y="186" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="223.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Transactional outbox</text><text x="590" y="237.75" font-size="11.5" text-anchor="middle" fill="#1e293b">write business row + event row in ONE</text><text x="590" y="252.25" font-size="11.5" text-anchor="middle" fill="#1e293b">local transaction; a relay publishes it</text><text x="590" y="266.75" font-size="11.5" text-anchor="middle" fill="#1e293b">→ no "saved but never published"</text><rect x="30" y="314" width="740" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="341.75" font-size="11.5" text-anchor="middle" fill="#1e293b">CQRS: separate write model (normalised, transactional) from read models (denormalised views, search indexes, caches)</text><text x="400" y="356.25" font-size="11.5" text-anchor="middle" fill="#1e293b">fed by events. Reads become fast and independent, at the cost of eventual consistency and more moving parts.</text></svg>