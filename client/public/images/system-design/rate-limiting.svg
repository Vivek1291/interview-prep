<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Rate limits at the edge, gateway, service and dependency client; token bucket, sliding window, fixed window and leaky bucket; shared Redis counters with atomic operations; 429 with Retry-After and rate limit headers"><title>Rate limits at the edge, gateway, service and dependency client; token bucket, sliding window, fixed window and leaky bucket; shared Redis counters with atomic operations; 429 with Retry-After and rate limit headers</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Rate limiting across a distributed system</text><rect x="30" y="58" width="200" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="82.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CDN / WAF edge</text><rect x="236" y="58" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">per-IP limits, bot rules, absorb floods</text><rect x="30" y="104" width="200" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="130" y="128.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">API gateway</text><rect x="236" y="104" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="127.9" font-size="11" text-anchor="middle" fill="#1e293b">per API key / tenant quotas, 429 + Retry-After</text><rect x="30" y="150" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">service</text><rect x="236" y="150" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="173.9" font-size="11" text-anchor="middle" fill="#1e293b">per-user, per-endpoint (login, search, export)</text><rect x="30" y="196" width="200" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="220.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">dependency client</text><rect x="236" y="196" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="386" y="219.9" font-size="11" text-anchor="middle" fill="#1e293b">stay under a partner API's own limit</text><rect x="556" y="58" width="214" height="178" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="663" y="108.9" font-size="11" text-anchor="middle" fill="#1e293b">Algorithms</text><text x="663" y="122.9" font-size="11" text-anchor="middle" fill="#1e293b">token bucket (bursts ok)</text><text x="663" y="136.9" font-size="11" text-anchor="middle" fill="#1e293b">sliding window (smooth)</text><text x="663" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b">fixed window (simple,</text><text x="663" y="164.9" font-size="11" text-anchor="middle" fill="#1e293b">burst at edges)</text><text x="663" y="178.9" font-size="11" text-anchor="middle" fill="#1e293b">leaky bucket (constant</text><text x="663" y="192.9" font-size="11" text-anchor="middle" fill="#1e293b">outflow)</text><rect x="30" y="252" width="360" height="124" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">Distributed counters</text><text x="210" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b">all instances share Redis:</text><text x="210" y="310.9" font-size="11" text-anchor="middle" fill="#1e293b">atomic INCR + EXPIRE or a Lua script</text><text x="210" y="324.9" font-size="11" text-anchor="middle" fill="#1e293b">(read-modify-write in one step)</text><text x="210" y="338.9" font-size="11" text-anchor="middle" fill="#1e293b">local approximations when Redis is down:</text><text x="210" y="352.9" font-size="11" text-anchor="middle" fill="#1e293b">fail open or fail closed (decide!)</text><rect x="410" y="252" width="360" height="124" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">Response contract</text><text x="590" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b">429 Too Many Requests + Retry-After</text><text x="590" y="310.9" font-size="11" text-anchor="middle" fill="#1e293b">RateLimit-Limit / -Remaining / -Reset</text><text x="590" y="324.9" font-size="11" text-anchor="middle" fill="#1e293b">document quotas per plan</text><text x="590" y="338.9" font-size="11" text-anchor="middle" fill="#1e293b">clients back off with jitter</text><text x="590" y="352.9" font-size="11" text-anchor="middle" fill="#1e293b">limits on cost, not only count (exports)</text></svg>