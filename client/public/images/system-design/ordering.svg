<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Wall clocks drift so last-write-wins can lose data; Lamport and vector clocks order events; order per key; exactly-once is at-least-once plus idempotency; measured 1,869 duplicate sequence numbers with max plus one versus none with an atomic counter"><title>Wall clocks drift so last-write-wins can lose data; Lamport and vector clocks order events; order per key; exactly-once is at-least-once plus idempotency; measured 1,869 duplicate sequence numbers with max plus one versus none with an atomic counter</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Time, ordering and exactly-once</text><rect x="30" y="58" width="360" height="112" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="96.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Wall clocks lie</text><text x="210" y="110.75" font-size="11.5" text-anchor="middle" fill="#1e293b">NTP skew of ms to seconds between servers</text><text x="210" y="125.25" font-size="11.5" text-anchor="middle" fill="#1e293b">"last write wins" by timestamp can drop</text><text x="210" y="139.75" font-size="11.5" text-anchor="middle" fill="#1e293b">the REAL last write</text><rect x="410" y="58" width="360" height="112" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="96.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Logical clocks</text><text x="590" y="110.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Lamport: counter = max(local, received) + 1</text><text x="590" y="125.25" font-size="11.5" text-anchor="middle" fill="#1e293b">→ orders causally related events</text><text x="590" y="139.75" font-size="11.5" text-anchor="middle" fill="#1e293b">vector clocks also detect concurrent writes</text><rect x="30" y="188" width="360" height="112" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="226.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Ordering where it matters</text><text x="210" y="240.75" font-size="11.5" text-anchor="middle" fill="#1e293b">per key, not globally: Kafka partition key,</text><text x="210" y="255.25" font-size="11.5" text-anchor="middle" fill="#1e293b">per-conversation sequence number,</text><text x="210" y="269.75" font-size="11.5" text-anchor="middle" fill="#1e293b">SQS FIFO message group</text><rect x="410" y="188" width="360" height="112" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="226.25" font-size="11.5" text-anchor="middle" fill="#1e293b">"Exactly once" = at-least-once delivery</text><text x="590" y="240.75" font-size="11.5" text-anchor="middle" fill="#1e293b">+ idempotent processing</text><text x="590" y="255.25" font-size="11.5" text-anchor="middle" fill="#1e293b">(dedupe table, idempotency key,</text><text x="590" y="269.75" font-size="11.5" text-anchor="middle" fill="#1e293b">upsert, conditional write)</text><rect x="30" y="318" width="740" height="58" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="343.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured (chat, 20 concurrent senders, 2,000 messages): SELECT max(seq)+1 then INSERT → 1,869 duplicate sequence numbers;</text><text x="400" y="357.9" font-size="11" text-anchor="middle" fill="#1e293b">one atomic UPDATE … SET last_seq = last_seq + 1 RETURNING → 0 duplicates (4,972 msgs/s).</text></svg>