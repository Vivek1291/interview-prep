<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Events flow from an SDK to an ingest API, a queue, a batch writer and partitioned raw storage with rollup jobs; measured 4,418 rows per second with single inserts vs 231,705 batched, and a dashboard query at 337 ms raw, 150 ms on a too-fine rollup and 3 ms on a low-cardinality rollup"><title>Events flow from an SDK to an ingest API, a queue, a batch writer and partitioned raw storage with rollup jobs; measured 4,418 rows per second with single inserts vs 231,705 batched, and a dashboard query at 337 ms raw, 150 ms on a too-fine rollup and 3 ms on a low-cardinality rollup</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design an analytics / event tracking pipeline (measured)</text><rect x="30" y="58" width="140" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">SDK / API</text><text x="100" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">collect events</text><rect x="190" y="58" width="150" height="54" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="265" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">ingest API</text><text x="265" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">validate, 202</text><rect x="360" y="58" width="140" height="54" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="430" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">queue / Kafka</text><text x="430" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">(buffer)</text><rect x="520" y="58" width="120" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="580" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">batch writer</text><text x="580" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">(1000/insert)</text><rect x="660" y="58" width="110" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="715" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">raw events</text><text x="715" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">(partitioned)</text><line x1="174" y1="85" x2="186" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="344" y1="85" x2="356" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="504" y1="85" x2="516" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="644" y1="85" x2="656" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="520" y="128" width="250" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="645" y="151.9" font-size="11" text-anchor="middle" fill="#1e293b">rollup job → hourly aggregates</text><line x1="715" y1="116" x2="715" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="190" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured on Postgres 17 (5M events)</text><text x="260" y="214" font-size="11.5" text-anchor="end" fill="#475569">ingest: one INSERT per event</text><rect x="270" y="200" width="7.07" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="283.07" y="214" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">4418 rows/s</text><text x="260" y="240" font-size="11.5" text-anchor="end" fill="#475569">ingest: 1,000-row batches</text><rect x="270" y="226" width="370.73" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="646.73" y="240" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">231705 rows/s (52×)</text><text x="260" y="274" font-size="11.5" text-anchor="end" fill="#475569">dashboard on raw events</text><rect x="270" y="260" width="202.2" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="478.2" y="274" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">337 ms</text><text x="260" y="300" font-size="11.5" text-anchor="end" fill="#475569">rollup by hour × tenant × type × country</text><rect x="270" y="286" width="90" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="366" y="300" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">150 ms (4.35M rows: too fine)</text><text x="260" y="326" font-size="11.5" text-anchor="end" fill="#475569">rollup by hour × type × country</text><rect x="270" y="312" width="3" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="279" y="326" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">3 ms (38,895 rows: 112× faster)</text><rect x="30" y="342" width="740" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="362.9" font-size="11" text-anchor="middle" fill="#1e293b">Rollups only help with LOW-cardinality keys; refresh incrementally (last 2 buckets: 115 ms); big scale → ClickHouse/BigQuery/Druid.</text></svg>