<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Two-phase commit holds locks across services and blocks on coordinator failure; a saga runs local transactions with compensations, for example create order, reserve stock, charge card, confirm, and on failure release stock and cancel the order"><title>Two-phase commit holds locks across services and blocks on coordinator failure; a saga runs local transactions with compensations, for example create order, reserve stock, charge card, confirm, and on failure release stock and cancel the order</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Distributed transactions: 2PC vs saga</text><rect x="30" y="58" width="360" height="130" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="98.9" font-size="11" text-anchor="middle" fill="#1e293b">2PC (two-phase commit)</text><text x="210" y="112.9" font-size="11" text-anchor="middle" fill="#1e293b">coordinator: "prepare?" → all vote yes →</text><text x="210" y="126.9" font-size="11" text-anchor="middle" fill="#1e293b">"commit"; locks held across services</text><text x="210" y="140.9" font-size="11" text-anchor="middle" fill="#1e293b">blocks if the coordinator dies</text><text x="210" y="154.9" font-size="11" text-anchor="middle" fill="#1e293b">rare between microservices</text><rect x="410" y="58" width="360" height="130" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="98.9" font-size="11" text-anchor="middle" fill="#1e293b">Saga</text><text x="590" y="112.9" font-size="11" text-anchor="middle" fill="#1e293b">sequence of LOCAL transactions;</text><text x="590" y="126.9" font-size="11" text-anchor="middle" fill="#1e293b">each step has a COMPENSATION</text><text x="590" y="140.9" font-size="11" text-anchor="middle" fill="#1e293b">(refund, release stock, cancel)</text><text x="590" y="154.9" font-size="11" text-anchor="middle" fill="#1e293b">eventually consistent, no global locks</text><rect x="40" y="214" width="160" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="120" y="235.9" font-size="11" text-anchor="middle" fill="#1e293b">create order</text><text x="120" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b">(PENDING)</text><rect x="230" y="214" width="160" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="310" y="242.9" font-size="11" text-anchor="middle" fill="#1e293b">reserve stock</text><line x1="202" y1="239" x2="228" y2="239" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="420" y="214" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="500" y="242.9" font-size="11" text-anchor="middle" fill="#1e293b">charge card</text><line x1="392" y1="239" x2="418" y2="239" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="610" y="214" width="160" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="242.9" font-size="11" text-anchor="middle" fill="#1e293b">confirm order</text><line x1="582" y1="239" x2="608" y2="239" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="292" font-size="11.5" text-anchor="middle" fill="#ef4444">charge card fails → compensations run backwards:</text><rect x="230" y="300" width="160" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="310" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">release stock</text><rect x="40" y="300" width="160" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="120" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">cancel order</text><line x1="226" y1="317" x2="204" y2="317" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="420" y="300" width="350" height="76" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">Orchestration: one coordinator calls steps</text><text x="595" y="334.9" font-size="11" text-anchor="middle" fill="#1e293b">(clear flow, Temporal/Step Functions)</text><text x="595" y="348.9" font-size="11" text-anchor="middle" fill="#1e293b">Choreography: services react to events</text><text x="595" y="362.9" font-size="11" text-anchor="middle" fill="#1e293b">(loose coupling, harder to follow)</text><rect x="40" y="342" width="350" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="215" y="362.9" font-size="11" text-anchor="middle" fill="#1e293b">steps must be idempotent + retried (outbox)</text></svg>