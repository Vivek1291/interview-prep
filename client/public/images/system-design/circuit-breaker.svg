<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured against a hung dependency: no timeout served nothing, a 300 ms timeout with fallback served 158 requests per second, and a circuit breaker served 32,647 with p99 5 ms while calling the dependency 150 times instead of 1,000; circuit states closed, open and half-open"><title>Measured against a hung dependency: no timeout served nothing, a 300 ms timeout with fallback served 158 requests per second, and a circuit breaker served 32,647 with p99 5 ms while calling the dependency 150 times instead of 1,000; circuit states closed, open and half-open</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Circuit breakers, bulkheads and fallbacks (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: API calls a dependency that hangs, 50 connections, 6 s</text><text x="210" y="86" font-size="11.5" text-anchor="end" fill="#475569">no timeout</text><rect x="220" y="70" width="3" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="229" y="86" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 req/s: every request hung (client timeouts 50)</text><text x="210" y="118" font-size="11.5" text-anchor="end" fill="#475569">timeout 300 ms + fallback</text><rect x="220" y="102" width="3" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="229" y="118" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">158 req/s · p99 375 ms · 1,000 calls to the dependency</text><text x="210" y="150" font-size="11.5" text-anchor="end" fill="#475569">+ circuit breaker</text><rect x="220" y="134" width="228.53" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="454.53" y="150" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">32647 req/s · p99 5 ms · 150 calls</text><rect x="30" y="186" width="220" height="76" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="140" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">CLOSED</text><text x="140" y="227.9" font-size="11" text-anchor="middle" fill="#1e293b">calls pass,</text><text x="140" y="241.9" font-size="11" text-anchor="middle" fill="#1e293b">count failures</text><rect x="290" y="186" width="220" height="76" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">OPEN</text><text x="400" y="227.9" font-size="11" text-anchor="middle" fill="#1e293b">fail fast / fallback</text><text x="400" y="241.9" font-size="11" text-anchor="middle" fill="#1e293b">for N seconds</text><line x1="252" y1="224" x2="286" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="550" y="186" width="220" height="76" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="660" y="213.9" font-size="11" text-anchor="middle" fill="#1e293b">HALF-OPEN</text><text x="660" y="227.9" font-size="11" text-anchor="middle" fill="#1e293b">let a probe through:</text><text x="660" y="241.9" font-size="11" text-anchor="middle" fill="#1e293b">ok → closed, fail → open</text><line x1="512" y1="224" x2="546" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="278" width="360" height="98" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="316.9" font-size="11" text-anchor="middle" fill="#1e293b">Bulkheads: separate pools/limits per dependency</text><text x="210" y="330.9" font-size="11" text-anchor="middle" fill="#1e293b">(a slow payments API can't use all sockets</text><text x="210" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">or all workers needed by search)</text><rect x="410" y="278" width="360" height="98" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="309.9" font-size="11" text-anchor="middle" fill="#1e293b">Fallbacks: cached value, default, partial page,</text><text x="590" y="323.9" font-size="11" text-anchor="middle" fill="#1e293b">"try again later" for non-critical features.</text><text x="590" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b">Our breaker let all 50 waiting calls probe at once;</text><text x="590" y="351.9" font-size="11" text-anchor="middle" fill="#1e293b">real ones allow ONE half-open probe.</text></svg>