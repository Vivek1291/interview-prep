<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Synchronous REST or gRPC versus asynchronous events with their trade-offs; measured a Node gateway hop adding about 0.07 ms per request at median; API gateway, BFF and service discovery"><title>Synchronous REST or gRPC versus asynchronous events with their trade-offs; measured a Node gateway hop adding about 0.07 ms per request at median; API gateway, BFF and service discovery</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How services talk: sync, async, gateways (measured hop)</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">Synchronous: REST / gRPC</text><text x="210" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">caller waits for the answer</text><text x="210" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">+ simple, immediate result</text><text x="210" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">- temporal coupling: callee down = caller fails</text><text x="210" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">- latency adds up along the chain</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">Asynchronous: events / messages</text><text x="590" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">publish "OrderPlaced", others react</text><text x="590" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">+ decoupled, absorbs spikes, retries</text><text x="590" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">- eventual consistency, harder to trace</text><text x="590" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">- needs idempotent consumers, DLQs</text><text x="400" y="202" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: one extra HTTP hop through a small Node gateway (route table, request id, keep-alive pool)</text><text x="220" y="229" font-size="11.5" text-anchor="end" fill="#475569">direct to the service</text><rect x="230" y="214" width="180" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="416" y="229" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.12 ms median (108,864 req/s)</text><text x="220" y="259" font-size="11.5" text-anchor="end" fill="#475569">through the Node gateway</text><rect x="230" y="244" width="285" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="521" y="259" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0.19 ms median (32,111 req/s)</text><rect x="30" y="282" width="740" height="94" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="318.9" font-size="11" text-anchor="middle" fill="#1e293b">API gateway: one entry point for clients: routing, auth checks, rate limits, request ids, TLS, aggregation.</text><text x="400" y="332.9" font-size="11" text-anchor="middle" fill="#1e293b">BFF (backend for frontend): one gateway per client type (web, mobile) shaping responses.</text><text x="400" y="346.9" font-size="11" text-anchor="middle" fill="#1e293b">Service discovery: DNS / Kubernetes Services / Consul so callers find healthy instances. The hop is cheap; the chains are not.</text></svg>