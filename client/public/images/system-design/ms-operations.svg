<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Contract tests instead of many end-to-end tests, additive API and event versioning, independent pipelines and releases, distributed tracing and per-service dashboards, shared libraries or a service mesh"><title>Contract tests instead of many end-to-end tests, additive API and event versioning, independent pipelines and releases, distributed tracing and per-service dashboards, shared libraries or a service mesh</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Testing, versioning, deploying and observing microservices</text><rect x="30" y="58" width="230" height="140" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">Testing</text><text x="145" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">unit + component tests per service</text><text x="145" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">CONTRACT tests (Pact): consumer</text><text x="145" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b">expectations verified in the</text><text x="145" y="152.9" font-size="11" text-anchor="middle" fill="#1e293b">provider's CI</text><text x="145" y="166.9" font-size="11" text-anchor="middle" fill="#1e293b">few end-to-end tests</text><rect x="285" y="58" width="230" height="140" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">Versioning</text><text x="400" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">additive changes only</text><text x="400" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">new fields optional,</text><text x="400" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b">old fields kept until</text><text x="400" y="152.9" font-size="11" text-anchor="middle" fill="#1e293b">consumers move</text><text x="400" y="166.9" font-size="11" text-anchor="middle" fill="#1e293b">event schemas in a registry</text><rect x="540" y="58" width="230" height="140" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">Deploying</text><text x="655" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">one pipeline per service</text><text x="655" y="124.9" font-size="11" text-anchor="middle" fill="#1e293b">independent releases</text><text x="655" y="138.9" font-size="11" text-anchor="middle" fill="#1e293b">canary / rolling</text><text x="655" y="152.9" font-size="11" text-anchor="middle" fill="#1e293b">no lock-step deploys</text><text x="655" y="166.9" font-size="11" text-anchor="middle" fill="#1e293b">platform team templates</text><rect x="30" y="216" width="360" height="160" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="210" y="264.9" font-size="11" text-anchor="middle" fill="#1e293b">Observing</text><text x="210" y="278.9" font-size="11" text-anchor="middle" fill="#1e293b">trace id through every hop (OpenTelemetry)</text><text x="210" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b">RED dashboards per service</text><text x="210" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">service map from traces</text><text x="210" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">alerts per SLO, owned by the team</text><text x="210" y="334.9" font-size="11" text-anchor="middle" fill="#1e293b">structured logs with the trace id</text><rect x="410" y="216" width="360" height="160" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="264.9" font-size="11" text-anchor="middle" fill="#1e293b">Cross-cutting without copy-paste</text><text x="590" y="278.9" font-size="11" text-anchor="middle" fill="#1e293b">shared libraries kept thin (logging, config)</text><text x="590" y="292.9" font-size="11" text-anchor="middle" fill="#1e293b">or a service mesh (mTLS, retries, metrics)</text><text x="590" y="306.9" font-size="11" text-anchor="middle" fill="#1e293b">sidecars vs libraries trade-off</text><text x="590" y="320.9" font-size="11" text-anchor="middle" fill="#1e293b">consistent health/readiness endpoints</text><text x="590" y="334.9" font-size="11" text-anchor="middle" fill="#1e293b">golden-path templates for new services</text></svg>