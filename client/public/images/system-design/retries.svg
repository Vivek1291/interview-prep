<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured retry storms: immediate retries sent 59 requests per client and all clients gave up, a fixed delay sent 23, exponential backoff without jitter took 18.5 s in waves, and full jitter finished in 5.8 s with 6.3 requests per client"><title>Measured retry storms: immediate retries sent 59 requests per client and all clients gave up, a fixed delay sent 23, exponential backoff without jitter took 18.5 s in waves, and full jitter finished in 5.8 s with 6.3 requests per client</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Timeouts and retries with backoff + jitter (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 300 clients, server down for 2 s, then 40 concurrent slots (real HTTP)</text><text x="210" y="86" font-size="11.5" text-anchor="end" fill="#475569">immediate retry</text><rect x="220" y="70" width="248.64" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="474.64" y="86" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">59.2 requests/client · all 300 gave up</text><text x="210" y="118" font-size="11.5" text-anchor="end" fill="#475569">fixed 100 ms delay</text><rect x="220" y="102" width="97.02" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="323.02" y="118" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">23.1 req/client · done 2.7 s · 3,000 req/s peak</text><text x="210" y="150" font-size="11.5" text-anchor="end" fill="#475569">exponential, no jitter</text><rect x="220" y="134" width="27.72" height="24" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="253.72" y="150" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">6.6 req/client · done 18.5 s (waves)</text><text x="210" y="182" font-size="11.5" text-anchor="end" fill="#475569">exponential + full jitter</text><rect x="220" y="166" width="26.46" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="252.46" y="182" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">6.3 req/client · done 5.8 s</text><rect x="30" y="210" width="360" height="166" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="254.9" font-size="11" text-anchor="middle" fill="#1e293b">Rules</text><text x="210" y="268.9" font-size="11" text-anchor="middle" fill="#1e293b">every remote call has a TIMEOUT</text><text x="210" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">retry only transient errors (timeouts,</text><text x="210" y="296.9" font-size="11" text-anchor="middle" fill="#1e293b">503, 429, ECONNRESET), not 400/404</text><text x="210" y="310.9" font-size="11" text-anchor="middle" fill="#1e293b">retry only idempotent operations</text><text x="210" y="324.9" font-size="11" text-anchor="middle" fill="#1e293b">(or use an idempotency key)</text><text x="210" y="338.9" font-size="11" text-anchor="middle" fill="#1e293b">cap attempts and total time</text><rect x="410" y="210" width="360" height="166" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="261.9" font-size="11" text-anchor="middle" fill="#1e293b">Backoff with full jitter</text><text x="590" y="275.9" font-size="11" text-anchor="middle" fill="#1e293b">delay = random(0, min(cap, base × 2^attempt))</text><text x="590" y="289.9" font-size="11" text-anchor="middle" fill="#1e293b">spreads retries so they don't arrive in waves</text><text x="590" y="303.9" font-size="11" text-anchor="middle" fill="#1e293b">honour Retry-After from 429/503</text><text x="590" y="317.9" font-size="11" text-anchor="middle" fill="#1e293b">retry at ONE layer (not client + gateway</text><text x="590" y="331.9" font-size="11" text-anchor="middle" fill="#1e293b">+ service + SDK = retries multiply)</text></svg>