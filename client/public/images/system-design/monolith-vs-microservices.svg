<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A monolith is simple but couples teams, a modular monolith keeps boundaries in one deployable, microservices give independent deploys at the cost of network failures and operations; when to split and the distributed monolith red flags"><title>A monolith is simple but couples teams, a modular monolith keeps boundaries in one deployable, microservices give independent deploys at the cost of network failures and operations; when to split and the distributed monolith red flags</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Monolith, modular monolith or microservices?</text><rect x="30" y="58" width="230" height="150" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b">Monolith</text><text x="145" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b">one deployable, one DB</text><text x="145" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b">+ simple, fast to build,</text><text x="145" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">  easy transactions</text><text x="145" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">- one team bottleneck,</text><text x="145" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b">  scale everything together</text><rect x="285" y="58" width="230" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b">Modular monolith</text><text x="400" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b">one deployable, strict</text><text x="400" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b">module boundaries</text><text x="400" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">+ most benefits, few costs</text><text x="400" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">+ split later along modules</text><text x="400" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b">(often the best default)</text><rect x="540" y="58" width="230" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b">Microservices</text><text x="655" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b">many deployables, DB each</text><text x="655" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b">+ independent deploys/scale,</text><text x="655" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">  team autonomy</text><text x="655" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">- network failures, eventual</text><text x="655" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b">  consistency, ops overhead</text><rect x="30" y="226" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="276" font-size="11.5" text-anchor="middle" fill="#1e293b">Split when</text><text x="210" y="290.5" font-size="11.5" text-anchor="middle" fill="#1e293b">several teams block each other on deploys</text><text x="210" y="305" font-size="11.5" text-anchor="middle" fill="#1e293b">parts need very different scaling/tech</text><text x="210" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">a boundary is stable and well understood</text><text x="210" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">you already have CI/CD, tracing, on-call</text><rect x="410" y="226" width="360" height="150" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="590" y="276" font-size="11.5" text-anchor="middle" fill="#1e293b">Red flags ("distributed monolith")</text><text x="590" y="290.5" font-size="11.5" text-anchor="middle" fill="#1e293b">services share one database</text><text x="590" y="305" font-size="11.5" text-anchor="middle" fill="#1e293b">every change needs 4 services deployed</text><text x="590" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b">long chains of sync calls</text><text x="590" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b">split by technical layer, not business domain</text></svg>