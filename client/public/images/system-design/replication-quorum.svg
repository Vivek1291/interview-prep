<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Leader-follower replication, quorum reads and writes where R plus W greater than N, Raft-style consensus with majorities, split brain and fencing tokens"><title>Leader-follower replication, quorum reads and writes where R plus W greater than N, Raft-style consensus with majorities, split brain and fencing tokens</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Replication, quorums, consensus and split brain</text><rect x="30" y="58" width="230" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="100.9" font-size="11" text-anchor="middle" fill="#1e293b">Leader-follower</text><text x="145" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">writes go to the leader</text><text x="145" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">followers replicate the log</text><text x="145" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">failover = elect new leader</text><rect x="285" y="58" width="230" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="100.9" font-size="11" text-anchor="middle" fill="#1e293b">Quorum (N replicas)</text><text x="400" y="114.9" font-size="11" text-anchor="middle" fill="#1e293b">write to W, read from R</text><text x="400" y="128.9" font-size="11" text-anchor="middle" fill="#1e293b">R + W &gt; N → reads overlap</text><text x="400" y="142.9" font-size="11" text-anchor="middle" fill="#1e293b">the latest write (N=3: W=2, R=2)</text><rect x="540" y="58" width="230" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">Consensus (Raft, Paxos)</text><text x="655" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">majority agrees on a log</text><text x="655" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">term numbers stop old leaders</text><text x="655" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">3 nodes tolerate 1 failure,</text><text x="655" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">5 nodes tolerate 2</text><rect x="30" y="196" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="240.5" font-size="11.5" text-anchor="middle" fill="#1e293b">Split brain: two nodes both think they lead</text><text x="210" y="255" font-size="11.5" text-anchor="middle" fill="#1e293b">(network partition, GC pause, slow heartbeat)</text><text x="210" y="269.5" font-size="11.5" text-anchor="middle" fill="#1e293b">→ both accept writes → conflicting data</text><rect x="410" y="196" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="233.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Fencing tokens: the lock service hands out an</text><text x="590" y="247.75" font-size="11.5" text-anchor="middle" fill="#1e293b">increasing number with each lease; storage</text><text x="590" y="262.25" font-size="11.5" text-anchor="middle" fill="#1e293b">rejects writes carrying an older token</text><text x="590" y="276.75" font-size="11.5" text-anchor="middle" fill="#1e293b">(the old leader wakes up and is refused)</text><rect x="30" y="322" width="740" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="345.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Don't build consensus yourself: use etcd/ZooKeeper/Consul, Postgres advisory locks or a managed DB's failover.</text><text x="400" y="360.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Odd cluster sizes (3, 5): a majority must survive a partition.</text></svg>