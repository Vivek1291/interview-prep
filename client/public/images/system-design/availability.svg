<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Availability multiplies in series (99.99 × 99.9 × 99.95 = 99.84 percent) and improves in parallel (two 99 percent instances give 99.99 percent); single points of failure, multi-AZ and multi-region, RTO and RPO"><title>Availability multiplies in series (99.99 × 99.9 × 99.95 = 99.84 percent) and improves in parallel (two 99 percent instances give 99.99 percent); single points of failure, multi-AZ and multi-region, RTO and RPO</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Availability: redundancy, multi-AZ, multi-region</text><rect x="30" y="58" width="360" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="95.25" font-size="11.5" text-anchor="middle" fill="#1e293b">In series (all must work)</text><text x="210" y="109.75" font-size="11.5" text-anchor="middle" fill="#1e293b">LB 99.99% × API 99.9% × DB 99.95%</text><text x="210" y="124.25" font-size="11.5" text-anchor="middle" fill="#1e293b">= 99.84% (≈ 70 min down / 30 days)</text><text x="210" y="138.75" font-size="11.5" text-anchor="middle" fill="#1e293b">every dependency LOWERS availability</text><rect x="410" y="58" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="95.25" font-size="11.5" text-anchor="middle" fill="#1e293b">In parallel (any one is enough)</text><text x="590" y="109.75" font-size="11.5" text-anchor="middle" fill="#1e293b">two instances at 99% each:</text><text x="590" y="124.25" font-size="11.5" text-anchor="middle" fill="#1e293b">1 - 0.01 × 0.01 = 99.99%</text><text x="590" y="138.75" font-size="11.5" text-anchor="middle" fill="#1e293b">redundancy RAISES availability</text><rect x="30" y="186" width="230" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="223.9" font-size="11" text-anchor="middle" fill="#1e293b">Remove single points</text><text x="145" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">of failure: ≥2 instances,</text><text x="145" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">multi-AZ DB with failover,</text><text x="145" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">managed LB, ≥2 queue nodes</text><rect x="285" y="186" width="230" height="110" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="223.9" font-size="11" text-anchor="middle" fill="#1e293b">Multi-AZ (default)</text><text x="400" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">survives a datacenter loss</text><text x="400" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">synchronous DB replica</text><text x="400" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">low latency between AZs</text><rect x="540" y="186" width="230" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="655" y="223.9" font-size="11" text-anchor="middle" fill="#1e293b">Multi-region (expensive)</text><text x="655" y="237.9" font-size="11" text-anchor="middle" fill="#1e293b">survives a region loss</text><text x="655" y="251.9" font-size="11" text-anchor="middle" fill="#1e293b">async replication → RPO &gt; 0</text><text x="655" y="265.9" font-size="11" text-anchor="middle" fill="#1e293b">active-passive or active-active</text><rect x="30" y="314" width="740" height="62" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="341.75" font-size="11.5" text-anchor="middle" fill="#1e293b">RTO = how long to recover · RPO = how much data you may lose. Backups you never restored are not backups.</text><text x="400" y="356.25" font-size="11.5" text-anchor="middle" fill="#1e293b">Design for failure: timeouts, retries with jitter, circuit breakers, graceful degradation, chaos/failover drills.</text></svg>