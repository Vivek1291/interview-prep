<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Schedules table, a scheduler that claims each slot once and a queue with workers; measured 18 runs for 7 slots without coordination versus exactly 7 with an advisory lock or a unique run key, including failover after killing the active instance"><title>Schedules table, a scheduler that claims each slot once and a queue with workers; measured 18 runs for 7 slots without coordination versus exactly 7 with an advisory lock or a unique run key, including failover after killing the active instance</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Design a distributed job scheduler (measured duplicates)</text><rect x="30" y="58" width="220" height="80" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="88.2" font-size="10.5" text-anchor="middle" fill="#1e293b">schedules table</text><text x="140" y="101.7" font-size="10.5" text-anchor="middle" fill="#1e293b">(cron, timezone, next_run_at,</text><text x="140" y="115.2" font-size="10.5" text-anchor="middle" fill="#1e293b">owner, enabled)</text><rect x="280" y="58" width="220" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="390" y="81.45" font-size="10.5" text-anchor="middle" fill="#1e293b">scheduler (any instance)</text><text x="390" y="94.95" font-size="10.5" text-anchor="middle" fill="#1e293b">claims due slots:</text><text x="390" y="108.45" font-size="10.5" text-anchor="middle" fill="#1e293b">INSERT run key ON CONFLICT</text><text x="390" y="121.95" font-size="10.5" text-anchor="middle" fill="#1e293b">DO NOTHING</text><rect x="530" y="58" width="240" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="650" y="88.2" font-size="10.5" text-anchor="middle" fill="#1e293b">queue (BullMQ/SQS/SKIP LOCKED)</text><text x="650" y="101.7" font-size="10.5" text-anchor="middle" fill="#1e293b">workers run jobs with retries,</text><text x="650" y="115.2" font-size="10.5" text-anchor="middle" fill="#1e293b">timeouts, DLQ, idempotency</text><line x1="254" y1="98" x2="276" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="504" y1="98" x2="526" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="162" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 3 instances, a job every second for 7 s, the active instance killed after 3.6 s</text><text x="230" y="189" font-size="11.5" text-anchor="end" fill="#475569">no coordination</text><rect x="240" y="174" width="216" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="462" y="189" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">18 runs for 7 slots (11 duplicates)</text><text x="230" y="219" font-size="11.5" text-anchor="end" fill="#475569">pg advisory lock (leader)</text><rect x="240" y="204" width="84" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="330" y="219" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7 runs, 0 duplicates, failover next slot</text><text x="230" y="249" font-size="11.5" text-anchor="end" fill="#475569">unique run key per slot</text><rect x="240" y="234" width="84" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="330" y="249" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">7 runs, 0 duplicates, any instance</text><rect x="30" y="276" width="740" height="100" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="315.9" font-size="11" text-anchor="middle" fill="#1e293b">Separate "when" (scheduler: compute due slots, enqueue once) from "do" (workers: scale out, retry).</text><text x="400" y="329.9" font-size="11" text-anchor="middle" fill="#1e293b">Missed slots after downtime: catch up, skip, or run once (a per-job policy). Store run history: status, attempts, duration, error.</text><text x="400" y="343.9" font-size="11" text-anchor="middle" fill="#1e293b">Cron in timezones + DST: store the timezone, compute next_run_at in it. Long jobs: heartbeats + visibility timeouts.</text></svg>