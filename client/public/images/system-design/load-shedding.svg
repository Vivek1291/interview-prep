<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Without shedding queues grow until clients time out and goodput collapses; with bounded queues excess requests get a fast 503 and accepted ones stay fast; what to limit, priorities, degradation and backpressure"><title>Without shedding queues grow until clients time out and goodput collapses; with bounded queues excess requests get a fast 503 and accepted ones stay fast; what to limit, priorities, degradation and backpressure</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Load shedding, backpressure and graceful degradation</text><rect x="30" y="58" width="360" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">Without shedding (unbounded queue)</text><text x="210" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">queue grows → every request waits longer</text><text x="210" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">clients time out → retry → MORE load</text><text x="210" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">server does work nobody waits for</text><text x="210" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">→ goodput collapses (congestion collapse)</text><rect x="410" y="58" width="360" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="93.9" font-size="11" text-anchor="middle" fill="#1e293b">With shedding (bounded queue/concurrency)</text><text x="590" y="107.9" font-size="11" text-anchor="middle" fill="#1e293b">over the limit → 503 + Retry-After at once</text><text x="590" y="121.9" font-size="11" text-anchor="middle" fill="#1e293b">accepted requests stay fast</text><text x="590" y="135.9" font-size="11" text-anchor="middle" fill="#1e293b">clients back off with jitter</text><text x="590" y="149.9" font-size="11" text-anchor="middle" fill="#1e293b">→ goodput stays near capacity</text><rect x="30" y="196" width="230" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="145" y="226.9" font-size="11" text-anchor="middle" fill="#1e293b">What to limit</text><text x="145" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b">in-flight requests,</text><text x="145" y="254.9" font-size="11" text-anchor="middle" fill="#1e293b">queue length or</text><text x="145" y="268.9" font-size="11" text-anchor="middle" fill="#1e293b">queue WAIT TIME</text><text x="145" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">(e.g. drop if waited &gt; 1 s)</text><rect x="285" y="196" width="230" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="233.9" font-size="11" text-anchor="middle" fill="#1e293b">Prioritise</text><text x="400" y="247.9" font-size="11" text-anchor="middle" fill="#1e293b">checkout &gt; search &gt; recs</text><text x="400" y="261.9" font-size="11" text-anchor="middle" fill="#1e293b">health checks never shed</text><text x="400" y="275.9" font-size="11" text-anchor="middle" fill="#1e293b">per-tenant fairness</text><rect x="540" y="196" width="230" height="110" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="655" y="226.9" font-size="11" text-anchor="middle" fill="#1e293b">Degrade gracefully</text><text x="655" y="240.9" font-size="11" text-anchor="middle" fill="#1e293b">hide recommendations,</text><text x="655" y="254.9" font-size="11" text-anchor="middle" fill="#1e293b">serve stale cache,</text><text x="655" y="268.9" font-size="11" text-anchor="middle" fill="#1e293b">read-only mode,</text><text x="655" y="282.9" font-size="11" text-anchor="middle" fill="#1e293b">turn off heavy features</text><rect x="30" y="322" width="740" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="345.75" font-size="11.5" text-anchor="middle" fill="#1e293b">Backpressure end to end: streams pause producers, queues cap length, consumers prefetch little, autoscaling adds capacity</text><text x="400" y="360.25" font-size="11.5" text-anchor="middle" fill="#1e293b">(minutes) while shedding protects you right now (milliseconds).</text></svg>