<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A nonce-based CSP allows own scripts and scripts with the nonce, and blocks injected inline scripts, inline handlers, foreign script origins and eval; measured: the XSS was blocked with CSP"><title>A nonce-based CSP allows own scripts and scripts with the nonce, and blocks injected inline scripts, inline handlers, foreign script origins and eval; measured: the XSS was blocked with CSP</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Content Security Policy: a second line of defence</text><rect x="30" y="62" width="740" height="58" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="87.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Content-Security-Policy: default-src 'self'; script-src 'self' 'nonce-r4nd0m';</text><text x="400" y="102.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  object-src 'none'; base-uri 'self'; frame-ancestors 'none'</text><rect x="30" y="132" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script src=&quot;/app.js&quot;&gt;</text><rect x="416" y="132" width="354" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="593" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b">allowed (self)</text><rect x="30" y="168" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="186.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script nonce=&quot;r4nd0m&quot;&gt;…&lt;/script&gt;</text><rect x="416" y="168" width="354" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="593" y="187.2" font-size="12" text-anchor="middle" fill="#1e293b">allowed (matching nonce)</text><rect x="30" y="204" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="222.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">injected &lt;script&gt;…&lt;/script&gt;</text><rect x="416" y="204" width="354" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="593" y="223.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BLOCKED (no nonce)</text><rect x="30" y="240" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="258.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;img onerror=&quot;…&quot;&gt; (inline handler)</text><rect x="416" y="240" width="354" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="593" y="259.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BLOCKED</text><rect x="30" y="276" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="294.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;script src=&quot;https://evil.com/x.js&quot;&gt;</text><rect x="416" y="276" width="354" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="593" y="295.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BLOCKED (not allowed origin)</text><rect x="30" y="312" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="220" y="330.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">eval(&quot;…&quot;)</text><rect x="416" y="312" width="354" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="593" y="331.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">BLOCKED (no 'unsafe-eval')</text><text x="400" y="372" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome: the same innerHTML XSS executed without CSP, and was blocked with CSP (1 violation event).</text></svg>