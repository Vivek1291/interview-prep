<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured Vite bundle: variables with the VITE_ prefix, even ones named secret, are included in the bundle while unprefixed ones are not; everything in the browser is public; secure API practices"><title>Measured Vite bundle: variables with the VITE_ prefix, even ones named secret, are included in the bundle while unprefixed ones are not; everything in the browser is public; secure API practices</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Secrets in frontend code</text><text x="400" y="64" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">Measured: what a Vite 7 production bundle contains</text><rect x="30" y="78" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="99" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">VITE_API_URL=https://api…</text><rect x="396" y="78" width="374" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="583" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">in bundle: YES (meant to be public)</text><rect x="30" y="118" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="139" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">VITE_STRIPE_SECRET_KEY=sk_live_…</text><rect x="396" y="118" width="374" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="583" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">in bundle: YES ❗ the prefix makes it public</text><rect x="30" y="158" width="360" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="179" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">DATABASE_PASSWORD=…</text><rect x="396" y="158" width="374" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="583" y="179.2" font-size="12" text-anchor="middle" fill="#1e293b">in bundle: no (no VITE_ prefix)</text><rect x="30" y="210" width="360" height="160" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="44" y="264.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Rule: everything shipped to the browser</text><text x="44" y="279.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">is public. Prefixes that expose:</text><text x="44" y="294.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">VITE_*, NEXT_PUBLIC_*, REACT_APP_*</text><text x="44" y="309.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Minification is not protection;</text><text x="44" y="324.2" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">source maps make it even easier.</text><rect x="410" y="210" width="360" height="160" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="424" y="256.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Secure API communication:</text><text x="424" y="271.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• HTTPS only (+ HSTS)</text><text x="424" y="286.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• secrets stay on the server (proxy/BFF)</text><text x="424" y="301.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• validate API responses (schemas)</text><text x="424" y="316.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• handle 401/403 (log out, refresh)</text><text x="424" y="331.7" font-size="12" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">• rate limits on the backend</text></svg>