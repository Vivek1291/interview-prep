<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A malicious page submits a form to the bank; measured in Chrome: cross-site POSTs and images only carry SameSite=None cookies, link clicks carry Lax cookies; defences are SameSite, CSRF tokens, no side effects on GET and origin checks"><title>A malicious page submits a form to the bank; measured in Chrome: cross-site POSTs and images only carry SameSite=None cookies, link clicks carry Lax cookies; defences are SameSite, CSRF tokens, no side effects on GET and origin checks</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">CSRF: forged requests that ride on your cookies</text><rect x="30" y="66" width="210" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="135" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">evil.example page</text><text x="135" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">(auto-submits a form)</text><line x1="242" y1="96" x2="296" y2="96" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="269" y="86" font-size="11" text-anchor="middle" fill="#475569">POST</text><rect x="300" y="66" width="230" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="415" y="92.7" font-size="12" text-anchor="middle" fill="#1e293b">bank.example/transfer</text><text x="415" y="107.7" font-size="12" text-anchor="middle" fill="#1e293b">cookies attached?</text><text x="400" y="146" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured in Chrome: which session cookies (Strict / Lax / None) were sent</text><rect x="30" y="158" width="180" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">cross-site form POST</text><rect x="214" y="158" width="180" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="304" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">only SameSite=None</text><rect x="405" y="158" width="180" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="495" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">cross-site &lt;img&gt; GET</text><rect x="589" y="158" width="180" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="679" y="174.9" font-size="11" text-anchor="middle" fill="#1e293b">only SameSite=None</text><rect x="30" y="188" width="180" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="204.9" font-size="11" text-anchor="middle" fill="#1e293b">cross-site link click</text><rect x="214" y="188" width="180" height="26" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="304" y="204.9" font-size="11" text-anchor="middle" fill="#1e293b">Lax + None (not Strict)</text><rect x="405" y="188" width="180" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="495" y="204.9" font-size="11" text-anchor="middle" fill="#1e293b">same-site request</text><rect x="589" y="188" width="180" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="679" y="204.9" font-size="11" text-anchor="middle" fill="#1e293b">all three</text><rect x="30" y="226" width="740" height="150" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="44" y="268.8" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">Defences (combine them):</text><text x="44" y="283.3" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">1. SameSite=Lax (default in modern browsers) or Strict on session cookies</text><text x="44" y="297.8" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">2. CSRF token: server issues a token tied to the session; the app sends it in a header (X-CSRF-Token); server compares</text><text x="44" y="312.3" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">3. Never change data on GET (Lax still sends cookies on top-level GET navigation)</text><text x="44" y="326.8" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">4. Check Origin / Sec-Fetch-Site headers for state-changing requests</text><text x="44" y="341.3" font-size="11.5" text-anchor="start" fill="#1e293b" xml:space="preserve" style="white-space:pre">(csurf is deprecated: use your framework's CSRF support or a signed double-submit token)</text></svg>