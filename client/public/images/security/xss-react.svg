<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="React escapes values rendered in JSX and blocks javascript: URLs, but dangerouslySetInnerHTML, innerHTML and eval execute attacker input"><title>React escapes values rendered in JSX and blocks javascript: URLs, but dangerouslySetInnerHTML, innerHTML and eval execute attacker input</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">XSS and what React protects you from</text><rect x="30" y="66" width="230" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="145" y="92.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">attacker input</text><text x="145" y="107.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;img src=x onerror=…&gt;</text><rect x="30" y="146" width="300" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="168" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;p&gt;{input}&lt;/p&gt;</text><line x1="332" y1="164" x2="362" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="366" y="146" width="404" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="568" y="168.2" font-size="12" text-anchor="middle" fill="#1e293b">escaped → &amp;lt;img …&amp;gt; shown as text</text><rect x="30" y="188" width="300" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="210" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;a href={url}&gt;</text><line x1="332" y1="206" x2="362" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="366" y="188" width="404" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="568" y="210.2" font-size="12" text-anchor="middle" fill="#1e293b">React 19 blocks javascript: URLs</text><rect x="30" y="230" width="300" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="252" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">dangerouslySetInnerHTML</text><line x1="332" y1="248" x2="362" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="366" y="230" width="404" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="568" y="252.2" font-size="12" text-anchor="middle" fill="#1e293b">rendered as HTML → script RUNS</text><rect x="30" y="272" width="300" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="294" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">el.innerHTML = input</text><line x1="332" y1="290" x2="362" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="366" y="272" width="404" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="568" y="294.2" font-size="12" text-anchor="middle" fill="#1e293b">runs (measured in Chrome: executed)</text><rect x="30" y="314" width="300" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="180" y="336" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">eval / new Function / setTimeout(&quot;…&quot;)</text><line x1="332" y1="332" x2="362" y2="332" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="366" y="314" width="404" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="568" y="336.2" font-size="12" text-anchor="middle" fill="#1e293b">runs</text><rect x="290" y="66" width="480" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="530" y="92.8" font-size="11.5" text-anchor="middle" fill="#1e293b">XSS = attacker-controlled JavaScript running on YOUR origin:</text><text x="530" y="107.3" font-size="11.5" text-anchor="middle" fill="#1e293b">reads the page, calls your APIs as the user, steals tokens in localStorage</text></svg>