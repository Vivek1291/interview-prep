<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An attacker page overlays an invisible iframe of the bank so a prize button click lands on Transfer; measured: without headers the page framed, with frame-ancestors none it was blocked"><title>An attacker page overlays an invisible iframe of the bank so a prize button click lands on Transfer; measured: without headers the page framed, with frame-ancestors none it was blocked</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Clickjacking and frame-ancestors</text><rect x="30" y="66" width="360" height="200" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="210" y="88" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">evil.example</text><rect x="60" y="110" width="300" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="144.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">🎁 Click to claim your prize!</text><rect x="60" y="110" width="300" height="60" rx="6" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/><text x="210" y="196" font-size="11.5" text-anchor="middle" fill="#ef4444">invisible iframe of bank.example on top:</text><text x="210" y="214" font-size="11.5" text-anchor="middle" fill="#ef4444">the click hits &quot;Transfer&quot;</text><text x="590" y="80" font-size="12" text-anchor="middle" fill="#475569" font-weight="700">Measured with Playwright (Chrome):</text><rect x="420" y="96" width="350" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="595" y="117.8" font-size="11.5" text-anchor="middle" fill="#1e293b">no header → page loaded inside the</text><text x="595" y="132.3" font-size="11.5" text-anchor="middle" fill="#1e293b">attacker iframe, Transfer button present</text><rect x="420" y="156" width="350" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="595" y="177.8" font-size="11.5" text-anchor="middle" fill="#1e293b">frame-ancestors 'none' → blocked:</text><text x="595" y="192.3" font-size="11.5" text-anchor="middle" fill="#1e293b">&quot;Framing … violates … frame-ancestors&quot;</text><rect x="30" y="290" width="740" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="319.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Content-Security-Policy: frame-ancestors 'none'   (or 'self' / list of allowed parents)</text><text x="400" y="334" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">X-Frame-Options: DENY (older header; Helmet sets SAMEORIGIN by default)</text><text x="400" y="348.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Set them on the server or CDN for every HTML response.</text></svg>