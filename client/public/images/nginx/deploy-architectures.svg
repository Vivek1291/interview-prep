<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Four deployment architectures: one VM with Nginx and PM2 or Docker Compose, containers behind a managed load balancer, a CDN for the React build plus a separately deployed API, and a PaaS; requirements common to all of them"><title>Four deployment architectures: one VM with Nginx and PM2 or Docker Compose, containers behind a managed load balancer, a CDN for the React build plus a separately deployed API, and a PaaS; requirements common to all of them</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Ways to deploy a React frontend and Node backend</text><rect x="30" y="58" width="200" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="130" y="89.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">1. One VM</text><rect x="236" y="58" width="534" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="503" y="81.9" font-size="11" text-anchor="middle" fill="#1e293b">Nginx (TLS, React build, /api proxy) + PM2 cluster</text><text x="503" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">or docker compose; cheapest, you patch the server</text><rect x="30" y="120" width="200" height="54" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="130" y="151.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">2. Containers + managed LB</text><rect x="236" y="120" width="534" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="503" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b">ALB → ECS/Kubernetes pods; Nginx optional (sidecar</text><text x="503" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b">or ingress-nginx); autoscaling, rolling deploys</text><rect x="30" y="182" width="200" height="54" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="130" y="213.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">3. CDN + API</text><rect x="236" y="182" width="534" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="503" y="205.9" font-size="11" text-anchor="middle" fill="#1e293b">React build on S3/CloudFront, Vercel or Netlify;</text><text x="503" y="219.9" font-size="11" text-anchor="middle" fill="#1e293b">API on containers/PaaS/Lambda; separate deploys</text><rect x="30" y="244" width="200" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="130" y="275.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">4. PaaS</text><rect x="236" y="244" width="534" height="54" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="503" y="267.9" font-size="11" text-anchor="middle" fill="#1e293b">Render, Railway, Fly.io, Heroku-style: git push →</text><text x="503" y="281.9" font-size="11" text-anchor="middle" fill="#1e293b">build → deploy; least ops, less control</text><rect x="30" y="310" width="740" height="66" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="339.9" font-size="11" text-anchor="middle" fill="#1e293b">Every option needs: HTTPS, environment config + secrets outside the code, health checks, logs/metrics,</text><text x="400" y="353.9" font-size="11" text-anchor="middle" fill="#1e293b">backups, zero-downtime deploys and rollback (previous build/image tag). Frontend and backend version together through the API contract.</text></svg>