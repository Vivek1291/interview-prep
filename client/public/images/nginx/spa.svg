<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="SPA deep links return 404 without try_files and 200 with it; hashed assets cached for a year and index.html revalidated; measured the 691 KB bundle at 184 KB with gzip, 154 KB precompressed and 125 KB with brotli; duplicate Cache-Control header gotcha"><title>SPA deep links return 404 without try_files and 200 with it; hashed assets cached for a year and index.html revalidated; measured the 691 KB bundle at 184 KB with gzip, 154 KB precompressed and 125 KB with brotli; duplicate Cache-Control header gotcha</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Serving a React SPA with Nginx (measured)</text><rect x="30" y="58" width="360" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="95.9" font-size="11" text-anchor="middle" fill="#1e293b">React Router deep link: /dashboard/settings</text><text x="210" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b">no fallback → Nginx looks for that file → 404 (measured)</text><text x="210" y="123.9" font-size="11" text-anchor="middle" fill="#1e293b">try_files $uri $uri/ /index.html → 200 (measured)</text><text x="210" y="137.9" font-size="11" text-anchor="middle" fill="#1e293b">the browser loads index.html, React renders the route</text><rect x="410" y="58" width="360" height="110" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="96.45" font-size="10.5" text-anchor="middle" fill="#1e293b">Caching rules</text><text x="590" y="109.95" font-size="10.5" text-anchor="middle" fill="#1e293b">hashed /assets/*.js → public, max-age=31536000, immutable</text><text x="590" y="123.45" font-size="10.5" text-anchor="middle" fill="#1e293b">index.html → Cache-Control: no-cache (always revalidate)</text><text x="590" y="136.95" font-size="10.5" text-anchor="middle" fill="#1e293b">new deploy = new hashes; users get it on next load</text><text x="400" y="192" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: this app's largest JS bundle (690,855 bytes) on the wire</text><text x="290" y="218" font-size="11.5" text-anchor="end" fill="#475569">no compression</text><rect x="300" y="204" width="380.05" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="686.05" y="218" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">691 KB</text><text x="290" y="244" font-size="11.5" text-anchor="end" fill="#475569">gzip on the fly (level 1, default)</text><rect x="300" y="230" width="101.2" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="407.2" y="244" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">184 KB</text><text x="290" y="270" font-size="11.5" text-anchor="end" fill="#475569">gzip_static (pre-compressed level 9)</text><rect x="300" y="256" width="84.7" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="390.7" y="270" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">154 KB</text><text x="290" y="296" font-size="11.5" text-anchor="end" fill="#475569">brotli q11 (pre-compressed, 721 ms to build)</text><rect x="300" y="282" width="68.75" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="374.75" y="296" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">125 KB</text><rect x="30" y="316" width="740" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">Gotcha found while measuring: "expires 1y;" + "add_header Cache-Control public, immutable" sends TWO Cache-Control headers.</text><text x="400" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b">Use one add_header with the full value. And add_header in a location drops the server-level add_headers (they don't merge).</text></svg>