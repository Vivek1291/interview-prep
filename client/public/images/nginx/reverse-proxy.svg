<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A reverse proxy location block with keep-alive and forwarded headers; gotchas for client IPs, WebSockets, streaming, body size and timeouts; measured 10,764 requests per second with 64,596 new connections without upstream keepalive versus 16,814 with 124 connections"><title>A reverse proxy location block with keep-alive and forwarded headers; gotchas for client IPs, WebSockets, streaming, body size and timeouts; measured 10,764 requests per second with 64,596 new connections without upstream keepalive versus 16,814 with 124 connections</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Nginx as a reverse proxy for Node (measured)</text><rect x="30" y="58" width="360" height="150" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="92.55" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">location /api/ {</text><text x="210" y="105.05" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_pass http://api_upstream;</text><text x="210" y="117.55" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_http_version 1.1;</text><text x="210" y="130.05" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_set_header Connection "";</text><text x="210" y="142.55" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_set_header Host $host;</text><text x="210" y="155.05" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</text><text x="210" y="167.55" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">  proxy_set_header X-Forwarded-Proto $scheme;</text><text x="210" y="180.05" font-size="9.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve" style="white-space:pre">}</text><rect x="410" y="58" width="360" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="96.2" font-size="10.5" text-anchor="middle" fill="#1e293b">Gotchas</text><text x="590" y="109.7" font-size="10.5" text-anchor="middle" fill="#1e293b">no upstream keepalive → new TCP connection per request</text><text x="590" y="123.2" font-size="10.5" text-anchor="middle" fill="#1e293b">Node sees Nginx's IP unless you read X-Forwarded-For</text><text x="590" y="136.7" font-size="10.5" text-anchor="middle" fill="#1e293b">(Express: app.set("trust proxy", 1))</text><text x="590" y="150.2" font-size="10.5" text-anchor="middle" fill="#1e293b">WebSockets need Upgrade + Connection headers</text><text x="590" y="163.7" font-size="10.5" text-anchor="middle" fill="#1e293b">SSE / streaming need proxy_buffering off</text><text x="590" y="177.2" font-size="10.5" text-anchor="middle" fill="#1e293b">defaults: client_max_body_size 1m, proxy_read_timeout 60s</text><text x="400" y="232" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 20 connections to /api/ping through Nginx for 6 s</text><text x="190" y="260" font-size="11.5" text-anchor="end" fill="#475569">no upstream keepalive</text><rect x="200" y="244" width="204.52" height="24" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="410.52" y="260" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">10764 req/s · 64,596 TCP connections to Node</text><text x="190" y="292" font-size="11.5" text-anchor="end" fill="#475569">keepalive 32</text><rect x="200" y="276" width="319.47" height="24" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="525.47" y="292" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">16814 req/s · 124 TCP connections to Node</text><rect x="30" y="320" width="740" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="344.9" font-size="11" text-anchor="middle" fill="#1e293b">Measured: POST 2 MB straight to Node → 200; through Nginx with defaults → 413 Request Entity Too Large.</text><text x="400" y="358.9" font-size="11" text-anchor="middle" fill="#1e293b">This app raises client_max_body_size to 64m and proxy_read_timeout to 300s only for its import and AI-streaming routes.</text></svg>