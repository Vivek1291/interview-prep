<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Nginx terminates TLS, serves static files with compression, routes and load balances to Node instances and other apps; measured raw static speed similar to Node (12,501 vs 11,276 requests per second) while precompressed gzip doubled large-file throughput"><title>Nginx terminates TLS, serves static files with compression, routes and load balances to Node instances and other apps; measured raw static speed similar to Node (12,501 vs 11,276 requests per second) while precompressed gzip doubled large-file throughput</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What Nginx does in front of Node.js (measured)</text><rect x="30" y="70" width="110" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="85" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">browser</text><text x="85" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">mobile app</text><rect x="180" y="58" width="250" height="84" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="305" y="83.45" font-size="10.5" text-anchor="middle" fill="#1e293b">NGINX :443 / :80</text><text x="305" y="96.95" font-size="10.5" text-anchor="middle" fill="#1e293b">TLS termination · HTTP/2 · gzip</text><text x="305" y="110.45" font-size="10.5" text-anchor="middle" fill="#1e293b">static files (React build) · routing</text><text x="305" y="123.95" font-size="10.5" text-anchor="middle" fill="#1e293b">body/rate limits · caching · access logs</text><rect x="470" y="58" width="140" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="540" y="80.9" font-size="11" text-anchor="middle" fill="#1e293b">Node API :3000</text><rect x="470" y="104" width="140" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="540" y="126.9" font-size="11" text-anchor="middle" fill="#1e293b">Node API :3001</text><rect x="640" y="58" width="130" height="84" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="705" y="89.9" font-size="11" text-anchor="middle" fill="#1e293b">other apps</text><text x="705" y="103.9" font-size="11" text-anchor="middle" fill="#1e293b">(admin, docs,</text><text x="705" y="117.9" font-size="11" text-anchor="middle" fill="#1e293b">webhooks)</text><line x1="144" y1="100" x2="176" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="434" y1="82" x2="466" y2="77" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="434" y1="118" x2="466" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="434" y1="100" x2="636" y2="100" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-slate)"/><text x="400" y="170" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured (Docker, Node 22, Nginx 1.27): raw speed is NOT the main reason</text><text x="240" y="196" font-size="11.5" text-anchor="end" fill="#475569">Node from disk, index.html</text><rect x="250" y="182" width="375.03" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631.03" y="196" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">12501 req/s</text><text x="240" y="224" font-size="11.5" text-anchor="end" fill="#475569">Nginx, index.html</text><rect x="250" y="210" width="338.28" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="594.28" y="224" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">11276 req/s</text><text x="240" y="252" font-size="11.5" text-anchor="end" fill="#475569">Node from disk, 690 KB JS</text><rect x="250" y="238" width="9.03" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="265.03" y="252" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">301 req/s (bandwidth-bound)</text><text x="240" y="280" font-size="11.5" text-anchor="end" fill="#475569">Nginx gzip_static, same JS</text><rect x="250" y="266" width="19.02" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="275.02" y="280" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">634 req/s (154 KB on the wire)</text><rect x="30" y="302" width="740" height="74" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="328.9" font-size="11" text-anchor="middle" fill="#1e293b">Why Nginx in front of Node: one public entry on 80/443 with TLS, serves static files and compression without touching</text><text x="400" y="342.9" font-size="11" text-anchor="middle" fill="#1e293b">Node, routes many apps/paths, load balances and retries, enforces body/time limits (1 MB default → 413), buffers and logs.</text><text x="400" y="356.9" font-size="11" text-anchor="middle" fill="#1e293b">Node keeps doing what it's good at: application logic. (Slow-client buffering matters most for thread-per-request servers.)</text></svg>