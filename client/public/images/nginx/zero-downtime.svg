<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Measured under load: nginx reload caused 0 failed requests, restarting the only backend caused 2,786 502 errors, and with two backends both a graceful stop and a hard kill of one caused 0 failures because Nginx retried on the other; zero-downtime deploy recipe"><title>Measured under load: nginx reload caused 0 failed requests, restarting the only backend caused 2,786 502 errors, and with two backends both a graceful stop and a hard kill of one caused 0 failures because Nginx retried on the other; zero-downtime deploy recipe</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Zero-downtime reloads and deploys with Nginx (measured)</text><text x="400" y="58" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured: 20 connections hammering /api/ping through Nginx for 8 s, action at 2.5 s</text><text x="240" y="85" font-size="11.5" text-anchor="end" fill="#475569">nginx -s reload</text><rect x="250" y="70" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="259" y="85" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 failed requests (136,529 total)</text><text x="240" y="115" font-size="11.5" text-anchor="end" fill="#475569">restart the ONLY backend</text><rect x="250" y="100" width="278.6" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="534.6" y="115" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">2786 failed requests (502 Bad Gateway)</text><text x="240" y="145" font-size="11.5" text-anchor="end" fill="#475569">2 backends, graceful stop of one</text><rect x="250" y="130" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="259" y="145" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 failed (119,438 total)</text><text x="240" y="175" font-size="11.5" text-anchor="end" fill="#475569">2 backends, kill -9 one</text><rect x="250" y="160" width="3" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="259" y="175" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">0 failed: Nginx retried on the other</text><rect x="30" y="200" width="360" height="176" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b">Why it worked</text><text x="210" y="263.9" font-size="11" text-anchor="middle" fill="#1e293b">reload: new workers start with the new config,</text><text x="210" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">old workers finish their requests, then exit</text><text x="210" y="291.9" font-size="11" text-anchor="middle" fill="#1e293b">upstream with 2+ servers: a failed connection</text><text x="210" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">is retried on the next server</text><text x="210" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">(proxy_next_upstream error timeout: default)</text><text x="210" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">retries only for idempotent methods by default</text><rect x="410" y="200" width="360" height="176" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="590" y="249.9" font-size="11" text-anchor="middle" fill="#1e293b">Zero-downtime deploy recipe</text><text x="590" y="263.9" font-size="11" text-anchor="middle" fill="#1e293b">1. start the new version next to the old one</text><text x="590" y="277.9" font-size="11" text-anchor="middle" fill="#1e293b">2. health-check it (/readyz)</text><text x="590" y="291.9" font-size="11" text-anchor="middle" fill="#1e293b">3. switch the upstream (or add it, drain the old)</text><text x="590" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">4. nginx -t &amp;&amp; nginx -s reload</text><text x="590" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">5. SIGTERM the old: it finishes in-flight requests</text><text x="590" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">6. keep the old build for instant rollback</text></svg>