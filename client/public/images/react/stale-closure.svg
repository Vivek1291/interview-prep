<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An interval created in the first render closes over count 0, so setCount(count + 1) always sets 1; measured after 5 ticks: 1 vs 5 with an updater function"><title>An interval created in the first render closes over count 0, so setCount(count + 1) always sets 1; measured after 5 ticks: 1 vs 5 with an updater function</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A stale closure in an interval</text><rect x="40" y="80" width="200" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="106.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">Render 1</text><text x="140" y="123.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">count = 0</text><rect x="300" y="80" width="200" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="106.4" font-size="14" text-anchor="middle" fill="#1e293b">Render 2</text><text x="400" y="123.4" font-size="14" text-anchor="middle" fill="#1e293b">count = 1</text><rect x="560" y="80" width="200" height="60" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="660" y="106.4" font-size="14" text-anchor="middle" fill="#1e293b">Render 3</text><text x="660" y="123.4" font-size="14" text-anchor="middle" fill="#1e293b">count = 1</text><rect x="40" y="190" width="200" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="140" y="216.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">setInterval(() =&gt;</text><text x="140" y="231.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  setCount(count + 1))</text><line x1="140" y1="142" x2="140" y2="186" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="208" y="158" font-size="12" text-anchor="middle" fill="#475569">closes over count = 0</text><path d="M240 220 Q400 126 560 112" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/><text x="470" y="214" font-size="12.5" text-anchor="middle" fill="#ef4444" font-weight="700">every tick: setCount(0 + 1) → 1</text><text x="400" y="286" font-size="13" text-anchor="middle" fill="#475569">The effect ran once ([] deps), so the interval keeps the FIRST render's count forever.</text><rect x="150" y="306" width="500" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="328.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">Fix: setCount(c =&gt; c + 1)  ·  or add count to deps  ·  or useEffectEvent</text><text x="400" y="370" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3) after 5 ticks: stale version shows 1, updater version shows 5</text></svg>