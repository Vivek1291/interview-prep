<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="With one context object for theme and user, changing the theme re-renders all 60 consumers; with separate contexts only the 10 theme consumers re-render"><title>With one context object for theme and user, changing the theme re-renders all 60 consumers; with separate contexts only the 10 theme consumers re-render</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Context: every consumer re-renders when the value changes</text><text x="205" y="72" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="700">One context {theme, user}</text><rect x="105" y="86" width="200" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="205" y="110.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">AppContext.Provider</text><rect x="40" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="64" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">T</text><rect x="96" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="120" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">U</text><rect x="152" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="176" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">U</text><rect x="208" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="232" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">U</text><rect x="264" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="288" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">U</text><rect x="320" y="160" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="344" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">U</text><line x1="205" y1="128" x2="205" y2="154" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="205" y="222" font-size="12.5" text-anchor="middle" fill="#475569">theme changes → EVERY consumer</text><text x="205" y="240" font-size="12.5" text-anchor="middle" fill="#475569">re-renders (new object value)</text><text x="595" y="72" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">Split: ThemeContext + UserContext</text><rect x="455" y="86" width="130" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="520" y="110.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Theme</text><rect x="605" y="86" width="130" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="670" y="110.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">User</text><rect x="495" y="160" width="48" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="519" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">T</text><rect x="560" y="160" width="38" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="579" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">U</text><rect x="604" y="160" width="38" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="623" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">U</text><rect x="648" y="160" width="38" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="667" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">U</text><rect x="692" y="160" width="38" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="711" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">U</text><rect x="736" y="160" width="38" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="755" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">U</text><line x1="520" y1="128" x2="520" y2="154" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="595" y="222" font-size="12.5" text-anchor="middle" fill="#475569">only theme consumers re-render</text><text x="400" y="288" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): 10 theme consumers + 50 user consumers, theme changes</text><text x="400" y="310" font-size="13" text-anchor="middle" fill="#475569">one context → 60 of 60 re-render   ·   split contexts → 10 of 60</text><rect x="300" y="333" width="14" height="14" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="320" y="345" font-size="12" text-anchor="start" fill="#475569">T = reads theme, U = reads user</text></svg>