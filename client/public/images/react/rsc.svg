<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Server Components run on the server, read data directly and keep libraries such as a 377 KB markdown stack off the client; Client Components marked use client handle interactivity; use server functions are called from forms"><title>Server Components run on the server, read data directly and keep libraries such as a 377 KB markdown stack off the client; Client Components marked use client handle interactivity; use server functions are called from forms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Server Components and Server Functions</text><rect x="30" y="70" width="360" height="290" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="210" y="94" font-size="14" text-anchor="middle" fill="#8b5cf6" font-weight="700">Server (or build time)</text><rect x="60" y="108" width="300" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="210" y="134" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">async function BlogPost({ id })</text><rect x="60" y="162" width="300" height="52" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="184.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const post = await db.posts.find(id)</text><text x="210" y="198.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">render markdown + highlight</text><rect x="60" y="224" width="300" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="210" y="247.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">'use server' async function addComment()</text><text x="210" y="290" font-size="12.5" text-anchor="middle" fill="#475569">libraries stay on the server:</text><text x="210" y="308" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">marked + sanitize-html + highlight.js = 377 KB gzip</text><text x="210" y="326" font-size="12.5" text-anchor="middle" fill="#10b981" font-weight="700">→ 0 KB sent to the browser</text><rect x="410" y="70" width="360" height="290" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="590" y="94" font-size="14" text-anchor="middle" fill="#0ea5e9" font-weight="700">Browser</text><rect x="440" y="108" width="300" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="590" y="134.4" font-size="12.5" text-anchor="middle" fill="#1e293b">RSC payload: rendered result</text><rect x="440" y="170" width="300" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="590" y="194.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">'use client'</text><text x="590" y="209.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">LikeButton (state, onClick)</text><rect x="440" y="244" width="300" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="268.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;form action={addComment}&gt;</text><text x="590" y="283.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">calls the server function</text><line x1="362" y1="130" x2="436" y2="130" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text x="399" y="122" font-size="12" text-anchor="middle" fill="#475569">stream</text><path d="M440 272 Q401 288 362 244" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="590" y="326" font-size="12.5" text-anchor="middle" fill="#475569">only Client Components ship JS</text></svg>