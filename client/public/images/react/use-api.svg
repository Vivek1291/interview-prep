<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="use(promise) suspends while pending, returns the value when resolved and throws to the error boundary when rejected; use(Context) reads context and may be called conditionally"><title>use(promise) suspends while pending, returns the value when resolved and throws to the error boundary when rejected; use(Context) reads context and may be called conditionally</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">The use() API</text><text x="205" y="70" font-size="15" text-anchor="middle" fill="#6366f1" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">use(promise)</text><rect x="60" y="86" width="290" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="205" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const user = use(userPromise)</text><rect x="60" y="148" width="135" height="52" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="127.5" y="170.6" font-size="12.5" text-anchor="middle" fill="#1e293b">pending</text><text x="127.5" y="186.1" font-size="12.5" text-anchor="middle" fill="#1e293b">→ suspends</text><rect x="215" y="148" width="135" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="282.5" y="170.6" font-size="12.5" text-anchor="middle" fill="#1e293b">resolved</text><text x="282.5" y="186.1" font-size="12.5" text-anchor="middle" fill="#1e293b">→ value</text><rect x="60" y="214" width="290" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="205" y="236.4" font-size="12.5" text-anchor="middle" fill="#1e293b">rejected → nearest error boundary</text><text x="205" y="276" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">the promise must be created OUTSIDE render</text><text x="205" y="294" font-size="12.5" text-anchor="middle" fill="#475569">(parent, loader, Server Component, cache)</text><text x="595" y="70" font-size="15" text-anchor="middle" fill="#14b8a6" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">use(Context)</text><rect x="450" y="86" width="290" height="104" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="595" y="120.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">if (!show) return null;</text><text x="595" y="134.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const theme = use(ThemeContext);</text><text x="595" y="149.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">// allowed: use() can be called</text><text x="595" y="163.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">// conditionally and in loops</text><rect x="450" y="206" width="290" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="232.4" font-size="12.5" text-anchor="middle" fill="#1e293b">not a hook slot → no Rules-of-Hooks order</text><text x="400" y="340" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">use is an API you call during render; it can only be called in components or hooks.</text></svg>