<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A component that is not ready suspends; the nearest Suspense boundary shows its fallback, React waits for the promise, retries, and shows the content"><title>A component that is not ready suspends; the nearest Suspense boundary shows its fallback, React waits for the promise, retries, and shows the content</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How Suspense works</text><rect x="265" y="64" width="270" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="88" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Suspense fallback={&lt;Spinner/&gt;}&gt;</text><rect x="240" y="140" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="315" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Header /&gt;</text><rect x="410" y="140" width="150" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="485" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Comments /&gt;</text><line x1="370" y1="106" x2="320" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="430" y1="106" x2="480" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="485" y="200" font-size="12" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,Consolas,monospace">use(commentsPromise)</text><text x="485" y="216" font-size="12" text-anchor="middle" fill="#f59e0b">promise pending → suspends</text><rect x="40" y="244" width="360" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="220" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b">1 render: a child is not ready (data / code)</text><rect x="40" y="272" width="360" height="24" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="220" y="288.2" font-size="12" text-anchor="middle" fill="#1e293b">2 nearest &lt;Suspense&gt; shows its fallback</text><rect x="40" y="300" width="360" height="24" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="220" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b">3 React waits for the promise</text><rect x="40" y="328" width="360" height="24" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="220" y="344.2" font-size="12" text-anchor="middle" fill="#1e293b">4 promise resolves → React retries the render</text><rect x="40" y="356" width="360" height="24" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="220" y="372.2" font-size="12" text-anchor="middle" fill="#1e293b">5 content replaces the fallback</text><rect x="430" y="244" width="340" height="136" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="600" y="263.7" font-size="12" text-anchor="middle" fill="#1e293b">Rules</text><text x="600" y="278.7" font-size="12" text-anchor="middle" fill="#1e293b">• the nearest boundary ABOVE the</text><text x="600" y="293.7" font-size="12" text-anchor="middle" fill="#1e293b">  suspending component catches it</text><text x="600" y="308.7" font-size="12" text-anchor="middle" fill="#1e293b">• everything inside that boundary</text><text x="600" y="323.7" font-size="12" text-anchor="middle" fill="#1e293b">  shows the one fallback</text><text x="600" y="338.7" font-size="12" text-anchor="middle" fill="#1e293b">• siblings outside keep rendering</text><text x="600" y="353.7" font-size="12" text-anchor="middle" fill="#1e293b">• React 19: fallback commits at once,</text><text x="600" y="368.7" font-size="12" text-anchor="middle" fill="#1e293b">  reveals are throttled (~300 ms)</text></svg>