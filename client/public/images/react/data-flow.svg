<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="TodoApp owns todos state, passes todos and onAdd down as props; AddTodo calls onAdd to send events up"><title>TodoApp owns todos state, passes todos and onAdd down as props; AddTodo calls onAdd to send events up</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One-way data flow: props down, events up</text><rect x="300" y="70" width="200" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="400" y="94.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">TodoApp</text><text x="400" y="111.4" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">state: todos</text><rect x="90" y="220" width="200" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="190" y="252.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">AddTodo</text><rect x="510" y="220" width="200" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="252.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">TodoList</text><rect x="510" y="320" width="200" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="610" y="347.6" font-size="13" text-anchor="middle" fill="#1e293b">TodoItem × n</text><line x1="330" y1="128" x2="230" y2="216" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="240" y="166" font-size="12" text-anchor="middle" fill="#475569">props: onAdd</text><line x1="470" y1="128" x2="590" y2="216" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="570" y="166" font-size="12" text-anchor="middle" fill="#475569">props: todos</text><line x1="610" y1="278" x2="610" y2="316" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><path d="M180 218 Q240 104 300 110" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="240" y="126" font-size="12" text-anchor="middle" fill="#475569">event up: onAdd(text)</text><rect x="40" y="319" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="60" y="331" font-size="12" text-anchor="start" fill="#475569">data flows DOWN as props (read-only)</text><rect x="40" y="339" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="60" y="351" font-size="12" text-anchor="start" fill="#475569">events flow UP through callbacks</text><text x="512" y="92" font-size="12" text-anchor="start" fill="#475569">state lives in the closest</text><text x="512" y="108" font-size="12" text-anchor="start" fill="#475569">common parent (&quot;lift it up&quot;)</text></svg>