<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Submitting a form with an action starts a transition, runs the async action with the previous state and FormData, and stores the returned state; useActionState returns state, formAction and isPending"><title>Submitting a form with an action starts a transition, runs the async action with the previous state and FormData, and stores the returned state; useActionState returns state, formAction and isPending</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Actions and useActionState</text><rect x="16" y="76" width="196" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="114" y="101.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;form action={formAction}&gt;</text><line x1="214" y1="98" x2="236" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="240" y="70" width="200" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="340" y="94.6" font-size="12.5" text-anchor="middle" fill="#1e293b">React starts a transition</text><text x="340" y="110.1" font-size="12.5" text-anchor="middle" fill="#1e293b">isPending = true</text><line x1="442" y1="98" x2="476" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="70" width="290" height="56" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="625" y="94.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">action(prevState, formData)</text><text x="625" y="109.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">await updateName(name) …</text><line x1="625" y1="128" x2="625" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="160" width="290" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="625" y="184.6" font-size="12.5" text-anchor="middle" fill="#1e293b">returns the next state</text><text x="625" y="200.1" font-size="12.5" text-anchor="middle" fill="#1e293b">{ error } or { ok: true }</text><line x1="476" y1="188" x2="442" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="240" y="160" width="200" height="56" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="340" y="184.6" font-size="12.5" text-anchor="middle" fill="#1e293b">isPending = false</text><text x="340" y="200.1" font-size="12.5" text-anchor="middle" fill="#1e293b">state updated, form reset</text><text x="400" y="252" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">const [state, formAction, isPending] = useActionState(action, initialState)</text><rect x="60" y="274" width="320" height="84" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="297.7" font-size="12" text-anchor="middle" fill="#1e293b">Before React 19</text><text x="220" y="312.7" font-size="12" text-anchor="middle" fill="#1e293b">4 useState (name, error, pending, success),</text><text x="220" y="327.7" font-size="12" text-anchor="middle" fill="#1e293b">try/catch/finally, preventDefault,</text><text x="220" y="342.7" font-size="12" text-anchor="middle" fill="#1e293b">manual reset</text><rect x="420" y="274" width="320" height="84" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="580" y="297.7" font-size="12" text-anchor="middle" fill="#1e293b">React 19 Actions</text><text x="580" y="312.7" font-size="12" text-anchor="middle" fill="#1e293b">1 useActionState, a plain async function,</text><text x="580" y="327.7" font-size="12" text-anchor="middle" fill="#1e293b">pending + errors + reset handled;</text><text x="580" y="342.7" font-size="12" text-anchor="middle" fill="#1e293b">works before hydration with RSC</text></svg>