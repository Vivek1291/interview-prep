<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="useState holds one value updated directly; useReducer sends actions to a pure reducer function that returns the next state"><title>useState holds one value updated directly; useReducer sends actions to a pure reducer function that returns the next state</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">useState vs useReducer</text><text x="200" y="70" font-size="16" text-anchor="middle" fill="#6366f1" font-weight="700">useState</text><rect x="60" y="88" width="280" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="200" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const [count, setCount] = useState(0)</text><rect x="60" y="150" width="280" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="200" y="176.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">setCount(c =&gt; c + 1)</text><text x="200" y="222" font-size="13" text-anchor="middle" fill="#475569">one value, simple updates</text><text x="200" y="240" font-size="13" text-anchor="middle" fill="#475569">logic lives in event handlers</text><text x="600" y="70" font-size="16" text-anchor="middle" fill="#8b5cf6" font-weight="700">useReducer</text><rect x="450" y="88" width="300" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600" y="114.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">dispatch({ type: 'added', item })</text><line x1="600" y1="134" x2="600" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="450" y="154" width="300" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="600" y="180.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">reducer(state, action) → newState</text><line x1="600" y1="200" x2="600" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="450" y="220" width="300" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="600" y="244.6" font-size="13" text-anchor="middle" fill="#1e293b">React re-renders with newState</text><text x="600" y="286" font-size="13" text-anchor="middle" fill="#475569">many related fields, next state depends on the</text><text x="600" y="304" font-size="13" text-anchor="middle" fill="#475569">action; logic is a pure, testable function</text><text x="400" y="350" font-size="13" text-anchor="middle" fill="#475569" font-style="italic">Rule of thumb: start with useState; switch when several setters always change together.</text></svg>