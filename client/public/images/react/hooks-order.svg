<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Hooks are stored in a list per component and matched by call order; skipping a hook in an if shifts every later hook to the wrong slot"><title>Hooks are stored in a list per component and matched by call order; skipping a hook in an if shifts every later hook to the wrong slot</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Why the Rules of Hooks exist: hooks are matched by order</text><text x="200" y="70" font-size="15" text-anchor="middle" fill="#10b981" font-weight="700">Render 1</text><text x="600" y="70" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="700">Render 2 (a hook was skipped by an if)</text><rect x="40" y="90" width="160" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="115.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useState('Asha')</text><line x1="202" y1="111" x2="228" y2="111" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="232" y="90" width="140" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302" y="115.4" font-size="12.5" text-anchor="middle" fill="#1e293b">slot 0: &quot;Asha&quot;</text><rect x="40" y="146" width="160" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="171.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useState(0)</text><line x1="202" y1="167" x2="228" y2="167" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="232" y="146" width="140" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302" y="171.4" font-size="12.5" text-anchor="middle" fill="#1e293b">slot 1: 0</text><rect x="40" y="202" width="160" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="120" y="227.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useEffect(...)</text><line x1="202" y1="223" x2="228" y2="223" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="232" y="202" width="140" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="302" y="227.4" font-size="12.5" text-anchor="middle" fill="#1e293b">slot 2: effect</text><rect x="420" y="90" width="180" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="510" y="115" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">if (x) useState('Asha')</text><rect x="420" y="146" width="180" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="510" y="171" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useState(0)</text><line x1="602" y1="111" x2="628" y2="111" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="632" y="90" width="150" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="707" y="115.2" font-size="12" text-anchor="middle" fill="#1e293b">reads slot 0: &quot;Asha&quot; ✗</text><rect x="420" y="202" width="180" height="42" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="510" y="227" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useEffect(...)</text><line x1="602" y1="167" x2="628" y2="167" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="632" y="146" width="150" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="707" y="171.2" font-size="12" text-anchor="middle" fill="#1e293b">reads slot 1: 0 ✗</text><text x="400" y="280" font-size="13" text-anchor="middle" fill="#475569">React stores each component's hooks in a list and matches them by CALL ORDER, not by name.</text><text x="400" y="302" font-size="13" text-anchor="middle" fill="#475569">Rules: call hooks only at the top level of components or custom hooks; never in if / loops / after early return.</text><text x="400" y="340" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">eslint-plugin-react-hooks catches violations; React 19.2+ adds compiler-powered rules.</text></svg>