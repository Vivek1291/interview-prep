<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Controlled input: React state holds the value and onChange updates it (20 renders for 20 keystrokes). Uncontrolled: the DOM holds the value, read with a ref or FormData (0 renders)."><title>Controlled input: React state holds the value and onChange updates it (20 renders for 20 keystrokes). Uncontrolled: the DOM holds the value, read with a ref or FormData (0 renders).</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Controlled vs uncontrolled inputs</text><text x="205" y="74" font-size="16" text-anchor="middle" fill="#6366f1" font-weight="700">Controlled</text><rect x="85" y="92" width="240" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="205" y="118.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">React state: name</text><rect x="85" y="186" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="212.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;input value={name}&gt;</text><line x1="205" y1="138" x2="205" y2="182" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/><text x="235" y="154" font-size="12" text-anchor="middle" fill="#475569">value</text><path d="M328 208 Q328 231 328 114" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-amber)"/><text x="372" y="166" font-size="12" text-anchor="start" fill="#f59e0b">onChange →</text><text x="372" y="182" font-size="12" text-anchor="start" fill="#f59e0b" font-family="ui-monospace,Menlo,Consolas,monospace">setName(v)</text><text x="205" y="262" font-size="12.5" text-anchor="middle" fill="#475569">React is the source of truth</text><text x="205" y="280" font-size="12.5" text-anchor="middle" fill="#475569">validate / format on every key</text><text x="595" y="74" font-size="16" text-anchor="middle" fill="#14b8a6" font-weight="700">Uncontrolled</text><rect x="475" y="92" width="240" height="44" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="595" y="118.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">DOM keeps the value</text><rect x="475" y="186" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="212.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;input defaultValue=&quot;&quot; ref={r}&gt;</text><line x1="595" y1="182" x2="595" y2="140" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><text x="605" y="166" font-size="12" text-anchor="start" fill="#14b8a6">read on submit</text><text x="595" y="262" font-size="12.5" text-anchor="middle" fill="#475569">the DOM is the source of truth</text><text x="595" y="280" font-size="12.5" text-anchor="middle" fill="#475569">or read it with FormData / form actions</text><text x="400" y="330" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): typing 20 characters</text><text x="400" y="352" font-size="13" text-anchor="middle" fill="#475569">controlled → 20 re-renders of the form   ·   uncontrolled → 0</text></svg>