<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Conditional rendering unmounts a hidden tab: switching back took 70 ms and lost the draft; Activity keeps it hidden: 4 ms and the draft is kept. ViewTransition animates updates inside transitions."><title>Conditional rendering unmounts a hidden tab: switching back took 70 ms and lost the draft; Activity keeps it hidden: 4 ms and the draft is kept. ViewTransition animates updates inside transitions.</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Activity and View Transitions</text><text x="205" y="70" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="700">Conditional rendering</text><rect x="60" y="86" width="290" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="110" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{tab === 'a' ? &lt;Editor/&gt; : &lt;Preview/&gt;}</text><text x="205" y="152" font-size="12.5" text-anchor="middle" fill="#475569">leaving tab A UNMOUNTS it:</text><text x="205" y="170" font-size="12.5" text-anchor="middle" fill="#475569">typed draft lost, effects re-run on return</text><rect x="85" y="186" width="240" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="205" y="208.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">switch back: 70 ms, draft lost</text><text x="595" y="70" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">&lt;Activity&gt; (React 19.2)</text><rect x="430" y="86" width="330" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="109.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Activity mode={visible ? 'visible' : 'hidden'}&gt;</text><text x="595" y="152" font-size="12.5" text-anchor="middle" fill="#475569">hidden: kept in memory, display:none,</text><text x="595" y="170" font-size="12.5" text-anchor="middle" fill="#475569">effects unmounted, updates at low priority</text><rect x="475" y="186" width="240" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="595" y="208.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">switch back: 4 ms, draft kept</text><rect x="60" y="250" width="680" height="64" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="271.2" font-size="12" text-anchor="middle" fill="#1e293b">&lt;ViewTransition&gt; (React 19.3, stable): animates elements that enter, exit or update inside</text><text x="400" y="286.2" font-size="12" text-anchor="middle" fill="#1e293b">startTransition / Suspense / useDeferredValue using the browser View Transition API;</text><text x="400" y="301.2" font-size="12" text-anchor="middle" fill="#1e293b">addTransitionType(&quot;next&quot;) chooses the animation (e.g. slide left vs right)</text><text x="400" y="346" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3): heavy tab (≈ 44 ms render) with a typed draft, switch away and back</text></svg>