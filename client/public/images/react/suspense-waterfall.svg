<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Three 400 ms requests fetched in nested components take 1,210 ms as a waterfall; started in parallel before rendering they take 402 ms"><title>Three 400 ms requests fetched in nested components take 1,210 ms as a waterfall; started in parallel before rendering they take 402 ms</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Fetch-on-render waterfalls vs render-as-you-fetch</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569">Each request takes 400 ms. Time →</text><text x="70" y="100" font-size="14" text-anchor="start" fill="#ef4444" font-weight="700">Waterfall</text><rect x="170" y="112" width="180" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="260" y="130.2" font-size="12" text-anchor="middle" fill="#1e293b">user</text><rect x="350" y="146" width="180" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="440" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b">posts</text><rect x="530" y="180" width="180" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="620" y="198.2" font-size="12" text-anchor="middle" fill="#1e293b">comments</text><text x="720.5" y="186" font-size="14" text-anchor="start" fill="#ef4444" font-weight="700">1,210 ms</text><text x="70" y="240" font-size="14" text-anchor="start" fill="#10b981" font-weight="700">Parallel</text><rect x="170" y="252" width="180" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="260" y="270.2" font-size="12" text-anchor="middle" fill="#1e293b">user</text><rect x="170" y="286" width="180" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="260" y="304.2" font-size="12" text-anchor="middle" fill="#1e293b">posts</text><rect x="170" y="320" width="180" height="28" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="260" y="338.2" font-size="12" text-anchor="middle" fill="#1e293b">comments</text><text x="356.9" y="326" font-size="14" text-anchor="start" fill="#10b981" font-weight="700">402 ms</text><text x="520" y="280" font-size="12.5" text-anchor="start" fill="#475569">start all requests BEFORE rendering</text><text x="520" y="298" font-size="12.5" text-anchor="start" fill="#475569">(preload in the route loader / event)</text><text x="400" y="370" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3): nested components that each use() their own data</text><text x="70" y="150" font-size="11.5" text-anchor="start" fill="#475569">fetch on render:</text><text x="70" y="166" font-size="11.5" text-anchor="start" fill="#475569">child starts only after</text><text x="70" y="182" font-size="11.5" text-anchor="start" fill="#475569">its parent resolved</text></svg>