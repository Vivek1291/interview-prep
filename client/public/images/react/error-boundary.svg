<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An ErrorBoundary wraps a Suspense boundary around Orders: pending shows the skeleton, rejected shows a retry UI, resolved shows the list"><title>An ErrorBoundary wraps a Suspense boundary around Orders: pending shows the skeleton, rejected shows a retry UI, resolved shows the list</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Suspense handles loading, error boundaries handle errors</text><rect x="245" y="62" width="310" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="86" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;ErrorBoundary fallback={&lt;Retry/&gt;}&gt;</text><rect x="255" y="120" width="290" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="144" font-size="11.5" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Suspense fallback={&lt;Skeleton/&gt;}&gt;</text><rect x="330" y="178" width="140" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="202.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Orders /&gt;</text><line x1="400" y1="104" x2="400" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="400" y1="162" x2="400" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="40" y="252" width="220" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="150" y="274.4" font-size="12.5" text-anchor="middle" fill="#1e293b">promise pending</text><line x1="150" y1="290" x2="150" y2="306" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><rect x="40" y="310" width="220" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="150" y="334.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Skeleton (Suspense fallback)</text><rect x="290" y="252" width="220" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="274.4" font-size="12.5" text-anchor="middle" fill="#1e293b">promise rejected / throws</text><line x1="400" y1="290" x2="400" y2="306" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="290" y="310" width="220" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="400" y="334.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Retry UI (error boundary)</text><rect x="540" y="252" width="220" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="650" y="274.4" font-size="12.5" text-anchor="middle" fill="#1e293b">promise resolved</text><line x1="650" y1="290" x2="650" y2="306" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="540" y="310" width="220" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="650" y="334.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">Orders list</text><text x="400" y="376" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Loading and errors are declared once around a section, not in every component.</text></svg>