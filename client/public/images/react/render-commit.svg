<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="React update pipeline: trigger, render a new element tree, reconcile with the previous tree, commit only changed DOM nodes, browser paints. Editing 1 of 1,000 rows: innerHTML rebuild touches 4,002 nodes, React changes 1 text node."><title>React update pipeline: trigger, render a new element tree, reconcile with the previous tree, commit only changed DOM nodes, browser paints. Editing 1 of 1,000 rows: innerHTML rebuild touches 4,002 nodes, React changes 1 text node.</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">How React updates the screen</text><rect x="22" y="90" width="135" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="89.5" y="114.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1 Trigger</text><rect x="22" y="134" width="135" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="89.5" y="165.6" font-size="12.5" text-anchor="middle" fill="#1e293b">setState / new props</text><text x="89.5" y="181.1" font-size="12.5" text-anchor="middle" fill="#1e293b">/ context change</text><line x1="159" y1="150" x2="175" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="177" y="90" width="135" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="244.5" y="114.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2 Render</text><rect x="177" y="134" width="135" height="70" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="244.5" y="165.6" font-size="12.5" text-anchor="middle" fill="#1e293b">call components →</text><text x="244.5" y="181.1" font-size="12.5" text-anchor="middle" fill="#1e293b">new element tree</text><line x1="314" y1="150" x2="330" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="332" y="90" width="135" height="38" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="399.5" y="114.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3 Reconcile</text><rect x="332" y="134" width="135" height="70" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="399.5" y="165.6" font-size="12.5" text-anchor="middle" fill="#1e293b">diff new tree vs</text><text x="399.5" y="181.1" font-size="12.5" text-anchor="middle" fill="#1e293b">previous tree</text><line x1="469" y1="150" x2="485" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="487" y="90" width="135" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="554.5" y="114.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4 Commit</text><rect x="487" y="134" width="135" height="70" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="554.5" y="165.6" font-size="12.5" text-anchor="middle" fill="#1e293b">apply ONLY the</text><text x="554.5" y="181.1" font-size="12.5" text-anchor="middle" fill="#1e293b">changed DOM nodes</text><line x1="624" y1="150" x2="640" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="642" y="90" width="135" height="38" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="709.5" y="114.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5 Paint</text><rect x="642" y="134" width="135" height="70" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/><text x="709.5" y="165.6" font-size="12.5" text-anchor="middle" fill="#1e293b">browser draws;</text><text x="709.5" y="181.1" font-size="12.5" text-anchor="middle" fill="#1e293b">then effects run</text><rect x="22" y="228" width="445" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="245" y="248" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Render phase: pure, can be paused or thrown away</text><text x="245" y="266" font-size="12" text-anchor="middle" fill="#475569">(no DOM changes yet)</text><rect x="487" y="228" width="290" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/><text x="632" y="248" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">Commit phase: synchronous</text><text x="632" y="266" font-size="12" text-anchor="middle" fill="#475569">DOM updated, refs set, effects</text><text x="400" y="312" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): editing 1 row of a 1,000-row list</text><text x="400" y="334" font-size="13" text-anchor="middle" fill="#475569">rebuild with innerHTML → 4,002 DOM nodes created/destroyed   ·   React → 1 text node changed</text><text x="400" y="364" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">You describe the UI for the current state; React works out the smallest DOM update.</text></svg>