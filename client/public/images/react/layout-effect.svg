<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Order of an update: render, commit DOM, useLayoutEffect (blocks paint), browser paints, useEffect. Use layout effects for measuring DOM before paint, effects for everything else"><title>Order of an update: render, commit DOM, useLayoutEffect (blocks paint), browser paints, useEffect. Use layout effects for measuring DOM before paint, effects for everything else</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">useLayoutEffect vs useEffect</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569">One update, in time order →</text><rect x="24" y="84" width="138" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="93" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">render</text><line x1="164" y1="106" x2="174" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="176" y="84" width="138" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="245" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">commit DOM</text><line x1="316" y1="106" x2="326" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="328" y="84" width="138" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="397" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">useLayoutEffect</text><line x1="468" y1="106" x2="478" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="480" y="84" width="138" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="549" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">browser paints</text><line x1="620" y1="106" x2="630" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="632" y="84" width="138" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="701" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">useEffect</text><rect x="326" y="140" width="136" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="394" y="160" font-size="12" text-anchor="middle" fill="#8b5cf6" font-weight="700">blocks the paint</text><rect x="632" y="140" width="136" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="700" y="160" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">after paint</text><rect x="40" y="200" width="340" height="100" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="210" y="231.1" font-size="12.5" text-anchor="middle" fill="#1e293b">useLayoutEffect</text><text x="210" y="246.6" font-size="12.5" text-anchor="middle" fill="#1e293b">measure DOM (size, position) and</text><text x="210" y="262.1" font-size="12.5" text-anchor="middle" fill="#1e293b">set state BEFORE the user sees it:</text><text x="210" y="277.6" font-size="12.5" text-anchor="middle" fill="#1e293b">tooltips, popovers, scroll restore</text><rect x="420" y="200" width="340" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="590" y="231.1" font-size="12.5" text-anchor="middle" fill="#1e293b">useEffect (default)</text><text x="590" y="246.6" font-size="12.5" text-anchor="middle" fill="#1e293b">fetching, subscriptions, logging,</text><text x="590" y="262.1" font-size="12.5" text-anchor="middle" fill="#1e293b">timers: anything that can wait</text><text x="590" y="277.6" font-size="12.5" text-anchor="middle" fill="#1e293b">until after the screen updated</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#475569">Using useEffect to position a tooltip → it flashes at the wrong spot for one frame.</text><text x="400" y="362" font-size="13" text-anchor="middle" fill="#475569">useLayoutEffect runs synchronously: keep it short or the UI freezes.</text></svg>