<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Components re-render when their state, their parent, a context they read or a hook changes; passing the list as children instead of rendering it inside reduced re-renders from 101 to 1"><title>Components re-render when their state, their parent, a context they read or a hook changes; passing the list as children instead of rendering it inside reduced re-renders from 101 to 1</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">What makes a component re-render</text><rect x="30" y="72" width="260" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="92.6" font-size="12.5" text-anchor="middle" fill="#1e293b">its state changed</text><text x="160" y="108.1" font-size="12.5" text-anchor="middle" fill="#1e293b">setState / dispatch</text><rect x="30" y="130" width="260" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="160" y="150.6" font-size="12.5" text-anchor="middle" fill="#1e293b">its parent re-rendered</text><text x="160" y="166.1" font-size="12.5" text-anchor="middle" fill="#1e293b">children re-render by default</text><rect x="30" y="188" width="260" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="160" y="208.6" font-size="12.5" text-anchor="middle" fill="#1e293b">a context it reads changed</text><text x="160" y="224.1" font-size="12.5" text-anchor="middle" fill="#1e293b">useContext / use</text><rect x="30" y="246" width="260" height="48" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="160" y="266.6" font-size="12.5" text-anchor="middle" fill="#1e293b">a hook it uses re-rendered it</text><text x="160" y="282.1" font-size="12.5" text-anchor="middle" fill="#1e293b">e.g. useSyncExternalStore</text><text x="160" y="318" font-size="12.5" text-anchor="middle" fill="#475569" font-weight="700">NOT a cause: props &quot;changing&quot;</text><text x="160" y="336" font-size="12" text-anchor="middle" fill="#475569">(a parent render is the real reason)</text><text x="560" y="72" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">Same counter, two structures</text><rect x="330" y="92" width="210" height="92" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="435" y="120.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">function Page() {</text><text x="435" y="134.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  const [n] = useState(0)</text><text x="435" y="149.3" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  return &lt;&gt;{n}&lt;List/&gt;&lt;/&gt;</text><text x="435" y="163.8" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><rect x="560" y="92" width="220" height="92" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="127.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Counter&gt;</text><text x="670" y="142" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  &lt;List /&gt;  ← created</text><text x="670" y="156.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;/Counter&gt;    by Page</text><text x="435" y="206" font-size="12" text-anchor="middle" fill="#475569">List (100 items) inside</text><text x="670" y="206" font-size="12" text-anchor="middle" fill="#475569">List passed as children</text><rect x="330" y="226" width="210" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="435" y="250.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">101 components re-render</text><rect x="560" y="226" width="220" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="250.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1 component re-renders</text><text x="555" y="292" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3): counter +1 above a 100-item list</text><text x="555" y="316" font-size="12.5" text-anchor="middle" fill="#475569">children elements made by a parent that did NOT re-render</text><text x="555" y="334" font-size="12.5" text-anchor="middle" fill="#475569">are the same objects → React skips them</text></svg>