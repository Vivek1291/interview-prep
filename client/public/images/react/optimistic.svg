<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Waiting for a 500 ms server shows the message after 508 ms; useOptimistic shows it after 2 ms marked as sending and the server confirms at 503 ms; on failure the optimistic item is rolled back"><title>Waiting for a 500 ms server shows the message after 508 ms; useOptimistic shows it after 2 ms marked as sending and the server confirms at 503 ms; on failure the optimistic item is rolled back</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">useOptimistic: show the result before the server answers</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569">Sending a chat message; the server takes 500 ms. Time →</text><text x="40" y="108" font-size="13" text-anchor="start" fill="#ef4444" font-weight="700">Wait for server</text><line x1="180" y1="104" x2="560" y2="104" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/><rect x="564" y="88" width="200" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="664" y="108.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">message appears: 508 ms</text><text x="40" y="176" font-size="13" text-anchor="start" fill="#10b981" font-weight="700">useOptimistic</text><rect x="180" y="156" width="230" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="295" y="176.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-weight="700">appears at 2 ms (sending…)</text><line x1="412" y1="172" x2="560" y2="172" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-green)"/><rect x="564" y="156" width="200" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="664" y="176.4" font-size="12.5" text-anchor="middle" fill="#1e293b">server confirms: 503 ms</text><rect x="60" y="214" width="680" height="56" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="238.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const [optimistic, addOptimistic] = useOptimistic(messages,</text><text x="400" y="253.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  (list, text) =&gt; [...list, { text, sending: true }])</text><rect x="60" y="284" width="330" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="225" y="315.6" font-size="12.5" text-anchor="middle" fill="#1e293b">success: the real state arrives,</text><text x="225" y="331.1" font-size="12.5" text-anchor="middle" fill="#1e293b">the optimistic copy is replaced</text><rect x="410" y="284" width="330" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="575" y="307.9" font-size="12.5" text-anchor="middle" fill="#1e293b">failure: the action ends without</text><text x="575" y="323.4" font-size="12.5" text-anchor="middle" fill="#1e293b">updating state → the optimistic</text><text x="575" y="338.9" font-size="12.5" text-anchor="middle" fill="#1e293b">item disappears automatically</text><text x="400" y="382" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3, jsdom): time until the new message is on screen</text></svg>