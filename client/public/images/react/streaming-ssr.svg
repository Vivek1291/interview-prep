<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Classic SSR waits 400 ms for all data before the first byte; streaming SSR sends the shell after 2 ms and streams the reviews when ready; selective hydration makes clicked parts interactive first"><title>Classic SSR waits 400 ms for all data before the first byte; streaming SSR sends the shell after 2 ms and streams the reviews when ready; selective hydration makes clicked parts interactive first</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Streaming SSR with Suspense</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569">Server: product page whose reviews API takes 400 ms. Time →</text><text x="40" y="104" font-size="13" text-anchor="start" fill="#ef4444" font-weight="700">Classic SSR</text><rect x="150" y="90" width="300" height="26" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="300" y="107.2" font-size="12" text-anchor="middle" fill="#1e293b">wait for ALL data (400 ms)</text><rect x="452" y="90" width="160" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="532" y="107.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">send whole HTML</text><text x="620" y="108" font-size="12.5" text-anchor="start" fill="#ef4444" font-weight="700">first byte 404 ms</text><text x="40" y="164" font-size="13" text-anchor="start" fill="#10b981" font-weight="700">Streaming</text><rect x="150" y="150" width="120" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="210" y="167.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">shell + fallback</text><text x="280" y="168" font-size="12.5" text-anchor="start" fill="#10b981" font-weight="700">first byte 2 ms</text><rect x="452" y="182" width="160" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="532" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b">reviews chunk</text><text x="620" y="200" font-size="12" text-anchor="start" fill="#475569">+ inline script swaps it in</text><rect x="40" y="236" width="350" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="215" y="270.2" font-size="12" text-anchor="middle" fill="#1e293b">renderToPipeableStream(&lt;App/&gt;)</text><text x="215" y="285.2" font-size="12" text-anchor="middle" fill="#1e293b">• shell (header, title, price) sent</text><text x="215" y="300.2" font-size="12" text-anchor="middle" fill="#1e293b">  immediately with &lt;Suspense&gt; fallbacks</text><text x="215" y="315.2" font-size="12" text-anchor="middle" fill="#1e293b">• each boundary streams when ready</text><text x="215" y="330.2" font-size="12" text-anchor="middle" fill="#1e293b">• React 19.2 batches reveals together</text><rect x="410" y="236" width="350" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="585" y="270.2" font-size="12" text-anchor="middle" fill="#1e293b">Selective hydration (client)</text><text x="585" y="285.2" font-size="12" text-anchor="middle" fill="#1e293b">• hydrateRoot hydrates boundary by</text><text x="585" y="300.2" font-size="12" text-anchor="middle" fill="#1e293b">  boundary, not all at once</text><text x="585" y="315.2" font-size="12" text-anchor="middle" fill="#1e293b">• a clicked boundary hydrates FIRST</text><text x="585" y="330.2" font-size="12" text-anchor="middle" fill="#1e293b">• the page is interactive sooner</text><text x="400" y="382" font-size="12" text-anchor="middle" fill="#475569" font-style="italic">Measured: react-dom/server 19.3 in Node, average of 3 renders</text></svg>