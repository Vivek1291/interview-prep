<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="React Compiler rewrites components to cache values and JSX elements in slots and reuse them when dependencies are unchanged; measured 201 re-renders per click without it and 0 with it, 26 ms vs 4.6 ms for 50 clicks"><title>React Compiler rewrites components to cache values and JSX elements in slots and reuse them when dependencies are unchanged; measured 201 re-renders per click without it and 0 with it, 26 ms vs 4.6 ms for 50 clicks</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">React Compiler: automatic memoization</text><rect x="30" y="72" width="350" height="150" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="93" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">function Shop({ items }) {</text><text x="205" y="107.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  const [cart, setCart] = useState(0)</text><text x="205" y="122" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  const onSelect = (id) =&gt; …</text><text x="205" y="136.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  return &lt;&gt;</text><text x="205" y="151" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &lt;button&gt;{cart}&lt;/button&gt;</text><text x="205" y="165.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    &lt;ProductList items={items}</text><text x="205" y="180" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">      onSelect={onSelect} /&gt;</text><text x="205" y="194.5" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  &lt;/&gt;</text><text x="205" y="209" font-size="11.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><text x="205" y="242" font-size="12.5" text-anchor="middle" fill="#475569">your code: no memo, no useMemo</text><line x1="382" y1="146" x2="418" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="138" font-size="12" text-anchor="middle" fill="#475569">build</text><rect x="420" y="72" width="350" height="150" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="595" y="115.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">const $ = _c(15)            // cache slots</text><text x="595" y="129.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">if ($[0] !== items) {      // deps changed?</text><text x="595" y="143.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  t1 = &lt;ProductList …/&gt;    // recompute</text><text x="595" y="157.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  $[0] = items; $[1] = t1</text><text x="595" y="171.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">} else t1 = $[1]           // reuse element</text><text x="595" y="185.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">→ same element ⇒ React skips ProductList</text><text x="595" y="242" font-size="12.5" text-anchor="middle" fill="#475569">compiled by babel-plugin-react-compiler 1.0</text><text x="400" y="286" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): clicking the cart button above a 200-item list</text><text x="400" y="308" font-size="13" text-anchor="middle" fill="#475569">list + items re-rendered per click: 201 → 0   ·   50 clicks: 26 ms → 4.6 ms</text><text x="400" y="332" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Not magic: selecting a row still re-renders all 200 items (the compiler caches elements,</text><text x="400" y="350" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">it doesn't add React.memo to list items); impure code is skipped, not compiled.</text></svg>