<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="JSX Button element compiles to jsx(Button, props) which returns a plain element object; React turns elements into DOM nodes"><title>JSX Button element compiles to jsx(Button, props) which returns a plain element object; React turns elements into DOM nodes</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">JSX is JavaScript: what it compiles to</text><rect x="25" y="80" width="230" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="140" y="120.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;Button size=&quot;lg&quot;</text><text x="140" y="136.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  onClick={save}&gt;</text><text x="140" y="152.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  Save</text><text x="140" y="168.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;/Button&gt;</text><text x="140" y="222" font-size="13" text-anchor="middle" fill="#0ea5e9" font-weight="700">JSX you write</text><line x1="258" y1="140" x2="300" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="279" y="130" font-size="12" text-anchor="middle" fill="#475569">compiler</text><rect x="305" y="80" width="210" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="410" y="113.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">jsx(Button, {</text><text x="410" y="128.9" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  size: 'lg',</text><text x="410" y="144.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  onClick: save,</text><text x="410" y="159.9" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  children: 'Save'</text><text x="410" y="175.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">})</text><text x="410" y="222" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">a function call</text><line x1="518" y1="140" x2="556" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="537" y="130" font-size="12" text-anchor="middle" fill="#475569">returns</text><rect x="560" y="80" width="215" height="120" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="667.5" y="121.1" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ type: Button,</text><text x="667.5" y="136.6" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  props: { size, onClick,</text><text x="667.5" y="152.1" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">    children },</text><text x="667.5" y="167.6" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">  key: null }</text><text x="667" y="222" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">a plain object (element)</text><rect x="150" y="262" width="500" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="400" y="289.6" font-size="13" text-anchor="middle" fill="#1e293b">React renders elements → reconciles → creates/updates real DOM nodes</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#475569">{ } holds any JavaScript expression  ·  className, htmlFor  ·  one root (or &lt;&gt;…&lt;/&gt;)</text><text x="400" y="362" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">Lists need key: &lt;li key={item.id}&gt;</text></svg>