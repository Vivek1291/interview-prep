<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A Profiler flame chart shows which components rendered and how long; Profiler onRender measured 2.78 ms per commit without memo and 1.27 ms with memo for 1,000 rows"><title>A Profiler flame chart shows which components rendered and how long; Profiler onRender measured 2.78 ms per commit without memo and 1.27 ms with memo for 1,000 rows</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Measure before optimizing: the React Profiler</text><text x="400" y="66" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">React DevTools Profiler: a recorded commit (flame chart)</text><rect x="40" y="84" width="720" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="102.2" font-size="12" text-anchor="middle" fill="#1e293b">App 3.1 ms</text><rect x="40" y="118" width="300" height="28" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="190" y="136.2" font-size="12" text-anchor="middle" fill="#1e293b">Header 0.2</text><rect x="350" y="118" width="410" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="555" y="136.2" font-size="12" text-anchor="middle" fill="#1e293b">ProductList 2.8 ms</text><rect x="350" y="152" width="60" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="380" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">Card</text><rect x="415" y="152" width="60" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="445" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">Card</text><rect x="480" y="152" width="60" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="510" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">Card</text><rect x="545" y="152" width="60" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="575" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">Card</text><rect x="610" y="152" width="60" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="640" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">Card</text><rect x="675" y="152" width="85" height="28" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="717.5" y="170.2" font-size="12" text-anchor="middle" fill="#1e293b">… ×1000</text><text x="400" y="210" font-size="12.5" text-anchor="middle" fill="#475569">Each bar = a component that rendered in this commit; width = time; grey = did not render.</text><rect x="40" y="236" width="350" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="215" y="259.9" font-size="12.5" text-anchor="middle" fill="#1e293b">Find WHY: &quot;Why did this render?&quot;</text><text x="215" y="275.4" font-size="12.5" text-anchor="middle" fill="#1e293b">(enable in DevTools settings)</text><text x="215" y="290.9" font-size="12.5" text-anchor="middle" fill="#1e293b">hooks changed · props changed · parent</text><rect x="410" y="236" width="350" height="70" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="585" y="260.2" font-size="12" text-anchor="middle" fill="#1e293b">&lt;Profiler id=&quot;list&quot; onRender={…}&gt;</text><text x="585" y="275.2" font-size="12" text-anchor="middle" fill="#1e293b">actualDuration vs baseDuration</text><text x="585" y="290.2" font-size="12" text-anchor="middle" fill="#1e293b">React 19.2: Chrome Performance tracks</text><text x="400" y="334" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured with &lt;Profiler&gt; (React 19.3 dev build): re-render 1,000 rows</text><text x="400" y="356" font-size="13" text-anchor="middle" fill="#475569">without memo ≈ 2.78 ms per commit   ·   with memo ≈ 1.27 ms</text></svg>