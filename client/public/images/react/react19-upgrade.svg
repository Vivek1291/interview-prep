t, default parameters</text><rect x="20" y="158" width="400" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="177.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">string refs (ref=&quot;input&quot;)</text><line x1="422" y1="174" x2="436" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="158" width="340" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="177.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">useRef / callback refs</text><rect x="20" y="198" width="400" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="217.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">legacy context (contextTypes)</text><line x1="422" y1="214" x2="436" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="198" width="340" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="217.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">createContext</text><rect x="20" y="238" width="400" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="257.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">forwardRef (still works, will be deprecated)</text><line x1="422" y1="254" x2="436" y2="254" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="238" width="340" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="257.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">ref as a prop</text><rect x="20" y="278" width="400" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="297.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">react-test-renderer, act from react-dom/test-utils</text><line x1="422" y1="294" x2="436" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="278" width="340" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="297.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Testing Library, act from react</text><rect x="20" y="318" width="400" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">unmountComponentAtNode, findDOMNode</text><line x1="422" y1="334" x2="436" y2="334" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="440" y="318" width="340" height="32" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="337.9" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">root.unmount(), refs</text><text x="400" y="372" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Path: upgrade to 18.3 first (it warns about everything) → fix warnings → 19 → run the codemods</text></svg>