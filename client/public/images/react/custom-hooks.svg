<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A custom hook useDebounce built from useState and useEffect is used by three components, each with its own state. Typing react hooks: 11 API calls without debounce, 1 with"><title>A custom hook useDebounce built from useState and useEffect is used by three components, each with its own state. Typing react hooks: 11 API calls without debounce, 1 with</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Custom hooks: reuse stateful logic</text><rect x="300" y="70" width="200" height="70" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="101.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">useDebounce(value, ms)</text><text x="400" y="117.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">useState + useEffect</text><rect x="60" y="210" width="200" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="160" y="234.7" font-size="12" text-anchor="middle" fill="#1e293b">SearchBox</text><text x="160" y="249.7" font-size="12" text-anchor="middle" fill="#1e293b">const q = useDebounce(text, 300)</text><rect x="300" y="210" width="200" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="234.7" font-size="12" text-anchor="middle" fill="#1e293b">UserFilter</text><text x="400" y="249.7" font-size="12" text-anchor="middle" fill="#1e293b">useDebounce(name, 500)</text><rect x="540" y="210" width="200" height="56" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="640" y="234.7" font-size="12" text-anchor="middle" fill="#1e293b">PriceSlider</text><text x="640" y="249.7" font-size="12" text-anchor="middle" fill="#1e293b">useDebounce(range, 200)</text><line x1="330" y1="142" x2="170" y2="206" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><line x1="400" y1="142" x2="400" y2="206" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><line x1="470" y1="142" x2="630" y2="206" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text x="400" y="296" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Shares LOGIC, not state: every call gets its own state and effects.</text><text x="400" y="318" font-size="13" text-anchor="middle" fill="#475569">Name starts with &quot;use&quot;, may call other hooks, returns whatever is useful.</text><text x="400" y="352" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Measured (React 19.3): typing &quot;react hooks&quot; → 11 API calls without, 1 with useDebounce(300)</text></svg>