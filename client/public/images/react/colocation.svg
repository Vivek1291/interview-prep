<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="With the search query in the page, 10 keystrokes cause 1,000 ProductCard renders; with the query inside SearchBox, 0"><title>With the search query in the page, 10 keystrokes cause 1,000 ProductCard renders; with the query inside SearchBox, 0</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">State colocation: keep state where it is used</text><text x="205" y="72" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="700">State in the page</text><rect x="95" y="88" width="220" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="205" y="114.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">ProductsPage: query</text><rect x="40" y="168" width="120" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="100" y="192.6" font-size="13" text-anchor="middle" fill="#1e293b">SearchBox</text><rect x="180" y="168" width="170" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="265" y="192.6" font-size="13" text-anchor="middle" fill="#1e293b">100 × ProductCard</text><line x1="170" y1="134" x2="110" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="240" y1="134" x2="260" y2="164" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="205" y="240" font-size="12.5" text-anchor="middle" fill="#475569">every keystroke re-renders the page</text><text x="205" y="258" font-size="12.5" text-anchor="middle" fill="#475569">and all 100 cards</text><text x="595" y="72" font-size="15" text-anchor="middle" fill="#10b981" font-weight="700">State colocated</text><rect x="485" y="88" width="220" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595" y="114.6" font-size="13" text-anchor="middle" fill="#1e293b">ProductsPage</text><rect x="430" y="168" width="140" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="500" y="192.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">SearchBox: query</text><rect x="590" y="168" width="170" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="675" y="192.6" font-size="13" text-anchor="middle" fill="#1e293b">100 × ProductCard</text><line x1="560" y1="134" x2="500" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="630" y1="134" x2="670" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="595" y="240" font-size="12.5" text-anchor="middle" fill="#475569">typing only re-renders SearchBox</text><text x="595" y="258" font-size="12.5" text-anchor="middle" fill="#475569">(results come via URL/router or a store)</text><text x="400" y="312" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): ProductCard renders during 10 keystrokes</text><text x="400" y="334" font-size="13" text-anchor="middle" fill="#475569">state in the page → 1,000   ·   state in SearchBox → 0</text><text x="400" y="364" font-size="12.5" text-anchor="middle" fill="#475569" font-style="italic">Keep state as close as possible to where it is used; lift it only when needed.</text></svg>