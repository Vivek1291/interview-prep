<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="useRef returns the same object every render; changing current does not re-render. Used for DOM nodes and mutable values. Counting 10 clicks: state 10 renders, ref 0"><title>useRef returns the same object every render; changing current does not re-render. Used for DOM nodes and mutable values. Counting 10 clicks: state 10 renders, ref 0</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">useRef: a value that is not state</text><text x="205" y="72" font-size="15" text-anchor="middle" fill="#14b8a6" font-weight="700">A box that survives renders</text><rect x="85" y="90" width="240" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="205" y="119.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ref = { current: 3 }</text><rect x="60" y="180" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="105" y="204.4" font-size="12.5" text-anchor="middle" fill="#1e293b">render 1</text><rect x="160" y="180" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="204.4" font-size="12.5" text-anchor="middle" fill="#1e293b">render 2</text><rect x="260" y="180" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="305" y="204.4" font-size="12.5" text-anchor="middle" fill="#1e293b">render 3</text><line x1="105" y1="178" x2="170" y2="142" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><line x1="205" y1="178" x2="200" y2="142" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><line x1="305" y1="178" x2="230" y2="142" stroke="#14b8a6" stroke-width="2" marker-end="url(#a-teal)"/><text x="205" y="246" font-size="13" text-anchor="middle" fill="#475569">same object every render;</text><text x="205" y="264" font-size="13" text-anchor="middle" fill="#475569">changing .current does NOT re-render</text><text x="595" y="72" font-size="15" text-anchor="middle" fill="#6366f1" font-weight="700">Two uses</text><rect x="450" y="90" width="290" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="595" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">DOM access</text><text x="595" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">&lt;input ref={inputRef} /&gt;</text><text x="595" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">inputRef.current.focus()</text><rect x="450" y="166" width="290" height="60" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="595" y="185.2" font-size="12" text-anchor="middle" fill="#1e293b">Mutable values</text><text x="595" y="200.2" font-size="12" text-anchor="middle" fill="#1e293b">timer ids, previous value,</text><text x="595" y="215.2" font-size="12" text-anchor="middle" fill="#1e293b">latest callback, counters</text><text x="400" y="312" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3): counting 10 clicks</text><text x="400" y="334" font-size="13" text-anchor="middle" fill="#475569">useState → 10 re-renders   ·   useRef → 0 re-renders (but the screen does not update!)</text></svg>