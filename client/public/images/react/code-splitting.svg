ight="38" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="550" y="255.8" font-size="11.5" text-anchor="middle" fill="#1e293b">Mermaid diagrams</text><text x="550" y="270.3" font-size="11.5" text-anchor="middle" fill="#1e293b">161 KB+</text><text x="640" y="264" font-size="12" text-anchor="start" fill="#475569">only if a diagram shows</text><text x="400" y="330" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured: this app's own production build (Vite), 69 JS files</text><text x="400" y="352" font-size="13" text-anchor="middle" fill="#475569">first load downloads 109 KB instead of 1,325 KB (≈ 8%)</text></svg>