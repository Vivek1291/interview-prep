<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="With index keys, prepending makes React update every row and append one (1,001 DOM changes for 1,000 rows); with stable id keys it inserts one row (1 change)"><title>With index keys, prepending makes React update every row and append one (1,001 DOM changes for 1,000 rows); with stable id keys it inserts one row (1 change)</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Why keys matter: prepending to a list</text><text x="205" y="74" font-size="14" text-anchor="middle" fill="#ef4444" font-weight="700">key = index  (prepend &quot;Item 0&quot;)</text><text x="595" y="74" font-size="14" text-anchor="middle" fill="#10b981" font-weight="700">key = item.id</text><rect x="60" y="92" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="115.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 0</text><rect x="138" y="92" width="210" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="243" y="115.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 1 → Item 0</text><rect x="60" y="138" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="161.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 1</text><rect x="138" y="138" width="210" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="243" y="161.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 2 → Item 1</text><rect x="60" y="184" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="207.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 2</text><rect x="138" y="184" width="210" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="243" y="207.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 3 → Item 2</text><rect x="60" y="230" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="253.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 3</text><rect x="138" y="230" width="210" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="243" y="253.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">new: Item 3</text><rect x="450" y="92" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="485" y="115.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 0</text><rect x="528" y="92" width="210" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="633" y="115.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 0  (inserted)</text><rect x="450" y="138" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="485" y="161.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 1</text><rect x="528" y="138" width="210" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="633" y="161.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 1  (kept)</text><rect x="450" y="184" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="485" y="207.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 2</text><rect x="528" y="184" width="210" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="633" y="207.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 2  (kept)</text><rect x="450" y="230" width="70" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="485" y="253.2" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">key 3</text><rect x="528" y="230" width="210" height="38" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="633" y="253.4" font-size="12.5" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">Item 3  (kept)</text><text x="205" y="296" font-size="12.5" text-anchor="middle" fill="#475569">every row is &quot;updated&quot; + one appended;</text><text x="205" y="314" font-size="12.5" text-anchor="middle" fill="#ef4444">input state/focus stays with the wrong row</text><text x="595" y="296" font-size="12.5" text-anchor="middle" fill="#475569">one new row inserted at the top;</text><text x="595" y="314" font-size="12.5" text-anchor="middle" fill="#10b981">the others keep their DOM and state</text><text x="400" y="352" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">Measured (React 19.3, 1,000 rows): index keys → 1,001 DOM changes   ·   stable keys → 1</text></svg>