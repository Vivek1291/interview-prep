<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="HTTP client: timeout, retry, circuit breaker"><title>HTTP client: timeout, retry, circuit breaker</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">HTTP client: timeout, retry, circuit breaker</text><line x1="130" y1="195" x2="157" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="280" y1="195" x2="307" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="430" y1="195" x2="457" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="590" y1="195" x2="637" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="530" y1="220" x2="530" y2="287" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><text x="530" y="247.5" font-size="11" text-anchor="middle" fill="#475569">retryable</text><line x1="530" y1="290" x2="530" y2="223" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a-violet)"/><line x1="222.5" y1="220" x2="222.5" y2="287" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="222.5" y="247.5" font-size="11" text-anchor="middle" fill="#475569">open → fail fast</text><rect x="20" y="170" width="110" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="75" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Service code</text><rect x="160" y="170" width="120" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="220" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Circuit</text><text x="220" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">breaker</text><rect x="310" y="170" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="370" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Interceptors</text><rect x="460" y="170" width="130" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="525" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">fetch +</text><text x="525" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">timeout</text><rect x="640" y="170" width="130" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="705" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Remote API</text><rect x="460" y="290" width="150" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="535" y="311.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">backoff + jitter</text><text x="535" y="326.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">/ Retry-After</text><rect x="150" y="290" width="150" height="44" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="225" y="316.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">CircuitOpenError</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Retry only safe methods or POST + Idempotency-Key</text></svg>