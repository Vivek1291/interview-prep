<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Auth service: access JWT + rotating refresh token + RBAC"><title>Auth service: access JWT + rotating refresh token + RBAC</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Auth service: access JWT + rotating refresh token + RBAC</text><line x1="120" y1="195" x2="157" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="138.5" y="189" font-size="11" text-anchor="middle" fill="#475569">login</text><line x1="280" y1="195" x2="317" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="380" y1="170" x2="380" y2="117" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="440" y1="195" x2="545" y2="117" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="440" y1="195" x2="477" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="458.5" y="189" font-size="11" text-anchor="middle" fill="#475569">rotate</text><line x1="120" y1="195" x2="235" y2="287" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="177.5" y="235" font-size="11" text-anchor="middle" fill="#475569">Bearer</text><line x1="310" y1="315" x2="377" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="20" y="170" width="100" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="70" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">React SPA</text><rect x="160" y="170" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="220" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">AuthController</text><rect x="320" y="170" width="120" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="380" y="199.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">AuthService</text><rect x="320" y="70" width="120" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="380" y="96.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">scrypt hash</text><rect x="480" y="70" width="130" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="545" y="96.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">JWT 15 min</text><rect x="480" y="170" width="130" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="545" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Refresh tokens</text><text x="545" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(hashed, family)</text><rect x="160" y="290" width="150" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="235" y="311.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">authenticate →</text><text x="235" y="326.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">requireRole</text><rect x="380" y="290" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="440" y="319.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Protected API</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Reused refresh token → revoke the whole family</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Protected routes answer 200, 401 (not logged in) or 403 (wrong role)</text></svg>