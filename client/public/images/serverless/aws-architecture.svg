<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Users reach CloudFront which serves the React build from S3 and routes the API through a load balancer or API Gateway to ECS Fargate or Lambda, backed by RDS, ElastiCache, SQS and S3, with IAM, secrets, CloudWatch and infrastructure as code"><title>Users reach CloudFront which serves the React build from S3 and routes the API through a load balancer or API Gateway to ECS Fargate or Lambda, backed by RDS, ElastiCache, SQS and S3, with IAM, secrets, CloudWatch and infrastructure as code</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">AWS services for a Node.js + React app</text><rect x="30" y="58" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="90" y="87.2" font-size="12" text-anchor="middle" fill="#1e293b">users</text><rect x="180" y="58" width="160" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="86.9" font-size="11" text-anchor="middle" fill="#1e293b">Route 53 + CloudFront</text><rect x="370" y="58" width="170" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="455" y="86.9" font-size="11" text-anchor="middle" fill="#1e293b">S3: React build</text><rect x="370" y="122" width="170" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="455" y="150.9" font-size="11" text-anchor="middle" fill="#1e293b">ALB / API Gateway</text><rect x="570" y="122" width="200" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="143.95" font-size="10.5" text-anchor="middle" fill="#1e293b">ECS Fargate (Node containers)</text><text x="670" y="157.45" font-size="10.5" text-anchor="middle" fill="#1e293b">or Lambda functions</text><line x1="154" y1="83" x2="176" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="344" y1="83" x2="366" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="300" y1="112" x2="380" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="544" y1="147" x2="566" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="206" width="176" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="118" y="232.9" font-size="11" text-anchor="middle" fill="#1e293b">RDS / Aurora Postgres</text><line x1="670" y1="176" x2="118" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-slate)"/><rect x="218" y="206" width="176" height="46" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="306" y="232.9" font-size="11" text-anchor="middle" fill="#1e293b">ElastiCache Redis</text><line x1="670" y1="176" x2="306" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-slate)"/><rect x="406" y="206" width="176" height="46" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="494" y="232.9" font-size="11" text-anchor="middle" fill="#1e293b">SQS / SNS / EventBridge</text><line x1="670" y1="176" x2="494" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-slate)"/><rect x="594" y="206" width="176" height="46" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/><text x="682" y="232.9" font-size="11" text-anchor="middle" fill="#1e293b">S3 uploads</text><line x1="670" y1="176" x2="682" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-slate)"/><rect x="30" y="270" width="360" height="106" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="210" y="305.9" font-size="11" text-anchor="middle" fill="#1e293b">Cross-cutting</text><text x="210" y="319.9" font-size="11" text-anchor="middle" fill="#1e293b">IAM roles (no keys in code), Secrets Manager / SSM</text><text x="210" y="333.9" font-size="11" text-anchor="middle" fill="#1e293b">CloudWatch logs + metrics + alarms, X-Ray traces</text><text x="210" y="347.9" font-size="11" text-anchor="middle" fill="#1e293b">VPC: public subnets (ALB), private (app, DB)</text><rect x="410" y="270" width="360" height="106" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="590" y="298.9" font-size="11" text-anchor="middle" fill="#1e293b">Infrastructure as Code</text><text x="590" y="312.9" font-size="11" text-anchor="middle" fill="#1e293b">Terraform, AWS CDK (TypeScript), CloudFormation,</text><text x="590" y="326.9" font-size="11" text-anchor="middle" fill="#1e293b">SAM / Serverless Framework for Lambda</text><text x="590" y="340.9" font-size="11" text-anchor="middle" fill="#1e293b">reviewed in PRs, applied by the pipeline</text><text x="590" y="354.9" font-size="11" text-anchor="middle" fill="#1e293b">same stack for staging and production</text></svg>