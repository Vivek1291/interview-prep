<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An event triggers a cold start that downloads code, starts Node and runs init code before the handler; warm invocations reuse the environment; measured init 87 ms unbundled, 85 ms bundled and 54 ms with lazy loading over 17 ms bare Node"><title>An event triggers a cold start that downloads code, starts Node and runs init code before the handler; warm invocations reuse the environment; measured init 87 ms unbundled, 85 ms bundled and 54 ms with lazy loading over 17 ms bare Node</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Lambda lifecycle and cold starts (measured init)</text><rect x="30" y="58" width="170" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="115" y="82.9" font-size="11" text-anchor="middle" fill="#1e293b">event source</text><text x="115" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">API Gateway, SQS,</text><text x="115" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">S3, EventBridge</text><rect x="230" y="58" width="250" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="355" y="82.9" font-size="11" text-anchor="middle" fill="#1e293b">COLD START (new environment)</text><text x="355" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">download code → start Node →</text><text x="355" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">run init code (requires, clients)</text><rect x="510" y="58" width="260" height="70" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640" y="82.9" font-size="11" text-anchor="middle" fill="#1e293b">handler(event, context)</text><text x="640" y="96.9" font-size="11" text-anchor="middle" fill="#1e293b">returns response / throws</text><text x="640" y="110.9" font-size="11" text-anchor="middle" fill="#1e293b">environment kept warm for reuse</text><line x1="204" y1="93" x2="226" y2="93" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="484" y1="93" x2="506" y2="93" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="640" y1="132" x2="640" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="510" y="150" width="260" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="640" y="173.9" font-size="11" text-anchor="middle" fill="#1e293b">next event: WARM → handler only</text><text x="400" y="214" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Measured locally: Node start + init + first call (median of 9)</text><text x="320" y="241" font-size="11.5" text-anchor="end" fill="#475569">bare node process</text><rect x="330" y="226" width="44.2" height="22" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="380.2" y="241" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">17 ms</text><text x="320" y="271" font-size="11.5" text-anchor="end" fill="#475569">init: S3 + DynamoDB + zod, unbundled</text><rect x="330" y="256" width="226.2" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="562.2" y="271" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">87 ms</text><text x="320" y="301" font-size="11.5" text-anchor="end" fill="#475569">same, esbuild bundle (1.2 MB vs 41 MB node_modules)</text><rect x="330" y="286" width="221" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="557" y="301" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">85 ms</text><text x="320" y="331" font-size="11.5" text-anchor="end" fill="#475569">lazy-load only what the handler needs</text><rect x="330" y="316" width="140.4" height="22" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="476.4" y="331" font-size="11.5" text-anchor="start" fill="#1e293b" font-weight="700">54 ms</text><text x="400" y="360" font-size="11" text-anchor="middle" fill="#475569">On Lambda the bundle also shrinks the package to download and unzip; init code runs once per environment, not per request.</text></svg>