<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Comparison of Lambda and containers by scaling, cost, limits, database connections, operations and good use cases"><title>Comparison of Lambda and containers by scaling, cost, limits, database connections, operations and good use cases</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Serverless vs containers for Node.js</text><text x="326" y="52" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Serverless (Lambda)</text><text x="624" y="52" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Containers (ECS/Fargate/K8s)</text><rect x="30" y="60" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="87.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Scaling</text><rect x="166" y="60" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="86.7" font-size="10.5" text-anchor="middle" fill="#1e293b">per request, to zero, automatic</text><rect x="492" y="60" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="86.7" font-size="10.5" text-anchor="middle" fill="#1e293b">tasks/pods: autoscaling rules, min &gt; 0</text><rect x="30" y="112" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Cost</text><rect x="166" y="112" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="138.7" font-size="10.5" text-anchor="middle" fill="#1e293b">pay per ms + requests: cheap when spiky/idle</text><rect x="492" y="112" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="138.7" font-size="10.5" text-anchor="middle" fill="#1e293b">pay for running capacity: cheaper at steady load</text><rect x="30" y="164" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="191.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Limits</text><rect x="166" y="164" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="190.7" font-size="10.5" text-anchor="middle" fill="#1e293b">15 min max, payload 6 MB, /tmp, cold starts</text><rect x="492" y="164" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="190.7" font-size="10.5" text-anchor="middle" fill="#1e293b">none of these: long jobs, WebSockets, big uploads</text><rect x="30" y="216" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="243.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Connections</text><rect x="166" y="216" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="235.95" font-size="10.5" text-anchor="middle" fill="#1e293b">many short-lived envs → DB connection storms</text><text x="326" y="249.45" font-size="10.5" text-anchor="middle" fill="#1e293b">(use RDS Proxy / HTTP data APIs)</text><rect x="492" y="216" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="242.7" font-size="10.5" text-anchor="middle" fill="#1e293b">normal long-lived pool per instance</text><rect x="30" y="268" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="295.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Ops</text><rect x="166" y="268" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="294.7" font-size="10.5" text-anchor="middle" fill="#1e293b">no servers, no patching, per-function deploys</text><rect x="492" y="268" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="294.7" font-size="10.5" text-anchor="middle" fill="#1e293b">images, cluster/service config, more control</text><rect x="30" y="320" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="347.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Good for</text><rect x="166" y="320" width="320" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="346.7" font-size="10.5" text-anchor="middle" fill="#1e293b">webhooks, cron, S3/SQS processing, glue, low-traffic APIs</text><rect x="492" y="320" width="278" height="46" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="631" y="346.7" font-size="10.5" text-anchor="middle" fill="#1e293b">steady APIs, WebSockets, heavy CPU, local parity</text></svg>