0" y2="154" stroke="#64748b" stroke-width="2"/><text x="620" y="168" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">800 ms</text><line x1="680" y1="146" x2="680" y2="154" stroke="#64748b" stroke-width="2"/><text x="680" y="168" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">900 ms</text><line x1="740" y1="146" x2="740" y2="154" stroke="#64748b" stroke-width="2"/><text x="740" y="168" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1000 ms</text><text x="130" y="154" font-size="12" text-anchor="end" fill="#475569" font-weight="700">keystrokes</text><circle cx="140" cy="150" r="7" fill="#0ea5e9"/><text x="140" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">n</text><circle cx="188" cy="150" r="7" fill="#0ea5e9"/><text x="188" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">no</text><circle cx="236" cy="150" r="7" fill="#0ea5e9"/><text x="236" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">nod</text><circle cx="284" cy="150" r="7" fill="#0ea5e9"/><text x="284" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">node</text><circle cx="332" cy="150" r="7" fill="#0ea5e9"/><text x="332" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">nodej</text><circle cx="596" cy="150" r="7" fill="#0ea5e9"/><text x="596" y="138" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">nodejs</text><line x1="140" y1="280" x2="750" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="140" y1="276" x2="140" y2="284" stroke="#64748b" stroke-width="2"/><text x="140" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0 ms</text><line x1="200" y1="276" x2="200" y2="284" stroke="#64748b" stroke-width="2"/><text x="200" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">100 ms</text><line x1="260" y1="276" x2="260" y2="284" stroke="#64748b" stroke-width="2"/><text x="260" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">200 ms</text><line x1="320" y1="276" x2="320" y2="284" stroke="#64748b" stroke-width="2"/><text x="320" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">300 ms</text><line x1="380" y1="276" x2="380" y2="284" stroke="#64748b" stroke-width="2"/><text x="380" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">400 ms</text><line x1="440" y1="276" x2="440" y2="284" stroke="#64748b" stroke-width="2"/><text x="440" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">500 ms</text><line x1="500" y1="276" x2="500" y2="284" stroke="#64748b" stroke-width="2"/><text x="500" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">600 ms</text><line x1="560" y1="276" x2="560" y2="284" stroke="#64748b" stroke-width="2"/><text x="560" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">700 ms</text><line x1="620" y1="276" x2="620" y2="284" stroke="#64748b" stroke-width="2"/><text x="620" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">800 ms</text><line x1="680" y1="276" x2="680" y2="284" stroke="#64748b" stroke-width="2"/><text x="680" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">900 ms</text><line x1="740" y1="276" x2="740" y2="284" stroke="#64748b" stroke-width="2"/><text x="740" y="298" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1000 ms</text><text x="130" y="284" font-size="12" text-anchor="end" fill="#475569" font-weight="700">fn runs</text><rect x="332" y="190" width="180" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="422" y="210" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">wait 300 ms of silence</text><circle cx="512" cy="280" r="7" fill="#10b981"/><text x="512" y="268" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">search(&quot;nodej&quot;)</text><rect x="596" y="190" width="144" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="668" y="210" font-size="12" text-anchor="middle" fill="#f59e0b" font-weight="700">runs at 1060 ms</text><text x="400" y="350" font-size="13" text-anchor="middle" fill="#475569">Every new call CANCELS the pending timer and starts a new one → only the last call of a burst runs.</text><text x="400" y="374" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">6 keystrokes → 2 API calls (one after each pause), instead of 6.</text></svg>