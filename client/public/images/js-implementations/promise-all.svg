<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Three promises finish at different times; the result array is A B C in input order"><title>Three promises finish at different times; the result array is A B C in input order</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Promise.all: wait for every promise, keep the input order</text><line x1="140" y1="330" x2="750" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="140" y1="326" x2="140" y2="334" stroke="#64748b" stroke-width="2"/><text x="140" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0 ms</text><line x1="260" y1="326" x2="260" y2="334" stroke="#64748b" stroke-width="2"/><text x="260" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">200 ms</text><line x1="380" y1="326" x2="380" y2="334" stroke="#64748b" stroke-width="2"/><text x="380" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">400 ms</text><line x1="500" y1="326" x2="500" y2="334" stroke="#64748b" stroke-width="2"/><text x="500" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">600 ms</text><line x1="620" y1="326" x2="620" y2="334" stroke="#64748b" stroke-width="2"/><text x="620" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">800 ms</text><line x1="740" y1="326" x2="740" y2="334" stroke="#64748b" stroke-width="2"/><text x="740" y="348" font-size="10" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1000 ms</text><text x="120" y="105" font-size="14" text-anchor="end" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p0</text><line x1="140" y1="100" x2="500" y2="100" stroke="#0ea5e9" stroke-width="4"/><circle cx="500" cy="100" r="7" fill="#10b981"/><text x="500" y="88" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><text x="120" y="165" font-size="14" text-anchor="end" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p1</text><line x1="140" y1="160" x2="260" y2="160" stroke="#0ea5e9" stroke-width="4"/><circle cx="260" cy="160" r="7" fill="#10b981"/><text x="260" y="148" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><text x="120" y="225" font-size="14" text-anchor="end" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p2</text><line x1="140" y1="220" x2="680" y2="220" stroke="#0ea5e9" stroke-width="4"/><circle cx="680" cy="220" r="7" fill="#10b981"/><text x="680" y="208" font-size="11" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><line x1="680" y1="80" x2="680" y2="300" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/><text x="672" y="230" font-size="12" text-anchor="end" fill="#10b981" font-weight="700">all done → resolve</text><text x="150" y="277" font-size="13" text-anchor="end" fill="#475569" font-weight="700">result</text><rect x="160" y="255" width="50" height="34" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="185" y="277.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="210" y="255" width="50" height="34" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="235" y="277.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><rect x="260" y="255" width="50" height="34" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="285" y="277.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><text x="560" y="262" font-size="12" text-anchor="middle" fill="#475569">results keep INPUT order,</text><text x="560" y="280" font-size="12" text-anchor="middle" fill="#475569">not finishing order</text><text x="400" y="375" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">If any promise rejects → Promise.all rejects immediately with that error (fail fast).</text></svg>