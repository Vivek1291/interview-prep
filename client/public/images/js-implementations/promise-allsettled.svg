<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Each promise becomes an object with status fulfilled and value, or rejected and reason"><title>Each promise becomes an object with status fulfilled and value, or rejected and reason</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Promise.allSettled: an outcome for every promise</text><rect x="80" y="100" width="80" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="126.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p0</text><line x1="160" y1="122" x2="300" y2="122" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="305" y="100" width="420" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="515" y="126.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ status: &quot;fulfilled&quot;, value: 42 }</text><rect x="80" y="170" width="80" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="196.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p1</text><line x1="160" y1="192" x2="300" y2="192" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><rect x="305" y="170" width="420" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="515" y="196.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ status: &quot;rejected&quot;, reason: Error(&quot;timeout&quot;) }</text><rect x="80" y="240" width="80" height="44" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="120" y="266.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">p2</text><line x1="160" y1="262" x2="300" y2="262" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><rect x="305" y="240" width="420" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="515" y="266.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">{ status: &quot;fulfilled&quot;, value: &quot;ok&quot; }</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#475569">Never rejects: waits for EVERY promise and reports each outcome, in input order.</text><text x="400" y="364" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Use it for &quot;load all widgets, show what worked and what failed&quot;.</text></svg>