<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="A call checks the cache by key; a hit returns the stored value, a miss computes and stores it"><title>A call checks the cache by key; a hit returns the stored value, a miss computes and stores it</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">memoize(fn): cache results by arguments</text><rect x="60" y="160" width="140" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="130" y="189.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">memoFib(40)</text><line x1="200" y1="185" x2="300" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="305" y="150" width="170" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="390" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b">key = &quot;40&quot;</text><text x="390" y="197.6" font-size="13" text-anchor="middle" fill="#1e293b">in cache?</text><line x1="475" y1="165" x2="590" y2="110" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="532.5" y="131.5" font-size="12" text-anchor="middle" fill="#475569">hit → return</text><line x1="475" y1="205" x2="590" y2="270" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><text x="532.5" y="231.5" font-size="12" text-anchor="middle" fill="#475569">miss → compute</text><rect x="595" y="85" width="150" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="114.9" font-size="14" text-anchor="middle" fill="#1e293b">cached value</text><rect x="595" y="245" width="150" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="670" y="266.6" font-size="13" text-anchor="middle" fill="#1e293b">fn(...args)</text><text x="670" y="282.6" font-size="13" text-anchor="middle" fill="#1e293b">then store</text><path d="M670 245 Q570 172.5 470 220" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-slate)"/><text x="570" y="194.5" font-size="12" text-anchor="middle" fill="#475569">cache.set</text><text x="400" y="340" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">fib(40): 331,160,281 calls without memo → 41 calls with memo.</text><text x="400" y="364" font-size="12" text-anchor="middle" fill="#475569">Only for PURE functions (same input → same output). Bound the cache (LRU) in long-lived apps.</text></svg>