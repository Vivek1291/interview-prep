troke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">LRU Cache: hash map + doubly linked list</text><text x="120" y="102" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">Map key → node</text><rect x="60" y="110" width="60" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="90" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">key</text><rect x="120" y="110" width="60" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="150" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">node</text><rect x="60" y="140" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="90" y="159.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><rect x="120" y="140" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="150" y="159.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">●</text><rect x="60" y="170" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="90" y="189.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><rect x="120" y="170" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="150" y="189.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">●</text><rect x="60" y="200" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="90" y="219.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">c</text><rect x="120" y="200" width="60" height="30" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="150" y="219.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">●</text><rect x="260" y="140" width="70" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="295" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">head</text><rect x="370" y="140" width="70" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="405" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">c</text><rect x="470" y="140" width="70" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="505" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><rect x="570" y="140" width="70" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="605" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><rect x="670" y="140" width="70" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="705" y="164.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">tail</text><line x1="330" y1="154" x2="368" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="368" y1="168" x2="332" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="440" y1="154" x2="478" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="478" y1="168" x2="442" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="540" y1="154" x2="578" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="578" y1="168" x2="542" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="640" y1="154" x2="678" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="678" y1="168" x2="642" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="405" y="125" font-size="11" text-anchor="middle" fill="#10b981" font-weight="700">most recent</text><text x="605" y="125" font-size="11" text-anchor="middle" fill="#ef4444" font-weight="700">least recent</text><text x="400" y="240" font-size="13" text-anchor="middle" fill="#475569">get(key): Map lookup O(1) → move the node to the front</text><text x="400" y="264" font-size="13" text-anchor="middle" fill="#475569">put(key): insert at the front; if over capacity → remove the node before the tail (O(1))</text><text x="400" y="310" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Map finds the node, the doubly linked list keeps the order → every operation O(1).</text><text x="400" y="344" font-size="12" text-anchor="middle" fill="#475569">JS shortcut: a Map keeps insertion order → delete + set moves a key to the end.</text></svg>