<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="An object with nested address and tags and a self cycle is copied into new objects via a WeakMap"><title>An object with nested address and tags and a self cycle is copied into new objects via a WeakMap</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">deepClone: copy every level, remember what was copied</text><rect x="80" y="100" width="150" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="155" y="126.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">user</text><rect x="60" y="210" width="90" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="105" y="234.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">address</text><rect x="170" y="210" width="80" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="210" y="234.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">tags[]</text><line x1="130" y1="144" x2="105" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="180" y1="144" x2="205" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="155" y="92" font-size="11" text-anchor="middle" fill="#ef4444" font-weight="700">user.self → user (a cycle)</text><rect x="560" y="100" width="150" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="635" y="126.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">user'</text><rect x="540" y="210" width="90" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="585" y="234.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">address'</text><rect x="650" y="210" width="80" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="690" y="234.9" font-size="14" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">tags'[]</text><line x1="610" y1="144" x2="585" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="660" y1="144" x2="685" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="102" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">WeakMap seen</text><rect x="330" y="110" width="70" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="365" y="127.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">original</text><rect x="400" y="110" width="70" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="435" y="127.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">copy</text><rect x="330" y="136" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="365" y="153.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">user</text><rect x="400" y="136" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="435" y="153.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">user'</text><rect x="330" y="162" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="365" y="179.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">address</text><rect x="400" y="162" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="435" y="179.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">address'</text><rect x="330" y="188" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="365" y="205.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">tags</text><rect x="400" y="188" width="70" height="26" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="435" y="205.6" font-size="13" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">tags'</text><text x="400" y="300" font-size="12" text-anchor="middle" fill="#475569">Recursively copy every object/array; a WeakMap original → copy handles cycles and shared references.</text><text x="400" y="322" font-size="12" text-anchor="middle" fill="#475569">Special cases: Date, Map, Set, RegExp. Functions are usually copied by reference.</text><text x="400" y="360" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">Shallow copy ({ ...obj }) shares nested objects → changing copy.address changes the original!</text></svg>