<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Hooks"><title>Hooks</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Routines tied to each door</text><rect x="40" y="75" width="330" height="190" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="205" y="174.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="205" y="98" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">FRONT DOOR: doc.save()</text><rect x="60" y="110" width="290" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="205" y="129.2" font-size="12" text-anchor="middle" fill="#1e293b">pre validate</text><rect x="60" y="147" width="290" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="205" y="166.2" font-size="12" text-anchor="middle" fill="#1e293b">pre save: hash password, slug</text><rect x="60" y="184" width="290" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205" y="203.2" font-size="12" text-anchor="middle" fill="#1e293b">write</text><rect x="60" y="221" width="290" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="205" y="240.2" font-size="12" text-anchor="middle" fill="#1e293b">post save: enqueue email</text><rect x="430" y="75" width="340" height="190" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600" y="174.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="600" y="98" font-size="13" text-anchor="middle" fill="#f59e0b" font-weight="700">SIDE DOOR: findOneAndUpdate()</text><rect x="450" y="115" width="300" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600" y="136.2" font-size="12" text-anchor="middle" fill="#1e293b">pre findOneAndUpdate: hash in getUpdate()</text><rect x="450" y="160" width="300" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="600" y="181.2" font-size="12" text-anchor="middle" fill="#1e293b">write</text><rect x="450" y="205" width="300" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="600" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">post findOneAndUpdate</text><rect x="40" y="285" width="730" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="405" y="309.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Save hooks never run for update queries → password hashed only in pre save = plain text via updateOne</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Mongoose 9: async hooks, no next() · this = document (save) or query (find/update)</text></svg>