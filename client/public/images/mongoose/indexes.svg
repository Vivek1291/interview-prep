<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Indexes in Mongoose"><title>Indexes in Mongoose</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Catalogues written on the blueprint, built as a planned job</text><rect x="40" y="80" width="250" height="160" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="165" y="134.2" font-size="12" text-anchor="middle" fill="#1e293b">SCHEMA</text><text x="165" y="149.2" font-size="12" text-anchor="middle" fill="#1e293b">email: unique</text><text x="165" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b">userId: index</text><text x="165" y="179.2" font-size="12" text-anchor="middle" fill="#1e293b">createdAt: expires 30d</text><text x="165" y="194.2" font-size="12" text-anchor="middle" fill="#1e293b">index({ userId, type, createdAt })</text><rect x="360" y="80" width="180" height="60" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="450" y="106.7" font-size="12" text-anchor="middle" fill="#1e293b">dev: autoIndex</text><text x="450" y="121.7" font-size="12" text-anchor="middle" fill="#1e293b">on first use</text><rect x="360" y="175" width="180" height="65" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="450" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">prod: deploy script</text><text x="450" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">diffIndexes → review</text><text x="450" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b">→ syncIndexes</text><rect x="600" y="120" width="170" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="685" y="151.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">indexes in</text><text x="685" y="167.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">MongoDB</text><line x1="290" y1="120" x2="356" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="290" y1="200" x2="356" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="540" y1="110" x2="596" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="540" y1="205" x2="596" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="40" y="275" width="730" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="405" y="299.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">syncIndexes also DROPS undeclared indexes (e.g. one added by hand) · check the diff first</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">unique on data with duplicates → build fails: clean up first</text></svg>