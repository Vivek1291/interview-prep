<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Timestamps"><title>Timestamps</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One world clock in storage, local clocks on screen</text><rect x="40" y="90" width="200" height="110" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="140" y="133.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">createdAt</text><text x="140" y="149.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">updatedAt</text><text x="140" y="165.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(set by Mongoose)</text><rect x="300" y="110" width="220" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="410" y="141.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2026-09-30T04:15:00Z</text><text x="410" y="156.7" font-size="12" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">(UTC in MongoDB + API)</text><rect x="580" y="70" width="190" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="675" y="99.6" font-size="13" text-anchor="middle" fill="#1e293b">India: 09:45</text><rect x="580" y="140" width="190" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="675" y="169.6" font-size="13" text-anchor="middle" fill="#1e293b">New York: 00:15</text><rect x="580" y="210" width="190" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="675" y="239.6" font-size="13" text-anchor="middle" fill="#1e293b">London: 05:15</text><line x1="240" y1="145" x2="296" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="520" y1="135" x2="576" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="520" y1="145" x2="576" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="520" y1="160" x2="576" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="40" y="270" width="480" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="280" y="296.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Reports: 20:00 UTC on 30 Sept = 1 Oct in India → pass a timezone</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">{ timestamps: false } on a view counter keeps updatedAt meaningful</text></svg>