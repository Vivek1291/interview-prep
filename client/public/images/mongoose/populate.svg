<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="populate"><title>populate</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">One call with a list of ids, not one call per post</text><rect x="30" y="80" width="170" height="200" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="115" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">posts (100)</text><text x="115" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">author: u4</text><text x="115" y="176.7" font-size="12" text-anchor="middle" fill="#1e293b">author: u9</text><text x="115" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b">author: u4</text><text x="115" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b">author: u17</text><text x="115" y="221.7" font-size="12" text-anchor="middle" fill="#1e293b">…</text><rect x="270" y="75" width="230" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="385" y="116.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">N+1: findById × 100</text><text x="385" y="132.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">101 queries · 29 ms</text><rect x="270" y="190" width="230" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="385" y="224.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">populate: users.find(</text><text x="385" y="239.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">{ _id: { $in: [ids] } })</text><text x="385" y="254.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">2 queries · 1.7 ms</text><rect x="570" y="190" width="200" height="90" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="670" y="231.7" font-size="12" text-anchor="middle" fill="#1e293b">stitch in Node:</text><text x="670" y="246.7" font-size="12" text-anchor="middle" fill="#1e293b">post.author = { name }</text><line x1="200" y1="120" x2="266" y2="120" stroke="#ef4444" stroke-width="2" marker-end="url(#a-red)"/><line x1="200" y1="235" x2="266" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><line x1="500" y1="235" x2="566" y2="235" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/><rect x="570" y="75" width="200" height="90" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="670" y="109.2" font-size="12" text-anchor="middle" fill="#1e293b">$lookup: 1 aggregation</text><text x="670" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">2.1 ms · can filter</text><text x="670" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">by joined fields</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">populate = application-side join · select only the fields the UI needs</text></svg>