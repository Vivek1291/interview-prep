<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Virtuals"><title>Virtuals</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Age is worked out from the stored birth date each time</text><rect x="40" y="90" width="230" height="130" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="155" y="135.6" font-size="13" text-anchor="middle" fill="#1e293b">STORED</text><text x="155" y="151.6" font-size="13" text-anchor="middle" fill="#1e293b">firstName: Asha</text><text x="155" y="167.6" font-size="13" text-anchor="middle" fill="#1e293b">lastName: Rao</text><text x="155" y="183.6" font-size="13" text-anchor="middle" fill="#1e293b">birthDate: 1994-03-15</text><rect x="330" y="70" width="200" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="430" y="99.2" font-size="12" text-anchor="middle" fill="#1e293b">fullName → &quot;Asha Rao&quot;</text><rect x="330" y="135" width="200" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="430" y="164.2" font-size="12" text-anchor="middle" fill="#1e293b">age → 32 (today)</text><rect x="330" y="200" width="200" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="430" y="229.2" font-size="12" text-anchor="middle" fill="#1e293b">posts → from posts.author</text><line x1="270" y1="130" x2="326" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="270" y1="155" x2="326" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="270" y1="180" x2="326" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="580" y="70" width="190" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="675" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b">in JSON only with</text><text x="675" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">toJSON: { virtuals: true }</text><rect x="580" y="165" width="190" height="85" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="675" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">find({ fullName })</text><text x="675" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">→ 0 results</text><text x="675" y="226.7" font-size="12" text-anchor="middle" fill="#1e293b">(not stored)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Need to sort or filter by it? Store a computed field instead</text></svg>