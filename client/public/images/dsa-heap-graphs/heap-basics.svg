<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Min-heap with root 1 drawn as a tree and as the array 1 3 2 7 5 4"><title>Min-heap with root 1 drawn as a tree and as the array 1 3 2 7 5 4</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Heap: a complete binary tree stored in an array</text><line x1="185.9" y1="114.1" x2="136.3" y2="163.7" stroke="#64748b" stroke-width="2"/><line x1="214.1" y1="114.1" x2="263.7" y2="163.7" stroke="#64748b" stroke-width="2"/><line x1="111.1" y1="197.9" x2="90.3" y2="239.4" stroke="#64748b" stroke-width="2"/><line x1="128.9" y1="197.9" x2="149.7" y2="239.4" stroke="#64748b" stroke-width="2"/><line x1="271.1" y1="197.9" x2="250.3" y2="239.4" stroke="#64748b" stroke-width="2"/><circle cx="200" cy="100" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="200" y="105" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="120" cy="180" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="120" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><circle cx="280" cy="180" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="280" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="80" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="80" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">7</text><circle cx="160" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="160" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><circle cx="240" cy="260" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="240" y="265" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">4</text><text x="200" y="310" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">min-heap: every parent ≤ its children</text><text x="410" y="137" font-size="13" text-anchor="end" fill="#475569" font-weight="700">array</text><rect x="420" y="110" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="446" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="446" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="472" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="498" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="498" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="524" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="550" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="550" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="576" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="602" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><text x="602" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="628" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="654" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="654" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="680" y="110" width="52" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="706" y="137.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="706" y="169" font-size="11" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="560" y="200" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">node i → children 2i + 1 and 2i + 2</text><text x="560" y="222" font-size="13" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">parent of i → (i − 1) &gt;&gt; 1</text><text x="560" y="262" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">peek O(1) · push / pop O(log n)</text><text x="560" y="290" font-size="12" text-anchor="middle" fill="#475569">push: add at the end, bubble UP</text><text x="560" y="310" font-size="12" text-anchor="middle" fill="#475569">pop: move last to the root, sift DOWN</text><text x="400" y="370" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">Kth largest: keep a min-heap of size k → its top is the kth largest.</text></svg>