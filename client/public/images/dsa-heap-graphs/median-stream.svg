<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Max-heap 5 1 3 and min-heap 8 15; the median is the top of the larger heap, 5"><title>Max-heap 5 1 3 and min-heap 8 15; the median is the top of the larger heap, 5</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Find Median from Data Stream: two heaps</text><text x="400" y="66" font-size="14" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">stream so far: 5, 15, 1, 3, 8</text><line x1="208.4" y1="156.3" x2="183.4" y2="191.3" stroke="#64748b" stroke-width="2"/><line x1="231.6" y1="156.3" x2="256.6" y2="191.3" stroke="#64748b" stroke-width="2"/><circle cx="220" cy="140" r="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="220" y="145" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">5</text><circle cx="170" cy="210" r="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="170" y="215" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="270" cy="210" r="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="270" y="215" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><line x1="571.6" y1="156.3" x2="596.6" y2="191.3" stroke="#64748b" stroke-width="2"/><circle cx="560" cy="140" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="560" y="145" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">8</text><circle cx="610" cy="210" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="610" y="215" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">15</text><text x="220" y="100" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700">low = MAX-heap (smaller half)</text><text x="580" y="100" font-size="13" text-anchor="middle" fill="#0ea5e9" font-weight="700">high = MIN-heap (bigger half)</text><rect x="330" y="250" width="140" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="400" y="276.9" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="700">median = 5</text><text x="400" y="320" font-size="13" text-anchor="middle" fill="#475569">Keep sizes equal (or low one bigger). Odd count → top of low.</text><text x="400" y="342" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">Even count → average of the two tops. add O(log n), findMedian O(1).</text></svg>