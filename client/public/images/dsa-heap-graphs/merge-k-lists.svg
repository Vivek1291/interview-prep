<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Three sorted lists; their heads 1 1 2 sit in a min-heap"><title>Three sorted lists; their heads 1 1 2 sit in a min-heap</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Merge K Sorted Lists with a min-heap</text><rect x="70" y="80" width="54" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="97" y="103.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><line x1="124" y1="98" x2="155" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="158" y="80" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="185" y="103.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><line x1="212" y1="98" x2="243" y2="98" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="246" y="80" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="273" y="103.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="70" y="150" width="54" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="97" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><line x1="124" y1="168" x2="155" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="158" y="150" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="185" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><line x1="212" y1="168" x2="243" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="246" y="150" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="273" y="173.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="70" y="220" width="54" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="97" y="243.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><line x1="124" y1="238" x2="155" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="158" y="220" width="54" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="185" y="243.3" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><text x="60" y="103" font-size="12" text-anchor="end" fill="#475569" font-weight="700">list 1</text><text x="60" y="173" font-size="12" text-anchor="end" fill="#475569" font-weight="700">list 2</text><text x="60" y="243" font-size="12" text-anchor="end" fill="#475569" font-weight="700">list 3</text><line x1="547" y1="125.2" x2="515" y2="162.5" stroke="#64748b" stroke-width="2"/><line x1="573" y1="125.2" x2="605" y2="162.5" stroke="#64748b" stroke-width="2"/><circle cx="560" cy="110" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="560" y="115" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="500" cy="180" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="500" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="620" cy="180" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="620" y="185" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><text x="560" y="70" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">min-heap of the k heads</text><line x1="360" y1="160" x2="470" y2="160" stroke="#10b981" stroke-width="2" marker-end="url(#a-green)"/><text x="415" y="154" font-size="12" text-anchor="middle" fill="#475569">push heads</text><text x="400" y="300" font-size="13" text-anchor="middle" fill="#475569">Pop the smallest head, append it to the result, push its next node.</text><text x="400" y="324" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">The heap never holds more than k nodes → O(N log k) for N total nodes.</text></svg>