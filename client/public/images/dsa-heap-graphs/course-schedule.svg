<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Course 0 before 1 and 2, both before 3; topological order 0 1 2 3"><title>Course 0 before 1 and 2, both before 3; topological order 0 1 2 3</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Course Schedule: topological order by in-degree</text><line x1="139.2" y1="124.5" x2="237.9" y2="96.3" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="137.9" y1="138.9" x2="239.4" y2="189.7" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="278.4" y1="97.9" x2="378.9" y2="140.9" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="278.8" y1="193.3" x2="378.3" y2="157.7" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><circle cx="120" cy="130" r="20" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="120" y="135" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">0</text><circle cx="260" cy="90" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="260" y="95" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">1</text><circle cx="260" cy="200" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="260" y="205" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">2</text><circle cx="400" cy="150" r="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="400" y="155" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="700">3</text><text x="120" y="175" font-size="12" text-anchor="middle" fill="#10b981" font-weight="700">in 0</text><text x="260" y="70" font-size="12" text-anchor="middle" fill="#475569">in 1</text><text x="260" y="245" font-size="12" text-anchor="middle" fill="#475569">in 1</text><text x="400" y="195" font-size="12" text-anchor="middle" fill="#475569">in 2</text><text x="260" y="290" font-size="13" text-anchor="middle" fill="#475569">edge a → b = &quot;take a before b&quot;</text><text x="600" y="100" font-size="14" text-anchor="middle" fill="#475569" font-weight="700">Kahn's algorithm</text><text x="600" y="126" font-size="12" text-anchor="middle" fill="#475569">queue all in-degree 0 courses</text><text x="600" y="146" font-size="12" text-anchor="middle" fill="#475569">take one, lower its neighbours</text><text x="600" y="166" font-size="12" text-anchor="middle" fill="#475569">in-degree; 0 → enqueue</text><text x="470" y="227" font-size="13" text-anchor="end" fill="#475569" font-weight="700">order</text><rect x="480" y="200" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="506" y="227.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="532" y="200" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="558" y="227.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="584" y="200" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="610" y="227.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="636" y="200" width="52" height="44" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="662" y="227.6" font-size="16" text-anchor="middle" fill="#1e293b" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="600" y="290" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">processed all 4 → possible ✅</text><text x="600" y="312" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">fewer than n → a cycle ❌</text><text x="400" y="370" font-size="13" text-anchor="middle" fill="#6366f1" font-weight="700">O(V + E) time and space.</text></svg>