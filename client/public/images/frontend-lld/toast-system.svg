<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Toast system: global store, queue with priority, Toaster"><title>Toast system: global store, queue with priority, Toaster</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Toast system: global store, queue with priority, Toaster</text><line x1="150" y1="195" x2="197" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="330" y1="195" x2="455" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="330" y1="195" x2="455" y2="237" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="392.5" y="210" font-size="11" text-anchor="middle" fill="#475569">full</text><line x1="530" y1="123" x2="577" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="645" y1="146" x2="645" y2="237" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="455" y1="240" x2="455" y2="149" stroke="#f59e0b" stroke-width="2" marker-end="url(#a-amber)"/><text x="419" y="188.5" font-size="11" text-anchor="middle" fill="#475569">promote</text><rect x="20" y="170" width="130" height="50" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="85" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">toast.error()</text><text x="85" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">(any code)</text><rect x="200" y="170" width="130" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="265" y="191.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">toastStore</text><text x="265" y="206.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">subscribe()</text><rect x="380" y="100" width="150" height="46" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="455" y="127.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">visible (max 3)</text><rect x="380" y="240" width="150" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="455" y="267.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">queue: error &gt; info</text><rect x="580" y="100" width="130" height="46" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="645" y="119.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Toaster</text><text x="645" y="134.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">useSyncExternalStore</text><rect x="580" y="240" width="130" height="50" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="645" y="261.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">ToastItem</text><text x="645" y="276.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">timer pauses</text><text x="400" y="359" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Duplicates merge (×3) · role=&quot;alert&quot; for errors, role=&quot;status&quot; otherwise</text><text x="400" y="377" font-size="12" text-anchor="middle" fill="#475569">Close or timeout → dismiss → next queued toast is promoted · hover pauses</text></svg>