<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Aggregation pipeline"><title>Aggregation pipeline</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A conveyor belt: filter, bin, relabel, line up, keep the top</text><rect x="20" y="150" width="110" height="70" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="75" y="181.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">1M orders</text><text x="75" y="197.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">(raw)</text><rect x="150" y="140" width="105" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="202.5" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b">$match</text><text x="202.5" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="202.5" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">throw away</text><text x="202.5" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">not PAID</text><line x1="130" y1="185" x2="146" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="270" y="140" width="105" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="322.5" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b">$group</text><text x="322.5" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="322.5" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">bins by month</text><text x="322.5" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">sum totals</text><line x1="250" y1="185" x2="266" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="390" y="140" width="105" height="90" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="442.5" y="166.7" font-size="12" text-anchor="middle" fill="#1e293b">$project</text><text x="442.5" y="181.7" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="442.5" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">relabel</text><text x="442.5" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">fields</text><line x1="370" y1="185" x2="386" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="510" y="140" width="105" height="90" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="562.5" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b">$sort</text><text x="562.5" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="562.5" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">line up</text><line x1="490" y1="185" x2="506" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="630" y="140" width="105" height="90" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="682.5" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b">$limit</text><text x="682.5" y="189.2" font-size="12" text-anchor="middle" fill="#1e293b"></text><text x="682.5" y="204.2" font-size="12" text-anchor="middle" fill="#1e293b">keep top N</text><line x1="610" y1="185" x2="626" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="20" y1="245" x2="780" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><text x="400" y="265" font-size="12" text-anchor="middle" fill="#475569">conveyor belt inside the database</text><rect x="160" y="290" width="230" height="44" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="275" y="316.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">pipeline: 317 ms → 12 rows</text><rect x="410" y="290" width="240" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="530" y="316.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">ship 250k docs to Node: 851 ms</text><text x="400" y="115" font-size="12.5" text-anchor="middle" fill="#6366f1" font-weight="700">filter first so the index helps and later workers see fewer boxes</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">$match after $group = HAVING · $sort + $limit = top-k</text></svg>