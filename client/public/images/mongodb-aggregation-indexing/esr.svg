"165" width="170" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="685" y="186.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">50,000 keys · 18 ms</text><text x="685" y="201.7" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">+ in-memory SORT</text><rect x="40" y="255" width="340" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="210" y="281.7" font-size="12" text-anchor="middle" fill="#1e293b">Prefix rule: { city, surname, first }</text><text x="210" y="296.7" font-size="12" text-anchor="middle" fill="#1e293b">serves city · city+surname · all three</text><rect x="420" y="255" width="350" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="595" y="281.7" font-size="12" text-anchor="middle" fill="#1e293b">but not &quot;first name only&quot;</text><text x="595" y="296.7" font-size="12" text-anchor="middle" fill="#1e293b">→ COLLSCAN</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Same query: PAID, total ≥ 4000, newest first, limit 20 on 1M orders</text></svg>