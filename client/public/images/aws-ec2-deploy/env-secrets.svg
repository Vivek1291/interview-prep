<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Environment variables and secrets"><title>Environment variables and secrets</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A locked key cabinet only the building can open</text><rect x="30" y="90" width="200" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="130" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">SSM Parameter Store</text><text x="130" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">/fullstack-app/prod/*</text><text x="130" y="169.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">SecureString (KMS)</text><rect x="300" y="70" width="200" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="101.7" font-size="12" text-anchor="middle" fill="#1e293b">fetch-env.sh</text><text x="400" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">→ .env (chmod 600)</text><rect x="300" y="165" width="200" height="70" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="400" y="196.7" font-size="12" text-anchor="middle" fill="#1e293b">SDK at startup</text><text x="400" y="211.7" font-size="12" text-anchor="middle" fill="#1e293b">(paged, 10 per call)</text><rect x="570" y="115" width="200" height="80" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="670" y="144.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">Zod validation</text><text x="670" y="159.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">missing or weak →</text><text x="670" y="174.2" font-size="12" text-anchor="middle" fill="#1e293b" font-weight="700">exit 1 (names only)</text><line x1="230" y1="130" x2="296" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="230" y1="170" x2="296" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="105" x2="566" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><line x1="500" y1="200" x2="566" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a-slate)"/><rect x="30" y="260" width="470" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="265" y="284.2" font-size="12" text-anchor="middle" fill="#1e293b">EC2 instance role: ssm:GetParametersByPath + kms:Decrypt (no access keys)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">VITE_* values are public: they ship inside the browser bundle</text></svg>