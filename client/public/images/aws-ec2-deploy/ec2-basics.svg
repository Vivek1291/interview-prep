<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="EC2 basics"><title>EC2 basics</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">Renting a computer: pick its size, OS, disk and open doors</text><rect x="30" y="75" width="330" height="230" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="195" y="194.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="195" y="98" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">EC2 instance (you manage)</text><rect x="50" y="112" width="290" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="195" y="134.2" font-size="12" text-anchor="middle" fill="#1e293b">AMI: Ubuntu 24.04 / AL2023</text><rect x="50" y="158" width="290" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="195" y="180.2" font-size="12" text-anchor="middle" fill="#1e293b">type: t3.small · 2 vCPU · 2 GiB</text><rect x="50" y="204" width="290" height="36" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="195" y="226.2" font-size="12" text-anchor="middle" fill="#1e293b">EBS: 20 GiB gp3 disk</text><rect x="50" y="250" width="290" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="195" y="272.2" font-size="12" text-anchor="middle" fill="#1e293b">Node 22 · Nginx · PM2 / Docker</text><rect x="420" y="85" width="350" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="595" y="110.6" font-size="13" text-anchor="middle" fill="#1e293b">security group = firewall</text><rect x="420" y="140" width="350" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="595" y="165.6" font-size="13" text-anchor="middle" fill="#1e293b">IAM role = keys without keys</text><rect x="420" y="195" width="350" height="42" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="595" y="220.6" font-size="13" text-anchor="middle" fill="#1e293b">user data = first-boot script</text><rect x="420" y="250" width="350" height="42" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="595" y="275.6" font-size="13" text-anchor="middle" fill="#1e293b">Elastic IP = fixed address</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">AWS runs the hardware; you run the OS, runtime, app and patches</text></svg>