<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Monitoring"><title>Monitoring</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A dashboard, a trip log and warning lights that call someone</text><rect x="30" y="75" width="230" height="120" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="145" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">METRICS</text><text x="145" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">CPU · memory · disk (agent)</text><text x="145" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">p95 latency · 5xx</text><text x="145" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">event-loop delay</text><rect x="285" y="75" width="230" height="120" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="400" y="116.7" font-size="12" text-anchor="middle" fill="#1e293b">LOGS</text><text x="400" y="131.7" font-size="12" text-anchor="middle" fill="#1e293b">pino JSON · request id</text><text x="400" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">authorization: [Redacted]</text><text x="400" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">→ CloudWatch Logs</text><rect x="540" y="75" width="230" height="120" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="655" y="124.2" font-size="12" text-anchor="middle" fill="#1e293b">ALARMS → SNS</text><text x="655" y="139.2" font-size="12" text-anchor="middle" fill="#1e293b">CPU &gt; 80% · 5xx &gt; 10</text><text x="655" y="154.2" font-size="12" text-anchor="middle" fill="#1e293b">p95 &gt; 0.5 s · disk &gt; 85%</text><rect x="120" y="230" width="560" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400" y="256.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">one 300 ms CPU-bound request → event-loop delay 302 ms,</text><text x="400" y="272.6" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="700">a /health check waited 283 ms</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Alert on what users feel (latency, errors) first, causes second</text></svg>