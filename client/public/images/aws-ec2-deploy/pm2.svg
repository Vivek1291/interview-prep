<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="PM2 restart vs reload"><title>PM2 restart vs reload</title><defs><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14b8a6"/></marker></defs><rect x="1" y="1" width="798" height="398" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/><text x="400" y="32" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="700">A manager swapping cashiers one lane at a time</text><rect x="30" y="80" width="340" height="190" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="200" y="179.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="200" y="103" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="700">pm2 restart: all at once</text><rect x="60" y="125" width="120" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="120" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">worker</text><text x="120" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">stopped</text><rect x="210" y="125" width="120" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="270" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">worker</text><text x="270" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">stopped</text><text x="200" y="215" font-size="15" text-anchor="middle" fill="#ef4444" font-weight="700">10,532 failed requests</text><text x="200" y="245" font-size="12" text-anchor="middle" fill="#475569">(under load, 2 workers)</text><rect x="430" y="80" width="340" height="190" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="600" y="179.9" font-size="14" text-anchor="middle" fill="#1e293b"></text><text x="600" y="103" font-size="13" text-anchor="middle" fill="#10b981" font-weight="700">pm2 reload: one at a time</text><rect x="460" y="125" width="120" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="520" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">new worker</text><text x="520" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">listening</text><rect x="610" y="125" width="120" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="670" y="146.7" font-size="12" text-anchor="middle" fill="#1e293b">old worker</text><text x="670" y="161.7" font-size="12" text-anchor="middle" fill="#1e293b">draining</text><text x="600" y="215" font-size="15" text-anchor="middle" fill="#10b981" font-weight="700">0 failed requests</text><text x="600" y="245" font-size="12" text-anchor="middle" fill="#475569">(52,647 requests served)</text><text x="400" y="368" font-size="12" text-anchor="middle" fill="#6366f1" font-weight="700">Cluster: 1 → 2 → 4 workers = 4,744 → 7,550 → 10,185 req/s · crash of 1 of 2 workers: 0 failed</text></svg>