server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64m;   # document imports can be up to 60 MB

  # Reverse proxy: browser → Nginx → Express (same origin, so no CORS issues)
  location /api/ {
    proxy_pass http://api:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # AI answers stream word by word: never buffer them
  location /api/ai/ {
    proxy_pass http://api:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Importing a document can take minutes (Google Docs exports big documents slowly)
  location /api/imports {
    proxy_pass http://api:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  location /uploads/ {
    proxy_pass http://api:5050;
  }

  # Cache hashed static assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: let React Router handle client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
